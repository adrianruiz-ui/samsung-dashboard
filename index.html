<!doctype html>
<html lang="es">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0F" />
  <title>Samsung MX — Performance Brief</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F8F7F2'/%3E%3Ctext x='50' y='74' text-anchor='middle' font-family='Georgia,serif' font-size='78' font-weight='600' fill='%230A0A09' font-style='italic'%3ES%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Libs para snapshots (PNG por sección + PDF global) -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- v22: PPTX de la press semanal (Performance Across SNS + VTR) -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <!-- Lib para exportar reportes a Excel (.xlsx) — 100% en el navegador -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          // Los colores apuntan a variables CSS (definidas en <style> más abajo,
          // con overrides bajo .light) en vez de hex fijos — así el toggle de
          // modo claro/oscuro no requiere tocar ninguna className del dashboard.
          colors: {
            ink:        'rgb(var(--c-ink) / <alpha-value>)',
            surface:    'rgb(var(--c-surface) / <alpha-value>)',
            surface2:   'rgb(var(--c-surface2) / <alpha-value>)',
            sidebar:    'rgb(var(--c-sidebar) / <alpha-value>)',
            line:       'var(--c-line)',
            line2:      'var(--c-line2)',
            txt:        'rgb(var(--c-txt) / <alpha-value>)',
            txt2:       'rgb(var(--c-txt2) / <alpha-value>)',
            txt3:       'rgb(var(--c-txt3) / <alpha-value>)',
            txt4:       'rgb(var(--c-txt4) / <alpha-value>)',
            faint:      'rgb(var(--c-faint) / <alpha-value>)',
            accent:     'rgb(var(--c-accent) / <alpha-value>)',
            accent2:    'rgb(var(--c-accent2) / <alpha-value>)',
            accentDeep: 'rgb(var(--c-accentDeep) / <alpha-value>)',
            // Versión apagada del acento — para etiquetas estructurales/
            // decorativas (marcadores de sección § 0X, eyebrows) que no
            // deberían competir visualmente con números/datos destacados
            // que sí usan "accent" a toda intensidad.
            accentSoft: 'rgb(var(--c-accentSoft) / <alpha-value>)',
            amber:      'rgb(var(--c-amber) / <alpha-value>)',
            success:    'rgb(var(--c-success) / <alpha-value>)',
            // Alias de "txt" pensado para overlays sutiles (bg-onSurface/[0.03]
            // etc.) — blanco muy transparente en oscuro, negro muy transparente
            // en claro, en vez de blanco fijo que desaparece sobre fondo claro.
            onSurface:  'rgb(var(--c-txt) / <alpha-value>)',
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
            serif: ['"Fraunces"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          letterSpacing: { tightest: '-0.04em' },
        },
      },
    };
  </script>

  <style>
    /* ============================================================
       TEMA — variables CSS. :root = oscuro (default). .light = claro.
       Formato "R G B" (sin comas) para que funcione con la sintaxis
       rgb(var(--x) / <alpha-value>) que usa Tailwind para opacidades.
       ============================================================ */
    :root {
      color-scheme: dark;
      --c-ink: 10 10 15;
      --c-surface: 19 19 26;
      --c-surface2: 26 26 34;
      --c-sidebar: 15 15 21;
      --c-line: rgba(255,255,255,0.06);
      --c-line2: rgba(255,255,255,0.10);
      --c-txt: 255 255 255;
      --c-txt2: 181 181 192;
      --c-txt3: 136 136 148;
      --c-txt4: 107 107 120;
      --c-faint: 74 74 85;
      --c-accent: 122 150 255;
      --c-accent2: 76 110 245;
      --c-accentDeep: 20 40 160;
      --c-accentSoft: 140 152 196;
      --c-amber: 240 179 88;
      --c-success: 93 202 165;
      --c-glow1: rgba(76,110,245,0.08);
      --c-glow2: rgba(20,40,160,0.04);
      --c-scrollbar: rgba(255,255,255,0.08);
      --c-scrollbar-hover: rgba(255,255,255,0.15);
    }
    :root { --logo-samsung: #FFFFFF; --logo-ganem: #FFFFFF; }
    html.light { --logo-samsung: #1428A0; --logo-ganem: #0A0A0F; }
    html.light {
      color-scheme: light;
      --c-ink: 245 246 248;
      --c-surface: 255 255 255;
      --c-surface2: 239 241 245;
      --c-sidebar: 236 238 242;
      --c-line: rgba(10,10,15,0.08);
      --c-line2: rgba(10,10,15,0.14);
      --c-txt: 15 15 20;
      --c-txt2: 66 66 76;
      --c-txt3: 104 104 114;
      --c-txt4: 138 138 148;
      --c-faint: 178 178 186;
      --c-accent: 20 40 160;
      --c-accent2: 40 70 205;
      --c-accentDeep: 14 28 120;
      --c-accentSoft: 104 116 160;
      --c-amber: 168 110 15;
      --c-success: 22 128 100;
      --c-glow1: rgba(20,40,160,0.08);
      --c-glow2: rgba(20,40,160,0.04);
      --c-scrollbar: rgba(10,10,15,0.10);
      --c-scrollbar-hover: rgba(10,10,15,0.20);
    }
    /* v25 — menos líneas finas: tarjetas por contraste de superficie y
       tablas sin separadores por fila (zebra muy sutil en su lugar) */
    .bg-surface.border.border-line { border-color: transparent; }
    .rounded-xl.bg-surface { border-radius: 16px; }
    tbody tr.border-b { border-bottom-color: transparent !important; }
    tbody tr:nth-child(even) { background-color: rgb(var(--c-txt) / 0.025); }
    table.no-zebra tbody tr { background-color: transparent !important; }

    /* v40 — Dirección de arte.
       (2) Etiquetas: fuera mayúsculas espaciadas en monoespaciada; quedan en
           la tipografía del sistema, tamaño legible y peso medio. La mono se
           queda solo para cifras. */
    .font-mono.uppercase {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif !important;
      text-transform: none !important; letter-spacing: 0 !important;
      font-size: 12px !important; font-weight: 500; color: rgb(var(--c-txt3));
    }
    .font-mono.uppercase.text-accent, .font-mono.uppercase.text-accentSoft { color: rgb(var(--c-accent)); }
    .font-mono.uppercase.text-amber { color: rgb(var(--c-amber)); }
    th.font-mono.uppercase, thead .font-mono.uppercase, thead tr.uppercase th { font-size: 11.5px !important; }
    thead tr.uppercase { text-transform: none !important; letter-spacing: 0 !important; font-family: 'Bricolage Grotesque', system-ui, sans-serif !important; font-size: 11.5px !important; }
    /* v48 — Jerarquía de títulos más marcada
       Nivel 1 (sección): grande y pesado. Nivel 2 (tarjeta): semibold.
       Encabezados de tabla: oscuros, semibold y con fondo propio. */
    section > div h2, section h2.text-\[18px\] { font-size: 22px !important; font-weight: 650 !important; letter-spacing: -0.015em; line-height: 1.2; color: rgb(var(--c-txt)); }
    section h2.text-\[15px\], .text-\[15px\].font-medium.text-txt { font-size: 16px !important; font-weight: 620 !important; letter-spacing: -0.01em; }
    .text-\[13px\].font-medium.text-txt { font-size: 14px !important; font-weight: 620 !important; }
    thead th, thead tr.uppercase th { color: rgb(var(--c-txt)) !important; font-weight: 620 !important; font-size: 12px !important; letter-spacing: 0 !important; text-transform: none !important; font-family: 'Bricolage Grotesque', system-ui, sans-serif !important; }
    thead tr { background-color: rgb(var(--c-txt) / 0.06) !important; }
    thead th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
    thead th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
    .font-mono.uppercase { color: rgb(var(--c-txt2)) !important; font-weight: 550 !important; }
    /* (3) Sin líneas finas: separadores por espacio y contraste de fondo */
    .border-b.border-line:not(input):not(select):not(textarea):not(button),
    .border-t.border-line:not(input):not(select):not(textarea):not(button),
    .border-b.border-line\/40, .border-b.border-line\/50, .border-t.border-line\/40 { border-color: transparent !important; }
    thead tr { background-color: rgb(var(--c-txt) / 0.035); }
    /* (5) Un solo lenguaje de gráficas */
    .recharts-cartesian-axis-line { display: none; }
    .recharts-cartesian-axis-tick-line { display: none; }
    .recharts-cartesian-axis-tick text { font-size: 10.5px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .recharts-cartesian-grid-vertical line { stroke-opacity: 0 !important; }
    .recharts-cartesian-grid-horizontal line { stroke: rgb(var(--c-txt)) !important; stroke-opacity: 0.06 !important; stroke-dasharray: none !important; }
    .recharts-line-curve { stroke-width: 2px; }
    .recharts-area-curve { stroke-width: 1.75px; }
    .recharts-legend-item-text { font-size: 11px; color: rgb(var(--c-txt3)) !important; }
    .recharts-default-tooltip, .recharts-tooltip-wrapper > div {
      border-radius: 10px !important; border: none !important;
      box-shadow: 0 8px 28px rgba(0,0,0,0.18) !important;
      font-family: 'Bricolage Grotesque', system-ui, sans-serif !important; font-size: 12px !important;
    }
    html, body, #root { height: 100%; background: rgb(var(--c-ink)); color: rgb(var(--c-txt)); transition: background-color 150ms ease, color 150ms ease; }
    body {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'ss01';
      letter-spacing: -0.005em;
      background-image: none;
    }
    .font-serif, [class*="font-serif"] { font-family: 'Fraunces', Georgia, serif; font-feature-settings: 'ss01'; }
    .font-mono, [class*="font-mono"] { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'ss01'; }
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .recharts-tooltip-wrapper:focus { outline: none; }
    .recharts-cartesian-grid line { stroke: var(--c-line); }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    .slide-in { animation: slideIn 240ms cubic-bezier(0.32, 0.72, 0, 1); }
    .fade-in  { animation: fadeIn 200ms ease-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 5px; border: 2px solid rgb(var(--c-ink)); }
    ::-webkit-scrollbar-thumb:hover { background: var(--c-scrollbar-hover); }

    .sidebar-collapsed-text { opacity: 0; pointer-events: none; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }

    select option { background: rgb(var(--c-surface)); color: rgb(var(--c-txt)); }

    /* v56 — Pulido visual
       (1) Una sola tipografía: la mono pasa a Bricolage con cifras tabulares
           (antes se mezclaban dos familias en la misma tabla).
       (2) Tamaños mínimos legibles.
       (3) Tablas: aire en la primera y última columna, encabezados en una línea.
       (4) Cero líneas finas: las variantes con opacidad también se ocultan. */
    .font-mono, [class*="font-mono"] { font-family: 'Bricolage Grotesque', system-ui, sans-serif !important; font-variant-numeric: tabular-nums; letter-spacing: 0 !important; }
    .text-\[8px\], .text-\[9px\] { font-size: 10.5px !important; }
    .text-\[10px\] { font-size: 11px !important; }
    table th:first-child, table td:first-child { padding-left: 16px !important; }
    table th:last-child, table td:last-child { padding-right: 16px !important; }
    thead th { white-space: nowrap; vertical-align: middle; }
    tbody td { vertical-align: middle; }
    .border-line\/40, .border-line\/50, .border-line\/30 { border-color: transparent !important; }
    .tracking-wider, .tracking-\[0\.15em\], .tracking-\[0\.18em\] { letter-spacing: 0 !important; }
    .uppercase:not(.keep-upper) { text-transform: none !important; }
    /* v61 — Sistema de movimiento. Una sola curva y tres duraciones; el
       movimiento explica (de dónde entra la información, qué cambió al filtrar),
       nunca decora. Se apaga con "reducir movimiento" y en exportaciones. */
    :root { --ease-out: cubic-bezier(.16, 1, .3, 1); --d-fast: 160ms; --d-med: 420ms; --d-slow: 900ms; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes swapIn { from { opacity: .35; filter: saturate(.6); } to { opacity: 1; filter: none; } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(.92); } 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: no-preference) {
      html.motion main > section:not(.in-view) > *,
      html.motion main [id^="grp-body"] > section:not(.in-view) > * { opacity: 0; }
      html.motion main section.in-view > * { animation: riseIn var(--d-slow) var(--ease-out) both; }
      html.motion main section.in-view > *:nth-child(2) { animation-delay: 70ms; }
      html.motion main section.in-view > *:nth-child(3) { animation-delay: 140ms; }
      html.motion main section.in-view > *:nth-child(4) { animation-delay: 210ms; }
      html.motion main section.in-view > *:nth-child(n+5) { animation-delay: 280ms; }
      html.motion main section.in-view .bar-grow { transform-origin: left center; animation: growX 1.1s var(--ease-out) both; animation-delay: 260ms; }
      html.motion main.data-swap { animation: swapIn var(--d-med) var(--ease-out); }
      html.motion .pop-in { animation: popIn var(--d-med) var(--ease-out) both; animation-delay: 380ms; }
      button, [role="button"], a { transition: background-color var(--d-fast) ease, color var(--d-fast) ease, transform var(--d-fast) ease, box-shadow var(--d-fast) ease; }
      button:not(:disabled):active, [role="button"]:active { transform: scale(.985); }
      tbody tr { transition: background-color var(--d-fast) ease; }
      [role="radiogroup"] button[aria-checked="true"] { transition: background-color var(--d-med) var(--ease-out), box-shadow var(--d-med) var(--ease-out), color var(--d-fast) ease; }
    }
    /* (2) indicador deslizante de selectores */
    .seg-ind { position: absolute; z-index: 0; pointer-events: none; border-radius: 6px; transition: left var(--d-med) var(--ease-out), top var(--d-med) var(--ease-out), width var(--d-med) var(--ease-out), height var(--d-med) var(--ease-out), opacity var(--d-fast) ease; }
    [role="radiogroup"].has-ind > button { position: relative; z-index: 1; }
    .seg-ind-surface { background: rgb(var(--c-surface)); box-shadow: 0 1px 2px rgba(10,10,15,.10), 0 0 0 1px rgba(10,10,15,.04); }
    html:not(.light) .seg-ind-surface { background: rgb(var(--c-txt) / 0.11); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
    [role="radiogroup"].has-ind > button[aria-checked="true"] { background-color: transparent !important; box-shadow: none !important; }
    /* (4) mapas de calor que se encienden en ola */
    @keyframes cellIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: no-preference) {
      html.motion main section:not(.in-view) .wave { opacity: 0; }
      html.motion main section.in-view .wave { animation: cellIn 520ms var(--ease-out) both; animation-delay: var(--wd, 0ms); }
    }
    /* (5) detalle del post: se abre desde la fila */
    @keyframes zoomFromRow { from { opacity: 0; transform: translateX(36px) scale(.94); } to { opacity: 1; transform: none; } }
    .zoom-from-row { animation: zoomFromRow 460ms var(--ease-out) both; }
    @keyframes rowPicked { 0% { background-color: rgb(var(--c-accent2) / 0.22); } 100% { background-color: transparent; } }
    .row-picked > td, .row-picked { animation: rowPicked 900ms var(--ease-out); }
    /* (6) pulso en cifras que cambiaron al actualizar el Sheet */
    @keyframes valuePulse { 0% { background-color: rgb(var(--c-accent2) / 0.30); box-shadow: 0 0 0 4px rgb(var(--c-accent2) / 0.18); } 100% { background-color: transparent; box-shadow: 0 0 0 0 transparent; } }
    .value-pulse { border-radius: 6px; animation: valuePulse 1.6s var(--ease-out); }
    @media (prefers-reduced-motion: reduce) { .seg-ind, .zoom-from-row, .value-pulse, .row-picked > td, .row-picked { transition: none !important; animation: none !important; } }
    /* (4) cambio de tema: círculo que se expande desde el botón */
    :root { --ch-axis: #4A4A55; --ch-axis-strong: #6B6B78; --ch-grid: rgba(255,255,255,0.10); --ch-tip-bg: #1A1A22; --ch-tip-border: rgba(255,255,255,0.10); --ch-tip-text: #FFFFFF; --ch-tip-label: #888894; }
    :root { --cad-ink: 76,110,245; --cad-a0: 0.22; --cad-span: 0.68; --cad-empty: rgba(127,127,140,0.10); }
    html.light { --cad-ink: 31,63,217; --cad-a0: 0.30; --cad-span: 0.70; --cad-empty: rgba(10,10,15,0.075); }
    html.light { --ch-axis: #B2B2BA; --ch-axis-strong: #8A8A92; --ch-grid: rgba(10,10,15,0.12); --ch-tip-bg: #FFFFFF; --ch-tip-border: rgba(10,10,15,0.12); --ch-tip-text: #0F0F14; --ch-tip-label: #686872; }
    /* El navegador no dibuja las secciones fuera de pantalla (cambio de tema, scroll y filtros más ligeros) */
    main section[id] { content-visibility: auto; contain-intrinsic-size: auto 900px; }
    .capturing main section[id] { content-visibility: visible; }
    .theme-switching, .theme-switching *, .theme-switching *::before, .theme-switching *::after { transition: none !important; }
    html.theme-switching, html.theme-switching body, html.theme-switching #root { transition: none !important; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-new(root) { animation: vtReveal 560ms cubic-bezier(.4, 0, .2, 1) both; }
    ::view-transition-group(root) { animation-duration: 560ms; }
    @keyframes vtReveal { from { clip-path: circle(0px at var(--vt-x, 50%) var(--vt-y, 0px)); } to { clip-path: circle(var(--vt-r, 150vmax) at var(--vt-x, 50%) var(--vt-y, 0px)); } }
    /* (5) grupos plegables */
    .login-in { animation: riseIn 520ms var(--ease-out, ease-out) both; }
    @media (prefers-reduced-motion: reduce) { .login-in { animation: none; } }
    .ask-panel { animation: askIn 220ms var(--ease-out, ease-out) both; }
    @keyframes askIn { from { opacity: 0; transform: translateY(-10px) scale(.985); } to { opacity: 1; transform: none; } }
    html.motion .ask-panel .pop-in { animation-delay: 0ms; }
    html.motion .ask-result .bar-grow { transform-origin: left center; animation: growX 700ms var(--ease-out) both; }
    .ask-kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 5px; background: rgb(var(--c-txt) / 0.07); color: rgb(var(--c-txt) / 0.55); }
    @media (prefers-reduced-motion: reduce) { .ask-panel { animation: none; } }
    @keyframes grpOpen { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    @keyframes grpClose { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-10px); } }
    @media (prefers-reduced-motion: no-preference) {
      .grp-body-open { animation: grpOpen 480ms var(--ease-out) both; }
      .grp-body-closing { animation: grpClose 240ms ease-in both; pointer-events: none; }
    }
    /* (6) indicador deslizante del menú lateral */
    .nav-ind { position: absolute; left: 8px; right: 8px; z-index: 0; border-radius: 8px; background: rgb(var(--c-accent2) / 0.12); pointer-events: none;
               transition: top 460ms var(--ease-out), height 460ms var(--ease-out), left 460ms var(--ease-out), width 460ms var(--ease-out), opacity 200ms ease; }
    .nav-ind::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 2px; border-radius: 2px; background: rgb(var(--c-accent2)); }
    /* (8) detalle del post en cascada */
    @media (prefers-reduced-motion: no-preference) {
      .drawer-body > * { animation: riseIn 560ms var(--ease-out) both; }
      .drawer-body > *:nth-child(2) { animation-delay: 60ms; } .drawer-body > *:nth-child(3) { animation-delay: 110ms; }
      .drawer-body > *:nth-child(4) { animation-delay: 160ms; } .drawer-body > *:nth-child(5) { animation-delay: 210ms; }
      .drawer-body > *:nth-child(6) { animation-delay: 260ms; } .drawer-body > *:nth-child(n+7) { animation-delay: 300ms; }
    }
    .capturing .wave { opacity: 1 !important; animation: none !important; transform: none !important; }

    /* Etiquetas de estado: relleno suave en vez de contorno (se leía como línea fina) */

<body>
  <div id="root"></div>

  <script type="module">
    // ============================================================
    // IMPORTS desde CDN (esm.sh) — sin build step
    // ============================================================
    import React, { useState, useEffect, useCallback, useMemo, useRef, Fragment } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import {
      ResponsiveContainer, BarChart, Bar, LineChart, Line, ComposedChart, ScatterChart, Scatter, ZAxis, XAxis, YAxis, Tooltip, CartesianGrid, ReferenceLine,
    } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    // ============================================================
    // CONFIG — Edita estas constantes para tu deploy
    // ============================================================
    const SHEET_ID = '1TcmeDE08Df6Qk4lzRe6PhIBq5qOBUCC_vvHZq4UWD98';
    const CACHE_TTL_MIN = 5;       // cuánto tiempo cachea localmente
    const AUTO_REFRESH_MIN = 5;    // polling automático en background; 0 = desactivado

    // ============================================================
    // CLIENTE GOOGLE SHEETS
    // ============================================================
    const SHEET_TABS = {
      Facebook:  '📘 Facebook',
      Instagram: '📷 Instagram',
      YouTube:   '▶️ YouTube',
      TikTok:    '🎵 TikTok',
      X:         '𝕏 X',
      LinkedIn:  '💼 LinkedIn',
      Threads:   '🧵 Threads',
    };
    const PLATFORMS = Object.keys(SHEET_TABS);
    // v30 — gid de cada pestaña (para saber en qué FILA del Sheet vive cada
    // post y abrirla directo). gviz se salta las filas vacías, así que el
    // número de fila se toma del export CSV, que sí las conserva.
    const SHEET_GIDS = {
      Facebook: '108585329', Instagram: '47698819', YouTube: '1302908273', TikTok: '17033369',
      X: '406488930', LinkedIn: '493682597', Threads: '2058997613',
    };
    const sheetRowUrl = (platform, row) => SHEET_GIDS[platform] && row
      ? `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${SHEET_GIDS[platform]}&range=A${row}` : null;

    // ============================================================
    // v68 — ACCESO SOLO CON CUENTAS DE GANEM (@ganem.mx)
    // Con AUTH_CLIENT_ID vacío el dashboard funciona como antes (Sheet
    // público). Con Client ID: inicio de sesión con Google, se verifica que
    // el correo sea @ganem.mx y los datos se leen con el token del propio
    // usuario vía Google Sheets API. La seguridad real la pone Google: el
    // Sheet deja de ser público y solo lo leen cuentas con acceso a él.
    // El código de esta página no contiene datos.
    // ============================================================
    const AUTH_CLIENT_ID = '548072100911-573b2rkd1m5ajk2cccqd6luf0iuik32v.apps.googleusercontent.com';
    const AUTH_DOMAIN = 'ganem.mx';
    const AUTH_SCOPES = 'openid email profile https://www.googleapis.com/auth/spreadsheets.readonly';
    const AUTH_ON = !!AUTH_CLIENT_ID;
    const AUTH_KEY = 'smx-auth';
    const authState = { token: null, exp: 0, email: null, name: null, picture: null };
    const authValid = () => !AUTH_ON || (!!authState.token && authState.exp > Date.now() + 30e3);
    function authLoad() {
      try {
        const v = JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null');
        if (v && v.token && v.exp > Date.now() + 60e3 && String(v.email || '').toLowerCase().endsWith('@' + AUTH_DOMAIN)) { Object.assign(authState, v); return true; }
      } catch {}
      return false;
    }
    function authSave() { try { sessionStorage.setItem(AUTH_KEY, JSON.stringify(authState)); } catch {} }
    function authClear() { Object.assign(authState, { token: null, exp: 0, email: null, name: null, picture: null }); try { sessionStorage.removeItem(AUTH_KEY); } catch {} }
    const authListeners = new Set();
    const authEmit = (ev) => authListeners.forEach(f => { try { f(ev); } catch {} });
    let gisPromise = null;
    function loadGis() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
      if (!gisPromise) gisPromise = new Promise((res, rej) => {
        const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
        sc.onload = () => res(); sc.onerror = () => { gisPromise = null; rej(new Error('No se pudo cargar el inicio de sesión de Google. Revisa tu conexión.')); };
        document.head.appendChild(sc);
      });
      return gisPromise;
    }
    const AUTH_SHEETS_SCOPE = 'https://www.googleapis.com/auth/spreadsheets.readonly';
    const AUTH_SCOPE_MSG = 'Falta el permiso para leer la base. Vuelve a dar clic en «Continuar con Google» y, en la ventana de Google, marca la casilla «Ver todas tus hojas de cálculo de Google Sheets».';
    let authNeedConsent = false;
    async function authSignIn() {
      await loadGis();
      let hint; try { hint = localStorage.getItem('smx-auth-hint') || undefined; } catch {}
      return new Promise((resolve, reject) => {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: AUTH_CLIENT_ID, scope: AUTH_SCOPES, hd: AUTH_DOMAIN, login_hint: hint, include_granted_scopes: true,
          callback: async (resp) => {
            if (!resp || resp.error) { reject(new Error(resp && resp.error === 'access_denied' ? 'No se concedió el acceso.' : 'No se pudo iniciar sesión.')); return; }
            // Google deja desmarcar permisos: sin el de Sheets el dashboard no puede leer la base
            if (!google.accounts.oauth2.hasGrantedAllScopes(resp, AUTH_SHEETS_SCOPE)) {
              authNeedConsent = true;
              try { google.accounts.oauth2.revoke(resp.access_token, () => {}); } catch {}
              reject(new Error(AUTH_SCOPE_MSG)); return;
            }
            try {
              const u = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${resp.access_token}` } }).then(r => r.json());
              const email = String(u.email || '').toLowerCase();
              if (!email.endsWith('@' + AUTH_DOMAIN) || u.email_verified === false) {
                try { google.accounts.oauth2.revoke(resp.access_token, () => {}); } catch {}
                reject(new Error(`${u.email || 'Esa cuenta'} no es una cuenta de Ganem. Entra con tu correo @${AUTH_DOMAIN}.`)); return;
              }
              Object.assign(authState, { token: resp.access_token, exp: Date.now() + (+resp.expires_in || 3600) * 1000, email, name: u.name || email, picture: u.picture || null });
              authSave(); try { localStorage.setItem('smx-auth-hint', email); } catch {}
              authEmit('in'); resolve(authState);
            } catch { reject(new Error('No se pudo verificar tu cuenta de Google.')); }
          },
          error_callback: (e) => reject(new Error(e && e.type === 'popup_closed' ? 'Se cerró la ventana de Google antes de terminar.'
            : e && e.type === 'popup_failed_to_open' ? 'El navegador bloqueó la ventana de Google. Permite ventanas emergentes para este sitio e intenta de nuevo.' : 'No se pudo iniciar sesión.')),
        });
        client.requestAccessToken({ prompt: authNeedConsent ? 'consent' : '' });
      });
    }
    let authOutMsg = null;
    function authSignOut(msg) {
      authOutMsg = typeof msg === 'string' ? msg : null;
      const tk = authState.token; authClear();
      try { localStorage.removeItem(CACHE_KEY); sessionStorage.removeItem(CACHE_KEY); } catch {}
      try { tk && google.accounts.oauth2.revoke(tk, () => {}); } catch {}
      authEmit('out');
    }
    async function sheetsValues(range, id = SHEET_ID) {
      if (!authValid()) { authEmit('expired'); throw new Error('Tu sesión expiró. Vuelve a entrar con tu cuenta de Ganem.'); }
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}?valueRenderOption=FORMATTED_VALUE&majorDimension=ROWS`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${authState.token}` }, cache: 'no-store' });
      if (res.status === 401) { authEmit('expired'); throw new Error('Tu sesión expiró. Vuelve a entrar con tu cuenta de Ganem.'); }
      if (res.status === 403 || res.status === 404) {
        let reason = '', msg = '';
        try { const j = await res.json(); reason = ((j.error && j.error.details) || []).map(d => d.reason).filter(Boolean).join(' ') || (j.error && j.error.status) || ''; msg = (j.error && j.error.message) || ''; } catch {}
        if (/SCOPE_INSUFFICIENT/.test(reason) || /insufficient authentication scopes/i.test(msg)) { authNeedConsent = true; authSignOut(AUTH_SCOPE_MSG); throw new Error(AUTH_SCOPE_MSG); }
        if (/SERVICE_DISABLED|API_DISABLED/.test(reason) || /has not been used|is disabled/i.test(msg)) throw new Error('La Google Sheets API no está activada en el proyecto de Google Cloud del dashboard (o se acaba de activar y tarda unos minutos). Intenta de nuevo en un momento.');
        const e = new Error(`Tu cuenta (${authState.email}) no tiene acceso al Sheet de Samsung. Pide acceso a quien administra la base.`); e.noAccess = true; throw e;
      }
      if (!res.ok) throw new Error(`No se pudo leer «${range.split('!')[0].replace(/'/g, '')}» (HTTP ${res.status}).`);
      const j = await res.json();
      const rows = (j.values || []).map(r => r.map(c => c == null ? '' : String(c)));
      const w = rows.reduce((m, r) => Math.max(m, r.length), 0);
      return rows.map(r => r.length < w ? [...r, ...Array(w - r.length).fill('')] : r);
    }

    async function fetchRowIndex(platformName) {
      const gid = SHEET_GIDS[platformName];
      if (!gid) return null;
      try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`, { cache: 'no-store' });
        if (!res.ok) return null;
        const txt = await res.text();
        if (txt.trim().startsWith('<')) return null;
        const rows = Papa.parse(txt, { header: false, skipEmptyLines: false }).data;
        const idx = new Map();               // "link|fecha" → [filas]
        for (let i = 2; i < rows.length; i++) {   // i=2 → fila 3 del Sheet
          const r = rows[i] || [];
          if (!r.some(c => (c || '').trim())) continue;
          const k = (r[0] || '').trim() + '|' + (r[1] || '').trim();
          if (!idx.has(k)) idx.set(k, []);
          idx.get(k).push(i + 1);
        }
        return idx;
      } catch { return null; }
    }

    function buildSheetUrl(tabName) {
      if (!SHEET_ID) throw new Error('Falta SHEET_ID en la configuración del archivo.');
      // RANGO EXPLÍCITO: A2:AI10000 fuerza a gviz a leer hasta la fila 10000.
      // Antes usábamos A2:AI (sin límite) y gviz a veces corta cuando hay
      // gaps de filas vacías entre los datos.
      const params = new URLSearchParams({
        tqx: 'out:csv',
        sheet: tabName,
        range: 'A2:AL10000',   // v21: hasta AL para leer la columna opcional "Imagen" (al final de cada pestaña)
      });
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
    }

    async function fetchTab(platformName) {
      const tabName = SHEET_TABS[platformName];
      if (AUTH_ON) {
        // v68 — con sesión: Sheets API. La fila del Sheet sale directo del índice.
        const vals = await sheetsValues(`'${tabName}'!A2:AL10000`);
        const hdr = (vals[0] || []).map(h => String(h).trim());
        const out = [];
        for (let i = 1; i < vals.length; i++) {
          const r = vals[i];
          if (!r.some(c => String(c).trim())) continue;
          const o = {}; hdr.forEach((h, j) => { if (h && !(h in o)) o[h] = r[j] ?? ''; });
          o._platform = platformName; o._row = i + 2; out.push(o);
        }
        return out;
      }
      const rowIndexP = fetchRowIndex(platformName);   // en paralelo; si falla, solo no hay número de fila
      const res = await fetch(buildSheetUrl(tabName), { redirect: 'follow', cache: 'no-store' });
      if (!res.ok) throw new Error(`Error al cargar "${tabName}": HTTP ${res.status}`);
      const csvText = await res.text();
      if (csvText.trim().startsWith('<')) {
        throw new Error(`"${tabName}" no devolvió CSV. ¿El Sheet es público?`);
      }
      const parsed = Papa.parse(csvText, {
        header: true, skipEmptyLines: 'greedy', dynamicTyping: false,
      });
      const idx = await rowIndexP;
      const used = new Map();
      return parsed.data.map(row => {
        let _row = null;
        if (idx) {
          const k = (row['Link'] || '').trim() + '|' + (row['Fecha'] || '').trim();
          const list = idx.get(k);
          if (list) { const n = used.get(k) || 0; _row = list[n] ?? null; used.set(k, n + 1); }
        }
        return { ...row, _platform: platformName, _row };
      });
    }

    async function fetchAllPlatforms() {
      const results = await Promise.allSettled(
        PLATFORMS.map(p => fetchTab(p).then(rows => ({ platform: p, rows })))
      );
      const data = {}; const errors = [];
      for (let i = 0; i < results.length; i++) {
        const r = results[i]; const platform = PLATFORMS[i];
        if (r.status === 'fulfilled') data[platform] = r.value.rows;
        else { errors.push({ platform, message: r.reason?.message || String(r.reason) }); data[platform] = []; }
      }
      if (AUTH_ON && errors.length === PLATFORMS.length) throw new Error(errors[0].message);
      return { data, errors, fetchedAt: Date.now() };
    }

    // ============================================================
    // TRANSFORMACIÓN — columnas español → claves internas + agregados
    // ============================================================
    const COL_MAP = {
      'Link': 'link', 'Fecha': 'date', 'Semana': 'week', 'Mes': 'month', 'Año': 'year',
      'Formato': 'format', 'Tipo Contenido': 'content_type', 'Tipo Pauta': 'strategy',
      'Campaña': 'campaign', 'Subcampaña': 'subcampaign', 'Etapa': 'stage',
      'Producto': 'product', 'Objetivo': 'objective', 'Audio': 'audio',
      'Subtítulos': 'subtitles', 'IA': 'ai', 'Duración (seg)': 'duration',
      'Imagen': 'image',   // v21 — opcional: URL de la miniatura del post
      'Alcance': 'reach', 'Impresiones': 'impressions', 'Reacciones': 'reactions',
      'Comentarios': 'comments', 'Compartidos': 'shares', 'Guardados': 'saves',
      'Repost': 'repost', 'Clics': 'clics', 'Views': 'views',
      'Inter. Básicas': 'basic_interactions', 'Inter. Totales': 'interactions',
      'ER Básico %': 'basic_er', 'ER Views %': 'er', 'CTR %': 'ctr',
      'T. Prom. Vista': 'avg_watch_time', 'VTR %': 'vtr',
      '¿Influencer?': 'is_influencer', 'Nombre Influencer': 'influencer_name',
      'Nuevos Seguidores': 'new_followers',
    };
    const NUMERIC_KEYS = new Set([
      'week','year','duration','reach','impressions','reactions','comments','shares',
      'saves','repost','clics','views','basic_interactions','interactions',
      'basic_er','er','ctr','avg_watch_time','vtr','new_followers',
    ]);

    function toNum(v) {
      if (v == null || v === '') return null;
      if (typeof v === 'number') return v;
      let s = String(v).trim();
      if (s === '' || s === '—' || s === '-' || s === '#N/A' || s === '#DIV/0!') return null;
      s = s.replace(/%\s*$/, '');
      if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
      else if (s.includes(',') && !s.includes('.')) {
        const lastComma = s.lastIndexOf(',');
        const after = s.length - lastComma - 1;
        if (after <= 2 && s.split(',').length === 2) s = s.replace(',', '.');
        else s = s.replace(/,/g, '');
      }
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    }

    function normalizeRow(row, platform) {
      const out = { platform };
      for (const [esKey, enKey] of Object.entries(COL_MAP)) {
        if (esKey in row) {
          const raw = row[esKey];
          if (NUMERIC_KEYS.has(enKey)) out[enKey] = toNum(raw);
          else out[enKey] = raw === '' ? null : raw;
        }
      }
      // Considera la fila como una publicación válida si tiene CUALQUIER campo
      // identificador. Antes descartábamos filas sin link/alcance/interacciones,
      // lo que excluía posts recientes con métricas aún sin levantar.
      const hasAnyIdentity =
        out.link || out.date || out.week != null || out.format ||
        out.product || out.campaign || out.subcampaign || out.objective ||
        (out.reach != null && out.reach > 0) ||
        (out.interactions != null && out.interactions > 0);
      if (!hasAnyIdentity) return null;
      // v20 — VALIDACIÓN: valores imposibles se marcan y se excluyen de las
      // TASAS (ER, ER Básico, CTR). Los TOTALES no se tocan.
      //  · ER Básico > 100%  → hay más interacciones básicas que alcance; la
      //    fila tiene un error de captura y contamina ER Views y ER Básico.
      //  · CTR > 100%        → más clics que impresiones.
      // VTR > 100% NO se marca: en Shorts/Reels es válido por repeticiones.
      out._flags = [];
      // v74 — ER Básico > 100% ya no se marca: el equipo confirmó que esos valores son
      // correctos (en TikTok/YouTube hay posts con más interacciones que alcance).
      if (out.ctr != null && out.ctr > 100) out._flags.push('ctr');
      return out;
    }

    // ============================================================
    // v21 — LECTURA CRUDA DE PESTAÑAS SIN ESTRUCTURA DE TABLA
    // (Followers y Status vs Meta 2026). headers=0 evita que gviz
    // fusione las filas de título con el encabezado.
    // ============================================================
    async function fetchRawSheet(tabName, range) {
      if (AUTH_ON) return sheetsValues(`'${tabName}'!${range}`);
      const params = new URLSearchParams({ tqx: 'out:csv', sheet: tabName, range, headers: '0' });
      const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`, { redirect: 'follow' });
      if (!res.ok) throw new Error(`Error al cargar "${tabName}": HTTP ${res.status}`);
      const csv = await res.text();
      if (csv.trim().startsWith('<')) throw new Error(`"${tabName}" no devolvió CSV.`);
      return Papa.parse(csv, { header: false, skipEmptyLines: false }).data;
    }

    const FOLLOWER_WEEKS_IN_YEAR = 52;   // la hoja Followers va de Week 1 a Week 52

    async function fetchFollowerGoals() {
      const [statusRows, followerRows] = await Promise.all([
        fetchRawSheet('Status vs Meta 2026', 'A1:H40'),
        fetchRawSheet('Followers', 'A1:DZ60'),
      ]);
      // Series semanales: col A = plataforma; luego pares (Total week, WoW).
      // El total de la semana k está en la columna 1 + 2·(k-1).
      const series = {};
      for (const r of followerRows) {
        const name = (r[0] || '').trim();
        if (!name || /^plataforma$/i.test(name) || /followers/i.test(name)) continue;
        const vals = [];
        for (let i = 1; i < r.length; i += 2) {
          const v = toNum(r[i]);
          if (v == null || v === 0) break;
          vals.push(v);
        }
        if (vals.length) series[name] = vals;
      }
      // Metas: filas con plataforma + base + actual + ganados + meta + % + gap
      const goals = [];
      for (const r of statusRows) {
        const name = (r[0] || '').trim();
        if (!name || /^(plataforma|total)$/i.test(name)) continue;
        const base = toNum(r[1]), current = toNum(r[2]), goal = toNum(r[4]);
        if (base == null || goal == null || !(goal > 0)) continue;
        goals.push({ name, base, current: current ?? (series[name] ? series[name][series[name].length - 1] : base), goal });
      }
      return goals.map(g => computeGoalProjection(g, series[g.name] || []));
    }

    function computeGoalProjection(g, weekly) {
      const n = weekly.length;
      const current = g.current;
      const gained = current - g.base;
      const gap = g.goal - gained;
      const pct = g.goal > 0 ? (gained / g.goal) * 100 : 0;
      const lookback = Math.min(4, Math.max(n - 1, 0));
      const pace = lookback > 0 ? (weekly[n - 1] - weekly[n - 1 - lookback]) / lookback : 0;
      const weeksLeft = Math.max(0, FOLLOWER_WEEKS_IN_YEAR - n);
      const required = gap > 0 && weeksLeft > 0 ? gap / weeksLeft : 0;
      const projectedGained = gained + pace * weeksLeft;
      const projectedPct = g.goal > 0 ? (projectedGained / g.goal) * 100 : 0;
      const status = gap <= 0 ? 'cumplida' : projectedGained >= g.goal ? 'en_ruta' : 'en_riesgo';
      const chart = [];
      for (let k = 0; k < FOLLOWER_WEEKS_IN_YEAR; k++) {
        chart.push({
          w: 'S' + (k + 1),
          real: k < n ? weekly[k] - g.base : null,
          ruta: Math.round(g.goal * (k + 1) / FOLLOWER_WEEKS_IN_YEAR),
        });
      }
      return { ...g, gained, gap, pct, pace, weeksLeft, required, projectedGained, projectedPct, status, lastWeek: n, chart };
    }

    // ============================================================
    // v21 — MINIATURAS. Solo se pueden obtener sin token para YouTube
    // (derivada del ID) e imágenes directas (Imgur, URLs de imagen).
    // Para el resto, la columna opcional "Imagen" del Sheet manda.
    // ============================================================

    // ============================================================
    // v21 — BENCHMARK POR SEGMENTO. Compara peras con peras:
    // misma plataforma + formato + tipo de pauta + tipo de contenido
    // (Global / Local / Regional). Histórico completo de la base,
    // ponderado (Σ/Σ) y excluyendo al propio post y a los marcados
    // con valores imposibles.
    // ============================================================
    const BENCH_MIN_N = 5;
    function segKey(p) {
      return [p.platform, p.format || '—', p.strategy || '—', p.content_type || '—'].join('|');
    }
    function segLabel(p) {
      const pauta = /^paid$/i.test(p.strategy || '') ? 'Pauta' : (p.strategy || 'Sin pauta');
      return `${p.format || 'Sin formato'} · ${pauta} · ${p.content_type || 'Sin tipo'} · ${p.platform}`;
    }
    function benchEligible(p) { return p.reach > 0 && !(p._flags || []).length; }
    function buildBenchmarks(allPosts) {
      const map = new Map();
      for (const p of allPosts || []) {
        if (!benchEligible(p)) continue;
        const k = segKey(p);
        if (!map.has(k)) map.set(k, { n: 0, reach: 0, ber_num: 0, ber_den: 0, er_num: 0, er_den: 0, ers: [], reaches: [] });
        const s = map.get(k);
        s.n += 1; s.reach += p.reach; s.reaches.push(p.reach);
        if (p.basic_er != null) { s.ber_num += p.basic_er; s.ber_den += 1; }   // v58: promedio por post
        if (p.er != null)       { s.ers.push(p.er); }   // v59: mediana por post
      }
      for (const s of map.values()) s.reaches.sort((a, b) => a - b);
      return map;
    }
    function benchFor(post, bench) {
      if (!bench || !post) return null;
      const s = bench.get(segKey(post));
      const label = segLabel(post);
      if (!s) return { n: 0, label, enough: false };
      // Leave-one-out: quita la contribución del propio post
      const self = benchEligible(post);
      const n = s.n - (self ? 1 : 0);
      if (n < BENCH_MIN_N) return { n, label, enough: false };
      const bNum = s.ber_num - (self && post.basic_er != null ? post.basic_er : 0);
      const bDen = s.ber_den - (self && post.basic_er != null ? 1 : 0);
      let ers = s.ers;
      if (self && post.er != null) { const i = ers.indexOf(post.er); if (i >= 0) ers = ers.slice(0, i).concat(ers.slice(i + 1)); }
      let reaches = s.reaches;
      if (self) { const i = reaches.indexOf(post.reach); if (i >= 0) reaches = reaches.slice(0, i).concat(reaches.slice(i + 1)); }
      const mid = Math.floor(reaches.length / 2);
      const reachMed = reaches.length % 2 ? reaches[mid] : (reaches[mid - 1] + reaches[mid]) / 2;
      const basic_er = bDen > 0 ? bNum / bDen : null;
      const er = ers.length ? medianOf(ers) : null;
      const rel = (v, b) => (v != null && b != null && b > 0) ? ((v - b) / b) * 100 : null;
      return {
        n, label, enough: true, basic_er, er, reachMed,
        d_basic_er: rel(post.basic_er, basic_er),
        d_er: rel(post.er, er),
        d_reach: rel(post.reach, reachMed),
      };
    }

    // v21 — accesibilidad: hace "clicable con teclado" un elemento no-botón
    function kbd(fn, label) {
      if (!fn) return {};
      return {
        role: 'button', tabIndex: 0, 'aria-label': label,
        onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); } },
      };
    }

    // ============================================================
    // v20 — TASAS PONDERADAS (Σ numerador ÷ Σ denominador)
    // Replica las fórmulas del Sheet pero sobre el conjunto filtrado:
    //   ER Views %  = Σ Inter. Totales ÷ Σ Alcance
    //   ER Básico % = Σ Inter. Básicas ÷ Σ Alcance
    //   CTR %       = Σ Clics ÷ Σ Impresiones
    //   VTR %       = promedio simple de la columna VTR %, como la BDD (v73)
    // Así cada post pesa según su tamaño: un post de 200 de alcance ya no
    // mueve el KPI igual que uno de 2M (sesgo del promedio simple v19).
    // ============================================================
    function medianOf(arr) {
      if (!arr || !arr.length) return null;
      const a = [...arr].sort((x, y) => x - y), m = a.length >> 1;
      return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
    }
    function rateAccum() {
      return { er_num:0, er_den:0, er_vals: [], ber_num:0, ber_den:0, ctr_num:0, ctr_den:0,
               vtr_num:0, vtr_den:0, flagged:0, er_mean_sum:0, er_mean_n:0 };
    }
    function rateAdd(r, p) {
      const bad = p._flags || [];
      if (bad.length) r.flagged += 1;
      if (p.reach > 0 && !bad.includes('er')) {
        // v59 — ER total = MEDIANA por post, sin Stories. Incluye reproducciones y
        // no tiene techo (hay posts de 100,000%), así que el promedio se dispara;
        // la mediana describe el post típico sin que la pauta domine.
        if (p.er != null && p.format !== 'Stories') {
          r.er_num += p.er;
          r.er_den += 1;
          r.er_vals.push(p.er);
          if (p.er !== 0) { r.er_mean_sum += p.er; r.er_mean_n += 1; }
        }
        // v58 — ER básico = promedio por post, sin Stories (así lo mide el cliente).
        // Ponderado por alcance, los posts con pauta (millones de alcance y pocas
        // interacciones) aplastaban el resultado.
        if (p.basic_er != null && p.format !== 'Stories') {
          r.ber_num += p.basic_er;
          r.ber_den += 1;
        }
      }
      // CTR: solo posts con clics registrados (> 0). En pauta y en varias
      // plataformas el clic no se captura y viene en 0; contarlo como 0 real
      // hundiría el CTR. Mismo criterio de "registrado" que en v19.
      if (p.ctr != null && p.ctr > 0 && p.impressions > 0 && !bad.includes('ctr')) {
        r.ctr_num += p.clics != null ? p.clics : p.ctr * p.impressions / 100;
        r.ctr_den += p.impressions;
      }
      // v73 — VTR = promedio simple de todos los valores capturados en la columna
      // «VTR %» (incluye 0 %), exactamente como el promedio de la BDD. Ponderado
      // por views, la pauta (≈99 % de las reproducciones en TikTok) aplastaba al
      // orgánico. El KPI de cuenta (videos de 0 a 30 s, sin Stories) va aparte.
      if (p.vtr != null && isFinite(p.vtr)) {
        r.vtr_num += p.vtr;
        r.vtr_den += 1;
      }
    }
    function rateFinal(r) {
      return {
        er_avg:       r.er_vals.length ? medianOf(r.er_vals) : 0,
        basic_er_avg: r.ber_den ? r.ber_num / r.ber_den : 0,
        ctr_avg:      r.ctr_den ? (r.ctr_num / r.ctr_den) * 100 : 0,
        vtr_avg:      r.vtr_den ? r.vtr_num / r.vtr_den : 0,
        er_mean:      r.er_mean_n ? r.er_mean_sum / r.er_mean_n : 0,
        flagged_posts: r.flagged,
      };
    }

    function emptyAgg() {
      return {
        reach:0, impressions:0, inter:0, basic_inter:0, views:0,
        reactions:0, comments:0, shares:0, saves:0, clics:0,
        posts:0,
        _r: rateAccum(),
      };
    }
    function aggAdd(a, p) {
      a.reach += p.reach || 0; a.impressions += p.impressions || 0;
      a.inter += p.interactions || 0; a.basic_inter += p.basic_interactions || 0;
      a.views += p.views || 0;
      a.reactions += p.reactions || 0; a.comments += p.comments || 0;
      a.shares += p.shares || 0; a.saves += p.saves || 0; a.clics += p.clics || 0;
      a.posts += 1;
      rateAdd(a._r, p);
    }
    function aggFinalize(a) {
      const o = { ...a, ...rateFinal(a._r) };
      // Promedios por publicación (totales / # posts)
      o.reach_per_post = a.posts > 0 ? a.reach / a.posts : 0;
      o.inter_per_post = a.posts > 0 ? a.inter / a.posts : 0;
      o.views_per_post = a.posts > 0 ? a.views / a.posts : 0;
      delete o._r;
      return o;
    }
    function groupAgg(posts, keyFn) {
      const map = new Map();
      for (const p of posts) {
        const k = keyFn(p);
        if (k == null || k === '') continue;
        if (!map.has(k)) map.set(k, emptyAgg());
        aggAdd(map.get(k), p);
      }
      const r = {}; for (const [k,v] of map) r[k] = aggFinalize(v); return r;
    }
    function nestedGroupAgg(posts, outerFn, innerFn) {
      const outer = {};
      for (const p of posts) {
        const ko = outerFn(p), ki = innerFn(p);
        if (ko == null || ki == null || ki === '') continue;
        if (!outer[ko]) outer[ko] = new Map();
        if (!outer[ko].has(ki)) outer[ko].set(ki, emptyAgg());
        aggAdd(outer[ko].get(ki), p);
      }
      const r = {};
      for (const [ko, inner] of Object.entries(outer)) {
        r[ko] = {}; for (const [ki, v] of inner) r[ko][ki] = aggFinalize(v);
      }
      return r;
    }

    /**
     * Normaliza filas crudas de todas las pestañas en un array de posts.
     * Se ejecuta UNA VEZ al cargar — no depende de filtros.
     */
    function normalizeAll(rawByPlatform) {
      const allPosts = [];
      const _diagByPlat = {};  // diagnóstico
      for (const [platform, rows] of Object.entries(rawByPlatform)) {
        let raw = 0, ok = 0;
        for (const r of rows) {
          raw++;
          const p = normalizeRow(r, platform);
          if (p) {
            p._row = r._row ?? null;
            // v43 — año de la SEMANA (no del calendario): la S1 2026 arranca el
            // 28-dic-2025, así que esos días cuentan en 2026. Con p.wk
            // (año·100 + semana) nunca se juntan la S30 de 2025 y la de 2026.
            const cy = calYear(p), dd = parseDate(p.date);
            let wy = cy;
            if (p.week != null && dd) {
              if (p.week <= 2 && dd.getMonth() === 11) wy = dd.getFullYear() + 1;
              else if (p.week >= 50 && dd.getMonth() === 0) wy = dd.getFullYear() - 1;
            }
            p._wy = wy;
            p.wk = (p.week != null && wy) ? wy * 100 + (+p.week) : null;
            allPosts.push(p); ok++;
          }
        }
        _diagByPlat[platform] = { raw_rows: raw, posts_ok: ok };
      }
      // Diagnóstico visible en consola, window.__smxDebug y panel #6
      const _s18 = allPosts.filter(p => p.week === 18);
      const _s18ByPlat = {};
      for (const p of _s18) _s18ByPlat[p.platform] = (_s18ByPlat[p.platform]||0)+1;

      // Captura filas crudas tal como las devolvió gviz/papaparse — para detectar
      // si el Sheet en vivo está enviando menos filas de las que parecen estar
      // presentes en la base de datos
      const _rawCountByPlat = {};
      const _rawS18ByPlat = {};
      const _rawS18Rows = {};   // sólo IG para inspección detallada
      for (const [platform, rows] of Object.entries(rawByPlatform)) {
        _rawCountByPlat[platform] = rows.length;
        const s18raw = rows.filter(r => {
          const s = r['Semana'];
          if (s == null || s === '') return false;
          const n = parseFloat(String(s).replace(',', '.'));
          return n === 18;
        });
        _rawS18ByPlat[platform] = s18raw.length;
        if (platform === 'Instagram' || platform === 'Facebook') {
          _rawS18Rows[platform] = s18raw.map(r => ({
            link: r['Link'] ? '✓' : '—',
            fecha: r['Fecha'],
            formato: r['Formato'],
            alcance: r['Alcance'],
            inter_totales: r['Inter. Totales'],
          }));
        }
      }

      console.log('%c[Samsung MX dashboard · build ' + BUILD_VERSION + ']',
        'color:#4C6EF5;font-weight:bold;font-size:13px');
      console.log('Filas crudas devueltas por gviz:', _rawCountByPlat);
      console.log('Filas crudas con Semana=18:', _rawS18ByPlat);
      console.log('Posts válidos por plataforma:', _diagByPlat);
      console.log('Total posts: ' + allPosts.length + '  ·  S18: ' + _s18.length);
      console.log('S18 por plataforma:', _s18ByPlat);
      console.log('Detalle de filas RAW S18 (FB e IG):');
      console.table(_rawS18Rows.Facebook || []);
      console.table(_rawS18Rows.Instagram || []);

      window.__smxDebug = {
        build: BUILD_VERSION,
        rawCountByPlat: _rawCountByPlat,
        rawS18ByPlat: _rawS18ByPlat,
        rawS18Rows: _rawS18Rows,
        byPlatform: _diagByPlat,
        s18ByPlat: _s18ByPlat,
        totalPosts: allPosts.length,
        totalS18: _s18.length,
        allPosts,
      };
      // Meta global: dominio completo de los datos (independiente de filtros)
      const weeks = [...new Set(allPosts.map(p => p.wk).filter(Boolean))].sort((a,b)=>a-b);
      // FIX: comparar como Date objects, no strings, para que date_min/max sean
      // cronológicos (antes "31/12/2025" > "01/01/2026" alfabéticamente)
      const dates = allPosts.map(p => parseDate(p.date)).filter(Boolean);
      const campaigns = [...new Set(allPosts.map(p => p.campaign).filter(Boolean))].sort();
      const subcampaigns = [...new Set(allPosts.map(p => p.subcampaign).filter(Boolean))].sort();
      const content_types = [...new Set(allPosts.map(p => p.content_type).filter(Boolean))].sort();
      const stages = [...new Set(allPosts.map(p => p.stage).filter(Boolean))].sort();
      const strategies = [...new Set(allPosts.map(p => p.strategy).filter(Boolean))].sort();
      const products = [...new Set(allPosts.map(p => p.product).filter(Boolean))].sort();
      const platforms = [...new Set(allPosts.map(p => p.platform))].sort();
      // Años presentes — derivados de fecha o del campo "Año" del Sheet
      const yearsSet = new Set();
      for (const p of allPosts) {
        if (p.year && +p.year > 1900) yearsSet.add(+p.year);
        const dt = parseDate(p.date);
        if (dt) yearsSet.add(dt.getFullYear());
      }
      const years = [...yearsSet].sort((a,b) => b - a);  // recientes primero

      // Semanas con datos por año — para el slider, que muestra sólo
      // las semanas relevantes al año filtrado
      const weeksByYear = {};
      for (const p of allPosts) {
        if (p.week == null) continue;
        let y = null;
        if (p.year && +p.year > 1900) y = +p.year;
        else {
          const dt = parseDate(p.date);
          if (dt) y = dt.getFullYear();
        }
        if (!y) continue;
        if (!weeksByYear[y]) weeksByYear[y] = new Set();
        weeksByYear[y].add(p.week);
      }
      const weeksByYearArr = {};
      for (const y of Object.keys(weeksByYear)) {
        weeksByYearArr[y] = [...weeksByYear[y]].sort((a,b) => a-b);
      }

      // Mapa campaña → subcampañas (para el filtro encadenado)
      const subBy = {};
      for (const p of allPosts) {
        if (p.campaign && p.subcampaign) {
          if (!subBy[p.campaign]) subBy[p.campaign] = new Set();
          subBy[p.campaign].add(p.subcampaign);
        }
      }
      const subcampaignsByCampaign = Object.fromEntries(
        Object.entries(subBy).map(([k, v]) => [k, [...v].sort()])
      );

      // Detectar posts huérfanos (sin Semana asignada) — útil para que el
      // usuario sepa que tiene filas en su Sheet sin clasificar
      const orphansNoWeek = allPosts.filter(p => p.week == null);
      const orphansByPlatform = {};
      for (const p of orphansNoWeek) {
        orphansByPlatform[p.platform] = (orphansByPlatform[p.platform] || 0) + 1;
      }

      // Igual, pero para Etapa — el desglose §04 "Por etapa" queda incompleto
      // en silencio si hay filas sin ese campo, así que lo avisamos.
      const orphansNoStage = allPosts.filter(p => !p.stage);
      const orphansNoStageByPlatform = {};
      for (const p of orphansNoStage) {
        orphansNoStageByPlatform[p.platform] = (orphansNoStageByPlatform[p.platform] || 0) + 1;
      }

      const meta = {
        total_posts: allPosts.length,
        platforms,
        weeks,
        weeks_by_year: weeksByYearArr,
        years,
        campaigns,
        subcampaigns,
        content_types,
        stages,
        strategies,
        products,
        subcampaignsByCampaign,
        date_min: dates.length ? dates.reduce((a,b) => a<b?a:b) : null,
        date_max: dates.length ? dates.reduce((a,b) => a>b?a:b) : null,
        orphans_no_week: orphansNoWeek.length,
        orphans_no_week_by_platform: orphansByPlatform,
        orphans_no_stage: orphansNoStage.length,
        orphans_no_stage_by_platform: orphansNoStageByPlatform,
      };
      return { allPosts, meta };
    }

    /**
     * Aplica los filtros al array de posts.
     * Filtros vacíos = no filtra esa dimensión.
     */
    // Helper: deriva el año de un post desde p.year o desde parseDate(p.date)
    // Año del post para filtros y agrupaciones = año de su semana (v43)
    function postYear(p) {
      if (p._wy) return p._wy;
      return calYear(p);
    }
    function calYear(p) {
      if (p.year && +p.year > 1900) return +p.year;
      const dt = parseDate(p.date);
      if (dt) return dt.getFullYear();
      return null;
    }

    // v43 — etiquetas de semana con año: "S30" o "S30 '25"
    const wkWeek = (k) => k % 100;
    const wkYear = (k) => Math.floor(k / 100);
    const wkLabel = (k, withYear) => `S${wkWeek(k)}${withYear ? ` '${String(wkYear(k)).slice(2)}` : ''}`;
    const wkLong = (k) => `Semana ${wkWeek(k)} de ${wkYear(k)}`;
    const wkPrev = (k) => wkWeek(k) > 1 ? k - 1 : (wkYear(k) - 1) * 100 + 52;
    const multiYear = (keys) => new Set((keys || []).map(k => wkYear(+k))).size > 1;

    // Mes (1-12) del post, derivado de su fecha — igual que el año, así no
    // depende de cómo venga escrita la columna "Mes" en el Sheet.
    const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    function postMonth(p) {
      const dt = parseDate(p.date);
      if (dt) return dt.getMonth() + 1;
      const m = toNum(p.month);
      return m != null && m >= 1 && m <= 12 ? m : null;
    }

    function applyFilters(allPosts, filters) {
      const { year, weeks, months, platforms, campaigns, subcampaigns, contentTypes, stages, strategies, products, formats } = filters;
      return allPosts.filter(p => {
        if (year && year !== 'all') {
          const py = postYear(p);
          if (py !== year) return false;
        }
        if (weeks && weeks.length > 0) {
          if (p.wk == null || !weeks.includes(p.wk)) return false;
        }
        if (months && months.length > 0) {
          const pm = postMonth(p);
          if (pm == null || !months.includes(pm)) return false;
        }
        if (platforms && platforms.length > 0 && !platforms.includes(p.platform)) return false;
        if (campaigns && campaigns.length > 0 && !campaigns.includes(p.campaign)) return false;
        if (subcampaigns && subcampaigns.length > 0 && !subcampaigns.includes(p.subcampaign)) return false;
        if (contentTypes && contentTypes.length > 0 && !contentTypes.includes(p.content_type)) return false;
        if (stages && stages.length > 0 && !stages.includes(p.stage)) return false;
        if (formats && formats.length > 0 && !formats.includes(p.format)) return false;
        if (strategies && strategies.length > 0 && !strategies.includes(p.strategy)) return false;
        if (products && products.length > 0 && !products.includes(p.product)) return false;
        return true;
      });
    }

    // ============================================================
    // FILTROS ENCADENADOS ("faceted filtering")
    // Cada selector solo debe ofrecer las opciones que en verdad existen
    // dentro del universo ya acotado por los DEMÁS filtros activos. Ej:
    // si Año=2026, "Campaña" solo lista campañas con posts en 2026; si
    // Campaña=H8Q8B8, "Subcampaña"/"Semana"/"Plataforma"/etc. solo listan
    // lo que vive dentro de esa campaña. Y viceversa entre cualquier par.
    // ============================================================
    const FACET_FIELD_MAP = {
      weeks: 'wk',
      months: 'month_num',
      platforms: 'platform',
      campaigns: 'campaign',
      subcampaigns: 'subcampaign',
      contentTypes: 'content_type',
      stages: 'stage',
      strategies: 'strategy',
      products: 'product',
      formats: 'format',
    };

    // Dimensiones habilitadas para la comparativa "Entidad vs. entidad"
    // (§ 08 · Comparativas) — reutiliza FACET_FIELD_MAP para saber en qué
    // campo de cada post filtrar.
    const COMPARE_DIMENSIONS = [
      { key: 'campaigns',    label: 'Campaña' },
      { key: 'subcampaigns', label: 'Subcampaña' },
      { key: 'stages',       label: 'Etapa' },
      { key: 'strategies',   label: 'Pauta' },
      { key: 'contentTypes', label: 'Tipo contenido' },
    ];

    // Para cada dimensión, calcula el set de valores que siguen existiendo
    // si se aplican TODOS los demás filtros activos (año incluido) pero se
    // ignora la propia dimensión — así su selección nunca se autolimita.
    function computeFacetSets(allPosts, filters) {
      const sets = {};
      for (const key of Object.keys(FACET_FIELD_MAP)) {
        const field = FACET_FIELD_MAP[key];
        const scoped = applyFilters(allPosts, { ...filters, [key]: [] });
        const set = new Set();
        for (const p of scoped) {
          const v = key === 'months' ? postMonth(p) : p[field];
          if (v != null && v !== '') set.add(v);
        }
        sets[key] = set;
      }
      return sets;
    }

    // Recorta cada filtro array a solo los valores que siguen siendo
    // válidos tras un cambio — evita el caso "0 resultados" en silencio
    // por una combinación que ya no tiene sentido (ej. una subcampaña que
    // no pertenece a la campaña recién elegida, o una semana que no
    // existe en el año recién elegido).
    function sanitizeFilters(allPosts, filters) {
      if (!allPosts || allPosts.length === 0) return filters;
      const sets = computeFacetSets(allPosts, filters);
      let changed = false;
      const next = { ...filters };
      for (const key of Object.keys(FACET_FIELD_MAP)) {
        const current = filters[key] || [];
        if (current.length === 0) continue;
        const allowed = sets[key];
        const pruned = current.filter((v) => allowed.has(v));
        if (pruned.length !== current.length) {
          next[key] = pruned;
          changed = true;
        }
      }
      return changed ? next : filters;
    }

    /**
     * Computa todos los agregados sobre un set de posts (ya filtrado o no).
     * Esta función SÍ se ejecuta en cada cambio de filtros.
     */
    function computeAggregates(posts, baseMeta) {
      const global = aggFinalize(posts.reduce((acc, p) => { aggAdd(acc, p); return acc; }, emptyAgg()));
      const by_platform = groupAgg(posts, p => p.platform);
      const by_week = groupAgg(posts.filter(p => p.wk), p => p.wk);
      const by_plat_week = nestedGroupAgg(posts.filter(p => p.wk), p => p.platform, p => p.wk);
      const by_format = groupAgg(posts, p => p.format);
      const by_product = groupAgg(posts, p => p.product);
      const by_strategy = groupAgg(posts, p => p.strategy);
      const by_campaign = groupAgg(posts, p => p.campaign);
      const by_objective = groupAgg(posts, p => p.objective);
      const by_stage = groupAgg(posts, p => p.stage);

      // Meta del subset filtrado (para la sección "viendo")
      const weeksInScope = [...new Set(posts.map(p => p.wk).filter(Boolean))].sort((a,b)=>a-b);
      // FIX: parsear a Date para que el min/max sea cronológico, no alfabético
      const datesInScope = posts.map(p => parseDate(p.date)).filter(Boolean);

      return {
        global, by_platform, by_week, by_plat_week, by_format, by_product,
        by_strategy, by_campaign, by_objective, by_stage,
        meta: {
          ...baseMeta,
          // Sobreescribimos sólo los campos que dependen del filtro
          posts_in_scope: posts.length,
          weeks_in_scope: weeksInScope,

    // ============================================================
    // Siempre número entero completo con separadores de miles (petición
    // del cliente: ver el dato exacto, nunca abreviado a K/M/B).
    const fmt = (n) => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-MX');
    const fmtFull = (n) => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-MX');
    const erFmt = (n) => n == null ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';

    // Parser robusto de fechas. Tu Sheet puede tener fechas en varios formatos:
    //   - "2026-04-27" (ISO)              ← parsea nativo
    //   - "27/04/2026" (DD/MM/YYYY MX)    ← parsea custom (nativo lo lee mal)
    //   - "27/04/26"   (DD/MM/YY)         ← parsea custom
    //   - "27 abr 2026"                    ← parsea custom (mes en español corto)
    //   - "05-ene", "05 ene"               ← parsea custom (sin año)
    //   - Date object (Excel / Google)     ← parsea nativo
    const ES_MONTHS = {
      'ene':1,'enero':1, 'feb':2,'febrero':2, 'mar':3,'marzo':3,
      'abr':4,'abril':4, 'may':5,'mayo':5, 'jun':6,'junio':6,
      'jul':7,'julio':7, 'ago':8,'agosto':8, 'sep':9,'sept':9,'septiembre':9,
      'oct':10,'octubre':10, 'nov':11,'noviembre':11, 'dic':12,'diciembre':12,
    };
    function parseDate(d) {
      if (!d) return null;
      if (d instanceof Date && !isNaN(d)) return d;
      const s = String(d).trim();
      if (!s) return null;

      // ISO: 2026-04-27 — parser nativo lo interpreta como UTC, ajustamos con T12 para evitar shift de día
      const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) {
        const dt = new Date(+iso[1], +iso[2] - 1, +iso[3]);
        if (!isNaN(dt)) return dt;
      }

      // DD/MM/YYYY o DD-MM-YYYY (formato MX común)
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (dmy) {
        const day = +dmy[1], month = +dmy[2] - 1;
        let year = +dmy[3];
        if (year < 100) year += 2000;
        const dt = new Date(year, month, day);
        if (!isNaN(dt)) return dt;
      }

      // DD-mes-YYYY o DD mes YYYY (con mes en español)
      const dmyEs = s.match(/^(\d{1,2})[\s\-](\p{L}+)(?:[\s\-](\d{2,4}))?$/u);
      if (dmyEs) {
        const day = +dmyEs[1];
        const monthKey = dmyEs[2].toLowerCase().replace('.','');
        const month = ES_MONTHS[monthKey];
        if (month) {
          let year = dmyEs[3] ? +dmyEs[3] : new Date().getFullYear();
          if (year < 100) year += 2000;
          const dt = new Date(year, month - 1, day);
          if (!isNaN(dt)) return dt;
        }
      }

      // Último recurso: parser nativo
      const dt = new Date(s);
      if (!isNaN(dt)) return dt;
      return null;
    }

    const dateFmt = (d) => {
      const dt = parseDate(d);
      if (!dt) return d ? String(d) : '—';
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
    };
    const dateShort = (d) => {
      const dt = parseDate(d);
      if (!dt) return d ? String(d) : '—';
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });

    // reutiliza los que ya existen y calcula al vuelo los que faltan
    // (subcampaña / tipo de contenido) con groupAgg sobre D.allPosts.
    function groupedReportRows(D, dimKey) {
      const dim = REPORT_DIMENSIONS.find(d => d.key === dimKey);
      if (!dim) return [];
      const precomputed = {
        platform: D.by_platform, week: D.by_week, campaign: D.by_campaign,
        product: D.by_product, strategy: D.by_strategy, stage: D.by_stage,
        format: D.by_format, objective: D.by_objective,
      };
      const grouped = precomputed[dimKey] || groupAgg(D.allPosts || [], (p) => p[dim.field]);
      let keys = Object.keys(grouped);
      if (dimKey === 'week') keys.sort((a, b) => +a - +b);
      else keys.sort((a, b) => (grouped[b].reach || 0) - (grouped[a].reach || 0));
      return keys.map((k) => ({
        label: dimKey === 'week' ? wkLong(+k) : k,
        agg: grouped[k],
      }));
    }

    function suggestedReportTitle(filters, mode, dimLabel) {
      const parts = [];
      parts.push(mode === 'summary' ? `Resumen por ${dimLabel}` : 'Posts');
      if (filters.platforms.length === 1) parts.push(filters.platforms[0]);
      else if (filters.platforms.length > 1) parts.push(`${filters.platforms.length} plataformas`);
      if (filters.contentTypes.length) parts.push(filters.contentTypes.join('+'));
      if (filters.campaigns.length === 1) parts.push(filters.campaigns[0]);
      if (filters.year !== 'all') parts.push(String(filters.year));
      if (filters.weeks.length === 1) parts.push(wkLabel(filters.weeks[0], true));
      else if (filters.weeks.length > 1) parts.push(`${filters.weeks.length} semanas`);
      parts.push(new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }));
      return parts.join(' · ');
    }

    // Nombre de archivo seguro para el .xlsx descargado (sin caracteres
    // raros ni acentos problemáticos en distintos SO).
    function sanitizeFileName(name) {
      const NFD_MARKS = new RegExp('[̀-ͯ]', 'g'); // marcas de acento tras normalize('NFD')
      const clean = String(name || 'Reporte')
        .normalize('NFD').replace(NFD_MARKS, '')
        .replace(/[\\/:*?"<>|]/g, '-') // caracteres inválidos en nombres de archivo
        .trim();
      return clean.length ? clean : 'Reporte';
    }

    // Nombre de pestaña seguro para el workbook de Excel (máx. 31
    // caracteres, sin [ ] : * ? / \ que Excel no permite en tabs).
    function sanitizeSheetTabName(name) {
      const clean = String(name || 'Reporte').replace(/[\[\]:*?/\\]/g, '-').trim();
      return (clean.length ? clean : 'Reporte').substring(0, 31);

    // la semana N del año, usando convención US/MX:
    //   Semana 1 = semana que contiene el 1 de enero, inicia en domingo.
    function weekDays(weekNum, year) {
      const jan1 = new Date(year, 0, 1);
      const dow = jan1.getDay();                // 0=Dom .. 6=Sáb
      const start = new Date(year, 0, 1 - dow + (weekNum - 1) * 7);
      return Array.from({ length: 7 }, (_, i) =>
        new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }
    const DAY_NAMES_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

    const dayLabel = (d) => `${DAY_NAMES_ES[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;

    // Infiere el año dominante de un conjunto de posts (por fecha o por p.year)
    const timeAgo = (ts) => {
      if (!ts) return '—';
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return 'hace un momento';
      if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
      if (diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
      return `hace ${Math.floor(diff/86400)} d`;
