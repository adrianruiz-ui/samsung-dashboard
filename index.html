  <script type="module">
    import React, { useState, useEffect, useCallback, useMemo } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import { ResponsiveContainer, AreaChart, Area, XAxis, YAxis, Tooltip, CartesianGrid, ComposedChart, Bar, Line } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    const SHEET_ID = '1TcmeDE08Df6Qk4lzRe6PhIBq5qOBUCC_vvHZq4UWD98';
    const SHEET_TABS = { Facebook: '📘 Facebook', Instagram: '📷 Instagram', YouTube: '▶️ YouTube', TikTok: '🎵 TikTok', X: '𝕏 X', LinkedIn: '💼 LinkedIn', Threads: '🧵 Threads' };
    const PLAT_COLORS = { Facebook:'#3B6FB8', Instagram:'#C73E6B', TikTok:'#1FA9B0', X:'#2A2A2A', YouTube:'#C53030', Threads:'#525252', LinkedIn:'#1F4D8C' };
    const PLAT_LETTERS = { Facebook:'FB', Instagram:'IG', YouTube:'YT', TikTok:'TT', X:'X', LinkedIn:'LI', Threads:'TH' };

    function toNum(v) {
      if (v == null || v === '') return 0;
      let s = String(v).trim().replace(/,/g, '').replace(/%/g, '');
      if (s === '' || s === '—' || s === '-' || s === '#N/A') return 0;
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function parseDateAndWeek(dateStr) {
      if (!dateStr) return { date: null, week: null };
      const parts = dateStr.split('/');
      let d = parts.length === 3 ? new Date(parts[2], parts[1] - 1, parts[0]) : new Date(dateStr);
      if (isNaN(d.getTime())) return { date: dateStr, week: null };
      
      const date = new Date(d.getTime());
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
      const week1 = new Date(date.getFullYear(), 0, 4);
      const week = 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
      return { date: d.toISOString(), week: week };
    }

    const COL_MAP = { 'Link': 'link', 'Fecha': 'date', 'Semana': 'week', 'Formato': 'format', 'Producto': 'product', 'Campaña': 'campaign', 'Alcance': 'reach', 'Inter. Totales': 'interactions', 'ER Views %': 'er', 'Views': 'views' };

    async function fetchData() {
      const allRows = [];
      for (const [plat, tab] of Object.entries(SHEET_TABS)) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&range=A2:AI`;
        const res = await fetch(url);
        const csv = await res.text();
        const parsed = Papa.parse(csv, { header: true, skipEmptyLines: 'greedy' });
        parsed.data.forEach(row => {
          if (!row.Post && !row.Link && !row.Fecha) return;
          const { date, week } = parseDateAndWeek(row.Fecha);
          const normalized = { platform: plat, date, week: toNum(row.Semana) || week };
          Object.entries(COL_MAP).forEach(([es, en]) => { normalized[en] = en === 'reach' || en === 'interactions' || en === 'er' || en === 'views' ? toNum(row[es]) : row[es]; });
          allRows.push(normalized);
        });
      }
      return allRows;
    }

    const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1) + 'M' : n >= 1e3 ? (n/1e3).toFixed(1) + 'K' : Math.round(n).toLocaleString();

    function App() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [weekFilter, setWeekFilter] = useState(18);

      useEffect(() => { fetchData().then(d => { setData(d); setLoading(false); }); }, []);

      const filtered = useMemo(() => data.filter(p => p.week === weekFilter), [data, weekFilter]);
      const stats = useMemo(() => {
        return filtered.reduce((acc, p) => {
          acc.reach += p.reach; acc.inter += p.interactions; acc.posts += 1;
          return acc;
        }, { reach: 0, inter: 0, posts: 0 });
      }, [filtered]);

      if (loading) return html`<div class="h-screen flex items-center justify-center font-mono">Cargando datos maestros...</div>`;

      return html`
        <div class="min-h-screen bg-paper pb-20">
          <header class="sticky top-0 z-30 bg-paper/80 border-b border-rule px-8 py-4 flex justify-between items-center backdrop-blur">
            <span class="font-serif italic text-2xl">Samsung MX.</span>
            <div class="flex gap-2">
              ${
