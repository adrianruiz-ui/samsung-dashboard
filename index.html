<body>
  <div id="root"></div>

  <script type="module">
    // ============================================================
    // IMPORTS desde CDN (esm.sh) — sin build step
    // ============================================================
    import React, { useState, useEffect, useCallback, useMemo, useRef, Fragment } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import {
      ResponsiveContainer, AreaChart, Area, BarChart, Bar,
      LineChart, Line, ComposedChart, XAxis, YAxis, Tooltip, CartesianGrid,
    } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    // ============================================================
    // CONFIG — Edita estas constantes para tu deploy
    // ============================================================
    const SHEET_ID = '1TcmeDE08Df6Qk4lzRe6PhIBq5qOBUCC_vvHZq4UWD98';
    const CACHE_TTL_MIN = 5;       // cuánto tiempo cachea localmente
    const AUTO_REFRESH_MIN = 5;    // polling automático en background; 0 = desactivado

    // ============================================================
    // CLIENTE GOOGLE SHEETS
    // ============================================================
    const SHEET_TABS = {
      Facebook:  '📘 Facebook',
      Instagram: '📷 Instagram',
      YouTube:   '▶️ YouTube',
      TikTok:    '🎵 TikTok',
      X:         '𝕏 X',
      LinkedIn:  '💼 LinkedIn',
      Threads:   '🧵 Threads',
    };
    const PLATFORMS = Object.keys(SHEET_TABS);

    function buildSheetUrl(tabName) {
      if (!SHEET_ID) throw new Error('Falta SHEET_ID en la configuración del archivo.');
      const params = new URLSearchParams({
        tqx: 'out:csv',
        sheet: tabName,
        range: 'A2:AI',
      });
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
    }

    async function fetchTab(platformName) {
      const tabName = SHEET_TABS[platformName];
      const res = await fetch(buildSheetUrl(tabName), { redirect: 'follow' });
      if (!res.ok) throw new Error(`Error al cargar "${tabName}": HTTP ${res.status}`);
      const csvText = await res.text();
      if (csvText.trim().startsWith('<')) {
        throw new Error(`"${tabName}" no devolvió CSV. ¿El Sheet es público?`);
      }
      const parsed = Papa.parse(csvText, {
        header: true, skipEmptyLines: 'greedy', dynamicTyping: false,
      });
      return parsed.data.map(row => ({ ...row, _platform: platformName }));
    }

    async function fetchAllPlatforms() {
      const results = await Promise.allSettled(
        PLATFORMS.map(p => fetchTab(p).then(rows => ({ platform: p, rows })))
      );
      const data = {}; const errors = [];
      for (let i = 0; i < results.length; i++) {
        const r = results[i]; const platform = PLATFORMS[i];
        if (r.status === 'fulfilled') data[platform] = r.value.rows;
        else { errors.push({ platform, message: r.reason?.message || String(r.reason) }); data[platform] = []; }
      }
      return { data, errors, fetchedAt: Date.now() };
    }

    // ============================================================
    // TRANSFORMACIÓN — columnas español → claves internas + agregados
    // ============================================================
    const COL_MAP = {
      'Link': 'link', 'Fecha': 'date', 'Semana': 'week', 'Mes': 'month', 'Año': 'year',
      'Formato': 'format', 'Tipo Contenido': 'content_type', 'Tipo Pauta': 'strategy',
      'Campaña': 'campaign', 'Subcampaña': 'subcampaign', 'Etapa': 'stage',
      'Producto': 'product', 'Objetivo': 'objective', 'Audio': 'audio',
      'Subtítulos': 'subtitles', 'IA': 'ai', 'Duración (seg)': 'duration',
      'Alcance': 'reach', 'Impresiones': 'impressions', 'Reacciones': 'reactions',
      'Comentarios': 'comments', 'Compartidos': 'shares', 'Guardados': 'saves',
      'Repost': 'repost', 'Clics': 'clics', 'Views': 'views',
      'Inter. Básicas': 'basic_interactions', 'Inter. Totales': 'interactions',
      'ER Básico %': 'basic_er', 'ER Views %': 'er', 'CTR %': 'ctr',
      'T. Prom. Vista': 'avg_watch_time', 'VTR %': 'vtr',
      '¿Influencer?': 'is_influencer', 'Nombre Influencer': 'influencer_name',
    };
    const NUMERIC_KEYS = new Set([
      'week','year','duration','reach','impressions','reactions','comments','shares',
      'saves','repost','clics','views','basic_interactions','interactions',
      'basic_er','er','ctr','avg_watch_time','vtr',
    ]);

    function toNum(v) {
      if (v == null || v === '') return null;
      if (typeof v === 'number') return v;
      let s = String(v).trim();
      if (s === '' || s === '—' || s === '-' || s === '#N/A' || s === '#DIV/0!') return null;
      s = s.replace(/%\s*$/, '');
      if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
      else if (s.includes(',') && !s.includes('.')) {
        const lastComma = s.lastIndexOf(',');
        const after = s.length - lastComma - 1;
        if (after <= 2 && s.split(',').length === 2) s = s.replace(',', '.');
        else s = s.replace(/,/g, '');
      }
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    }

    function normalizeRow(row, platform) {
      const out = { platform };
      for (const [esKey, enKey] of Object.entries(COL_MAP)) {
        if (esKey in row) {
          const raw = row[esKey];
          if (NUMERIC_KEYS.has(enKey)) out[enKey] = toNum(raw);
          else out[enKey] = raw === '' ? null : raw;
        }
      }
      if (!out.link && !out.reach && !out.interactions) return null;
      return out;
    }

    function emptyAgg() {
      return {
        reach:0, impressions:0, inter:0, views:0,
        reactions:0, comments:0, shares:0, saves:0, clics:0,
        posts:0,
        _er_sum:0, _er_n:0, _vtr_sum:0, _vtr_n:0, _ctr_sum:0, _ctr_n:0,
      };
    }
    function aggAdd(a, p) {
      a.reach += p.reach || 0; a.impressions += p.impressions || 0;
      a.inter += p.interactions || 0; a.views += p.views || 0;
      a.reactions += p.reactions || 0; a.comments += p.comments || 0;
      a.shares += p.shares || 0; a.saves += p.saves || 0; a.clics += p.clics || 0;
      a.posts += 1;
      if (p.er != null && p.er !== 0) { a._er_sum += p.er; a._er_n += 1; }
      if (p.vtr != null && p.vtr !== 0) { a._vtr_sum += p.vtr; a._vtr_n += 1; }
      if (p.ctr != null && p.ctr !== 0) { a._ctr_sum += p.ctr; a._ctr_n += 1; }
    }
    function aggFinalize(a) {
      const o = { ...a };
      o.er_avg = a._er_n ? a._er_sum / a._er_n : 0;
      o.vtr_avg = a._vtr_n ? a._vtr_sum / a._vtr_n : 0;
      o.ctr_avg = a._ctr_n ? a._ctr_sum / a._ctr_n : 0;
      delete o._er_sum; delete o._er_n; delete o._vtr_sum; delete o._vtr_n;
      delete o._ctr_sum; delete o._ctr_n;
      return o;
    }
    function groupAgg(posts, keyFn) {
      const map = new Map();
      for (const p of posts) {
        const k = keyFn(p);
        if (k == null || k === '') continue;
        if (!map.has(k)) map.set(k, emptyAgg());
        aggAdd(map.get(k), p);
      }
      const r = {}; for (const [k,v] of map) r[k] = aggFinalize(v); return r;
    }
    function nestedGroupAgg(posts, outerFn, innerFn) {
      const outer = {};
      for (const p of posts) {
        const ko = outerFn(p), ki = innerFn(p);
        if (ko == null || ki == null || ki === '') continue;
        if (!outer[ko]) outer[ko] = new Map();
        if (!outer[ko].has(ki)) outer[ko].set(ki, emptyAgg());
        aggAdd(outer[ko].get(ki), p);
      }
      const r = {};
      for (const [ko, inner] of Object.entries(outer)) {
        r[ko] = {}; for (const [ki, v] of inner) r[ko][ki] = aggFinalize(v);
      }
      return r;
    }

    /**
     * Normaliza filas crudas de todas las pestañas en un array de posts.
     * Se ejecuta UNA VEZ al cargar — no depende de filtros.
     */
    function normalizeAll(rawByPlatform) {
      const allPosts = [];
      for (const [platform, rows] of Object.entries(rawByPlatform)) {
        for (const r of rows) {
          const p = normalizeRow(r, platform);
          if (p) allPosts.push(p);
        }
      }
      // Meta global: dominio completo de los datos (independiente de filtros)
      const weeks = [...new Set(allPosts.map(p => p.week).filter(Boolean))].sort((a,b)=>a-b);
      const dates = allPosts.map(p => p.date).filter(Boolean);
      const campaigns = [...new Set(allPosts.map(p => p.campaign).filter(Boolean))].sort();
      const subcampaigns = [...new Set(allPosts.map(p => p.subcampaign).filter(Boolean))].sort();
      const platforms = [...new Set(allPosts.map(p => p.platform))].sort();

      // Mapa campaña → subcampañas (para el filtro encadenado)
      const subBy = {};
      for (const p of allPosts) {
        if (p.campaign && p.subcampaign) {
          if (!subBy[p.campaign]) subBy[p.campaign] = new Set();
          subBy[p.campaign].add(p.subcampaign);
        }
      }
      const subcampaignsByCampaign = Object.fromEntries(
        Object.entries(subBy).map(([k, v]) => [k, [...v].sort()])
      );

      const meta = {
        total_posts: allPosts.length,
        platforms,
        weeks,
        campaigns,
        subcampaigns,
        subcampaignsByCampaign,
        date_min: dates.length ? dates.reduce((a,b) => a<b?a:b) : null,
        date_max: dates.length ? dates.reduce((a,b) => a>b?a:b) : null,
      };
      return { allPosts, meta };
    }

    /**
     * Aplica los filtros al array de posts.
     * Filtros vacíos = no filtra esa dimensión.
     */
    function applyFilters(allPosts, filters) {
      const { weekRange, platforms, campaigns, subcampaigns } = filters;
      return allPosts.filter(p => {
        if (weekRange && p.week != null) {
          if (p.week < weekRange[0] || p.week > weekRange[1]) return false;
        }
        if (platforms && platforms.length > 0 && !platforms.includes(p.platform)) return false;
        if (campaigns && campaigns.length > 0 && !campaigns.includes(p.campaign)) return false;
        if (subcampaigns && subcampaigns.length > 0 && !subcampaigns.includes(p.subcampaign)) return false;
        return true;
      });
    }

    /**
     * Computa todos los agregados sobre un set de posts (ya filtrado o no).
     * Esta función SÍ se ejecuta en cada cambio de filtros.
     */
    function computeAggregates(posts, baseMeta) {
      const global = aggFinalize(posts.reduce((acc, p) => { aggAdd(acc, p); return acc; }, emptyAgg()));
      const by_platform = groupAgg(posts, p => p.platform);
      const by_week = groupAgg(posts.filter(p => p.week), p => p.week);
      const by_plat_week = nestedGroupAgg(posts.filter(p => p.week), p => p.platform, p => p.week);
      const by_format = groupAgg(posts, p => p.format);
      const by_product = groupAgg(posts, p => p.product);
      const by_strategy = groupAgg(posts, p => p.strategy);
      const by_campaign = groupAgg(posts, p => p.campaign);
      const by_objective = groupAgg(posts, p => p.objective);

      // Meta del subset filtrado (para la sección "viendo")
      const weeksInScope = [...new Set(posts.map(p => p.week).filter(Boolean))].sort((a,b)=>a-b);
      const datesInScope = posts.map(p => p.date).filter(Boolean);

      return {
        global, by_platform, by_week, by_plat_week, by_format, by_product,
        by_strategy, by_campaign, by_objective,
        meta: {
          ...baseMeta,
          // Sobreescribimos sólo los campos que dependen del filtro
          posts_in_scope: posts.length,
          weeks_in_scope: weeksInScope,
          date_min_scope: datesInScope.length ? datesInScope.reduce((a,b) => a<b?a:b) : null,
          date_max_scope: datesInScope.length ? datesInScope.reduce((a,b) => a>b?a:b) : null,
        },
        allPosts: posts,
      };
    }

    /**
     * Función legado para compatibilidad: normaliza + agrega sin filtros.
     * Solo se usa para inicialización de cache.
     */
    function transformAll(rawByPlatform) {
      const { allPosts, meta } = normalizeAll(rawByPlatform);
      return computeAggregates(allPosts, meta);
    }

    // ============================================================
    // FORMATTERS
    // ============================================================
    const fmt = (n) => {
      if (n == null || isNaN(n)) return '—';
      const a = Math.abs(n);
      if (a >= 1e9) return (n/1e9).toFixed(1) + 'B';
      if (a >= 1e6) return (n/1e6).toFixed(1) + 'M';
      if (a >= 1e3) return (n/1e3).toFixed(1) + 'K';
      return Math.round(n).toLocaleString('es-MX');
    };
    const fmtFull = (n) => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-MX');
    const erFmt = (n) => n == null ? '—' : Number(n).toFixed(2) + '%';
    const dateFmt = (d) => {
      if (!d) return '—';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
    };
    const dateShort = (d) => {
      if (!d) return '—';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
    };
    const timeAgo = (ts) => {
      if (!ts) return '—';
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return 'hace un momento';
      if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
      if (diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
      return `hace ${Math.floor(diff/86400)} d`;
    };

    const PLAT_COLORS = {
      Facebook:'#3B6FB8', Instagram:'#C73E6B', TikTok:'#1FA9B0',
      X:'#2A2A2A', YouTube:'#C53030', Threads:'#525252', LinkedIn:'#1F4D8C',
    };
    const PLAT_LETTERS = {
      Facebook:'FB', Instagram:'IG', YouTube:'YT', TikTok:'TT',
      X:'X', LinkedIn:'LI', Threads:'TH',
    };

    // ============================================================
    // CACHE local + HOOK de datos con auto-refresh
    // ============================================================
    const CACHE_KEY = 'smx-dashboard-cache-html-v1';
    const CACHE_TTL_MS = CACHE_TTL_MIN * 60 * 1000;

    function readCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const p = JSON.parse(raw);
        if (Date.now() - p.fetchedAt > CACHE_TTL_MS) return null;
        return p;
      } catch { return null; }
    }
    function writeCache(p) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(p)); } catch {} }
    function clearCache() { try { localStorage.removeItem(CACHE_KEY); } catch {} }

    function useDashboardData() {
      const [state, setState] = useState({
        data: null, loading: true, refreshing: false,
        error: null, errors: [], fetchedAt: null,
      });
      const inFlightRef = useRef(false);

      const load = useCallback(async ({ skipCache = false } = {}) => {
        if (inFlightRef.current) return;

        if (!skipCache) {
          const cached = readCache();
          if (cached) {
            try {
              const data = transformAll(cached.rawByPlatform);
              setState(s => ({ ...s, data, loading:false, errors: cached.errors||[], fetchedAt: cached.fetchedAt }));
              return;
            } catch { clearCache(); }
          }
        }

        inFlightRef.current = true;
        setState(s => ({ ...s, loading: !s.data, refreshing: !!s.data, error: null }));

        try {
          const { data: rawByPlatform, errors, fetchedAt } = await fetchAllPlatforms();
          const data = transformAll(rawByPlatform);
          writeCache({ rawByPlatform, errors, fetchedAt });
          setState({ data, loading:false, refreshing:false, error:null, errors, fetchedAt });
        } catch (e) {
          setState(s => ({ ...s, loading:false, refreshing:false, error: e?.message || 'Error desconocido' }));
        } finally {
          inFlightRef.current = false;
        }
      }, []);

      useEffect(() => { load(); }, [load]);

      useEffect(() => {
        const onVis = () => { if (document.visibilityState === 'visible') load(); };
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
      }, [load]);

      useEffect(() => {
        if (AUTO_REFRESH_MIN <= 0) return;
        const id = setInterval(() => {
          if (document.visibilityState === 'visible') load({ skipCache: true });
        }, AUTO_REFRESH_MIN * 60 * 1000);
        return () => clearInterval(id);
      }, [load]);

      const refresh = useCallback(() => { clearCache(); return load({ skipCache: true }); }, [load]);
      return { ...state, refresh, autoRefreshMin: AUTO_REFRESH_MIN };
    }

    // ============================================================
    // FILTROS — estado, sync con URL, filtro encadenado
    // ============================================================
    const EMPTY_FILTERS = {
      weekRange: null,        // [min, max] o null
      platforms: [],          // [] = todas
      campaigns: [],
      subcampaigns: [],
    };

    function readFiltersFromUrl() {
      try {
        const sp = new URLSearchParams(window.location.search);
        const f = { ...EMPTY_FILTERS };
        const wr = sp.get('w');
        if (wr) {
          const [a, b] = wr.split('-').map(Number);
          if (!isNaN(a) && !isNaN(b)) f.weekRange = [Math.min(a,b), Math.max(a,b)];
        }
        const arr = (k) => {
          const v = sp.get(k);
          return v ? v.split('|').filter(Boolean) : [];
        };
        f.platforms = arr('p');
        f.campaigns = arr('c');
        f.subcampaigns = arr('sc');
        return f;
      } catch { return EMPTY_FILTERS; }
    }

    function writeFiltersToUrl(f) {
      try {
        const sp = new URLSearchParams();
        if (f.weekRange) sp.set('w', `${f.weekRange[0]}-${f.weekRange[1]}`);
        if (f.platforms?.length)    sp.set('p',  f.platforms.join('|'));
        if (f.campaigns?.length)    sp.set('c',  f.campaigns.join('|'));
        if (f.subcampaigns?.length) sp.set('sc', f.subcampaigns.join('|'));
        const qs = sp.toString();
        const newUrl = window.location.pathname + (qs ? '?' + qs : '');
        window.history.replaceState(null, '', newUrl);
      } catch {}
    }

    function useFilters(initial = EMPTY_FILTERS) {
      const [filters, setFiltersRaw] = useState(() => {
        // Hidrata desde URL al cargar
        try {
          if (typeof window !== 'undefined') return readFiltersFromUrl();
        } catch {}
        return initial;
      });

      const setFilters = useCallback((updater) => {
        setFiltersRaw(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          writeFiltersToUrl(next);
          return next;
        });
      }, []);

      const isActive = (
        (filters.weekRange != null) ||
        filters.platforms.length > 0 ||
        filters.campaigns.length > 0 ||
        filters.subcampaigns.length > 0
      );

      const clear = useCallback(() => setFilters(EMPTY_FILTERS), [setFilters]);

      return { filters, setFilters, clear, isActive };
    }

    // ============================================================
    // ICONOS (SVG inline en lugar de lucide-react)
    // Cada icono es un SVG completo — htm no soporta fragments con <></>
    // ============================================================
    const RefreshIcon = ({ size = 16, className = '' }) => html`
      <svg xmlns="http://www.w3.org/2000/svg" width=${size} height=${size}
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth=${2} strokeLinecap="round" strokeLinejoin="round"
           className=${className}>

    /**
     * Hook utilitario: cierra el popover al click fuera o al presionar ESC.
     */
    function useClickOutside(ref, handler) {
      useEffect(() => {
        const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) handler(); };
        const onKey = (e) => { if (e.key === 'Escape') handler(); };
        document.addEventListener('mousedown', onClick);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onClick);
          document.removeEventListener('keydown', onKey);
        };
      }, [ref, handler]);
    }

    /**
     * Botón con popover. El popover se posiciona absoluto debajo del botón.
     */
    function FilterPopover({ label, summary, badgeCount, children, align = 'left', wide = false }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useClickOutside(ref, () => setOpen(false));

      return html`
        <div ref=${ref} className="relative">
          <button onClick=${() => setOpen(o => !o)}
                  className=${"inline-flex items-center gap-2 px-3 py-1.5 border text-xs font-mono uppercase tracking-wider transition-all " +
                    (badgeCount > 0
                      ? "border-ink bg-ink text-paper"
                      : "border-rule bg-cream text-ink hover:border-ink/40")}>
            <span>${label}</span>
            ${badgeCount > 0 ? html`
              <span className="bg-paper text-ink rounded-full px-1.5 py-0 text-[10px] font-semibold leading-tight">
                ${badgeCount}
              </span>
            ` : html`
              <span className="text-muted normal-case tracking-normal">${summary}</span>
            `}
            <${ChevronDownIcon} size=${12} className=${open ? "rotate-180 transition-transform" : "transition-transform"}/>
          </button>
          ${open && html`
            <div className=${"absolute z-50 mt-2 bg-cream border border-rule shadow-lg " +
              (wide ? "min-w-[280px]" : "min-w-[220px]") + " " +
              (align === 'right' ? "right-0" : "left-0")}>
              ${children({ close: () => setOpen(false) })}
            </div>
          `}
        </div>`;
    }

    /**
     * Range slider para semanas — dual-handle.
     * Usa un patrón con dos sliders superpuestos.
     */
    function WeekRangeControl({ weeks, value, onChange }) {
      if (!weeks.length) return null;
      const min = weeks[0];
      const max = weeks[weeks.length - 1];
      const [a, b] = value || [min, max];

      const setLow = (v) => {
        const nv = Math.min(v, b);
        onChange([nv, b]);
      };
      const setHigh = (v) => {
        const nv = Math.max(v, a);
        onChange([a, nv]);
      };

      const pctA = max === min ? 0 : ((a - min) / (max - min)) * 100;
      const pctB = max === min ? 100 : ((b - min) / (max - min)) * 100;

      return html`
        <div className="px-4 py-4 min-w-[280px]">
          <div className="flex items-baseline justify-between mb-3">
            <span className="text-[10px] font-mono uppercase tracking-wider text-muted">Rango</span>
            <span className="font-mono text-sm text-ink tabular-nums">
              S${a} <span className="text-faint">→</span> S${b}
            </span>
          </div>

          <div className="relative h-8">
            <div className="absolute top-1/2 left-0 right-0 h-1 bg-rule -translate-y-1/2"></div>
            <div className="absolute top-1/2 h-1 bg-ink -translate-y-1/2"
                 style=${{ left: pctA + '%', right: (100 - pctB) + '%' }}></div>
            <input type="range" min=${min} max=${max} value=${a}
                   onChange=${e => setLow(parseInt(e.target.value))}
                   className="absolute top-0 left-0 w-full h-8 appearance-none bg-transparent pointer-events-none"
                   style=${{ WebkitAppearance:'none' }}/>
            <input type="range" min=${min} max=${max} value=${b}
                   onChange=${e => setHigh(parseInt(e.target.value))}
                   className="absolute top-0 left-0 w-full h-8 appearance-none bg-transparent pointer-events-none"/>
          </div>

          <div className="flex justify-between mt-2 text-[10px] font-mono text-faint">
            <span>S${min}</span>
            <span>S${max}</span>
          </div>

          <div className="flex justify-between mt-4 pt-3 border-t border-rule text-[10px] font-mono uppercase tracking-wider">
            <button onClick=${() => onChange(null)} className="text-muted hover:text-ink">Quitar filtro</button>
            <button onClick=${() => onChange([min, max])} className="text-muted hover:text-ink">Todo</button>
          </div>

          <style>${`
            input[type="range"] { pointer-events: none; }
            input[type="range"]::-webkit-slider-thumb {
              pointer-events: auto;
              -webkit-appearance: none;
              appearance: none;
              width: 16px;
              height: 16px;
              border-radius: 50%;
              background: #0A0A09;
              border: 2px solid #F8F7F2;
              box-shadow: 0 0 0 1px #0A0A09;
              cursor: pointer;
            }
            input[type="range"]::-moz-range-thumb {
              pointer-events: auto;
              width: 16px;
              height: 16px;
              border-radius: 50%;
              background: #0A0A09;
              border: 2px solid #F8F7F2;
              box-shadow: 0 0 0 1px #0A0A09;
              cursor: pointer;
            }
            input[type="range"]::-webkit-slider-runnable-track { background: transparent; }
            input[type="range"]::-moz-range-track { background: transparent; }
          `}</style>
        </div>`;
    }

    /**
     * Componente principal: la barra completa de filtros.
     */
    function FilterBar({ baseMeta, filters, setFilters, clear, isActive, postsInScope, totalPosts }) {
      const { weeks, platforms, campaigns, subcampaignsByCampaign } = baseMeta;

      // Subcampañas disponibles en función de las campañas seleccionadas
      const availableSubcampaigns = useMemo(() => {
        if (!filters.campaigns.length) return baseMeta.subcampaigns;
        const set = new Set();
        for (const c of filters.campaigns) {
          (subcampaignsByCampaign[c] || []).forEach(s => set.add(s));
        }
        return [...set].sort();
      }, [filters.campaigns, baseMeta.subcampaigns, subcampaignsByCampaign]);

      // Toggles
      const toggleArr = (key) => (val) => {
        setFilters(prev => {
          const arr = prev[key];
          const next = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
          // Si cambian campañas, limpia subcampañas que ya no son válidas
          let cleaned = { ...prev, [key]: next };
          if (key === 'campaigns') {
            const newSubsAvail = next.length === 0
              ? baseMeta.subcampaigns
              : [...new Set(next.flatMap(c => subcampaignsByCampaign[c] || []))];
            cleaned.subcampaigns = prev.subcampaigns.filter(s => newSubsAvail.includes(s));
          }
          return cleaned;
        });
      };

      const selectAll = (key, options) => () => {
        setFilters(prev => ({ ...prev, [key]: [...options] }));
      };
      const clearKey = (key) => () => {
        setFilters(prev => ({ ...prev, [key]: [] }));
      };

      const setWeekRange = (range) => {
        setFilters(prev => ({ ...prev, weekRange: range }));
      };

      const weekSummary = filters.weekRange
        ? `S${filters.weekRange[0]}–S${filters.weekRange[1]}`
        : 'Todas';

      const arrSummary = (arr, total) => {
        if (arr.length === 0) return 'Todas';
        if (arr.length === 1) return arr[0].length > 16 ? arr[0].slice(0,14) + '…' : arr[0];
        return `${arr.length} de ${total}`;
      };

      return html`
        <div className="border-b border-rule bg-cream sticky top-[57px] z-20 backdrop-blur-sm" style=${{background: 'rgba(255,255,255,0.92)'}}>
          <div className="max-w-[1440px] mx-auto px-8 py-3 flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-2 text-[10px] font-mono uppercase tracking-[0.2em] text-faint shrink-0">
              <${FilterIcon} size=${12}/> Filtros
            </div>

            <${FilterPopover}
              label="Semana"
              summary=${weekSummary}
              badgeCount=${filters.weekRange ? 1 : 0}
            >
              ${({}) => html`<${WeekRangeControl} weeks=${weeks} value=${filters.weekRange} onChange=${setWeekRange}/>`}
            <//>

            <${FilterPopover}
              label="Plataforma"
              summary=${arrSummary(filters.platforms, platforms.length)}
              badgeCount=${filters.platforms.length}
            >
              ${() => html`<${MultiSelectPanel}
                options=${platforms}
                selected=${filters.platforms}
                onToggle=${toggleArr('platforms')}
                onSelectAll=${selectAll('platforms', platforms)}
                onClear=${clearKey('platforms')}
              />`}
            <//>

            <${FilterPopover}
              label="Campaña"
              summary=${arrSummary(filters.campaigns, campaigns.length)}
              badgeCount=${filters.campaigns.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${campaigns}
                selected=${filters.campaigns}
                onToggle=${toggleArr('campaigns')}
                onSelectAll=${selectAll('campaigns', campaigns)}
                onClear=${clearKey('campaigns')}
              />`}
            <//>

            <${FilterPopover}
              label="Subcampaña"
              summary=${arrSummary(filters.subcampaigns, availableSubcampaigns.length)}
              badgeCount=${filters.subcampaigns.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableSubcampaigns}
                selected=${filters.subcampaigns}
                onToggle=${toggleArr('subcampaigns')}
                onSelectAll=${selectAll('subcampaigns', availableSubcampaigns)}
                onClear=${clearKey('subcampaigns')}
                emptyLabel=${filters.campaigns.length ? 'Esta campaña no tiene subcampañas' : 'Sin subcampañas'}
              />`}
            <//>

            <div className="flex-1 min-w-[8px]"></div>

            <div className="text-[11px] font-mono text-muted">
              <span className=${isActive ? "text-ink" : ""}>${postsInScope.toLocaleString('es-MX')}</span>
              <span className="text-faint"> de ${totalPosts.toLocaleString('es-MX')} posts</span>
            </div>

            ${isActive && html`
              <button onClick=${clear}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 text-[11px] font-mono uppercase tracking-wider border border-amber/40 text-amber hover:bg-amber/10 transition-colors">
                <${XIcon} size=${11}/> Limpiar
              </button>
            `}
          </div>
        </div>`;
    }

            <div className="flex items-baseline justify-between mb-6">
              <div>

                <h2 className="font-serif text-3xl text-ink">Por plataforma.</h2>

          </div>

    }

    // ============================================================
    // TrendSection
    // ============================================================
    const TREND_METRICS = [
      { k:'reach',  l:'Alcance' },
      { k:'inter',  l:'Interacciones' },
      { k:'views',  l:'Reproducciones' },
      { k:'er_avg', l:'ER promedio', isPercent:true },
    ];

    function TrendSection({ D }) {
      const [metric, setMetric] = useState('reach');
      const isPercent = TREND_METRICS.find(m => m.k === metric)?.isPercent;

      const series = useMemo(() => {
        return Object.keys(D.by_week).sort((a,b) => +a - +b).map(w => ({
          week: +w, label: 'S' + w,
          value: D.by_week[w][metric], posts: D.by_week[w].posts,
        }));
      }, [D, metric]);

      return html`
        <section className="border-b border-rule">
          <div className="max-w-[1440px] mx-auto px-8 py-12">
            <div className="flex flex-wrap items-baseline justify-between gap-4 mb-6">
              <div>
                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-amber mb-2">§ 02</div>
                <h2 className="font-serif text-3xl text-ink">Evolución semanal.</h2>
              </div>
              <div className="flex border border-rule">
                ${TREND_METRICS.map((m, i) => html`
                  <button key=${m.k} onClick=${() => setMetric(m.k)}
                    className=${"px-4 py-2 text-xs font-mono uppercase tracking-wider transition-colors " +
                      (i > 0 ? "border-l border-rule " : "") +
                      (metric === m.k ? "bg-ink text-paper" : "text-muted hover:text-ink hover:bg-ink/5")}>
                    ${m.l}
                  </button>
                `)}
              </div>
            </div>
            <div className="bg-cream border border-rule p-6">
              <div className="h-80">
                <${ResponsiveContainer}>
                  <${ComposedChart} data=${series} margin=${{ top:10, right:16, left:8, bottom:8 }}>
                    <${CartesianGrid} stroke="#E5E2DA" strokeDasharray="0" vertical=${false} />
                    <${XAxis} dataKey="label" stroke="#6B675D" fontSize=${11}
                              tickLine=${false} axisLine=${{ stroke: '#E5E2DA' }}
                              interval=${Math.max(0, Math.floor(series.length / 12))} />
                    <${YAxis} yAxisId="left" stroke="#6B675D" fontSize=${11}
                              tickLine=${false} axisLine=${false}
                              tickFormatter=${isPercent ? (v) => v.toFixed(1) + '%' : fmt}
                              width=${48} />
                    <${YAxis} yAxisId="right" orientation="right" stroke="#A09B8E" fontSize=${11}
                              tickLine=${false} axisLine=${false} width=${32} />
                    <${Tooltip}
                      cursor=${{ fill: '#F8F7F2' }}
                      contentStyle=${{ background:'#FFFFFF', border:'1px solid #E5E2DA', borderRadius:6, padding:'8px 12px', fontSize:11, fontFamily:'JetBrains Mono, monospace' }}
                      labelFormatter=${(label) => `Semana ${label.slice(1)}`}
                      formatter=${(v, name) => {
                        if (name === 'value') return [isPercent ? erFmt(v) : fmt(v), TREND_METRICS.find(m => m.k === metric)?.l];
                        return [v, 'Posts'];
                      }} />
                    <${Bar} yAxisId="right" dataKey="posts" fill="#E5E2DA" />
                    <${Line} yAxisId="left" type="monotone" dataKey="value"
                             stroke="#0F766E" strokeWidth=${2}
                             dot=${{ fill:'#0F766E', r:3 }} activeDot=${{ r:5 }} />
                  <//>
                <//>
              </div>
              <div className="flex gap-6 mt-4 pt-4 border-t border-rule text-[11px] font-mono text-muted">
                <div className="flex items-center gap-2"><span className="w-3 h-0.5 bg-accent"></span><span>${TREND_METRICS.find(m => m.k === metric)?.l}</span></div>
                <div className="flex items-center gap-2"><span className="w-3 h-2 bg-rule"></span><span>Volumen de posts</span></div>
              </div>
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // MixSection
    // ============================================================
    function MixSection({ D }) {
      const strats = Object.entries(D.by_strategy)
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.posts - a.posts);
      const fmts = Object.entries(D.by_format)
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.reach - a.reach);
      const totalPosts = D.global.posts;
      const max = fmts[0]?.reach || 1;

      return html`
        <section className="border-b border-rule">
          <div className="max-w-[1440px] mx-auto px-8 py-12">
            <div className="flex items-baseline justify-between mb-8">
              <div>
                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-amber mb-2">§ 03</div>
                <h2 className="font-serif text-3xl text-ink">Mezcla.</h2>
              </div>
              <div className="text-xs font-mono text-faint">Estrategia · formato</div>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
              <div className="lg:border-r lg:border-rule lg:pr-10">
                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-muted mb-4">Pautado vs Orgánico</div>
                ${strats.length === 0 && html`<div className="text-faint text-sm">Sin datos de estrategia.</div>`}
                <div className="space-y-5">
                  ${strats.slice(0, 4).map(s => {
                    const isPaid = (s.name||'').toLowerCase().includes('pauta') || (s.name||'').toLowerCase().includes('paid');
                    const color = isPaid ? '#D97706' : '#0F766E';
                    const pctPosts = totalPosts ? Math.round(s.posts/totalPosts*100) : 0;
                    return html`
                      <div key=${s.name}>
                        <div className="flex items-baseline justify-between mb-2">
                          <div className="flex items-baseline gap-3">
                            <span className="font-serif text-xl text-ink">${s.name || '—'}</span>
                            <span className="text-[11px] font-mono text-faint">${pctPosts}% de posts</span>
                          </div>
                          <div className="font-mono tabular-nums text-base text-ink">${fmt(s.reach)}</div>
                        </div>
                        <div className="h-1 bg-rule"><div className="h-full" style=${{ width: pctPosts + '%', background: color }}/></div>
                        <div className="flex justify-between mt-2 text-[11px] font-mono text-muted">
                          <span>${s.posts} posts · ER ${erFmt(s.er_avg)}</span>
                          <span>${fmt(s.inter)} interacciones</span>
                        </div>
                      </div>`;
                  })}
                </div>
              </div>
              <div className="lg:pl-2">
                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-muted mb-4">Por formato (alcance)</div>
                <div className="space-y-3">
                  ${fmts.slice(0, 8).map(f => {
                    const w = (f.reach / max) * 100;
                    return html`
                      <div key=${f.name} className="grid grid-cols-12 items-baseline gap-3">
                        <div className="col-span-3 text-sm text-ink">${f.name}</div>
                        <div className="col-span-6 h-px bg-rule relative">
                          <div className="absolute left-0 top-1/2 -translate-y-1/2 h-2"
                               style=${{ width: w + '%', background: '#0F766E' }}/>
                        </div>
                        <div className="col-span-2 text-right font-mono text-xs text-ink">${fmt(f.reach)}</div>
                        <div className="col-span-1 text-right font-mono text-xs text-muted">${erFmt(f.er_avg)}</div>
                      </div>`;
                  })}
                </div>
              </div>
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // TopPostsTable
    // ============================================================
    const SORTS = [
      { k:'reach',        l:'Por alcance' },
      { k:'interactions', l:'Por interacciones' },
      { k:'er',           l:'Por ER' },
      { k:'date',         l:'Más recientes' },
    ];

    function TopPostsTable({ D, onPick }) {
      const [sortBy, setSortBy] = useState('reach');
      const [filterPlat, setFilterPlat] = useState('all');
      const [limit, setLimit] = useState(15);
      const platforms = Object.keys(D.by_platform);

      const sorted = useMemo(() => {
        const all = D.allPosts || [];
        const filtered = filterPlat === 'all' ? all : all.filter(p => p.platform === filterPlat);
        if (sortBy === 'date') return [...filtered].sort((a,b) => (b.date||'').localeCompare(a.date||''));
        if (sortBy === 'er') return [...filtered].filter(p => (p.reach||0) > 1000 && p.er > 0).sort((a,b) => (b.er||0) - (a.er||0));
        return [...filtered].filter(p => (p[sortBy]||0) > 0).sort((a,b) => (b[sortBy]||0) - (a[sortBy]||0));
      }, [D, sortBy, filterPlat]);

      const visible = sorted.slice(0, limit);

      return html`
        <section className="border-b border-rule">
          <div className="max-w-[1440px] mx-auto px-8 py-12">
            <div className="flex flex-wrap items-baseline justify-between gap-4 mb-6">
              <div>
                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-amber mb-2">§ 04</div>
                <h2 className="font-serif text-3xl text-ink">Mejores publicaciones.</h2>
                <p className="text-muted text-sm mt-2">Click en cualquier fila para ver el detalle completo.</p>
              </div>
              <div className="flex flex-wrap gap-2">
                <select value=${sortBy} onChange=${e => setSortBy(e.target.value)}
                        className="text-xs font-mono uppercase tracking-wider bg-cream border border-rule px-3 py-2 text-ink">
                  ${SORTS.map(s => html`<option key=${s.k} value=${s.k}>${s.l}</option>`)}
                </select>
                <select value=${filterPlat} onChange=${e => setFilterPlat(e.target.value)}
                        className="text-xs font-mono uppercase tracking-wider bg-cream border border-rule px-3 py-2 text-ink">
                  <option value="all">Todas</option>
                  ${platforms.map(p => html`<option key=${p} value=${p}>${p}</option>`)}
                </select>
              </div>
            </div>

            <div className="bg-cream border border-rule overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-rule text-[10px] font-mono uppercase tracking-[0.15em] text-faint">
                    <th className="text-left py-3 px-4 font-medium">#</th>
                    <th className="text-left py-3 px-4 font-medium">Plat.</th>
                    <th className="text-left py-3 px-4 font-medium">Fecha</th>
                    <th className="text-left py-3 px-4 font-medium">Sem.</th>
                    <th className="text-left py-3 px-4 font-medium">Formato</th>
                    <th className="text-left py-3 px-4 font-medium">Producto</th>
                    <th className="text-left py-3 px-4 font-medium">Campaña</th>
                    <th className="text-right py-3 px-4 font-medium">Alcance</th>
                    <th className="text-right py-3 px-4 font-medium">Inter.</th>
                    <th className="text-right py-3 px-4 font-medium">ER</th>
                    <th className="text-right py-3 px-4 font-medium pr-6">VTR</th>
                  </tr>
                </thead>
                <tbody>
                  ${visible.length === 0 && html`
                    <tr><td colSpan=${11} className="py-12 text-center text-faint text-sm">Sin posts que cumplan los filtros.</td></tr>
                  `}
                  ${visible.map((p, i) => {
                    const color = PLAT_COLORS[p.platform];
                    return html`
                      <tr key=${i} onClick=${() => onPick(p)}
                          className="border-b border-rule/60 last:border-0 hover:bg-paper cursor-pointer transition-colors group">
                        <td className="py-3 px-4 font-mono text-xs text-faint group-hover:text-ink">${i+1}</td>
                        <td className="py-3 px-4">
                          <span className="font-mono text-[10px] font-semibold text-cream px-1.5 py-0.5 rounded"
                                style=${{ background: color }}>${PLAT_LETTERS[p.platform]}</span>
                        </td>
                        <td className="py-3 px-4 font-mono text-xs text-muted">${dateShort(p.date)}</td>
                        <td className="py-3 px-4 font-mono text-xs text-muted">S${p.week || '—'}</td>
                        <td className="py-3 px-4 text-ink">${p.format || '—'}</td>
                        <td className="py-3 px-4 text-ink truncate max-w-[200px]" title=${p.product}>
                          ${p.product || html`<span className="text-faint">—</span>`}
                        </td>
                        <td className="py-3 px-4 text-muted truncate max-w-[180px]" title=${p.campaign}>
                          ${p.campaign || html`<span className="text-faint">—</span>`}
                        </td>
                        <td className="py-3 px-4 text-right font-mono tabular-nums text-ink">${fmt(p.reach)}</td>
                        <td className="py-3 px-4 text-right font-mono tabular-nums text-ink">${fmt(p.interactions)}</td>
                        <td className="py-3 px-4 text-right font-mono tabular-nums" style=${{ color }}>${erFmt(p.er)}</td>
                        <td className="py-3 px-4 pr-6 text-right font-mono tabular-nums text-muted">
                          ${p.vtr != null ? erFmt(p.vtr) : '—'}
                        </td>
                      </tr>`;
                  })}
                </tbody>
              </table>
            </div>

            ${sorted.length > limit && html`
              <div className="text-center mt-4">
                <button onClick=${() => setLimit(l => l + 25)}
                        className="text-xs font-mono uppercase tracking-wider text-muted hover:text-ink border border-rule hover:border-ink/40 px-4 py-2 transition-colors">
                  Ver 25 más (${sorted.length - limit} restantes)
                </button>
              </div>
            `}
          </div>
        </section>`;
    }

    // ============================================================
    // CatalogSection (Top productos + campañas)
    // ============================================================
    function CatalogList({ entries, title, max }) {
      return html`
        <div>
          <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-muted mb-4">${title}</div>
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-rule text-[10px] font-mono uppercase tracking-[0.15em] text-faint">
                <th className="text-left py-2 font-medium"></th>
                <th className="text-right py-2 font-medium">Posts</th>
                <th className="text-right py-2 font-medium">Alcance</th>
                <th className="text-right py-2 font-medium pr-1">ER</th>
              </tr>
            </thead>
            <tbody>
              ${entries.slice(0, max).map(e => html`
                <tr key=${e.name} className="border-b border-rule/40 last:border-0">
                  <td className="py-2.5 text-ink truncate max-w-[260px]" title=${e.name}>${e.name}</td>
                  <td className="py-2.5 text-right font-mono tabular-nums text-muted">${e.posts}</td>
                  <td className="py-2.5 text-right font-mono tabular-nums text-ink">${fmt(e.reach)}</td>
                  <td className="py-2.5 pr-1 text-right font-mono tabular-nums text-muted">${erFmt(e.er_avg)}</td>
                </tr>
              `)}
            </tbody>
          </table>
        </div>`;
    }

    function CatalogSection({ D }) {
      const products = Object.entries(D.by_product).map(([k,v]) => ({ name:k, ...v })).sort((a,b) => b.reach - a.reach);
      const campaigns = Object.entries(D.by_campaign).map(([k,v]) => ({ name:k, ...v })).sort((a,b) => b.reach - a.reach);

      return html`
        <section className="border-b border-rule">
          <div className="max-w-[1440px] mx-auto px-8 py-12">
            <div className="flex items-baseline justify-between mb-8">
              <div>
                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-amber mb-2">§ 05</div>
                <h2 className="font-serif text-3xl text-ink">Catálogo.</h2>
              </div>
              <div className="text-xs font-mono text-faint">Productos · campañas</div>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
              <${CatalogList} entries=${products}  title="Top productos por alcance"  max=${10} />
              <${CatalogList} entries=${campaigns} title="Top campañas por alcance"   max=${10} />
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // DetailDrawer
    // ============================================================
    function DrawerStat({ label, value }) {
      return html`
        <div className="border-b border-rule py-3">
          <div className="text-[10px] font-mono uppercase tracking-[0.2em] text-faint mb-1">${label}</div>
          <div className="font-mono text-base text-ink tabular-nums">${value}</div>
        </div>`;
    }
    function DrawerTag({ label, value }) {
      if (!value) return null;
      return html`
        <div className="flex flex-col">
          <span className="text-[10px] font-mono uppercase tracking-[0.18em] text-faint">${label}</span>
          <span className="text-sm text-ink mt-0.5">${value}</span>
        </div>`;
    }

    function DetailDrawer({ post, onClose }) {
      useEffect(() => {
        if (!post) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [post, onClose]);

      if (!post) return null;
      const color = PLAT_COLORS[post.platform];

      return html`
        <${Fragment}>
          <div className="fixed inset-0 z-40 bg-ink/30 fade-in" onClick=${onClose}/>
          <aside className="fixed top-0 right-0 bottom-0 w-full sm:w-[480px] z-50 bg-paper border-l border-rule shadow-xl slide-in flex flex-col">
            <div className="flex items-center justify-between px-6 py-4 border-b border-rule">
              <div className="flex items-center gap-3">
                <span className="font-mono text-[11px] font-semibold text-cream px-2 py-1 rounded"
                      style=${{ background: color }}>${PLAT_LETTERS[post.platform]}</span>
                <span className="font-serif text-base text-ink">${post.platform}</span>
              </div>
              <button onClick=${onClose}
                      className="w-8 h-8 rounded-full hover:bg-ink/5 flex items-center justify-center text-ink/60 hover:text-ink transition-colors">
                <${XIcon} size=${16}/>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto">
              <div className="px-6 py-6">
                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-amber mb-3">
                  ${dateFmt(post.date)} · Semana ${post.week || '—'}
                </div>
                <h3 className="font-serif text-2xl text-ink leading-tight mb-2">
                  ${post.product || html`<span className="italic text-muted">Producto sin asignar</span>`}
                </h3>
                ${post.campaign && html`
                  <p className="text-sm text-muted mb-6">
                    Campaña: <span className="text-ink">${post.campaign}</span>
                    ${post.subcampaign && html` · ${post.subcampaign}`}
                  </p>
                `}

                <div className="grid grid-cols-2 gap-4 mb-6">
                  <div className="bg-cream border border-rule p-4">
                    <div className="text-[10px] font-mono uppercase tracking-[0.2em] text-faint mb-2">Alcance</div>
                    <div className="font-mono text-2xl text-ink tabular-nums leading-none">${fmt(post.reach)}</div>
                    <div className="text-[11px] font-mono text-muted mt-2">${fmtFull(post.reach)}</div>
                  </div>
                  <div className="bg-cream border border-rule p-4">
                    <div className="text-[10px] font-mono uppercase tracking-[0.2em] text-faint mb-2">ER</div>
                    <div className="font-mono text-2xl tabular-nums leading-none" style=${{ color }}>${erFmt(post.er)}</div>
                    <div className="text-[11px] font-mono text-muted mt-2">Básico ${erFmt(post.basic_er)}</div>
                  </div>
                </div>

                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-muted mb-3 mt-8">Engagement</div>
                <div className="bg-cream border border-rule px-4">
                  <${DrawerStat} label="Interacciones totales" value=${fmtFull(post.interactions)} />
                  <${DrawerStat} label="Reacciones" value=${fmtFull(post.reactions)} />
                  <${DrawerStat} label="Comentarios" value=${fmtFull(post.comments)} />
                  <${DrawerStat} label="Compartidos" value=${fmtFull(post.shares)} />
                  ${post.saves > 0 && html`<${DrawerStat} label="Guardados" value=${fmtFull(post.saves)} />`}
                  ${post.clics > 0 && html`<${DrawerStat} label="Clics" value=${fmtFull(post.clics)} />`}
                  ${post.repost > 0 && html`<${DrawerStat} label="Reposts" value=${fmtFull(post.repost)} />`}
                  <div className="py-3">
                    <div className="text-[10px] font-mono uppercase tracking-[0.2em] text-faint mb-1">CTR</div>
                    <div className="font-mono text-base text-ink tabular-nums">${erFmt(post.ctr)}</div>
                  </div>
                </div>

                ${(post.views > 0 || post.duration > 0) && html`
                  <${Fragment}>
                    <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-muted mb-3 mt-8">Video</div>
                    <div className="bg-cream border border-rule px-4">
                      <${DrawerStat} label="Reproducciones" value=${fmtFull(post.views)} />
                      ${post.duration > 0 && html`<${DrawerStat} label="Duración" value=${`${post.duration}s`} />`}
                      ${post.avg_watch_time > 0 && html`<${DrawerStat} label="Tiempo prom. visto" value=${`${post.avg_watch_time.toFixed(1)}s`} />`}
                      ${post.vtr != null && html`<${DrawerStat} label="VTR" value=${erFmt(post.vtr)} />`}
                    </div>
                  <//>
                `}

                <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-muted mb-3 mt-8">Clasificación</div>
                <div className="bg-cream border border-rule p-4 grid grid-cols-2 gap-4">
                  <${DrawerTag} label="Formato" value=${post.format} />
                  <${DrawerTag} label="Tipo de contenido" value=${post.content_type} />
                  <${DrawerTag} label="Estrategia" value=${post.strategy} />
                  <${DrawerTag} label="Etapa" value=${post.stage} />
                  <${DrawerTag} label="Objetivo" value=${post.objective} />
                  <${DrawerTag} label="IA" value=${post.ai} />
                  ${post.is_influencer === 'Sí' && html`<${DrawerTag} label="Influencer" value=${post.influencer_name || 'Sí'} />`}
                </div>
              </div>
            </div>

            ${post.link && html`
              <div className="border-t border-rule px-6 py-4">
                <a href=${post.link} target="_blank" rel="noopener noreferrer"
                   className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-ink text-paper text-sm hover:bg-ink/90 transition-colors">
                  Ver publicación original <${ExtIcon} size=${14}/>
                </a>
              </div>
            `}
          </aside>
        <//>`;
    }

    // ============================================================
    // Footer
    // ============================================================
    function Footer({ fetchedAt, totalPosts }) {
      return html`
        <footer className="border-t border-rule mt-4">
          <div className="max-w-[1440px] mx-auto px-8 py-12 grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
            <div>
              <div className="font-serif italic text-2xl text-ink mb-2">Samsung MX.</div>
              <div className="text-[11px] font-mono uppercase tracking-[0.2em] text-faint">Performance Brief · 2026</div>
            </div>
            <div className="text-xs text-muted leading-relaxed">
              Datos en vivo desde Google Sheets. Cualquier cambio en la base se refleja al recargar (auto-refresh activo).
            </div>
            <div className="text-right text-[11px] font-mono text-faint">
              ${totalPosts} posts indexados<br/>
              Última carga · ${fetchedAt ? new Date(fetchedAt).toLocaleString('es-MX') : '—'}
            </div>
          </div>
        </footer>`;
    }

    // ============================================================
    // App principal
    // ============================================================
    function App() {
      const { data, loading, refreshing, error, errors, fetchedAt, refresh, autoRefreshMin } = useDashboardData();
      const [selected, setSelected] = useState(null);
      const { filters, setFilters, clear, isActive } = useFilters();

      // baseMeta y filteredData se recalculan SOLO cuando cambian
      // los datos crudos o los filtros — nunca durante un re-render normal.
      const baseMeta = data?.meta || null;
      const allPosts = data?.allPosts || [];

      const filteredData = useMemo(() => {
        if (!data || !baseMeta) return null;
        const filtered = applyFilters(allPosts, filters);
        return computeAggregates(filtered, baseMeta);
      }, [data, allPosts, baseMeta, filters]);

      if (loading) return html`<${LoadingState}/>`;
      if (error)   return html`<${ErrorState} message=${error} onRetry=${refresh}/>`;
      if (!data || !filteredData) return html`<${ErrorState} message="Sin datos disponibles." onRetry=${refresh}/>`;

      const D = filteredData;
      const noResults = D.global.posts === 0;

      return html`
        <div className="min-h-screen bg-paper text-ink">
          <${TopBar} fetchedAt=${fetchedAt} onRefresh=${refresh} refreshing=${refreshing} autoRefreshMin=${autoRefreshMin}/>

          <${FilterBar}
            baseMeta=${baseMeta}
            filters=${filters}
            setFilters=${setFilters}
            clear=${clear}
            isActive=${isActive}
            postsInScope=${D.global.posts}
            totalPosts=${baseMeta.total_posts}
          />

          ${errors && errors.length > 0 && html`
            <div className="max-w-[1440px] mx-auto px-8 pt-3">
              <div className="bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                <span className="font-mono uppercase tracking-wider">Aviso</span> · No se pudo cargar
                ${errors.length === 1 ? ' ' + errors[0].platform : ` ${errors.length} pestañas`}.
                Las demás se muestran con normalidad.
              </div>
            </div>
          `}

          ${noResults ? html`
            <div className="max-w-[1440px] mx-auto px-8 py-32 text-center">
              <div className="font-mono text-[11px] uppercase tracking-[0.2em] text-amber mb-4">Sin resultados</div>
              <h2 className="font-serif text-3xl text-ink mb-3">No hay posts que cumplan los filtros.</h2>
              <p className="text-muted text-sm mb-6">Prueba ampliando el rango de semanas o quitando alguna selección.</p>
              <button onClick=${clear}
                      className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-ink text-paper text-sm font-medium hover:bg-ink/90 transition-colors">
                Limpiar filtros
              </button>
            </div>
          ` : html`
            <main>
              <${HeroSection}    D=${D}/>
              <${KpiRow}         D=${D}/>
              <${PlatformsGrid}  D=${D}/>
              <${TrendSection}   D=${D}/>
              <${MixSection}     D=${D}/>
              <${TopPostsTable}  D=${D} onPick=${setSelected}/>
              <${CatalogSection} D=${D}/>
            </main>
          `}

          <${Footer} fetchedAt=${fetchedAt} totalPosts=${baseMeta.total_posts}/>
          ${selected && html`<${DetailDrawer} post=${selected} onClose=${() => setSelected(null)}/>`}
        </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
</html>
