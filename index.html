  <script>
    tailwind.config = {

          colors: {
            ink:        'rgb(var(--c-ink) / <alpha-value>)',
            surface:    'rgb(var(--c-surface) / <alpha-value>)',
            surface2:   'rgb(var(--c-surface2) / <alpha-value>)',
            sidebar:    'rgb(var(--c-sidebar) / <alpha-value>)',

            faint:      'rgb(var(--c-faint) / <alpha-value>)',
            accent:     'rgb(var(--c-accent) / <alpha-value>)',

            onSurface:  'rgb(var(--c-txt) / <alpha-value>)',

  <style>
    /* ============================================================
       TEMA — variables CSS. :root = oscuro (default). .light = claro.
       Formato "R G B" (sin comas) para que funcione con la sintaxis
       rgb(var(--x) / <alpha-value>) que usa Tailwind para opacidades.

      --c-txt3: 104 104 114;
      --c-txt4: 138 138 148;
      --c-faint: 178 178 186;
      --c-accent: 85 70 201;
      --c-accent2: 106 84 217;
      --c-accentDeep: 68 54 168;
      --c-amber: 168 110 15;
      --c-success: 22 128 100;
      --c-glow1: rgba(139,127,232,0.10);
      --c-glow2: rgba(85,70,201,0.05);

    html, body, #root { height: 100%; background: rgb(var(--c-ink)); color: rgb(var(--c-txt)); transition: background-color 150ms ease, color 150ms ease; }
    body {

<body>
  <div id="root"></div>

  <script type="module">
    // ============================================================
    // IMPORTS desde CDN (esm.sh) — sin build step
    // ============================================================
    import React, { useState, useEffect, useCallback, useMemo, useRef, Fragment } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import {
      ResponsiveContainer, AreaChart, Area, BarChart, Bar,
      LineChart, Line, ComposedChart, XAxis, YAxis, Tooltip, CartesianGrid, ReferenceLine,
    } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    // ============================================================
    // CONFIG — Edita estas constantes para tu deploy
    // ============================================================
    const SHEET_ID = '1TcmeDE08Df6Qk4lzRe6PhIBq5qOBUCC_vvHZq4UWD98';
    const CACHE_TTL_MIN = 5;       // cuánto tiempo cachea localmente
    const AUTO_REFRESH_MIN = 5;    // polling automático en background; 0 = desactivado

    // ============================================================
    // CLIENTE GOOGLE SHEETS
    // ============================================================
    const SHEET_TABS = {
      Facebook:  '📘 Facebook',
      Instagram: '📷 Instagram',
      YouTube:   '▶️ YouTube',
      TikTok:    '🎵 TikTok',
      X:         '𝕏 X',
      LinkedIn:  '💼 LinkedIn',
      Threads:   '🧵 Threads',
    };
    const PLATFORMS = Object.keys(SHEET_TABS);

    function buildSheetUrl(tabName) {
      if (!SHEET_ID) throw new Error('Falta SHEET_ID en la configuración del archivo.');
      // RANGO EXPLÍCITO: A2:AI10000 fuerza a gviz a leer hasta la fila 10000.
      // Antes usábamos A2:AI (sin límite) y gviz a veces corta cuando hay
      // gaps de filas vacías entre los datos.
      const params = new URLSearchParams({
        tqx: 'out:csv',
        sheet: tabName,
        range: 'A2:AI10000',
      });
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
    }

    async function fetchTab(platformName) {
      const tabName = SHEET_TABS[platformName];
      const res = await fetch(buildSheetUrl(tabName), { redirect: 'follow' });
      if (!res.ok) throw new Error(`Error al cargar "${tabName}": HTTP ${res.status}`);
      const csvText = await res.text();
      if (csvText.trim().startsWith('<')) {
        throw new Error(`"${tabName}" no devolvió CSV. ¿El Sheet es público?`);
      }
      const parsed = Papa.parse(csvText, {
        header: true, skipEmptyLines: 'greedy', dynamicTyping: false,
      });
      return parsed.data.map(row => ({ ...row, _platform: platformName }));
    }

    async function fetchAllPlatforms() {
      const results = await Promise.allSettled(
        PLATFORMS.map(p => fetchTab(p).then(rows => ({ platform: p, rows })))
      );
      const data = {}; const errors = [];
      for (let i = 0; i < results.length; i++) {
        const r = results[i]; const platform = PLATFORMS[i];
        if (r.status === 'fulfilled') data[platform] = r.value.rows;
        else { errors.push({ platform, message: r.reason?.message || String(r.reason) }); data[platform] = []; }
      }
      return { data, errors, fetchedAt: Date.now() };
    }

    // ============================================================
    // TRANSFORMACIÓN — columnas español → claves internas + agregados
    // ============================================================
    const COL_MAP = {
      'Link': 'link', 'Fecha': 'date', 'Semana': 'week', 'Mes': 'month', 'Año': 'year',
      'Formato': 'format', 'Tipo Contenido': 'content_type', 'Tipo Pauta': 'strategy',
      'Campaña': 'campaign', 'Subcampaña': 'subcampaign', 'Etapa': 'stage',
      'Producto': 'product', 'Objetivo': 'objective', 'Audio': 'audio',
      'Subtítulos': 'subtitles', 'IA': 'ai', 'Duración (seg)': 'duration',
      'Alcance': 'reach', 'Impresiones': 'impressions', 'Reacciones': 'reactions',
      'Comentarios': 'comments', 'Compartidos': 'shares', 'Guardados': 'saves',
      'Repost': 'repost', 'Clics': 'clics', 'Views': 'views',
      'Inter. Básicas': 'basic_interactions', 'Inter. Totales': 'interactions',
      'ER Básico %': 'basic_er', 'ER Views %': 'er', 'CTR %': 'ctr',
      'T. Prom. Vista': 'avg_watch_time', 'VTR %': 'vtr',
      '¿Influencer?': 'is_influencer', 'Nombre Influencer': 'influencer_name',
    };
    const NUMERIC_KEYS = new Set([
      'week','year','duration','reach','impressions','reactions','comments','shares',
      'saves','repost','clics','views','basic_interactions','interactions',
      'basic_er','er','ctr','avg_watch_time','vtr',
    ]);

    function toNum(v) {
      if (v == null || v === '') return null;
      if (typeof v === 'number') return v;
      let s = String(v).trim();
      if (s === '' || s === '—' || s === '-' || s === '#N/A' || s === '#DIV/0!') return null;
      s = s.replace(/%\s*$/, '');
      if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
      else if (s.includes(',') && !s.includes('.')) {
        const lastComma = s.lastIndexOf(',');
        const after = s.length - lastComma - 1;
        if (after <= 2 && s.split(',').length === 2) s = s.replace(',', '.');
        else s = s.replace(/,/g, '');
      }
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    }

    function normalizeRow(row, platform) {
      const out = { platform };
      for (const [esKey, enKey] of Object.entries(COL_MAP)) {
        if (esKey in row) {
          const raw = row[esKey];
          if (NUMERIC_KEYS.has(enKey)) out[enKey] = toNum(raw);
          else out[enKey] = raw === '' ? null : raw;
        }
      }
      // Considera la fila como una publicación válida si tiene CUALQUIER campo
      // identificador. Antes descartábamos filas sin link/alcance/interacciones,
      // lo que excluía posts recientes con métricas aún sin levantar.
      const hasAnyIdentity =
        out.link || out.date || out.week != null || out.format ||
        out.product || out.campaign || out.subcampaign || out.objective ||
        (out.reach != null && out.reach > 0) ||
        (out.interactions != null && out.interactions > 0);
      if (!hasAnyIdentity) return null;
      return out;
    }

    function emptyAgg() {
      return {
        reach:0, impressions:0, inter:0, basic_inter:0, views:0,
        reactions:0, comments:0, shares:0, saves:0, clics:0,
        posts:0,
        _er_sum:0, _er_n:0, _basic_er_sum:0, _basic_er_n:0,
        _vtr_sum:0, _vtr_n:0, _ctr_sum:0, _ctr_n:0,
      };
    }
    function aggAdd(a, p) {
      a.reach += p.reach || 0; a.impressions += p.impressions || 0;
      a.inter += p.interactions || 0; a.basic_inter += p.basic_interactions || 0;
      a.views += p.views || 0;
      a.reactions += p.reactions || 0; a.comments += p.comments || 0;
      a.shares += p.shares || 0; a.saves += p.saves || 0; a.clics += p.clics || 0;
      a.posts += 1;
      if (p.er != null && p.er !== 0) { a._er_sum += p.er; a._er_n += 1; }
      if (p.basic_er != null && p.basic_er !== 0) { a._basic_er_sum += p.basic_er; a._basic_er_n += 1; }
      if (p.vtr != null && p.vtr !== 0) { a._vtr_sum += p.vtr; a._vtr_n += 1; }
      if (p.ctr != null && p.ctr !== 0) { a._ctr_sum += p.ctr; a._ctr_n += 1; }
    }
    function aggFinalize(a) {
      const o = { ...a };
      o.er_avg = a._er_n ? a._er_sum / a._er_n : 0;
      o.basic_er_avg = a._basic_er_n ? a._basic_er_sum / a._basic_er_n : 0;
      o.vtr_avg = a._vtr_n ? a._vtr_sum / a._vtr_n : 0;
      o.ctr_avg = a._ctr_n ? a._ctr_sum / a._ctr_n : 0;
      // Promedios por publicación (totales / # posts)
      o.reach_per_post = a.posts > 0 ? a.reach / a.posts : 0;
      o.inter_per_post = a.posts > 0 ? a.inter / a.posts : 0;
      o.views_per_post = a.posts > 0 ? a.views / a.posts : 0;
      delete o._er_sum; delete o._er_n; delete o._basic_er_sum; delete o._basic_er_n;
      delete o._vtr_sum; delete o._vtr_n;
      delete o._ctr_sum; delete o._ctr_n;
      return o;
    }
    function groupAgg(posts, keyFn) {
      const map = new Map();
      for (const p of posts) {
        const k = keyFn(p);
        if (k == null || k === '') continue;
        if (!map.has(k)) map.set(k, emptyAgg());
        aggAdd(map.get(k), p);
      }
      const r = {}; for (const [k,v] of map) r[k] = aggFinalize(v); return r;
    }
    function nestedGroupAgg(posts, outerFn, innerFn) {
      const outer = {};
      for (const p of posts) {
        const ko = outerFn(p), ki = innerFn(p);
        if (ko == null || ki == null || ki === '') continue;
        if (!outer[ko]) outer[ko] = new Map();
        if (!outer[ko].has(ki)) outer[ko].set(ki, emptyAgg());
        aggAdd(outer[ko].get(ki), p);
      }
      const r = {};
      for (const [ko, inner] of Object.entries(outer)) {
        r[ko] = {}; for (const [ki, v] of inner) r[ko][ki] = aggFinalize(v);
      }
      return r;
    }

    /**
     * Normaliza filas crudas de todas las pestañas en un array de posts.
     * Se ejecuta UNA VEZ al cargar — no depende de filtros.
     */
    function normalizeAll(rawByPlatform) {
      const allPosts = [];
      const _diagByPlat = {};  // diagnóstico
      for (const [platform, rows] of Object.entries(rawByPlatform)) {
        let raw = 0, ok = 0;
        for (const r of rows) {
          raw++;
          const p = normalizeRow(r, platform);
          if (p) { allPosts.push(p); ok++; }
        }
        _diagByPlat[platform] = { raw_rows: raw, posts_ok: ok };
      }
      // Diagnóstico visible en consola, window.__smxDebug y panel #6
      const _s18 = allPosts.filter(p => p.week === 18);
      const _s18ByPlat = {};
      for (const p of _s18) _s18ByPlat[p.platform] = (_s18ByPlat[p.platform]||0)+1;

      // Captura filas crudas tal como las devolvió gviz/papaparse — para detectar
      // si el Sheet en vivo está enviando menos filas de las que parecen estar
      // presentes en la base de datos
      const _rawCountByPlat = {};
      const _rawS18ByPlat = {};
      const _rawS18Rows = {};   // sólo IG para inspección detallada
      for (const [platform, rows] of Object.entries(rawByPlatform)) {
        _rawCountByPlat[platform] = rows.length;
        const s18raw = rows.filter(r => {
          const s = r['Semana'];
          if (s == null || s === '') return false;
          const n = parseFloat(String(s).replace(',', '.'));
          return n === 18;
        });
        _rawS18ByPlat[platform] = s18raw.length;
        if (platform === 'Instagram' || platform === 'Facebook') {
          _rawS18Rows[platform] = s18raw.map(r => ({
            link: r['Link'] ? '✓' : '—',
            fecha: r['Fecha'],
            formato: r['Formato'],
            alcance: r['Alcance'],
            inter_totales: r['Inter. Totales'],
          }));
        }
      }

      console.log('%c[Samsung MX dashboard · build ' + BUILD_VERSION + ']',
        'color:#AFA9EC;font-weight:bold;font-size:13px');
      console.log('Filas crudas devueltas por gviz:', _rawCountByPlat);
      console.log('Filas crudas con Semana=18:', _rawS18ByPlat);
      console.log('Posts válidos por plataforma:', _diagByPlat);
      console.log('Total posts: ' + allPosts.length + '  ·  S18: ' + _s18.length);
      console.log('S18 por plataforma:', _s18ByPlat);
      console.log('Detalle de filas RAW S18 (FB e IG):');
      console.table(_rawS18Rows.Facebook || []);
      console.table(_rawS18Rows.Instagram || []);

      window.__smxDebug = {
        build: BUILD_VERSION,
        rawCountByPlat: _rawCountByPlat,
        rawS18ByPlat: _rawS18ByPlat,
        rawS18Rows: _rawS18Rows,
        byPlatform: _diagByPlat,
        s18ByPlat: _s18ByPlat,
        totalPosts: allPosts.length,
        totalS18: _s18.length,
        allPosts,
      };
      // Meta global: dominio completo de los datos (independiente de filtros)
      const weeks = [...new Set(allPosts.map(p => p.week).filter(Boolean))].sort((a,b)=>a-b);
      // FIX: comparar como Date objects, no strings, para que date_min/max sean
      // cronológicos (antes "31/12/2025" > "01/01/2026" alfabéticamente)
      const dates = allPosts.map(p => parseDate(p.date)).filter(Boolean);
      const campaigns = [...new Set(allPosts.map(p => p.campaign).filter(Boolean))].sort();
      const subcampaigns = [...new Set(allPosts.map(p => p.subcampaign).filter(Boolean))].sort();
      const content_types = [...new Set(allPosts.map(p => p.content_type).filter(Boolean))].sort();
      const stages = [...new Set(allPosts.map(p => p.stage).filter(Boolean))].sort();
      const strategies = [...new Set(allPosts.map(p => p.strategy).filter(Boolean))].sort();
      const products = [...new Set(allPosts.map(p => p.product).filter(Boolean))].sort();
      const platforms = [...new Set(allPosts.map(p => p.platform))].sort();
      // Años presentes — derivados de fecha o del campo "Año" del Sheet
      const yearsSet = new Set();
      for (const p of allPosts) {
        if (p.year && +p.year > 1900) yearsSet.add(+p.year);
        const dt = parseDate(p.date);
        if (dt) yearsSet.add(dt.getFullYear());
      }
      const years = [...yearsSet].sort((a,b) => b - a);  // recientes primero

      // Semanas con datos por año — para el slider, que muestra sólo
      // las semanas relevantes al año filtrado
      const weeksByYear = {};
      for (const p of allPosts) {
        if (p.week == null) continue;
        let y = null;
        if (p.year && +p.year > 1900) y = +p.year;
        else {
          const dt = parseDate(p.date);
          if (dt) y = dt.getFullYear();
        }
        if (!y) continue;
        if (!weeksByYear[y]) weeksByYear[y] = new Set();
        weeksByYear[y].add(p.week);
      }
      const weeksByYearArr = {};
      for (const y of Object.keys(weeksByYear)) {
        weeksByYearArr[y] = [...weeksByYear[y]].sort((a,b) => a-b);
      }

      // Mapa campaña → subcampañas (para el filtro encadenado)
      const subBy = {};
      for (const p of allPosts) {
        if (p.campaign && p.subcampaign) {
          if (!subBy[p.campaign]) subBy[p.campaign] = new Set();
          subBy[p.campaign].add(p.subcampaign);
        }
      }
      const subcampaignsByCampaign = Object.fromEntries(
        Object.entries(subBy).map(([k, v]) => [k, [...v].sort()])
      );

      // Detectar posts huérfanos (sin Semana asignada) — útil para que el
      // usuario sepa que tiene filas en su Sheet sin clasificar
      const orphansNoWeek = allPosts.filter(p => p.week == null);
      const orphansByPlatform = {};
      for (const p of orphansNoWeek) {
        orphansByPlatform[p.platform] = (orphansByPlatform[p.platform] || 0) + 1;
      }

      // Igual, pero para Etapa — el desglose §04 "Por etapa" queda incompleto
      // en silencio si hay filas sin ese campo, así que lo avisamos.
      const orphansNoStage = allPosts.filter(p => !p.stage);
      const orphansNoStageByPlatform = {};
      for (const p of orphansNoStage) {
        orphansNoStageByPlatform[p.platform] = (orphansNoStageByPlatform[p.platform] || 0) + 1;
      }

      const meta = {
        total_posts: allPosts.length,
        platforms,
        weeks,
        weeks_by_year: weeksByYearArr,
        years,
        campaigns,
        subcampaigns,
        content_types,
        stages,
        strategies,
        products,
        subcampaignsByCampaign,
        date_min: dates.length ? dates.reduce((a,b) => a<b?a:b) : null,
        date_max: dates.length ? dates.reduce((a,b) => a>b?a:b) : null,
        orphans_no_week: orphansNoWeek.length,
        orphans_no_week_by_platform: orphansByPlatform,
        orphans_no_stage: orphansNoStage.length,
        orphans_no_stage_by_platform: orphansNoStageByPlatform,
      };
      return { allPosts, meta };
    }

    /**
     * Aplica los filtros al array de posts.
     * Filtros vacíos = no filtra esa dimensión.
     */
    // Helper: deriva el año de un post desde p.year o desde parseDate(p.date)
    function postYear(p) {
      if (p.year && +p.year > 1900) return +p.year;
      const dt = parseDate(p.date);
      if (dt) return dt.getFullYear();
      return null;
    }

    function applyFilters(allPosts, filters) {
      const { year, weeks, platforms, campaigns, subcampaigns, contentTypes, stages, strategies, products, formats } = filters;
      return allPosts.filter(p => {
        if (year && year !== 'all') {
          const py = postYear(p);
          if (py !== year) return false;
        }
        if (weeks && weeks.length > 0) {
          if (p.week == null || !weeks.includes(p.week)) return false;
        }
        if (platforms && platforms.length > 0 && !platforms.includes(p.platform)) return false;
        if (campaigns && campaigns.length > 0 && !campaigns.includes(p.campaign)) return false;
        if (subcampaigns && subcampaigns.length > 0 && !subcampaigns.includes(p.subcampaign)) return false;
        if (contentTypes && contentTypes.length > 0 && !contentTypes.includes(p.content_type)) return false;
        if (stages && stages.length > 0 && !stages.includes(p.stage)) return false;
        if (formats && formats.length > 0 && !formats.includes(p.format)) return false;
        if (strategies && strategies.length > 0 && !strategies.includes(p.strategy)) return false;
        if (products && products.length > 0 && !products.includes(p.product)) return false;
        return true;
      });
    }

    // ============================================================
    // FILTROS ENCADENADOS ("faceted filtering")
    // Cada selector solo debe ofrecer las opciones que en verdad existen
    // dentro del universo ya acotado por los DEMÁS filtros activos. Ej:
    // si Año=2026, "Campaña" solo lista campañas con posts en 2026; si
    // Campaña=H8Q8B8, "Subcampaña"/"Semana"/"Plataforma"/etc. solo listan
    // lo que vive dentro de esa campaña. Y viceversa entre cualquier par.
    // ============================================================
    const FACET_FIELD_MAP = {
      weeks: 'week',
      platforms: 'platform',
      campaigns: 'campaign',
      subcampaigns: 'subcampaign',
      contentTypes: 'content_type',
      stages: 'stage',
      strategies: 'strategy',
      products: 'product',
      formats: 'format',
    };

    // Dimensiones habilitadas para la comparativa "Entidad vs. entidad"
    // (§ 08 · Comparativas) — reutiliza FACET_FIELD_MAP para saber en qué
    // campo de cada post filtrar.
    const COMPARE_DIMENSIONS = [
      { key: 'campaigns',    label: 'Campaña' },
      { key: 'subcampaigns', label: 'Subcampaña' },
      { key: 'stages',       label: 'Etapa' },
      { key: 'strategies',   label: 'Pauta' },
      { key: 'contentTypes', label: 'Tipo contenido' },
    ];

    // Para cada dimensión, calcula el set de valores que siguen existiendo
    // si se aplican TODOS los demás filtros activos (año incluido) pero se
    // ignora la propia dimensión — así su selección nunca se autolimita.
    function computeFacetSets(allPosts, filters) {
      const sets = {};
      for (const key of Object.keys(FACET_FIELD_MAP)) {
        const field = FACET_FIELD_MAP[key];
        const scoped = applyFilters(allPosts, { ...filters, [key]: [] });
        const set = new Set();
        for (const p of scoped) {
          const v = p[field];
          if (v != null && v !== '') set.add(v);
        }
        sets[key] = set;
      }
      return sets;
    }

    // Recorta cada filtro array a solo los valores que siguen siendo
    // válidos tras un cambio — evita el caso "0 resultados" en silencio
    // por una combinación que ya no tiene sentido (ej. una subcampaña que
    // no pertenece a la campaña recién elegida, o una semana que no
    // existe en el año recién elegido).
    function sanitizeFilters(allPosts, filters) {
      if (!allPosts || allPosts.length === 0) return filters;
      const sets = computeFacetSets(allPosts, filters);
      let changed = false;
      const next = { ...filters };
      for (const key of Object.keys(FACET_FIELD_MAP)) {
        const current = filters[key] || [];
        if (current.length === 0) continue;
        const allowed = sets[key];
        const pruned = current.filter((v) => allowed.has(v));
        if (pruned.length !== current.length) {
          next[key] = pruned;
          changed = true;
        }
      }
      return changed ? next : filters;
    }

    /**
     * Computa todos los agregados sobre un set de posts (ya filtrado o no).
     * Esta función SÍ se ejecuta en cada cambio de filtros.
     */
    function computeAggregates(posts, baseMeta) {
      const global = aggFinalize(posts.reduce((acc, p) => { aggAdd(acc, p); return acc; }, emptyAgg()));
      const by_platform = groupAgg(posts, p => p.platform);
      const by_week = groupAgg(posts.filter(p => p.week), p => p.week);
      const by_plat_week = nestedGroupAgg(posts.filter(p => p.week), p => p.platform, p => p.week);
      const by_format = groupAgg(posts, p => p.format);
      const by_product = groupAgg(posts, p => p.product);
      const by_strategy = groupAgg(posts, p => p.strategy);
      const by_campaign = groupAgg(posts, p => p.campaign);
      const by_objective = groupAgg(posts, p => p.objective);
      const by_stage = groupAgg(posts, p => p.stage);

      // Meta del subset filtrado (para la sección "viendo")
      const weeksInScope = [...new Set(posts.map(p => p.week).filter(Boolean))].sort((a,b)=>a-b);
      // FIX: parsear a Date para que el min/max sea cronológico, no alfabético
      const datesInScope = posts.map(p => parseDate(p.date)).filter(Boolean);

      return {
        global, by_platform, by_week, by_plat_week, by_format, by_product,
        by_strategy, by_campaign, by_objective, by_stage,
        meta: {
          ...baseMeta,
          // Sobreescribimos sólo los campos que dependen del filtro
          posts_in_scope: posts.length,
          weeks_in_scope: weeksInScope,
          date_min_scope: datesInScope.length ? datesInScope.reduce((a,b) => a<b?a:b) : null,
          date_max_scope: datesInScope.length ? datesInScope.reduce((a,b) => a>b?a:b) : null,
        },
        allPosts: posts,
      };
    }

    /**
     * Función legado para compatibilidad: normaliza + agrega sin filtros.
     * Solo se usa para inicialización de cache.
     */
    function transformAll(rawByPlatform) {
      const { allPosts, meta } = normalizeAll(rawByPlatform);
      return computeAggregates(allPosts, meta);
    }

    // ============================================================
    // FORMATTERS
    // ============================================================
    // Antes abreviaba a K/M/B; ahora siempre muestra el número completo
    // con separadores de miles (petición: ver el dato exacto).
    const fmt = (n) => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-MX');
    const fmtFull = (n) => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-MX');
    const erFmt = (n) => n == null ? '—' : Number(n).toFixed(2) + '%';

    // Parser robusto de fechas. Tu Sheet puede tener fechas en varios formatos:
    //   - "2026-04-27" (ISO)              ← parsea nativo
    //   - "27/04/2026" (DD/MM/YYYY MX)    ← parsea custom (nativo lo lee mal)
    //   - "27/04/26"   (DD/MM/YY)         ← parsea custom
    //   - "27 abr 2026"                    ← parsea custom (mes en español corto)
    //   - "05-ene", "05 ene"               ← parsea custom (sin año)
    //   - Date object (Excel / Google)     ← parsea nativo
    const ES_MONTHS = {
      'ene':1,'enero':1, 'feb':2,'febrero':2, 'mar':3,'marzo':3,
      'abr':4,'abril':4, 'may':5,'mayo':5, 'jun':6,'junio':6,
      'jul':7,'julio':7, 'ago':8,'agosto':8, 'sep':9,'sept':9,'septiembre':9,
      'oct':10,'octubre':10, 'nov':11,'noviembre':11, 'dic':12,'diciembre':12,
    };
    function parseDate(d) {
      if (!d) return null;
      if (d instanceof Date && !isNaN(d)) return d;
      const s = String(d).trim();
      if (!s) return null;

      // ISO: 2026-04-27 — parser nativo lo interpreta como UTC, ajustamos con T12 para evitar shift de día
      const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) {
        const dt = new Date(+iso[1], +iso[2] - 1, +iso[3]);
        if (!isNaN(dt)) return dt;
      }

      // DD/MM/YYYY o DD-MM-YYYY (formato MX común)
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (dmy) {
        const day = +dmy[1], month = +dmy[2] - 1;
        let year = +dmy[3];
        if (year < 100) year += 2000;
        const dt = new Date(year, month, day);
        if (!isNaN(dt)) return dt;
      }

      // DD-mes-YYYY o DD mes YYYY (con mes en español)
      const dmyEs = s.match(/^(\d{1,2})[\s\-](\p{L}+)(?:[\s\-](\d{2,4}))?$/u);
      if (dmyEs) {
        const day = +dmyEs[1];
        const monthKey = dmyEs[2].toLowerCase().replace('.','');
        const month = ES_MONTHS[monthKey];
        if (month) {
          let year = dmyEs[3] ? +dmyEs[3] : new Date().getFullYear();
          if (year < 100) year += 2000;
          const dt = new Date(year, month - 1, day);
          if (!isNaN(dt)) return dt;
        }
      }

      // Último recurso: parser nativo
      const dt = new Date(s);
      if (!isNaN(dt)) return dt;
      return null;
    }

    const dateFmt = (d) => {
      const dt = parseDate(d);
      if (!dt) return d ? String(d) : '—';
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
    };
    const dateShort = (d) => {
      const dt = parseDate(d);
      if (!dt) return d ? String(d) : '—';
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
    };

    // Dimensiones por las que se puede agrupar el resumen.

    // Columnas disponibles en modo "Posts individuales" (un post = una fila).
    const RAW_COLUMNS = [
      { key: 'date',         label: 'Fecha',             get: (p) => dateFmt(p.date) },

    const DEFAULT_RAW_COLUMNS = ['date', 'platform', 'campaign', 'format', 'reach', 'interactions', 'views', 'er', 'vtr', 'link'];

    // Arma las filas agrupadas para el modo "Resumen" a partir de los
    // agregados ya calculados en D (D.by_platform, D.by_week, ...) —
    // reutiliza los que ya existen y calcula al vuelo los que faltan
    // (subcampaña / tipo de contenido) con groupAgg sobre D.allPosts.
    function groupedReportRows(D, dimKey) {
      const dim = REPORT_DIMENSIONS.find(d => d.key === dimKey);
      if (!dim) return [];
      const precomputed = {
        platform: D.by_platform, week: D.by_week, campaign: D.by_campaign,
        product: D.by_product, strategy: D.by_strategy, stage: D.by_stage,
        format: D.by_format, objective: D.by_objective,
      };
      const grouped = precomputed[dimKey] || groupAgg(D.allPosts || [], (p) => p[dim.field]);
      let keys = Object.keys(grouped);
      if (dimKey === 'week') keys.sort((a, b) => +a - +b);
      else keys.sort((a, b) => (grouped[b].reach || 0) - (grouped[a].reach || 0));
      return keys.map((k) => ({
        label: dimKey === 'week' ? `Semana ${k}` : k,
        agg: grouped[k],
      }));
    }

    // Sugiere un título legible para la hoja según los filtros activos —
    // el usuario puede editarlo libremente antes de generar el reporte.
    function suggestedReportTitle(filters, mode, dimLabel) {
      const parts = [];
      parts.push(mode === 'summary' ? `Resumen por ${dimLabel}` : 'Posts');
      if (filters.platforms.length === 1) parts.push(filters.platforms[0]);
      else if (filters.platforms.length > 1) parts.push(`${filters.platforms.length} plataformas`);
      if (filters.contentTypes.length) parts.push(filters.contentTypes.join('+'));
      if (filters.campaigns.length === 1) parts.push(filters.campaigns[0]);
      if (filters.year !== 'all') parts.push(String(filters.year));
      if (filters.weeks.length === 1) parts.push(`S${filters.weeks[0]}`);
      else if (filters.weeks.length > 1) parts.push(`${filters.weeks.length} semanas`);
      parts.push(new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }));
      return parts.join(' · ');
    }

    // Nombre de archivo seguro para el .xlsx descargado (sin caracteres
    // raros ni acentos problemáticos en distintos SO).
    function sanitizeFileName(name) {
      const NFD_MARKS = new RegExp('[̀-ͯ]', 'g'); // marcas de acento tras normalize('NFD')
      const clean = String(name || 'Reporte')
        .normalize('NFD').replace(NFD_MARKS, '')
        .replace(/[\\/:*?"<>|]/g, '-') // caracteres inválidos en nombres de archivo
        .trim();
      return clean.length ? clean : 'Reporte';
    }

    // Nombre de pestaña seguro para el workbook de Excel (máx. 31
    // caracteres, sin [ ] : * ? / \ que Excel no permite en tabs).
    function sanitizeSheetTabName(name) {
      const clean = String(name || 'Reporte').replace(/[\[\]:*?/\\]/g, '-').trim();
      return (clean.length ? clean : 'Reporte').substring(0, 31);
    }

    // === Helpers para vista diaria ===
    // weekDays(N, año) → array de 7 Date objects (Dom→Sáb) que componen
    // la semana N del año, usando convención US/MX:
    //   Semana 1 = semana que contiene el 1 de enero, inicia en domingo.
    function weekDays(weekNum, year) {
      const jan1 = new Date(year, 0, 1);
      const dow = jan1.getDay();                // 0=Dom .. 6=Sáb
      const start = new Date(year, 0, 1 - dow + (weekNum - 1) * 7);
      return Array.from({ length: 7 }, (_, i) =>
        new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }
    const DAY_NAMES_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayLabel = (d) => `${DAY_NAMES_ES[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;

    // Infiere el año dominante de un conjunto de posts (por fecha o por p.year)
    function inferYear(posts) {
      const counts = {};
      for (const p of posts || []) {
        let y = null;
        if (p.year && +p.year > 1900) y = +p.year;
        else {
          const dt = parseDate(p.date);
          if (dt) y = dt.getFullYear();
        }
        if (y) counts[y] = (counts[y] || 0) + 1;
      }
      const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
      return sorted.length ? +sorted[0][0] : new Date().getFullYear();
    }
    const timeAgo = (ts) => {
      if (!ts) return '—';
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return 'hace un momento';
      if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
      if (diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
      return `hace ${Math.floor(diff/86400)} d`;
    };

    const PLAT_COLORS = {
      Facebook:'#3B6FB8', Instagram:'#C73E6B', TikTok:'#1FA9B0',
      X:'#2A2A2A', YouTube:'#C53030', Threads:'#525252', LinkedIn:'#1F4D8C',
    };
    const PLAT_LETTERS = {
      Facebook:'FB', Instagram:'IG', YouTube:'YT', TikTok:'TT',
      X:'X', LinkedIn:'LI', Threads:'TH',
    };

    // ============================================================
    // LOGOS — embebidos como data URIs
    // ============================================================
    // SAMSUNG_LOGO_DATA_URI: pega aquí el data URI del wordmark oficial.
    // Vacío por ahora — al estar vacío, el sidebar usa el placeholder "S"
    // estilizado. Para activar el logo:
    //   1. Convierte tu PNG/SVG a base64 (https://www.base64-image.de/)

    // ============================================================
    // EXPORTACIÓN — PNG por sección y PDF global
    // ============================================================
    function buildFileName(suffix) {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `samsung-mx_${suffix}_${yyyy}-${mm}-${dd}`;
    }

    async function captureSection(sectionId) {
      const el = document.getElementById(sectionId);
      if (!el) throw new Error('Sección no encontrada: ' + sectionId);
      if (typeof window.html2canvas !== 'function') {
        throw new Error('html2canvas no está cargado todavía. Recarga la página.');
      }
      // backgroundColor: lee --c-ink en vivo para que coincida con el tema
      // actual (claro u oscuro) en vez de asumir siempre fondo oscuro.
      // scale: 2 = retina-quality
      // useCORS: para que las imágenes externas (si las hay) no rompan la captura
      const inkRgb = getComputedStyle(document.documentElement).getPropertyValue('--c-ink').trim();
      const bg = inkRgb ? `rgb(${inkRgb.split(/\s+/).join(',')})` : '#0A0A0F';
      return await window.html2canvas(el, {
        backgroundColor: bg,
        scale: 2,
        useCORS: true,
        logging: false,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight,
      });
    }

    async function exportSectionAsPng(sectionId, name) {
      try {
        const canvas = await captureSection(sectionId);
        const link = document.createElement('a');
        link.download = buildFileName(name) + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        console.error('Error exportando PNG:', e);
        alert('No se pudo exportar la imagen: ' + e.message);
      }
    }

    async function exportFullDashboardPdf(onProgress) {
      try {
        if (typeof window.jspdf === 'undefined') {
          throw new Error('jsPDF no está cargado. Recarga la página.');
        }
        const { jsPDF } = window.jspdf;
        // Secciones en el orden que aparecen en el dashboard
        const sections = [
          { id: 'sec-resumen',      name: 'Resumen' },
          { id: 'sec-plataformas',  name: 'Plataformas' },
          { id: 'sec-tendencia',    name: 'Tendencia' },
          { id: 'sec-mezcla',       name: 'Mezcla' },
          { id: 'sec-top-posts',    name: 'Top posts' },
          { id: 'sec-vtr',          name: 'VTR' },
          { id: 'sec-promedios',    name: 'Promedios' },
          { id: 'sec-comparativas', name: 'Comparativas' },
          { id: 'sec-catalogo',     name: 'Catálogo' },
          { id: 'sec-anomalias',    name: 'Anomalías' },
          { id: 'sec-cadencia',     name: 'Cadencia' },
          { id: 'sec-simulador',    name: 'Simulador' },
        ];
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const padding = 24;
        let firstPage = true;

        const present = sections.filter(s => document.getElementById(s.id));
        for (let i = 0; i < present.length; i++) {
          const { id, name } = present[i];
          if (onProgress) onProgress(i + 1, present.length, name);
          const canvas = await captureSection(id);
          if (!firstPage) pdf.addPage();
          firstPage = false;
          // Encajar la imagen en la página manteniendo aspecto
          const maxW = pageW - padding * 2;
          const maxH = pageH - padding * 2;
          const ratio = Math.min(maxW / canvas.width, maxH / canvas.height);
          const w = canvas.width * ratio;
          const h = canvas.height * ratio;
          // Fondo oscuro para que matchee con el dashboard
          pdf.setFillColor(10, 10, 15);
          pdf.rect(0, 0, pageW, pageH, 'F');
          pdf.addImage(canvas.toDataURL('image/png'), 'PNG',
            (pageW - w) / 2, (pageH - h) / 2, w, h);
        }
        pdf.save(buildFileName('dashboard') + '.pdf');
      } catch (e) {
        console.error('Error exportando PDF:', e);
        alert('No se pudo exportar el PDF: ' + e.message);
      }
    }

    // ============================================================
    // CACHE local + HOOK de datos con auto-refresh
    // ============================================================
    // BUILD_VERSION: cámbialo cuando subas una versión nueva.
    // Al cambiar, automáticamente se invalida cualquier caché viejo del navegador.
    const BUILD_VERSION = '2026-05-23-v19';
    const CACHE_KEY = 'smx-dashboard-cache-' + BUILD_VERSION;
    const CACHE_TTL_MS = CACHE_TTL_MIN * 60 * 1000;

    // Limpia automáticamente caches de builds viejos al cargar.
    try {
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('smx-dashboard-cache-') && k !== CACHE_KEY) {
          localStorage.removeItem(k);
        }
      });
    } catch {}

    function readCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const p = JSON.parse(raw);
        if (Date.now() - p.fetchedAt > CACHE_TTL_MS) return null;
        return p;
      } catch { return null; }
    }
    function writeCache(p) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(p)); } catch {} }
    function clearCache() { try { localStorage.removeItem(CACHE_KEY); } catch {} }

    function useDashboardData() {
      const [state, setState] = useState({
        data: null, loading: true, refreshing: false,
        error: null, errors: [], fetchedAt: null,
      });
      const inFlightRef = useRef(false);

      const load = useCallback(async ({ skipCache = false } = {}) => {
        if (inFlightRef.current) return;

        if (!skipCache) {
          const cached = readCache();
          if (cached) {
            try {
              const data = transformAll(cached.rawByPlatform);
              setState(s => ({ ...s, data, loading:false, errors: cached.errors||[], fetchedAt: cached.fetchedAt }));
              return;
            } catch { clearCache(); }
          }
        }

        inFlightRef.current = true;
        setState(s => ({ ...s, loading: !s.data, refreshing: !!s.data, error: null }));

        try {
          const { data: rawByPlatform, errors, fetchedAt } = await fetchAllPlatforms();
          const data = transformAll(rawByPlatform);
          writeCache({ rawByPlatform, errors, fetchedAt });
          setState({ data, loading:false, refreshing:false, error:null, errors, fetchedAt });
        } catch (e) {
          setState(s => ({ ...s, loading:false, refreshing:false, error: e?.message || 'Error desconocido' }));
        } finally {
          inFlightRef.current = false;
        }
      }, []);

      useEffect(() => { load(); }, [load]);

      useEffect(() => {
        const onVis = () => { if (document.visibilityState === 'visible') load(); };
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
      }, [load]);

      useEffect(() => {
        if (AUTO_REFRESH_MIN <= 0) return;
        const id = setInterval(() => {
          if (document.visibilityState === 'visible') load({ skipCache: true });
        }, AUTO_REFRESH_MIN * 60 * 1000);
        return () => clearInterval(id);
      }, [load]);

      const refresh = useCallback(() => { clearCache(); return load({ skipCache: true }); }, [load]);
      return { ...state, refresh, autoRefreshMin: AUTO_REFRESH_MIN };
    }

    // ============================================================
    // FILTROS — estado, sync con URL, filtro encadenado
    // ============================================================
    const EMPTY_FILTERS = {
      year: 2026,             // 2025 | 2026 | 'all'
      weeks: [],               // [] = todas; semanas específicas seleccionadas
      platforms: [],          // [] = todas
      campaigns: [],
      subcampaigns: [],
      contentTypes: [],       // [] = todos (Local / Global / LAO / ...)
      stages: [],              // [] = todas (Etapa del funnel/campaña)
      strategies: [],         // [] = todas (Orgánico / Pagado / ...)
      products: [],           // [] = todos (Galaxy S25 / Z Fold7 / Watch / ...)
      formats: [],             // [] = todos (Reel / Carrusel / Historia / ...)
    };

    function readFiltersFromUrl() {
      try {
        const sp = new URLSearchParams(window.location.search);
        const f = { ...EMPTY_FILTERS };
        const y = sp.get('y');
        if (y === '2025' || y === '2026') f.year = +y;
        else if (y === 'all')              f.year = 'all';
        // si no hay ?y= en URL → conserva el default 2026
        const arr = (k) => {
          const v = sp.get(k);
          return v ? v.split('|').filter(Boolean) : [];
        };
        const w = sp.get('w');
        if (w) f.weeks = w.split('|').map(Number).filter(n => !isNaN(n));
        f.platforms = arr('p');
        f.campaigns = arr('c');
        f.subcampaigns = arr('sc');
        f.contentTypes = arr('ct');
        f.stages = arr('sg');
        f.strategies = arr('st');
        f.products = arr('pr');
        f.formats = arr('fm');
        return f;
      } catch { return EMPTY_FILTERS; }
    }

    function writeFiltersToUrl(f) {
      try {
        const sp = new URLSearchParams();
        // sólo escribir ?y= si no es el default 2026
        if (f.year !== 2026) sp.set('y', String(f.year));
        if (f.weeks?.length)         sp.set('w',  f.weeks.join('|'));
        if (f.platforms?.length)    sp.set('p',  f.platforms.join('|'));
        if (f.campaigns?.length)    sp.set('c',  f.campaigns.join('|'));
        if (f.subcampaigns?.length) sp.set('sc', f.subcampaigns.join('|'));
        if (f.contentTypes?.length) sp.set('ct', f.contentTypes.join('|'));
        if (f.stages?.length)       sp.set('sg', f.stages.join('|'));
        if (f.strategies?.length)   sp.set('st', f.strategies.join('|'));
        if (f.products?.length)     sp.set('pr', f.products.join('|'));
        if (f.formats?.length)      sp.set('fm', f.formats.join('|'));
        const qs = sp.toString();
        const newUrl = window.location.pathname + (qs ? '?' + qs : '');
        window.history.replaceState(null, '', newUrl);
      } catch {}
    }

    function useFilters(allPosts, initial = EMPTY_FILTERS) {
      const [filters, setFiltersRaw] = useState(() => {
        // Hidrata desde URL al cargar
        try {
          if (typeof window !== 'undefined') return readFiltersFromUrl();
        } catch {}
        return initial;

        setFiltersRaw(prev => {
          const raw = typeof updater === 'function' ? updater(prev) : updater;
          // Filtros encadenados: si el cambio deja alguna selección de
          // otra dimensión sin sentido (ej. una subcampaña que ya no
          // pertenece a la campaña elegida), la recorta automáticamente
          // en vez de dejar el dashboard en "0 resultados" en silencio.
          const next = sanitizeFilters(allPosts, raw);
          writeFiltersToUrl(next);
          return next;
        });
      }, [allPosts]);

        (filters.year != null && filters.year !== 2026) ||
        filters.weeks.length > 0 ||
        filters.platforms.length > 0 ||
        filters.campaigns.length > 0 ||
        filters.subcampaigns.length > 0 ||
        filters.contentTypes.length > 0 ||
        filters.stages.length > 0 ||
        filters.strategies.length > 0 ||
        filters.products.length > 0 ||

      return { filters, setFilters, clear, isActive };

     * Toggle genérico para "clic en una fila de desglose = filtrar a ese
     * único valor; clic de nuevo = quitar el filtro". Usado por las tarjetas
     * de plataforma y por las filas de etapa/estrategia/formato/campaña/producto.
     */
    function toggleSingleFilter(setFilters, key, value) {
      setFilters(prev => {
        const isOnlyThis = prev[key].length === 1 && prev[key][0] === value;
        return { ...prev, [key]: isOnlyThis ? [] : [value] };

    function useTheme() {
      const [theme, setTheme] = useState(() => {
        try {
          const saved = localStorage.getItem('smx-theme');

          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
        } catch {}
        return 'dark';

      useEffect(() => {
        document.documentElement.classList.toggle('light', theme === 'light');

        if (meta) meta.setAttribute('content', theme === 'light' ? '#F8F7F2' : '#0A0A0F');
      }, [theme]);

      const toggleTheme = useCallback(() => {

    /**
     * Hook utilitario: cierra el popover al click fuera o al presionar ESC.
     */
    function useClickOutside(ref, handler) {
      useEffect(() => {
        const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) handler(); };
        const onKey = (e) => { if (e.key === 'Escape') handler(); };
        document.addEventListener('mousedown', onClick);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onClick);
          document.removeEventListener('keydown', onKey);
        };
      }, [ref, handler]);
    }

    /**
     * Botón con popover. El popover se posiciona absoluto debajo del botón.
     */
    function FilterPopover({ label, summary, badgeCount, children, align = 'left', wide = false }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useClickOutside(ref, () => setOpen(false));

      const active = badgeCount > 0;
      return html`
        <div ref=${ref} className="relative">
          <button onClick=${() => setOpen(o => !o)}
                  className=${"inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-[11px] transition-all " +
                    (active
                      ? "border-accent2/40 bg-accent2/12 text-txt"
                      : "border-line bg-onSurface/[0.03] text-txt3 hover:border-line2 hover:text-txt2")}>
            <span className="font-medium">${label}</span>
            ${active ? html`
              <span className="bg-accent text-ink rounded px-1.5 leading-tight font-mono text-[10px] font-semibold">
                ${badgeCount}
              </span>
            ` : html`
              <span className="text-txt3">${summary}</span>
            `}
            <${ChevronDownIcon} size=${12} className=${open ? "rotate-180 transition-transform" : "transition-transform"}/>
          </button>
          ${open && html`
            <div className=${"absolute z-50 mt-2 bg-surface2 border border-line2 rounded-lg shadow-2xl shadow-black/40 " +
              (wide ? "min-w-[280px]" : "min-w-[220px]") + " " +
              (align === 'right' ? "right-0" : "left-0")}>

    }

    /**
     * Componente principal: la barra completa de filtros.
     */
    function FilterBar({ baseMeta, filters, setFilters, clear, isActive, postsInScope, totalPosts, allPosts }) {
      const { weeks, platforms, campaigns } = baseMeta;
      const [linkCopied, setLinkCopied] = useState(false);

      // Filtros encadenados: para cada dimensión, qué valores siguen
      // existiendo dado el resto de los filtros activos ahora mismo.
      const facetSets = useMemo(
        () => computeFacetSets(allPosts || [], filters),
        [allPosts, filters]
      );

      const copyFilteredLink = async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
        } catch {
          // Fallback para navegadores/contextos sin permiso de Clipboard API
          const ta = document.createElement('textarea');
          ta.value = window.location.href;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch {}
          document.body.removeChild(ta);
        }
        setLinkCopied(true);
        setTimeout(() => setLinkCopied(false), 1800);
      };

      // Listas de opciones por dimensión: el catálogo completo (ya
      // ordenado, viene de baseMeta) recortado a lo que sigue existiendo
      // dados los DEMÁS filtros activos ahora mismo (encadenado en ambas
      // direcciones: Año → Campaña, Campaña → Subcampaña/Semana/
      // Plataforma, y así con cualquier combinación).
      const availableWeeks        = useMemo(() => weeks.filter((w) => facetSets.weeks.has(w)), [weeks, facetSets.weeks]);
      const availablePlatforms    = useMemo(() => platforms.filter((v) => facetSets.platforms.has(v)), [platforms, facetSets.platforms]);
      const availableCampaigns    = useMemo(() => campaigns.filter((v) => facetSets.campaigns.has(v)), [campaigns, facetSets.campaigns]);
      const availableSubcampaigns = useMemo(() => (baseMeta.subcampaigns || []).filter((v) => facetSets.subcampaigns.has(v)), [baseMeta.subcampaigns, facetSets.subcampaigns]);
      const availableContentTypes = useMemo(() => (baseMeta.content_types || []).filter((v) => facetSets.contentTypes.has(v)), [baseMeta.content_types, facetSets.contentTypes]);
      const availableStages       = useMemo(() => (baseMeta.stages || []).filter((v) => facetSets.stages.has(v)), [baseMeta.stages, facetSets.stages]);
      const availableStrategies   = useMemo(() => (baseMeta.strategies || []).filter((v) => facetSets.strategies.has(v)), [baseMeta.strategies, facetSets.strategies]);
      const availableProducts     = useMemo(() => (baseMeta.products || []).filter((v) => facetSets.products.has(v)), [baseMeta.products, facetSets.products]);

      // Toggles — el recorte de selecciones que dejan de tener sentido
      // (ej. una subcampaña que ya no pertenece a la campaña elegida) lo
      // hace sanitizeFilters() de forma centralizada dentro de setFilters,
      // así que aquí no hace falta lógica especial por campo.
      const toggleArr = (key) => (val) => {
        setFilters(prev => {
          const arr = prev[key];
          const next = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
          return { ...prev, [key]: next };
        });
      };

      const selectAll = (key, options) => () => {
        setFilters(prev => ({ ...prev, [key]: [...options] }));
      };
      const clearKey = (key) => () => {
        setFilters(prev => ({ ...prev, [key]: [] }));
      };

      const setYear = (y) => {
        // No hace falta limpiar semanas a mano: sanitizeFilters recorta
        // automáticamente las que ya no existan en el año elegido, y
        // conserva las que sí siguen aplicando (ej. semana 3 en ambos años).
        setFilters(prev => ({ ...prev, year: y }));
      };

      const yearOptions = [
        { v: 2025,  l: '2025' },
        { v: 2026,  l: '2026' },
        { v: 'all', l: 'Todo' },
      ];

      const arrSummary = (arr, total) => {
        if (arr.length === 0) return 'Todas';

        return `${arr.length} de ${total}`;

      return html`

          <div className="px-7 py-3 flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-2 text-[10px] font-mono uppercase tracking-[0.2em] text-faint shrink-0">
              <${FilterIcon} size=${12}/> Filtros
            </div>

            <div className="flex items-center rounded-lg border border-line bg-onSurface/[0.02] overflow-hidden shrink-0">
              <span className="text-[10px] font-mono uppercase tracking-[0.15em] text-faint px-2.5 py-1.5 border-r border-line">Año</span>
              ${yearOptions.map((o, i) => html`
                <button key=${o.v}
                  onClick=${() => setYear(o.v)}
                  className=${"px-2.5 py-1.5 text-[11px] transition-colors " +
                    (i > 0 ? "border-l border-line " : "") +
                    (filters.year === o.v
                      ? "bg-accent2/15 text-txt"
                      : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                  ${o.l}
                </button>
              `)}
            </div>

            <${FilterPopover}
              label="Semana"
              summary=${filters.weeks.length === 0 ? 'Todas' : filters.weeks.length === 1 ? `S${filters.weeks[0]}` : `${filters.weeks.length} de ${availableWeeks.length}`}
              badgeCount=${filters.weeks.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableWeeks}
                selected=${filters.weeks}
                onToggle=${toggleArr('weeks')}
                onSelectAll=${selectAll('weeks', availableWeeks)}
                onClear=${clearKey('weeks')}
                renderLabel=${(w) => `Semana ${w}`}
                emptyLabel="Sin semanas"
              />`}
            <//>

            <${FilterPopover}
              label="Plataforma"
              summary=${arrSummary(filters.platforms, availablePlatforms.length)}

            >
              ${() => html`<${MultiSelectPanel}
                options=${availablePlatforms}
                selected=${filters.platforms}
                onToggle=${toggleArr('platforms')}
                onSelectAll=${selectAll('platforms', availablePlatforms)}
                onClear=${clearKey('platforms')}
                emptyLabel="Sin plataformas para esta selección"
              />`}
            <//>

            <${FilterPopover}
              label="Campaña"
              summary=${arrSummary(filters.campaigns, availableCampaigns.length)}
              badgeCount=${filters.campaigns.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableCampaigns}
                selected=${filters.campaigns}
                onToggle=${toggleArr('campaigns')}
                onSelectAll=${selectAll('campaigns', availableCampaigns)}
                onClear=${clearKey('campaigns')}
                emptyLabel="Sin campañas para esta selección"
              />`}
            <//>

            <${FilterPopover}
              label="Subcampaña"
              summary=${arrSummary(filters.subcampaigns, availableSubcampaigns.length)}
              badgeCount=${filters.subcampaigns.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableSubcampaigns}
                selected=${filters.subcampaigns}
                onToggle=${toggleArr('subcampaigns')}
                onSelectAll=${selectAll('subcampaigns', availableSubcampaigns)}
                onClear=${clearKey('subcampaigns')}
                emptyLabel=${filters.campaigns.length ? 'Esta campaña no tiene subcampañas' : 'Sin subcampañas'}
              />`}
            <//>

            <${FilterPopover}
              label="Tipo contenido"
              summary=${arrSummary(filters.contentTypes, availableContentTypes.length)}
              badgeCount=${filters.contentTypes.length}
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableContentTypes}
                selected=${filters.contentTypes}
                onToggle=${toggleArr('contentTypes')}
                onSelectAll=${selectAll('contentTypes', availableContentTypes)}
                onClear=${clearKey('contentTypes')}
                emptyLabel="Sin tipos de contenido para esta selección"
              />`}
            <//>

            <${FilterPopover}
              label="Etapa"
              summary=${arrSummary(filters.stages, availableStages.length)}
              badgeCount=${filters.stages.length}
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableStages}
                selected=${filters.stages}
                onToggle=${toggleArr('stages')}
                onSelectAll=${selectAll('stages', availableStages)}
                onClear=${clearKey('stages')}
                emptyLabel="Sin etapas para esta selección"
              />`}
            <//>

            <${FilterPopover}
              label="Pauta"
              summary=${arrSummary(filters.strategies, availableStrategies.length)}
              badgeCount=${filters.strategies.length}
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableStrategies}
                selected=${filters.strategies}
                onToggle=${toggleArr('strategies')}
                onSelectAll=${selectAll('strategies', availableStrategies)}
                onClear=${clearKey('strategies')}
                emptyLabel="Sin tipos de pauta para esta selección"
              />`}
            <//>

            <${FilterPopover}
              label="Producto"
              summary=${arrSummary(filters.products, availableProducts.length)}
              badgeCount=${filters.products.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableProducts}
                selected=${filters.products}
                onToggle=${toggleArr('products')}
                onSelectAll=${selectAll('products', availableProducts)}
                onClear=${clearKey('products')}
                emptyLabel="Sin productos para esta selección"
              />`}
            <//>

            <div className="flex-1 min-w-[8px]"></div>

            <div className="text-[11px] font-mono text-txt4 tabular-nums">
              <span className=${isActive ? "text-txt" : ""}>${postsInScope.toLocaleString('es-MX')}</span>
              <span className="text-faint"> de ${totalPosts.toLocaleString('es-MX')} posts</span>
            </div>

            <button onClick=${copyFilteredLink}
                    title="Copia el link con los filtros actuales para compartir esta vista"
                    className=${"inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-medium border transition-colors " +
                      (linkCopied ? "border-success/40 text-success bg-success/10" : "border-line2 text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
              ${linkCopied ? html`<${CheckIcon} size=${11}/> ¡Copiado!` : html`<${LinkIcon} size=${11}/> Copiar link`}
            </button>

            ${isActive && html`
              <button onClick=${clear}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-medium border border-amber/40 text-amber hover:bg-amber/10 transition-colors">
                <${XIcon} size=${11}/> Limpiar

    // ============================================================
    // PostSearch — buscador rápido para saltar directo a un post
    // específico (por campaña, subcampaña, producto, formato, tipo de
    // contenido, pauta, etapa, objetivo, influencer o plataforma), sin
    // pasar por el Catálogo. Busca sobre TODO el dataset (sin importar
    // los filtros activos) para que siempre se pueda encontrar cualquier
    // post; al elegir uno se abre el mismo DetailDrawer que usa el resto
    // del dashboard.
    // ============================================================
    const POST_SEARCH_FIELDS = ['campaign', 'subcampaign', 'product', 'format', 'content_type', 'strategy', 'stage', 'objective', 'influencer_name', 'platform', 'link'];

    function PostSearch({ allPosts, onPick }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const wrapRef = useRef(null);

      useEffect(() => {
        const onDocClick = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', onDocClick);
        return () => document.removeEventListener('mousedown', onDocClick);
      }, []);

      const results = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (q.length < 2) return [];
        const matches = [];
        for (const p of (allPosts || [])) {
          for (const f of POST_SEARCH_FIELDS) {
            const v = p[f];
            if (v != null && String(v).toLowerCase().includes(q)) { matches.push(p); break; }
          }
          if (matches.length >= 60) break;
        }
        return matches.sort((a, b) => (b.reach || 0) - (a.reach || 0)).slice(0, 8);
      }, [query, allPosts]);

      const pick = (p) => { onPick(p); setOpen(false); setQuery(''); };

      return html`
        <div ref=${wrapRef} className="relative">
          <div className="relative">
            <${SearchIcon} size=${13} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-txt4 pointer-events-none"/>
            <input type="text" value=${query}
                   onChange=${(e) => { setQuery(e.target.value); setOpen(true); }}
                   onFocus=${() => setOpen(true)}
                   placeholder="Buscar post…"
                   className="h-8 pl-8 pr-3 rounded-lg border border-line bg-onSurface/[0.03] text-[11px] text-txt placeholder:text-txt4 focus:outline-none focus:border-line2 focus:bg-onSurface/[0.05] w-[150px] focus:w-[260px] transition-all" />
          </div>
          ${open && query.trim().length >= 2 && html`
            <div className="absolute right-0 mt-1.5 w-[360px] max-h-[420px] overflow-y-auto rounded-xl border border-line bg-surface shadow-2xl z-50">
              ${results.length === 0 ? html`
                <div className="px-4 py-6 text-center text-[12px] text-txt4">Sin resultados para "${query}"</div>
              ` : results.map((p, i) => html`
                <button key=${i} onClick=${() => pick(p)}
                        className="w-full text-left px-3.5 py-2.5 border-b border-line/50 last:border-0 hover:bg-onSurface/[0.04] transition-colors flex items-center gap-2.5">
                  <span className="font-mono text-[9px] font-semibold text-white px-1.5 py-0.5 rounded shrink-0" style=${{ background: PLAT_COLORS[p.platform] || '#666' }}>${PLAT_LETTERS[p.platform] || '?'}</span>
                  <div className="min-w-0 flex-1">
                    <div className="text-[12px] text-txt truncate">${p.campaign || p.product || 'Sin campaña'}</div>
                    <div className="text-[10px] font-mono text-txt4 truncate">${dateShort(p.date)} · ${p.format || '—'}${p.subcampaign ? ' · ' + p.subcampaign : ''}</div>
                  </div>
                  <div className="text-[11px] font-mono text-txt3 tabular-nums shrink-0">${fmt(p.reach)}</div>
                </button>
              `)}
            </div>
          `}
        </div>`;
    }

    function TopBar({ fetchedAt, onRefresh, refreshing, autoRefreshMin, allPosts, onPick }) {
      const today = new Date().toLocaleDateString('es-MX', {
        weekday:'long', day:'2-digit', month:'long', year:'numeric',
      });
      const [pdfBusy, setPdfBusy] = useState(false);
      const [pdfProgress, setPdfProgress] = useState('');

      const handlePdf = async () => {
        if (pdfBusy) return;
        setPdfBusy(true);
        try {
          await exportFullDashboardPdf((i, total, name) => {
            setPdfProgress(`${i}/${total} · ${name}`);
          });
        } finally {
          setPdfBusy(false);
          setPdfProgress('');
        }
      };

      return html`
        <header className="px-7 pt-6 pb-5 flex items-end justify-between gap-6">
          <div>
            <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5 capitalize">${today}</div>
            <h1 className="text-[22px] font-medium text-txt leading-none tracking-tight">Resumen ejecutivo</h1>
          </div>
          <div className="flex items-center gap-2">
            <${PostSearch} allPosts=${allPosts} onPick=${onPick}/>
            ${fetchedAt && html`
              <div className="hidden lg:block text-right mr-2">
                <div className="text-[10px] font-mono text-txt4">Actualizado ${timeAgo(fetchedAt)}</div>
                ${autoRefreshMin > 0 && html`<div className="text-[9px] font-mono text-faint">auto cada ${autoRefreshMin}m</div>`}
              </div>
            `}
            <button onClick=${handlePdf} disabled=${pdfBusy}
                    className="h-8 px-3 rounded-lg border border-line bg-onSurface/[0.03] hover:bg-onSurface/[0.06] hover:border-line2 disabled:opacity-50 transition-all flex items-center gap-1.5 text-txt3 hover:text-txt text-[11px] font-mono"
                    title="Exportar dashboard completo como PDF">
              <${DownloadIcon} size=${13} className=${pdfBusy ? 'animate-pulse' : ''} />

                    title="Actualizar ahora">
              <${RefreshIcon} size=${14} className=${refreshing ? 'animate-spin' : ''} />
            </button>
          </div>
        </header>`;

              <div className="flex items-baseline gap-2 mb-3 flex-wrap">
                <span className="text-txt font-medium leading-[0.95] tracking-tightest break-all"
                      style=${{ fontSize: 'clamp(34px, 5vw, 60px)' }}>

                </span>
                <span className="font-serif italic text-txt4 font-light"
                      style=${{ fontSize: 'clamp(18px, 2.2vw, 28px)' }}>

                </span>

                <span className="text-txt2 font-medium">${fmtFull(g.posts)} publicaciones</span> en
                <span className="text-txt2 font-medium"> ${Object.keys(D.by_platform).length} ${Object.keys(D.by_platform).length === 1 ? 'plataforma' : 'plataformas'}</span> generaron

    // ============================================================
    // InsightsPanel — lecturas automáticas del periodo filtrado.
    // Reglas deterministas sobre D (nada de llamadas externas): cada
    // función evalúa una condición y, si es lo bastante notable, agrega
    // una oración corta. Se ordenan por relevancia y se muestran las
    // primeras 4, para no saturar con obviedades.
    // ============================================================
    function computeInsights(D) {
      const insights = [];
      const g = D.global;
      if (!g || !g.posts) return insights;

      // 1) Plataforma líder (solo si hay más de una en el filtro actual
      // y de verdad domina — si no, no aporta nada decirlo)
      {
        const entries = Object.entries(D.by_platform || {});
        if (entries.length > 1 && g.reach > 0) {
          const [name, agg] = [...entries].sort((a, b) => b[1].reach - a[1].reach)[0];
          const share = (agg.reach / g.reach) * 100;
          if (share >= 25) {
            insights.push({
              id: 'platform-leader', tone: 'neutral', priority: share,
              parts: [
                { t: name, strong: true },
                { t: ' lideró el alcance con ' },
                { t: `${share.toFixed(0)}%`, strong: true },
                { t: ' de participación (' },
                { t: `${agg.posts} posts`, strong: true },
                { t: ').' },
              ],
            });
          }
        }
      }

      // 2) Tendencia semana a semana (últimas dos semanas con datos
      // dentro del filtro actual)
      {
        const weekKeys = Object.keys(D.by_week || {}).map(Number).sort((a, b) => a - b);
        if (weekKeys.length >= 2) {
          const currW = weekKeys[weekKeys.length - 1];
          const prevW = weekKeys[weekKeys.length - 2];
          const currReach = D.by_week[currW].reach;
          const prevReach = D.by_week[prevW].reach;
          if (prevReach > 0) {
            const delta = ((currReach - prevReach) / prevReach) * 100;
            if (Math.abs(delta) >= 8) {
              const up = delta > 0;
              insights.push({
                id: 'wow-trend', tone: up ? 'positive' : 'negative', priority: Math.abs(delta) * 0.9,
                parts: [
                  { t: 'El alcance ' },
                  { t: up ? 'subió' : 'bajó', strong: true },
                  { t: ` ${Math.abs(delta).toFixed(0)}%`, strong: true },
                  { t: ` en la semana ${currW} vs. la semana ${prevW}.` },
                ],
              });
            }
          }
        }
      }

      // 3) Mejor formato por ER — se exige un mínimo de posts para no
      // premiar a un formato con 1 publicación afortunada
      {
        const MIN = 3;
        const entries = Object.entries(D.by_format || {}).filter(([, v]) => v.posts >= MIN && v.er_avg > 0);
        if (entries.length >= 2) {
          const [name, agg] = entries.sort((a, b) => b[1].er_avg - a[1].er_avg)[0];
          insights.push({
            id: 'best-format', tone: 'positive', priority: 38,
            parts: [
              { t: name, strong: true },
              { t: ' fue el formato con mejor ER (' },
              { t: erFmt(agg.er_avg), strong: true },
              { t: `) entre los que tuvieron ${MIN}+ posts.` },
            ],
          });
        }
      }

      // 4) Campaña que concentra el alcance
      {
        const MIN = 3;
        const entries = Object.entries(D.by_campaign || {}).filter(([, v]) => v.posts >= MIN);
        if (entries.length >= 2 && g.reach > 0) {
          const [name, agg] = entries.sort((a, b) => b[1].reach - a[1].reach)[0];
          const share = (agg.reach / g.reach) * 100;
          if (share >= 15) {
            insights.push({
              id: 'top-campaign', tone: 'neutral', priority: share * 0.8,
              parts: [
                { t: 'La campaña ' },
                { t: name, strong: true },
                { t: ' concentró ' },
                { t: `${share.toFixed(0)}%`, strong: true },
                { t: ` del alcance total (${fmt(agg.reach)}).` },
              ],
            });
          }
        }
      }

      // 5) Post con mayor alcance del periodo filtrado
      {
        const posts = D.allPosts || [];
        if (posts.length >= 5) {
          const top = [...posts].sort((a, b) => (b.reach || 0) - (a.reach || 0))[0];
          if (top && top.reach) {
            insights.push({
              id: 'top-post', tone: 'positive', priority: 33,
              parts: [
                { t: 'El post con mayor alcance fue ' },
                { t: `${top.format || 'contenido'} de ${top.platform}`, strong: true },
                { t: top.campaign ? ` (${top.campaign})` : '' },
                { t: ' con ' },
                { t: fmt(top.reach), strong: true },
                { t: ' de alcance.' },
              ],
            });
          }
        }
      }

      return insights.sort((a, b) => b.priority - a.priority).slice(0, 4);
    }

    function InsightLine({ insight }) {
      const toneColor = insight.tone === 'positive' ? 'text-success' : insight.tone === 'negative' ? 'text-amber' : 'text-accent';
      const glyph = insight.tone === 'positive' ? '↑' : insight.tone === 'negative' ? '↓' : '•';
      return html`
        <div className="flex items-start gap-2.5 py-2 first:pt-0 last:pb-0 border-b border-line/40 last:border-0">
          <span className=${"font-mono text-[13px] leading-[1.4] mt-0.5 shrink-0 " + toneColor}>${glyph}</span>
          <p className="text-[13px] text-txt3 leading-relaxed">
            ${insight.parts.map((part, i) => part.strong
              ? html`<span key=${i} className="text-txt2 font-medium">${part.t}</span>`
              : html`<span key=${i}>${part.t}</span>`)}
          </p>
        </div>`;
    }

    function InsightsPanel({ D }) {
      const insights = useMemo(() => computeInsights(D), [D]);
      if (!insights.length) return null;
      return html`
        <section className="px-7 pb-5">
          <div className="rounded-xl bg-surface border border-line p-5">
            <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1">Lecturas del periodo</div>
            <div className="text-[10px] font-mono text-faint mb-3">Generadas automáticamente a partir del filtro actual</div>
            <div>
              ${insights.map(ins => html`<${InsightLine} key=${ins.id} insight=${ins} />`)}
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // KpiRow — strip de 6 cards
    // ============================================================
    function KpiCell({ label, value, sub, accent, onClick, delta, deltaLabel }) {
      return html`
        <div onClick=${onClick}
             className=${"rounded-xl bg-surface border border-line px-4 py-3.5 min-w-0 relative group " +
