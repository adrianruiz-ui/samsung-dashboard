    // ============================================================
    // AnomaliesSection — detector de posts atípicos.
    // Método: por cada plataforma con muestra suficiente, calcula la
    // mediana y el MAD (desviación absoluta mediana) de alcance y de ER
    // por post, y marca los que se alejan demasiado del "modified
    // z-score" (Iglewicz & Hoaglin) — más robusto que media/desv. estándar
    // cuando la data tiene posts virales que distorsionarían un promedio
    // normal. Umbral estándar de la literatura: |z| >= 3.5.
    // ============================================================
    const ANOMALY_MIN_GROUP = 6;
    const ANOMALY_Z_THRESHOLD = 3.5;

    function median(arr) {
      if (!arr.length) return 0;
      const s = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(s.length / 2);
      return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    }

    function computeAnomalies(D) {
      const posts = D.allPosts || [];
      const byPlatform = {};
      for (const p of posts) {
        if (!p.platform) continue;
        (byPlatform[p.platform] = byPlatform[p.platform] || []).push(p);
      }

      const found = [];
      for (const group of Object.values(byPlatform)) {
        if (group.length < ANOMALY_MIN_GROUP) continue;

        // --- Alcance ---
        const reaches = group.map(p => p.reach || 0);
        const medR = median(reaches);
        const madR = median(reaches.map(r => Math.abs(r - medR)));
        if (madR > 0) {
          for (const p of group) {
            const z = 0.6745 * ((p.reach || 0) - medR) / madR;
            if (Math.abs(z) >= ANOMALY_Z_THRESHOLD) {
              found.push({ post: p, metric: 'reach', z, direction: z > 0 ? 'up' : 'down', value: p.reach || 0, baseline: medR });
            }
          }
        }

        // --- ER ---
        const ers = group.map(p => p.er).filter(v => v != null && v !== 0);
        if (ers.length >= ANOMALY_MIN_GROUP) {
          const medE = median(ers);
          const madE = median(ers.map(v => Math.abs(v - medE)));
          if (madE > 0) {
            for (const p of group) {
              if (p.er == null || p.er === 0) continue;
              const z = 0.6745 * (p.er - medE) / madE;
              if (Math.abs(z) >= ANOMALY_Z_THRESHOLD) {
                found.push({ post: p, metric: 'er', z, direction: z > 0 ? 'up' : 'down', value: p.er, baseline: medE });
              }
            }
          }
        }
      }

      // Si un mismo post califica por alcance Y por ER, nos quedamos con
      // la métrica de mayor severidad para no listarlo dos veces
      const byPostKey = new Map();
      for (const a of found) {
        const key = a.post.link || `${a.post.platform}|${a.post.date}|${a.post.campaign}|${a.post.format}|${a.post.reach}`;
        const prev = byPostKey.get(key);
        if (!prev || Math.abs(a.z) > Math.abs(prev.z)) byPostKey.set(key, a);
      }

      return [...byPostKey.values()].sort((a, b) => Math.abs(b.z) - Math.abs(a.z)).slice(0, 12);
    }

    function AnomalyRow({ a, onPick }) {
      const p = a.post;
      const color = PLAT_COLORS[p.platform];
      const up = a.direction === 'up';
      const metricLabel = a.metric === 'reach' ? 'Alcance' : 'ER';

    // ============================================================
    // CadenceSection — mapa de calor de cadencia de publicación.
    // Una celda por día del calendario dentro del rango filtrado (estilo
    // "contribuciones" de GitHub): más oscuro = más posts ese día. Los
    // días sin publicar quedan visibles como huecos. Al costado, alcance
    // promedio por día de la semana para ver si conviene publicar en
    // ciertos días.
    // ============================================================
    const WEEKDAY_LABELS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

    function dateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function computeCadence(D) {
      const posts = D.allPosts || [];
      const byDate = new Map();
      for (const p of posts) {
        const d = parseDate(p.date);
        if (!d) continue;
        const key = dateKey(d);
        if (!byDate.has(key)) byDate.set(key, { date: d, posts: 0, reach: 0 });
        const rec = byDate.get(key);
        rec.posts += 1;
        rec.reach += p.reach || 0;
      }
      if (byDate.size === 0) return null;

      const withDates = [...byDate.values()].map(r => r.date);
      const minDate = D.meta?.date_min_scope || withDates.reduce((a, b) => a < b ? a : b);
      const maxDate = D.meta?.date_max_scope || withDates.reduce((a, b) => a > b ? a : b);

      // Alinea el inicio de la cuadrícula al domingo anterior para que
      // las columnas (semanas) queden parejas
      const start = new Date(minDate);
      start.setDate(start.getDate() - start.getDay());
      const end = new Date(maxDate);

      const days = [];
      const cursor = new Date(start);
      while (cursor <= end) {
        const key = dateKey(cursor);
        const rec = byDate.get(key);
        days.push({
          date: new Date(cursor),
          dow: cursor.getDay(),
          posts: rec ? rec.posts : 0,
          reach: rec ? rec.reach : 0,
          inRange: cursor >= minDate && cursor <= maxDate,
        });
        cursor.setDate(cursor.getDate() + 1);
      }

      const weeks = [];
      for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

      const byWeekday = WEEKDAY_LABELS.map((label, dow) => {
        const cells = days.filter(d => d.dow === dow && d.inRange && d.posts > 0);
        const postsCount = cells.reduce((s, d) => s + d.posts, 0);
        const reachSum = cells.reduce((s, d) => s + d.reach, 0);
        return { dow, label, posts: postsCount, avgReachPerPost: postsCount > 0 ? reachSum / postsCount : 0 };
      });

      const maxPostsInDay = Math.max(1, ...days.map(d => d.posts));

      return { weeks, byWeekday, maxPostsInDay };
    }

    function cadenceCellStyle(posts, maxPosts, inRange) {
      if (!inRange) return { visibility: 'hidden' };
      if (posts === 0) return { background: 'rgba(127,127,140,0.10)' };
      const ratio = Math.min(1, posts / maxPosts);
      const alpha = 0.22 + ratio * 0.68;
      return { background: `rgba(76,110,245,${alpha.toFixed(2)})` };
    }

    function CadenceHeatmap({ cadence }) {
      const { weeks, maxPostsInDay } = cadence;
      return html`
        <div className="overflow-x-auto pb-1">
          <div className="inline-flex gap-[3px]">

    // ============================================================
    // v29 — HORARIOS: mejor hora para publicar.
    // La base no registra la hora, pero el ID de la publicación sí la
    // trae en varias plataformas (validado contra la columna Fecha: ~98%
    // coincide al día). TikTok, X y LinkedIn guardan el segundo exacto en
    // los bits altos del ID; Instagram y Threads en el shortcode (ID de
    // Meta con época propia). Facebook y YouTube no se pueden: su ID no
    // contiene la hora. Todo se calcula en el navegador, sin APIs.
    // ============================================================
    const PT_B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    const POSTTIME_PLATS = ['Instagram', 'TikTok', 'X', 'Threads', 'LinkedIn'];
    const _ptCache = new Map();
    function postTimestamp(link) {
      const l = (link || '').trim();
      if (!l) return null;
      if (_ptCache.has(l)) return _ptCache.get(l);
      let ms = null, m;
      try {
        if ((m = l.match(/tiktok\.com\/.*\/(?:video|photo)\/(\d{15,})/i))) ms = Number(BigInt(m[1]) >> 32n) * 1000;
        else if ((m = l.match(/(?:instagram\.com|threads\.(?:com|net))\/(?:[^/]+\/)?(?:p|reel|reels|post|tv)\/([A-Za-z0-9_-]{11})/i))) {
          let n = 0n; for (const ch of m[1]) n = n * 64n + BigInt(PT_B64.indexOf(ch));
          ms = Number(n >> 23n) + 1314220021721;
        }
        else if ((m = l.match(/(?:x|twitter)\.com\/[^/]+\/status\/(\d+)/i))) ms = Number(BigInt(m[1]) >> 22n) + 1288834974657;
        else if ((m = l.match(/(?:activity|share|ugcPost)[:-](\d{19})/i))) ms = Number(BigInt(m[1]) >> 22n);
      } catch { ms = null; }
      if (ms != null) { const y = new Date(ms).getUTCFullYear(); if (y < 2020 || y > 2030) ms = null; }
      _ptCache.set(l, ms);
      return ms;
    }
    const _mxFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Mexico_City', hour: 'numeric', hourCycle: 'h23', weekday: 'short' });
    const WD_IDX = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    const WD_ES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    function mxDayHour(ms) {
      const parts = _mxFmt.formatToParts(new Date(ms));
      const h = +parts.find(p => p.type === 'hour').value % 24;
      const d = WD_IDX[parts.find(p => p.type === 'weekday').value];
      return { d, h };
    }
    const HOUR_BANDS = [[6, 9], [9, 12], [12, 14], [14, 16], [16, 18], [18, 20], [20, 22], [22, 30]];
    const bandOf = (h) => { const hh = h < 6 ? h + 24 : h; return HOUR_BANDS.findIndex(([a, b]) => hh >= a && hh < b); };
    const bandLabel = (i) => { const [a, b] = HOUR_BANDS[i]; return `${a}–${b > 24 ? (b - 24) : b} h`; };
    const HORA_METRICS = [
      { k: 'ber',   l: 'ER básico',      f: (p) => (p.basic_er != null && !(p._flags || []).includes('er')) ? p.basic_er : null, fmtv: (v) => erFmt(v) },
      { k: 'reach', l: 'Alcance',        f: (p) => p.reach || null, fmtv: (v) => fmtFull(v) },
      { k: 'inter', l: 'Interacciones',  f: (p) => p.interactions || null, fmtv: (v) => fmtFull(v) },
    ];
    const HORA_MIN_N = 4;      // mínimo para pintar una celda
    const HORA_TOP_N = 8;      // mínimo para recomendar una franja
    const hMedian = (arr) => { if (!arr.length) return null; const a = [...arr].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };

    function computeHorarios(posts, metricK, plat, scope) {
      const M = HORA_METRICS.find(m => m.k === metricK) || HORA_METRICS[0];
      const eligible = posts.filter(p => POSTTIME_PLATS.includes(p.platform));
      const rows = [];
      for (const p of eligible) {
        if (plat !== 'all' && p.platform !== plat) continue;
        const paid = isPaidP(p);
        if (scope === 'org' && paid) continue;
        if (scope === 'paid' && !paid) continue;
        const v = M.f(p); if (v == null || !(v > 0)) continue;
        const ms = postTimestamp(p.link); if (ms == null) continue;
        rows.push({ p, v, ...mxDayHour(ms) });
      }
      // Índice vs. lo típico de su plataforma + formato (1.00 = típico)
      const segVals = new Map();
      for (const r of rows) { const k = r.p.platform + '|' + (r.p.format || ''); if (!segVals.has(k)) segVals.set(k, []); segVals.get(k).push(r.v); }
      const segMed = new Map([...segVals].map(([k, a]) => [k, hMedian(a)]));
      for (const r of rows) { const md = segMed.get(r.p.platform + '|' + (r.p.format || '')); r.idx = md ? r.v / md : null; r.b = bandOf(r.h); }
      const valid = rows.filter(r => r.idx != null && r.b >= 0);
      const cell = (list) => ({ n: list.length, idx: list.length ? hMedian(list.map(r => r.idx)) : null, val: list.length ? hMedian(list.map(r => r.v)) : null });
      const grid = WD_ES.map((_, d) => HOUR_BANDS.map((__, b) => cell(valid.filter(r => r.d === d && r.b === b))));
      const byBand = HOUR_BANDS.map((_, b) => cell(valid.filter(r => r.b === b)));
      const byDay = WD_ES.map((_, d) => cell(valid.filter(r => r.d === d)));
      const byHour = Array.from({ length: 24 }, (_, h) => valid.filter(r => r.h === h).length);
      const top = [];
      grid.forEach((row, d) => row.forEach((c, b) => { if (c.n >= HORA_TOP_N) top.push({ d, b, ...c }); }));
      top.sort((a, b) => b.idx - a.idx);
      const perPlat = POSTTIME_PLATS.map(pl => {
        const list = valid.filter(r => r.p.platform === pl);
        const bands = HOUR_BANDS.map((_, b) => ({ b, ...cell(list.filter(r => r.b === b)) })).filter(x => x.n >= HORA_TOP_N);
        bands.sort((a, b) => b.idx - a.idx);
        const busiest = HOUR_BANDS.map((_, b) => ({ b, n: list.filter(r => r.b === b).length })).sort((a, b) => b.n - a.n)[0];
        return { platform: pl, n: list.length, best: bands[0] || null, worst: bands.length > 1 ? bands[bands.length - 1] : null, busiest };
      }).filter(x => x.n > 0);
      const totalEligible = posts.filter(p => POSTTIME_PLATS.includes(p.platform)).length;
      const excluded = posts.filter(p => !POSTTIME_PLATS.includes(p.platform)).length;
      return { M, n: valid.length, grid, byBand, byDay, byHour, top: top.slice(0, 3), perPlat, totalEligible, excluded,
               decoded: posts.filter(p => POSTTIME_PLATS.includes(p.platform) && postTimestamp(p.link) != null).length };
    }

    function HorariosSection({ D }) {

      const seg = (opts, cur, set, label) => html`

        </div>`;
      const maxHour = Math.max(1, ...H.byHour);

      return html`
        <section id="sec-horarios" className="px-4 md:px-7 py-7 relative group">

          <div className="mb-5">

              Facebook y YouTube no se incluyen: su link no contiene la hora.

          <div className="flex flex-wrap items-center gap-2 mb-4">
            ${seg(HORA_METRICS.map(m => [m.k, m.l]), metric, setMetric, 'Métrica')}
            ${seg([['org', 'Orgánico'], ['paid', 'Pauta'], ['all', 'Todos']], scope, setScope, 'Pauta')}
            ${seg([['all', 'Todas'], ...POSTTIME_PLATS.map(p => [p, p])], plat, setPlat, 'Plataforma')}
          </div>

          ${H.n < 12 ? html`
            <div className="rounded-xl bg-surface p-8 text-center text-txt3 text-[13px]">
              Muy pocos posts con hora en este filtro (${H.n}). Amplía el periodo o cambia Orgánico/Pauta.
            </div>` : html`
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
            <div className="lg:col-span-8 rounded-xl bg-surface p-5 overflow-x-auto">
              <div className="text-[13px] font-medium text-txt mb-1">${H.M.l} por día y hora</div>
              <div className="text-[11px] text-txt4 mb-4">Verde: rinde arriba de lo típico · ámbar: abajo · gris: menos de ${HORA_MIN_N} posts (sin lectura) · el número es cuántos posts hay en la franja</div>
              <table className="no-zebra w-full min-w-[560px] border-separate" style=${{ borderSpacing: 4 }}>
                <thead>

                    <th></th>

                  </tr>
                </thead>
                <tbody>
                  ${H.grid.map((row, d) => html`
                    <tr key=${d} style=${{ background: 'transparent' }}>
                      <th scope="row" className="text-[11px] font-normal text-txt3 text-left pr-2">${WD_ES[d]}</th>
                      ${row.map((c, b) => html`
                        <td key=${b} className="rounded-md text-center align-middle h-10"
                            style=${heat(c)}
                            title=${c.n ? `${WD_ES[d]} ${bandLabel(b)} · ${c.n} posts · mediana ${H.M.fmtv(c.val)} · ${idxTxt(c.idx)} vs. típico` : `${WD_ES[d]} ${bandLabel(b)} · sin posts`}>
                          ${c.n >= HORA_MIN_N
                            ? html`<div className="text-[11px] font-medium text-txt tabular-nums leading-tight">${idxTxt(c.idx)}</div><div className="text-[9px] font-mono text-txt3">${c.n}</div>`
                            : c.n ? html`<div className="text-[9px] font-mono text-faint">${c.n}</div>` : ''}
                        </td>`)}
                    </tr>`)}
                </tbody>
              </table>

            <div className="lg:col-span-4 flex flex-col gap-3">

                  : H.top.map((t, i) => html`

                      <div className="text-right">
                        <div className="text-[13px] text-success tabular-nums">${idxTxt(t.idx)}</div>
                        <div className="text-[10px] font-mono text-txt4">${t.n} posts</div>
                      </div>
                    </div>`)}
              </div>
              <div className="rounded-xl bg-surface p-5">
                <div className="text-[13px] font-medium text-txt">Mejor franja por plataforma</div>
                <div className="text-[11px] text-txt4 mb-3">Franjas con ${HORA_TOP_N}+ posts</div>
                ${H.perPlat.map(pp => html`
                  <div key=${pp.platform} className="py-1.5">
                    <div className="flex items-center justify-between gap-2">
                      <span className="inline-flex items-center gap-2 text-[12px] text-txt2">
                        <span className="font-mono text-[9px] font-semibold text-white px-1.5 py-0.5 rounded" style=${{ background: PLAT_COLORS[pp.platform] }}>${PLAT_LETTERS[pp.platform]}</span>
                        ${pp.platform}
                      </span>
                      <span className="text-[12px] tabular-nums ${''}">
                        ${pp.best ? html`<span className="text-txt">${bandLabel(pp.best.b)}</span> <span className="text-success">${idxTxt(pp.best.idx)}</span>` : html`<span className="text-txt4">sin muestra suficiente</span>`}
                      </span>
                    </div>
                    <div className="text-[10px] font-mono text-txt4 mt-0.5 pl-8">
                      ${pp.n} posts · donde más publican: ${pp.busiest && pp.busiest.n ? bandLabel(pp.busiest.b) : '—'}${pp.worst ? ` · más bajo: ${bandLabel(pp.worst.b)} ${idxTxt(pp.worst.idx)}` : ''}
                    </div>

            <div className="lg:col-span-12 rounded-xl bg-surface p-5">
              <div className="flex flex-wrap items-baseline justify-between gap-2 mb-3">

                <div className="text-[11px] text-txt4">${H.n} posts con hora · ${H.decoded} de ${H.totalEligible} links de estas plataformas leídos${H.excluded ? ` · ${H.excluded} de Facebook/YouTube fuera` : ''}</div>

                    <div className="w-full rounded-t" style=${{ height: `${(n / maxHour) * 100}%`, minHeight: n ? 2 : 0, background: '#4C6EF5', opacity: 0.75 }}></div>

    // ============================================================
    // SimuladorSection — calculadora de metas al revés: en vez de
    // "hice X posts, obtuve Y", parte de la meta que pide el cliente y
    // calcula cuántos posts de cada plataforma/formato hacen falta,
    // usando el promedio histórico por post como base. Se ancla SIEMPRE
    // al histórico completo de 2026 (a propósito, para que la base de
    // comparación no cambie con los filtros del resto del dashboard) y
    // se puede acotar por Tipo de contenido (Local/Regional/Global) y
    // Pauta (Orgánico/Paid).
    // ============================================================
    const SIM_MIN_SAMPLE = 3;
    const SIM_METRICS = [
      { key: 'reach', label: 'Alcance',        avgKey: 'avgReach' },
      { key: 'inter', label: 'Interacciones',  avgKey: 'avgInter' },
      { key: 'views', label: 'Reproducciones', avgKey: 'avgViews' },
      { key: 'clics', label: 'Clics',          avgKey: 'avgClics' },
    ];

    function computeSimGroups(posts2026, contentTypeScope, strategyScope) {
      const scoped = posts2026.filter(p => {
        if (contentTypeScope !== 'all' && p.content_type !== contentTypeScope) return false;
        if (strategyScope !== 'all' && p.strategy !== strategyScope) return false;
        return true;
      });
      const map = new Map();
      for (const p of scoped) {
        if (!p.platform || !p.format) continue;
        const key = p.platform + '|' + p.format;
        if (!map.has(key)) map.set(key, { platform: p.platform, format: p.format, n: 0, reach: 0, inter: 0, views: 0, clics: 0 });
        const g = map.get(key);
        g.n++;
        g.reach += p.reach || 0;
        g.inter += p.interactions || 0;
        g.views += p.views || 0;
        g.clics += p.clics || 0;
      }
      return [...map.values()].map(g => ({
        ...g,
        avgReach: g.n ? g.reach / g.n : 0,
        avgInter: g.n ? g.inter / g.n : 0,
        avgViews: g.n ? g.views / g.n : 0,
        avgClics: g.n ? g.clics / g.n : 0,
      }));
    }

    function SimScopeToggle({ label, options, value, onChange }) {
      return html`
        <div>
          <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">${label}</div>

              className=${"px-3 py-1.5 text-[11px] transition-colors " + (value === 'all' ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
              Todos
            </button>
            ${options.map(o => html`
              <button key=${o} onClick=${() => onChange(o)}
                className=${"px-3 py-1.5 text-[11px] border-l border-line transition-colors " + (value === o ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                ${o}
              </button>
            `)}
          </div>
        </div>`;
    }

    function SimuladorSection({ allPosts }) {
      const posts2026 = useMemo(() => (allPosts || []).filter(p => p.year === 2026), [allPosts]);

      const contentTypeOptions = useMemo(() =>
        [...new Set(posts2026.map(p => p.content_type).filter(Boolean))].sort(), [posts2026]);
      const strategyOptions = useMemo(() =>
        [...new Set(posts2026.map(p => p.strategy).filter(Boolean))].sort(), [posts2026]);

      const [contentTypeScope, setContentTypeScope] = useState('all');
      const [strategyScope, setStrategyScope] = useState('all');
      const [goalMetric, setGoalMetric] = useState('reach');
      const [goalTarget, setGoalTarget] = useState('');
      const [allocations, setAllocations] = useState({});

      // Si cambia el universo (tipo de contenido / pauta), las filas ya
      // no son las mismas — se resetea lo planeado para no dejar
      // números "fantasma" de una combinación que ya no aplica.
      useEffect(() => { setAllocations({}); }, [contentTypeScope, strategyScope]);

      const groups = useMemo(
        () => computeSimGroups(posts2026, contentTypeScope, strategyScope),
        [posts2026, contentTypeScope, strategyScope]
      );

      const metricCfg = SIM_METRICS.find(m => m.key === goalMetric);
      const sortedGroups = useMemo(
        () => [...groups].sort((a, b) => b[metricCfg.avgKey] - a[metricCfg.avgKey]),
        [groups, metricCfg]
      );

      const totalHistPosts = groups.reduce((s, g) => s + g.n, 0);

      const setAlloc = (key, val) => {
        const n = val === '' ? '' : Math.max(0, Math.round(Number(val) || 0));
        setAllocations(prev => ({ ...prev, [key]: n }));
      };

      const target = Number(goalTarget) || 0;
      const totalProjected = sortedGroups.reduce((s, g) => {
        const key = g.platform + '|' + g.format;
        const n = Number(allocations[key]) || 0;
        return s + n * g[metricCfg.avgKey];
      }, 0);
      const progressPct = target > 0 ? Math.min(100, (totalProjected / target) * 100) : 0;
      const delta = target - totalProjected;

      const autocompletar = () => {
        if (target <= 0 || totalHistPosts === 0) return;
        const next = {};
        for (const g of sortedGroups) {
          const key = g.platform + '|' + g.format;
          const share = g.n / totalHistPosts;
          const goalForGroup = target * share;
          const avg = g[metricCfg.avgKey];
          next[key] = avg > 0 ? Math.ceil(goalForGroup / avg) : 0;
        }
        setAllocations(next);
      };

      return html`
        <section id="sec-simulador" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-simulador" name="Simulador" />
          <div className="mb-5">
            <h2 className="text-[18px] font-medium text-txt">Simulador de metas</h2>
            <p className="text-txt4 text-[12px] mt-1">
              Parte de la meta que te piden y calcula cuántos posts de cada plataforma/formato hacen falta, usando el promedio histórico por post.
              Basado siempre en el histórico completo de 2026 (${fmtFull(totalHistPosts)} posts en el alcance elegido), sin importar los filtros de arriba.
            </p>
          </div>

          <div className="rounded-xl bg-surface border border-line p-5 mb-4">
            <div className="flex flex-wrap gap-6 mb-5">
              <${SimScopeToggle} label="Tipo de contenido" options=${contentTypeOptions} value=${contentTypeScope} onChange=${setContentTypeScope} />
              <${SimScopeToggle} label="Pauta" options=${strategyOptions} value=${strategyScope} onChange=${setStrategyScope} />
            </div>

            <div className="flex flex-wrap items-end gap-4">
              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Métrica meta</div>
                <div className="inline-flex rounded-lg border border-line bg-onSurface/[0.02] overflow-hidden">
                  ${SIM_METRICS.map((m, i) => html`
                    <button key=${m.key} onClick=${() => setGoalMetric(m.key)}
                      className=${"px-3 py-1.5 text-[11px] transition-colors " + (i > 0 ? "border-l border-line " : "") + (goalMetric === m.key ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                      ${m.label}
                    </button>
                  `)}
                </div>
              </div>
              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Meta</div>
                <input type="number" min="0" value=${goalTarget}
                       onChange=${(e) => setGoalTarget(e.target.value)}
                       placeholder="Ej. 5000000"
                       className="h-[34px] w-[160px] px-3 rounded-lg border border-line bg-onSurface/[0.03] text-[12px] text-txt tabular-nums placeholder:text-txt4 focus:outline-none focus:border-line2" />
              </div>
              <button onClick=${autocompletar} disabled=${target <= 0}
                      className="h-[34px] px-3.5 rounded-lg border border-accent2/30 text-accent text-[11px] hover:text-white hover:bg-accent2 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-accent transition-colors">
                Autocompletar
              </button>
            </div>
          </div>

          ${sortedGroups.length === 0 ? html`
            <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
              <div className="text-txt3 text-[13px]">Sin posts en 2026 para esta combinación de Tipo de contenido / Pauta.</div>
            </div>
          ` : html`
            <div className="rounded-xl bg-surface border border-line overflow-x-auto mb-4">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-line text-[10px] font-mono uppercase tracking-[0.15em] text-txt4">
                    <th className="text-left py-2.5 px-4 font-medium">Plat.</th>
                    <th className="text-left py-2.5 px-4 font-medium">Formato</th>
                    <th className="text-right py-2.5 px-4 font-medium">Posts hist. 2026</th>
                    <th className="text-right py-2.5 px-4 font-medium">Prom. ${metricCfg.label}/post</th>
                    <th className="text-right py-2.5 px-4 font-medium">Posts a planear</th>
                    <th className="text-right py-2.5 pl-2 pr-4 font-medium">Subtotal</th>
                  </tr>
                </thead>
                <tbody>
                  ${sortedGroups.map(g => {
                    const key = g.platform + '|' + g.format;
                    const n = allocations[key] ?? '';
                    const subtotal = (Number(n) || 0) * g[metricCfg.avgKey];
                    const lowSample = g.n < SIM_MIN_SAMPLE;
                    return html`
                      <tr key=${key} className="border-b border-line/50 last:border-0">
                        <td className="py-2.5 px-4">
                          <span className="font-mono text-[10px] font-semibold text-white px-1.5 py-0.5 rounded" style=${{ background: PLAT_COLORS[g.platform] }}>${PLAT_LETTERS[g.platform]}</span>
                        </td>
                        <td className="py-2.5 px-4 text-[12px] text-txt2">${g.format}</td>
                        <td className="py-2.5 px-4 text-right font-mono tabular-nums text-[11px]">
                          <span className=${lowSample ? "text-amber" : "text-txt4"} title=${lowSample ? `Muestra baja (menos de ${SIM_MIN_SAMPLE} posts) — promedio poco confiable` : ''}>${g.n}${lowSample ? ' ⚠' : ''}</span>
                        </td>
                        <td className="py-2.5 px-4 text-right font-mono tabular-nums text-[12px] text-txt">${fmt(g[metricCfg.avgKey])}</td>
                        <td className="py-2.5 px-4 text-right">
                          <input type="number" min="0" value=${n}
                                 onChange=${(e) => setAlloc(key, e.target.value)}
                                 placeholder="0"
                                 className="h-[30px] w-[80px] px-2 rounded-md border border-line bg-onSurface/[0.03] text-[12px] text-txt text-right tabular-nums placeholder:text-txt4 focus:outline-none focus:border-line2" />
                        </td>
                        <td className="py-2.5 pl-2 pr-4 text-right font-mono tabular-nums text-[12px] text-txt2">${fmt(subtotal)}</td>
                      </tr>`;
                  })}
                </tbody>
              </table>
            </div>

            <div className="rounded-xl bg-surface border border-line p-5">
              <div className="flex flex-wrap items-baseline justify-between gap-3 mb-3">
                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4">Proyectado vs. meta (${metricCfg.label})</div>
                <div className="text-[13px] font-mono tabular-nums">
                  <span className="text-txt">${fmt(totalProjected)}</span>
                  <span className="text-faint"> / ${target > 0 ? fmt(target) : '—'}</span>
                </div>
              </div>
              <div className="h-2 rounded-full bg-onSurface/[0.06] overflow-hidden">
                <div className=${"h-full rounded-full transition-all " + (delta <= 0 && target > 0 ? "bg-success" : "bg-accent2")}
                     style=${{ width: `${progressPct}%` }}></div>
              </div>
              ${target > 0 && html`
                <div className=${"text-[11px] font-mono mt-2 " + (delta <= 0 ? "text-success" : "text-txt3")}>
                  ${delta <= 0 ? `Meta cubierta — ${fmt(Math.abs(delta))} de sobra` : `Te faltan ${fmt(delta)} para llegar a la meta`}
                </div>
              `}
            </div>
          `}
        </section>`;
    }

            </svg>
          </div>`;
      }
      return html`
        <img src=${src} crossOrigin="anonymous" loading="lazy" referrerPolicy="no-referrer"

    function DrawerThumb({ post }) {

      const src = thumbFor(post);

      // vive en Calidad de datos, que es de uso interno).
      if (!src || err) return null;
      return html`
        <div className="px-5 pt-5">
          <img src=${src} crossOrigin="anonymous" referrerPolicy="no-referrer" onError=${() => setErr(true)}
               alt=${`Miniatura del post: ${post.format || 'post'} de ${post.platform}${post.campaign ? ' · ' + post.campaign : ''}`}
               className="w-full max-h-[260px] object-contain rounded-xl bg-onSurface/[0.04] border border-line" />
        </div>`;
    }

    function deltaTone(d) {
      if (d == null) return 'text-txt4';
      if (d >= 10) return 'text-success';
      if (d <= -10) return 'text-amber';
      return 'text-txt3';
    }
    function deltaTxt(d) {
      if (d == null) return '—';
      // ≥ +100% se lee mejor como múltiplo (p. ej. +3,417% → 35.2×)
      if (d >= 100) return `${(1 + d / 100).toFixed(1)}×`;
      const s = d > 0 ? '+' : d < 0 ? '−' : '±';
      return `${s}${Math.abs(d).toFixed(0)}%`;
    }

    function BenchPill({ b }) {
      if (!b) return html`<span className="text-faint text-[11px]">—</span>`;
      if (!b.enough) return html`<span className="text-faint text-[10px] font-mono" title=${`Segmento ${b.label}: n=${b.n}, muestra insuficiente (mín. ${BENCH_MIN_N})`}>${'n<' + BENCH_MIN_N}</span>`;
      const d = b.d_basic_er;
      return html`
        <span className=${"font-mono tabular-nums text-[12px] " + deltaTone(d)}
              title=${`ER básico vs. segmento ${b.label} (n=${b.n}): ${b.basic_er != null ? erFmt(b.basic_er) : '—'}`}
              aria-label=${d == null ? 'Sin comparación' : `${deltaTxt(d)} contra el ER básico de su segmento`}>
          ${deltaTxt(d)}
        </span>`;
    }

    function BenchRow({ label, post, bench, d, fmtFn }) {
      return html`
        <div className="grid grid-cols-[1fr_auto_auto_auto] items-baseline gap-3 py-2 text-[12px]">
          <span className="text-txt3">${label}</span>
          <span className="font-mono tabular-nums text-txt">${post}</span>
          <span className="font-mono tabular-nums text-txt4 text-[11px]">vs ${bench}</span>
          <span className=${"font-mono tabular-nums text-[12px] w-14 text-right " + deltaTone(d)}>${deltaTxt(d)}</span>
        </div>`;
    }

    function BenchBlock({ post, b }) {
      if (!b) return null;
      return html`
        <div className="mb-1">
          <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2 mt-1">Vs. su segmento</div>
          <div className="rounded-xl bg-surface border border-line px-3.5 py-2.5">
            <div className="text-[11px] text-txt2 mb-1">${b.label}</div>
            <div className="text-[10px] font-mono text-txt4 mb-1.5">
              ${b.enough ? `Benchmark histórico ponderado · ${b.n} posts comparables` : `Solo ${b.n} post${b.n === 1 ? '' : 's'} comparable${b.n === 1 ? '' : 's'} — se necesitan ${BENCH_MIN_N} para comparar`}
            </div>
            ${b.enough && html`
              <${Fragment}>
                <${BenchRow} label="ER básico" post=${erFmt(post.basic_er)} bench=${b.basic_er != null ? erFmt(b.basic_er) : '—'} d=${b.d_basic_er} />
                <${BenchRow} label="ER views" post=${erFmt(post.er)} bench=${b.er != null ? erFmt(b.er) : '—'} d=${b.d_er} />
                <${BenchRow} label="Alcance (vs. mediana)" post=${fmt(post.reach)} bench=${fmt(b.reachMed)} d=${b.d_reach} />
              <//>
            `}
          </div>
        </div>`;

    // ============================================================
    // ExportModal — reportes "bomberazo" para la clienta: elige un
    // resumen agrupado (dimensión + métricas) o el listado de posts
    // individuales (columnas a elegir), usando los filtros ya activos
    // en el dashboard, y lo manda a un Apps Script que arma una hoja
    // nueva en un Google Sheets maestro.
    // ============================================================
    function ExportModal({ open, onClose, D, filters }) {
      const [mode, setMode] = useState('summary'); // 'summary' | 'raw'
      const [groupBy, setGroupBy] = useState('platform');
      const [selectedMetrics, setSelectedMetrics] = useState(DEFAULT_REPORT_METRICS);
      const [selectedColumns, setSelectedColumns] = useState(DEFAULT_RAW_COLUMNS);
      const [title, setTitle] = useState('');
      const [titleTouched, setTitleTouched] = useState(false);
      const [status, setStatus] = useState('idle'); // idle | loading | success | error
      const [errorMsg, setErrorMsg] = useState(null);
      const [dateFrom, setDateFrom] = useState('');   // 'YYYY-MM-DD' o ''
      const [dateTo, setDateTo] = useState('');
      const [splitBy, setSplitBy] = useState('none'); // none | year | month | week

      const dimLabel = REPORT_DIMENSIONS.find((d) => d.key === groupBy)?.label || groupBy;

      // Si cambian los parámetros del reporte, borra un resultado/error
      // viejo para que no se quede pegado un "listo" que ya no aplica.
      useEffect(() => {
        setStatus('idle'); setErrorMsg(null);
      }, [mode, groupBy, selectedMetrics, selectedColumns, dateFrom, dateTo, splitBy]);

      // Sugiere un título automáticamente mientras el usuario no lo edite.
      useEffect(() => {
        if (!titleTouched) setTitle(suggestedReportTitle(filters, mode, dimLabel));
      }, [filters, mode, dimLabel, titleTouched]);

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [open, onClose]);

      if (!open) return null;

      const toggleMetric = (key) => {
        setSelectedMetrics((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]);
      };
      const toggleColumn = (key) => {
        setSelectedColumns((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]);
      };

      // Posts dentro del alcance de los filtros del dashboard + el rango
      // de fechas propio del reporte (si lo hay).
      const scopedPosts = (() => {
        let list = D.allPosts || [];
        if (dateFrom || dateTo) {
          const f = dateFrom ? new Date(dateFrom + 'T00:00:00') : null;
          const t = dateTo ? new Date(dateTo + 'T23:59:59') : null;
          list = list.filter((p) => {
            const d = parseDate(p.date);
            if (!d) return false;
            return (!f || d >= f) && (!t || d <= t);
          });
        }
        return list;
      })();
      const postsInScope = scopedPosts.length;

      // Clave/etiqueta del periodo al que pertenece un post según "Dividir por".
      const periodOf = (p) => {
        const y = postYear(p);
        if (!y) return null;
        if (splitBy === 'year') return { k: y, l: String(y) };
        if (splitBy === 'month') {
          const m = postMonth(p);
          return m ? { k: y * 100 + m, l: `${MONTH_NAMES[m - 1]} ${y}` } : null;
        }
        if (splitBy === 'week') {
          return p.week != null ? { k: y * 100 + p.week, l: `S${String(p.week).padStart(2, '0')} ${y}` } : null;
        }
        return null;
      };

      const handleGenerate = () => {
        setStatus('loading'); setErrorMsg(null);
        try {
          const metrics = REPORT_METRICS.filter((m) => selectedMetrics.includes(m.key));
          const cols = RAW_COLUMNS.filter((c) => selectedColumns.includes(c.key));
          if (mode === 'summary' && metrics.length === 0) throw new Error('Elige al menos una métrica.');
          if (mode === 'raw' && cols.length === 0) throw new Error('Elige al menos una columna.');

          const buildData = (posts) => {
            if (mode === 'summary') {
              const sub = { ...computeAggregates(posts, D.meta), allPosts: posts };
              return {
                headers: [dimLabel, ...metrics.map((m) => m.label)],
                rows: groupedReportRows(sub, groupBy).map(({ label, agg }) => [label, ...metrics.map((m) => m.fmt(agg[m.key] ?? 0))]),
              };
            }
            return { headers: cols.map((c) => c.label), rows: posts.map((p) => cols.map((c) => c.get(p))) };
          };

          if (scopedPosts.length === 0) throw new Error('No hay datos para los filtros/rango seleccionados.');
          if (typeof XLSX === 'undefined') throw new Error('No se pudo cargar la librería de Excel (revisa tu conexión y recarga la página).');

          // Hojas a generar: una sola, o una "Total" + una por periodo.
          const sheets = [];
          if (splitBy === 'none') {
            sheets.push({ name: title || 'Reporte', posts: scopedPosts });
          } else {
            sheets.push({ name: 'Total', posts: scopedPosts });
            const buckets = new Map();
            for (const p of scopedPosts) {
              const per = periodOf(p);
              if (!per) continue;
              if (!buckets.has(per.k)) buckets.set(per.k, { l: per.l, posts: [] });
              buckets.get(per.k).posts.push(p);
            }
            [...buckets.entries()].sort((a, b) => a[0] - b[0])
              .forEach(([, b]) => sheets.push({ name: b.l, posts: b.posts }));
          }

          // Arma el workbook 100% en el navegador — no sale ningún dato
          // a ningún servidor externo.
          const wb = XLSX.utils.book_new();
          const usedNames = new Set();
          for (const sh of sheets) {
            const { headers, rows } = buildData(sh.posts);
            if (rows.length === 0) continue;
            const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
            ws['!cols'] = headers.map((h, i) => {
              const maxLen = Math.max(
                String(h ?? '').length,
                ...rows.slice(0, 500).map((r) => String(r[i] ?? '').length)
              );
              return { wch: Math.min(Math.max(maxLen + 2, 10), 40) };
            });
            let name = sanitizeSheetTabName(sh.name);
            let n = 2;
            while (usedNames.has(name.toLowerCase())) name = sanitizeSheetTabName(sh.name).substring(0, 28) + ' ' + (n++);
            usedNames.add(name.toLowerCase());
            XLSX.utils.book_append_sheet(wb, ws, name);
          }
          if (wb.SheetNames.length === 0) throw new Error('No hay datos para los filtros/selección actuales.');
          XLSX.writeFile(wb, `${sanitizeFileName(title || 'Reporte')}.xlsx`);

          setStatus('success');
        } catch (err) {
          setErrorMsg(String(err.message || err));
          setStatus('error');
        }
      };

      return html`
        <${Fragment}>
          <div className="fixed inset-0 z-40 fade-in" style=${{ background: 'rgba(0,0,0,0.6)' }} onClick=${onClose}/>
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick=${onClose}>
            <div role="dialog" aria-modal="true" aria-label="Exportar reporte"
                 className="w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-2xl bg-surface border border-line2 fade-in"
                 style=${{ boxShadow: '0 20px 60px rgba(0,0,0,0.5)' }}
                 onClick=${(e) => e.stopPropagation()}>

              <div className="flex items-center justify-between px-5 py-4 border-b border-line sticky top-0 bg-surface z-10">
                <div className="flex items-center gap-2.5">
                  <${SheetIcon} size=${16} className="text-accent"/>
                  <span className="text-[14px] text-txt font-medium">Exportar reporte</span>
                </div>
                <button aria-label="Cerrar" onClick=${onClose}
                        className="w-7 h-7 rounded-md hover:bg-onSurface/[0.06] flex items-center justify-center text-txt3 hover:text-txt transition-colors">
                  <${XIcon} size=${15}/>
                </button>
              </div>

              <div className="px-5 py-5">
                <div className="text-[11px] text-txt3 leading-relaxed mb-4">
                  Usa los filtros que ya tienes activos arriba
                  (<span className="text-txt2 font-medium">${fmtFull(postsInScope)} posts</span> en el rango actual)
                  y elige qué descargar en un Excel (.xlsx) — se abre directo en Excel o se importa a Google Sheets con "Archivo → Importar".
                </div>

                <div className="flex rounded-lg border border-line overflow-hidden mb-4">
                  <button onClick=${() => setMode('summary')}
                          className=${"flex-1 px-3 py-2 text-[12px] transition-colors " +
                            (mode === 'summary' ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                    Resumen agrupado
                  </button>
                  <button onClick=${() => setMode('raw')}
                          className=${"flex-1 px-3 py-2 text-[12px] border-l border-line transition-colors " +
                            (mode === 'raw' ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                    Posts individuales
                  </button>
                </div>

                ${mode === 'summary' ? html`
                  <div className="mb-4">
                    <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Agrupar por</div>
                    <div className="flex flex-wrap gap-1.5">
                      ${REPORT_DIMENSIONS.map((d) => html`
                        <button key=${d.key} onClick=${() => setGroupBy(d.key)}
                                className=${"px-2.5 py-1 rounded-full border text-[11px] transition-colors " +
                                  (groupBy === d.key ? "border-accent2/40 bg-accent2/12 text-txt" : "border-line text-txt3 hover:text-txt2 hover:border-line2")}>
                          ${d.label}
                        </button>`)}
                    </div>
                  </div>

                  <div className="mb-5">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-txt4">Métricas</div>
                      <div className="flex gap-2 text-[10px] font-mono uppercase tracking-wider">
                        <button onClick=${() => setSelectedMetrics(REPORT_METRICS.map((m) => m.key))} className="text-txt4 hover:text-txt">Todas</button>
                        <button onClick=${() => setSelectedMetrics([])} className="text-txt4 hover:text-txt">Limpiar</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 max-h-[180px] overflow-y-auto pr-1">
                      ${REPORT_METRICS.map((m) => {
                        const isOn = selectedMetrics.includes(m.key);
                        return html`
                          <button key=${m.key} onClick=${() => toggleMetric(m.key)}
                                  className="flex items-center gap-2 text-left text-[11px] px-2 py-1.5 rounded-md hover:bg-onSurface/[0.04] transition-colors">
                            <span className=${"w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 " +
                              (isOn ? "bg-accent border-accent" : "border-line2 bg-onSurface/[0.03]")}>
                              ${isOn && html`<${CheckIcon} size=${9} className="text-ink"/>`}
                            </span>
                            <span className="text-txt2 truncate" title=${m.label}>${m.label}</span>
                          </button>`;
                      })}
                    </div>
                  </div>
                ` : html`
                  <div className="mb-5">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-txt4">Columnas</div>
                      <div className="flex gap-2 text-[10px] font-mono uppercase tracking-wider">
                        <button onClick=${() => setSelectedColumns(RAW_COLUMNS.map((c) => c.key))} className="text-txt4 hover:text-txt">Todas</button>
                        <button onClick=${() => setSelectedColumns([])} className="text-txt4 hover:text-txt">Limpiar</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 max-h-[220px] overflow-y-auto pr-1">
                      ${RAW_COLUMNS.map((c) => {
                        const isOn = selectedColumns.includes(c.key);
                        return html`
                          <button key=${c.key} onClick=${() => toggleColumn(c.key)}
                                  className="flex items-center gap-2 text-left text-[11px] px-2 py-1.5 rounded-md hover:bg-onSurface/[0.04] transition-colors">
                            <span className=${"w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 " +
                              (isOn ? "bg-accent border-accent" : "border-line2 bg-onSurface/[0.03]")}>
                              ${isOn && html`<${CheckIcon} size=${9} className="text-ink"/>`}
                            </span>
                            <span className="text-txt2 truncate" title=${c.label}>${c.label}</span>
                          </button>`;
                      })}
                    </div>
                  </div>
                `}

                <div className="mb-4">
                  <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Rango de fechas (opcional)</div>
                  <div className="flex items-center gap-2">
                    <input type="date" value=${dateFrom} onChange=${(e) => setDateFrom(e.target.value)}
                           className="flex-1 px-3 py-1.5 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50"/>
                    <span className="text-txt4 text-[11px]">a</span>
                    <input type="date" value=${dateTo} onChange=${(e) => setDateTo(e.target.value)}
                           className="flex-1 px-3 py-1.5 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50"/>
                    ${(dateFrom || dateTo) && html`
                      <button onClick=${() => { setDateFrom(''); setDateTo(''); }} className="text-[10px] font-mono uppercase tracking-wider text-txt4 hover:text-txt">Limpiar</button>
                    `}
                  </div>
                </div>

                <div className="mb-5">
                  <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Dividir en pestañas por</div>
                  <div className="flex flex-wrap gap-1.5">
                    ${[['none', 'Sin dividir'], ['year', 'Año'], ['month', 'Mes'], ['week', 'Semana']].map(([k, l]) => html`
                      <button key=${k} onClick=${() => setSplitBy(k)}
                              className=${"px-2.5 py-1 rounded-full border text-[11px] transition-colors " +
                                (splitBy === k ? "border-accent2/40 bg-accent2/12 text-txt" : "border-line text-txt3 hover:text-txt2 hover:border-line2")}>
                        ${l}
                      </button>`)}
                  </div>
                  ${splitBy !== 'none' && html`
                    <div className="text-[10px] text-txt4 mt-2">Incluye una pestaña "Total" y una pestaña por cada ${splitBy === 'year' ? 'año' : splitBy === 'month' ? 'mes' : 'semana'}.</div>
                  `}
                </div>

                <div className="mb-5">
                  <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Título de la hoja</div>
                  <input type="text" value=${title}
                         onChange=${(e) => { setTitle(e.target.value); setTitleTouched(true); }}
                         className="w-full px-3 py-2 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50"/>
                </div>

                ${status === 'error' && html`
                  <div className="mb-4 rounded-lg bg-amber/10 border border-amber/30 px-3 py-2 text-[11px] text-amber leading-relaxed">
                    ${errorMsg}
                  </div>
                `}

                ${status === 'success' && html`
                  <div className="mb-4 rounded-lg bg-success/10 border border-success/30 px-3 py-3 text-[12px] text-txt2 leading-relaxed">
                    <div className="flex items-center gap-2 text-success">
                      <${CheckIcon} size=${13}/>
                      <span className="font-medium">Excel descargado</span>
                    </div>
                    <div className="text-txt3 mt-1">Revisa tu carpeta de Descargas — el archivo ya está listo para abrir o subir a Google Sheets.</div>
                  </div>
                `}

                <button onClick=${handleGenerate} disabled=${status === 'loading'}
                        className="w-full inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-accent text-ink text-sm font-medium hover:bg-accent2 hover:text-white transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                  ${status === 'loading'
                    ? html`<${SpinnerIcon} size=${14}/> Generando…`
                    : html`<${DownloadIcon} size=${14}/> Descargar Excel`}
                </button>
              </div>
            </div>
          </div>
        <//>`;

    // ============================================================
    // App principal
    // ============================================================
    // ============================================================
    // v21 — META 2026 · CRECIMIENTO DE FOLLOWERS
    // Lee "Followers" y "Status vs Meta 2026". No depende de los filtros.
    // ============================================================
    const GOAL_STATUS = {
      cumplida:  { label: 'Meta cumplida', cls: 'text-success border-success/40 bg-success/[0.08]' },
      en_ruta:   { label: 'En ruta',       cls: 'text-success border-success/40 bg-success/[0.08]' },
      en_riesgo: { label: 'En riesgo',     cls: 'text-amber border-amber/40 bg-amber/[0.08]' },
    };

    function FollowerGoalCard({ g, chartTheme }) {
      const color = PLAT_COLORS[g.name] || 'rgb(var(--c-accent))';
      const st = GOAL_STATUS[g.status];
      const barPct = Math.max(0, Math.min(100, g.pct));
      const projPct = Math.max(0, Math.min(100, g.projectedPct));
      const sign = (v) => (v >= 0 ? '+' : '−') + fmt(Math.abs(Math.round(v)));
      return html`
        <article className="rounded-xl bg-surface border border-line p-5 min-w-0" aria-label=${`Meta de followers ${g.name}`}>
          <div className="flex items-center justify-between gap-3 mb-3">
            <div className="flex items-center gap-2">
              ${PLAT_LETTERS[g.name] && html`<span className="font-mono text-[10px] font-semibold text-white px-1.5 py-0.5 rounded" style=${{ background: color }}>${PLAT_LETTERS[g.name]}</span>`}
              <span className="text-[14px] text-txt">${g.name}</span>
            </div>
            <span className=${"text-[10px] font-mono uppercase tracking-wider border rounded-full px-2 py-0.5 " + st.cls}>${st.label}</span>
          </div>

          <div className="flex items-baseline gap-2">
            <div className="text-[30px] font-medium tabular-nums leading-none text-txt">${g.pct.toFixed(1)}%</div>
            <div className="text-[11px] text-txt4">de la meta de followers</div>
          </div>
          <div className="text-[12px] text-txt3 mt-1.5 tabular-nums">
            <span className="text-txt2 font-medium">${sign(g.gained)}</span> de ${fmt(g.goal)} followers ganados
          </div>

          <div className="relative h-2 rounded-full bg-onSurface/[0.06] mt-4 overflow-visible"
               role="progressbar" aria-valuemin=${0} aria-valuemax=${100} aria-valuenow=${Math.round(barPct)}
               aria-label=${`Avance de la meta de followers de ${g.name}`}>
            <div className="absolute inset-y-0 left-0 rounded-full" style=${{ width: barPct + '%', background: color }}></div>
            ${g.status !== 'cumplida' && html`
              <div className="absolute -top-1 -bottom-1 w-[2px] bg-txt3/70" style=${{ left: `calc(${projPct}% - 1px)` }}
                   title=${`Proyección al cierre: ${g.projectedPct.toFixed(0)}%`}></div>`}

    // ============================================================
    // v21 — CALIDAD DE DATOS (sobre el filtro actual)
    // ============================================================
    function hasMetrics(p) {
      return (p.reach > 0) || (p.impressions > 0) || (p.interactions > 0) || (p.views > 0);
    }
    // ============================================================
    // v41 — ERRORES DE CAPTURA: links duplicados y campos mal llenados.
    // Se revisa contra TODA la base (no solo el filtro) para encontrar el
    // duplicado aunque esté en otra semana o pestaña.
    // ============================================================
    const LINK_ID_PARAMS = ['v', 'fbid', 'story_fbid', 'id', 'p'];
    function normLinkKey(l) {
      const s = (l || '').trim();
      const m = s.match(/^https?:\/\/(?:www\.|m\.|mobile\.)?([^?#\s]+)(\?[^#\s]*)?/i);
      if (!m) return null;
      if (/imgur\.com|\.(png|jpe?g|webp|gif)$/i.test(m[1])) return null;     // referencias de imagen (Stories)
      let key = m[1].replace(/\/+$/, '').toLowerCase();
      if (m[2]) {
        const q = new URLSearchParams(m[2]);
        const keep = LINK_ID_PARAMS.filter(k => q.get(k)).map(k => `${k}=${q.get(k)}`);
        if (keep.length) key += '?' + keep.join('&');
      }
      return key;
    }
    const PLAT_DOMAIN = { Facebook: /facebook\.com|fb\.watch|fb\.com/i, Instagram: /instagram\.com/i, YouTube: /youtube\.com|youtu\.be/i,
                          TikTok: /tiktok\.com/i, X: /(?:^|\/\/|\.)(x|twitter)\.com/i, LinkedIn: /linkedin\.com|lnkd\.in/i, Threads: /threads\.(net|com)/i };
    const PLAT_FORMATS = {
      Facebook: ['Video', 'Foto', 'Stories', 'Reels', 'Carrusel', 'Live', 'Texto'],
      Instagram: ['Reels', 'Foto', 'Stories', 'Carrusel', 'Live'],
      YouTube: ['Video', 'Short', 'Live'],
      TikTok: ['Video', 'Foto', 'Carrusel', 'Live'],
      X: ['Foto', 'Video', 'Carrusel', 'Texto', 'Live'],
      LinkedIn: ['Video', 'Texto', 'Live', 'Foto', 'Carrusel'],
      Threads: ['Foto', 'Carrusel', 'Texto', 'Video'],
    };
    const CATALOG = { strategy: ['Orgánico', 'Paid'], content_type: ['Global', 'Local', 'Regional'] };
    const MES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const foldTxt = (v) => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
    const where = (p) => `${p.platform}${p._row ? ' fila ' + p._row : ''}`;

    function computeCaptureChecks(all) {
      const out = new Map();   // post → [tags]
      const add = (p, t) => { if (!out.has(p)) out.set(p, []); const a = out.get(p); if (!a.includes(t)) a.push(t); };
      // 1) Links duplicados
      const byLink = new Map();
      for (const p of all) { const k = normLinkKey(p.link); if (!k) continue; if (!byLink.has(k)) byLink.set(k, []); byLink.get(k).push(p); }
      for (const list of byLink.values()) {
        if (list.length < 2) continue;
        for (const p of list) {
          const others = list.filter(o => o !== p);
          const mixed = others.some(o => isPaidP(o) !== isPaidP(p));
          add(p, `${mixed ? 'Mismo link en orgánico y pauta' : 'Link duplicado'} (también en ${others.slice(0, 2).map(where).join(', ')}${others.length > 2 ? '…' : ''})`);
        }
      }
      // 2) Escritura inconsistente (mayúsculas, acentos, espacios)
      const FIELDS = [['campaign', 'Campaña'], ['subcampaign', 'Subcampaña'], ['product', 'Producto'], ['stage', 'Etapa'], ['format', 'Formato'], ['content_type', 'Tipo Contenido'], ['strategy', 'Tipo Pauta']];
      for (const [f, label] of FIELDS) {
        const g = new Map();
        for (const p of all) { const v = p[f]; if (v == null || String(v).trim() === '') continue; const k = foldTxt(v); if (!g.has(k)) g.set(k, new Map()); const m = g.get(k); m.set(v, (m.get(v) || 0) + 1); }
        const winner = new Map();
        for (const [k, m] of g) if (m.size > 1) winner.set(k, [...m.entries()].sort((a, b) => b[1] - a[1])[0][0]);
        for (const p of all) {
          const v = p[f]; if (v == null) continue;
          const w = winner.get(foldTxt(v));
          if (w && v !== w) add(p, String(v).trim() === String(w).trim()
            ? `${label} con espacios de más: "${String(v).trim()}"`
            : `${label} escrito distinto: "${v}" (la mayoría usa "${w}")`);
        }
      }
      for (const p of all) {
        // 3) Link mal capturado
        const l = (p.link || '').trim();
        if (l) {
          const img = /imgur\.com|\.(png|jpe?g|webp|gif)(\?|$)/i.test(l);
          if (!/^https?:\/\//i.test(l) || /\s/.test(l) || (l.match(/https?:\/\//gi) || []).length > 1) add(p, 'Link mal capturado (espacios, texto extra o dos links pegados)');
          else if (!img && PLAT_DOMAIN[p.platform] && !PLAT_DOMAIN[p.platform].test(l)) add(p, `Link de otra plataforma en la pestaña ${p.platform}`);
        }
        // 4) Fecha, semana, mes y año
        if (p.date) {
          const d = parseDate(p.date);
          if (!d || isNaN(d)) add(p, `Fecha inválida ("${p.date}")`);
          else {
            if (p.year != null && +p.year !== d.getFullYear()) add(p, `Año no coincide con la fecha (${p.year} vs ${d.getFullYear()})`);
            if (p.month && foldTxt(p.month) !== MES_ES[d.getMonth()]) add(p, `Mes no coincide con la fecha (${p.month} vs ${MES_ES[d.getMonth()][0].toUpperCase() + MES_ES[d.getMonth()].slice(1)})`);
            if (d >= PRESS_WEEK1 && p.week != null) {
              const wk = Math.floor((d - PRESS_WEEK1) / 864e5 / 7) + 1;
              if (+p.week !== wk) add(p, `Semana no coincide con la fecha (S${p.week} vs S${wk})`);
            }
          }
        }
        // 5) Valores fuera de catálogo
        if (p.format && PLAT_FORMATS[p.platform] && !PLAT_FORMATS[p.platform].some(x => foldTxt(x) === foldTxt(p.format))) add(p, `Formato "${p.format}" no corresponde a ${p.platform}`);
        for (const [f, allowed] of Object.entries(CATALOG)) {
          if (p[f] && !allowed.some(x => foldTxt(x) === foldTxt(p[f]))) add(p, `${f === 'strategy' ? 'Tipo Pauta' : 'Tipo Contenido'} fuera de catálogo: "${p[f]}"`);
        }
        // 6) Números incoherentes
        if (p.basic_interactions != null && p.interactions != null && p.interactions < p.basic_interactions) add(p, 'Inter. Totales menor que Inter. Básicas');
      }
      return out;
    }

    function computeDataQuality(posts, allForChecks) {
      const capture = computeCaptureChecks(allForChecks && allForChecks.length ? allForChecks : posts);
      const issues = [];
      const byWeek = new Map();
      const counts = { sinMetricas: 0, sinPauta: 0, sinClasif: 0, imposibles: 0, conMiniatura: 0, captura: 0, duplicados: 0, campos: 0 };
      for (const p of posts) {
        const tags = [];
        if (!hasMetrics(p)) { tags.push('Sin métricas'); counts.sinMetricas++; }
        if (!p.strategy) { tags.push('Sin Tipo Pauta'); counts.sinPauta++; }
        if (!p.format || !p.content_type) { tags.push(!p.format && !p.content_type ? 'Sin Formato ni Tipo Contenido' : !p.format ? 'Sin Formato' : 'Sin Tipo Contenido'); counts.sinClasif++; }
        if ((p._flags || []).length) { tags.push('Valor imposible (' + (p._flags.includes('er') ? 'ER Básico > 100%' : 'CTR > 100%') + ')'); counts.imposibles++; }
        const cap = capture.get(p);
        if (cap && cap.length) {
          tags.push(...cap); counts.captura++;
          if (cap.some(t => /^(Link duplicado|Mismo link)/.test(t))) counts.duplicados++;
          if (cap.some(t => !/^(Link duplicado|Mismo link)/.test(t))) counts.campos++;
        }
        if (tags.length) issues.push({ post: p, tags });
        if (p.week != null) {
          const k = (postYear(p) || '') + '-' + p.week;
          if (!byWeek.has(k)) byWeek.set(k, { year: postYear(p), week: p.week, total: 0, pending: 0 });
          const w = byWeek.get(k); w.total++; if (!hasMetrics(p)) w.pending++;
        }
      }
      const weeks = [...byWeek.values()].sort((a, b) => (b.year - a.year) || (b.week - a.week)).slice(0, 8);
      const ts = (p) => { const d = parseDate(p.date); return d ? d.getTime() : 0; };
      issues.sort((a, b) => ts(b.post) - ts(a.post));
      return { counts, weeks, issues, total: posts.length };
    }

    // ============================================================
    // v22 — PRESS SEMANAL: "Performance Across SNS" + "VTR"
    // Replica exactamente las pestañas del Sheet (validado S1–S42 2026):
    //  · Posts / Alcance / Inter. Totales = Perf_Semanal (todos los posts)
    //  · Followers = suma de todas las cuentas de la hoja Followers
    //  · VTR = bloque "VTR General" de VTR_Video: promedio simple por
    //    plataforma (videos con VTR > 0, sin Stories) y promedio entre
    //    plataformas. Ignora los filtros del dashboard.
    // ============================================================
    const PRESS_YEAR = 2026;
    const PRESS_WEEK1 = new Date(2025, 11, 28);   // domingo de la S1
    const PRESS_PLATS = ['Facebook', 'Instagram', 'YouTube', 'TikTok', 'X', 'LinkedIn', 'Threads'];
    const MES_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function pressWeekRange(w) {
      const a = new Date(PRESS_WEEK1); a.setDate(a.getDate() + 7 * (w - 1));
      const b = new Date(a); b.setDate(b.getDate() + 6);
      return [a, b];
    }
    function pressLastClosedWeek(today = new Date()) {
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      return Math.floor((t - PRESS_WEEK1) / 86400000 / 7) + 1 - 1;
    }
    function ordEn(d) {
      const n = d.getDate();
      const suf = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
      return `${MES_EN[d.getMonth()]} ${String(n).padStart(2, '0')}${suf}`;
    }
    function fmtKpress(v) {
      v = Number(v || 0);
      if (v >= 1e6) return `${(v / 1e6).toFixed(1)} M`;
      if (v >= 1e4) return `${Math.round(v / 1e3)} K`;
      if (v >= 1e3) return `${(v / 1e3).toFixed(1)} K`;
      return `${Math.round(v)}`;
    }

    async function fetchFollowerTotals() {
      const rows = await fetchRawSheet('Followers', 'A1:DZ60');
      const totals = {};
      for (const r of rows) {
        const name = (r[0] || '').trim();
        if (/^newsletter/i.test(name)) break;
        if (!name || /^plataforma$/i.test(name) || /followers/i.test(name)) continue;
        for (let i = 1, w = 1; i < r.length; i += 2, w++) {
          const v = toNum(r[i]);
          if (v == null || v === 0) break;
          totals[w] = (totals[w] || 0) + v;
        }
      }
      return totals;
    }

    function computePressWeek(allPosts, week, followers) {
      const inWeek = (w) => (allPosts || []).filter(p => p.week === w && postYear(p) === PRESS_YEAR);
      const perfOf = (list) => ({
        posts: list.length,
        reach: list.reduce((s, p) => s + (p.reach || 0), 0),
        inter: list.reduce((s, p) => s + (p.interactions || 0), 0),
      });
      const vtrOf = (list) => {
        const by = {};
        for (const p of list) {
          if (p.vtr == null || !(p.vtr > 0) || p.format === 'Stories') continue;
          (by[p.platform] = by[p.platform] || []).push(p.vtr);
        }
        const plats = {};
        for (const k of PRESS_PLATS) if (by[k]) plats[k] = by[k].reduce((a, b) => a + b, 0) / by[k].length;
        const vals = Object.values(plats);
        return { plats, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null };
      };
      const cur = inWeek(week), prev = inWeek(week - 1);
      const series = [];
      for (let w = 1; w <= week; w++) { const pf = perfOf(inWeek(w)); series.push({ w, reach: pf.reach, inter: pf.inter }); }
      const pending = cur.filter(p => !hasMetrics(p)).length;
      return {
        week, range: pressWeekRange(week),
        perf: perfOf(cur), prev: perfOf(prev), series,
        vtr: vtrOf(cur), vtrPrev: vtrOf(prev),
        fol: followers?.[week] ?? null, folPrev: followers?.[week - 1] ?? null,
        pending,
      };
    }

    function pressDelta(a, b) { return (a != null && b) ? (a - b) / b : null; }

    // v23 — Recuadros de campaña: campaña + subcampañas elegidas, misma
    // lógica que el reporte (todos los posts; VTR = promedio simple de los
    // videos con VTR > 0 sin Stories; post destacado = más Inter. Totales).
    function pressWeekPosts(allPosts, week) {
      return (allPosts || []).filter(p => p.week === week && postYear(p) === PRESS_YEAR);
    }
    function pressCampaignOptions(allPosts, week) {
      const map = new Map();
      for (const p of pressWeekPosts(allPosts, week)) {
        if (!p.campaign) continue;
        if (!map.has(p.campaign)) map.set(p.campaign, { name: p.campaign, posts: 0, inter: 0, subs: new Map() });
        const c = map.get(p.campaign);
        c.posts++; c.inter += p.interactions || 0;
        const sk = p.subcampaign || '(sin subcampaña)';
        c.subs.set(sk, (c.subs.get(sk) || 0) + 1);
      }
      return [...map.values()].sort((a, b) => b.inter - a.inter);
    }
    function computeCampaignBox(allPosts, week, camp, subs) {
      const list = pressWeekPosts(allPosts, week).filter(p =>
        p.campaign === camp && (!subs || subs.includes(p.subcampaign || '(sin subcampaña)')));
      if (!list.length) return null;
      const vt = list.filter(p => p.vtr != null && p.vtr > 0 && p.format !== 'Stories').map(p => p.vtr);
      const top = [...list].sort((a, b) => (b.interactions || 0) - (a.interactions || 0))[0];
      return {
        posts: list.length,
        reach: list.reduce((s, p) => s + (p.reach || 0), 0),
        inter: list.reduce((s, p) => s + (p.interactions || 0), 0),
        vtr: vt.length ? vt.reduce((a, b) => a + b, 0) / vt.length : null,
        top: { label: `${top.platform} ${top.format || ''}`.trim(), reach: top.reach || 0, inter: top.interactions || 0, link: top.link || null },
      };
    }

    // v32 — Slide "[SNS Summary] Followers" (slide 3 del reporte semanal):
    // tabla de las últimas 14 semanas por cuenta (total + WoW), meta 2026
    // (AR) y % de avance (KPI's) para IG/TikTok/YouTube, suscriptores del
    // newsletter y evolución de followers por cuenta desde la semana 1.
    async function fetchPressFollowers() {
      // v33 — la pestaña Followers se lee del export CSV: gviz "adivina" el
      // tipo de cada columna y borra los encabezados "Week N" del newsletter.
      const readFollowers = async () => {
        try {
          const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${FOLLOWERS_GID}`);
          const txt = res.ok ? await res.text() : '';
          if (txt && !txt.trim().startsWith('<')) return Papa.parse(txt, { header: false, skipEmptyLines: false }).data;
        } catch {}
        return fetchRawSheet('Followers', 'A1:DZ60');
      };
      const [rows, statusRows] = await Promise.all([
        readFollowers(),
        fetchRawSheet('Status vs Meta 2026', 'A1:H40').catch(() => []),
      ]);
      const series = [], totals = {};
      let newsletter = null;
      for (let k = 0; k < rows.length; k++) {
        const r = rows[k], name = (r[0] || '').trim();
        if (/^newsletter/i.test(name)) {
          // Debajo: fila de encabezados "Week N" y fila de valores
          const hdr = rows[k + 1] || [], val = rows[k + 2] || [];
          const weeks = [], vals = [];
          // Semana de cada columna: se ancla al primer "Week N" encontrado y
          // avanza de uno en uno (por si algún encabezado llega vacío)
          let i0 = -1, w0 = null;
          for (let i = 1; i < hdr.length; i++) {
            const m = String(hdr[i] || '').match(/week\s*(\d+)/i);
            if (m) { i0 = i; w0 = +m[1]; break; }
          }
          if (w0 != null) for (let i = 1; i < Math.max(hdr.length, val.length); i++) {
            const raw = String(val[i] || '').replace(/[.,\s]/g, '');   // "33.536" y "33,536" → 33536
            if (!raw || isNaN(+raw)) continue;
            weeks.push(w0 + (i - i0)); vals.push(+raw);
          }
          if (weeks.length) newsletter = { weeks, vals };
          break;
        }
        if (!name || /^plataforma$/i.test(name) || /followers/i.test(name)) continue;
        const vals = [];
        for (let i = 1, w = 1; i < r.length; i += 2, w++) {
          const v = toNum(r[i]);
          if (v == null || v === 0) break;
          vals.push(v);
          totals[w] = (totals[w] || 0) + v;
        }
        if (vals.length) series.push({ name, vals });
      }
      const goals = {};
      for (const r of statusRows) {
        const name = (r[0] || '').trim();
        if (!name || /^(plataforma|total)$/i.test(name)) continue;
        const base = toNum(r[1]), goal = toNum(r[4]);
        if (goal) goals[name] = { base, goal };
      }
      return { totals, series, newsletter, goals };
    }

    const FOLLOWERS_GID = '818526065';

      // ---------- Newsletter (hasta 26 semanas)

          ], {

      }

      // ---------- Evolución de followers W1 → W actual
      const labels = Array.from({ length: W }, (_, i) => `W${i + 1}`);
      const data = F.series.map(({ name, vals }) => ({ name: name.replace('X | ', 'X | '), labels, values: labels.map((_, i) => vals[i] ?? null) }));
      s.addChart(pptx.ChartType.line, data, {

      });
      if (per) s.addText(per, { x: E(10103052), y: E(6702067), w: E(1803300), h: E(187500), fontFace: REG, fontSize: 5, color: '000000', align: 'right', margin: 0 });

    // ============================================================
    // v35 — SLIDES DE TEMA LIBRE para la press (como el slide de Galaxy Tab
    // S12 del reporte, pero para cualquier dispositivo, campaña o tema).
    // El tema se define con filtros de la semana; los recuadros de abajo se
    // parten por la dimensión que se elija. Sentimiento y conversación son
    // espacios para pegar (vienen de Brandwatch y de las plataformas).
    // ============================================================
    const TOPIC_DIMS = [
      { k: 'campaign',    l: 'Campaña',     f: (p) => p.campaign },
      { k: 'product',     l: 'Producto',    f: (p) => p.product },
      { k: 'subcampaign', l: 'Subcampaña',  f: (p) => p.subcampaign },
      { k: 'platform',    l: 'Plataforma',  f: (p) => p.platform },
      { k: 'format',      l: 'Formato',     f: (p) => p.format },
    ];
    const topicDim = (k) => TOPIC_DIMS.find(d => d.k === k);
    function pressStats(list) {
      if (!list.length) return null;
      const vt = list.filter(p => p.vtr != null && p.vtr > 0 && p.format !== 'Stories').map(p => p.vtr);
      const top = [...list].sort((a, b) => (b.interactions || 0) - (a.interactions || 0))[0];
      return {
        posts: list.length,
        reach: list.reduce((s, p) => s + (p.reach || 0), 0),
        inter: list.reduce((s, p) => s + (p.interactions || 0), 0),
        vtr: vt.length ? vt.reduce((a, b) => a + b, 0) / vt.length : null,
        top: { label: `${top.platform} ${top.format || ''}`.trim(), reach: top.reach || 0, inter: top.interactions || 0, link: top.link || null },
      };
    }
    function topicOptions(allPosts, week, dimK) {
      const D = topicDim(dimK); const m = new Map();
      for (const p of pressWeekPosts(allPosts, week)) {
        const v = D.f(p); if (!v) continue;
        const r = m.get(v) || { v, n: 0, inter: 0 }; r.n++; r.inter += p.interactions || 0; m.set(v, r);
      }
      return [...m.values()].sort((a, b) => b.inter - a.inter);
    }
    function topicList(allPosts, week, t) {
      const D = topicDim(t.dim);
      // Siempre totales (orgánico + pauta), como se reporta al cliente
      return pressWeekPosts(allPosts, week).filter(p => t.values.includes(D.f(p)));
    }
    function topicSplitOptions(list, splitK) {
      if (!splitK || splitK === 'none') return [];
      const D = topicDim(splitK); const m = new Map();
      for (const p of list) { const v = D.f(p) || '(sin dato)'; const r = m.get(v) || { v, n: 0, inter: 0 }; r.n++; r.inter += p.interactions || 0; m.set(v, r); }
      return [...m.values()].sort((a, b) => b.inter - a.inter);
    }
    function organicVtrRef(allPosts, week) {
      const v = (allPosts || []).filter(p => postYear(p) === PRESS_YEAR && p.week && p.week <= week && !isPaidP(p) &&
        p.vtr != null && p.vtr > 0 && p.format !== 'Stories').map(p => p.vtr);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    }
    function computeTopic(allPosts, week, t) {
      if (t.dim === 'manual') return { manual: true, title: t.title || 'Tema', groups: [], bullets: [] };

      const perf = pressStats(list);
      const ref = organicVtrRef(allPosts, week);
      const D = t.split && t.split !== 'none' ? topicDim(t.split) : null;
      const groups = D ? (t.splitKeys || []).slice(0, 2).map(k => ({ title: k, data: pressStats(list.filter(p => (D.f(p) || '(sin dato)') === k)) })).filter(g => g.data) : [];

        } else bullets.push(`The best-performing piece was ${perf.top.label}, with ${fmtKpress(perf.top.reach)} reach and ${fmtKpress(perf.top.inter)} interactions.`);

      return { manual: false, title: t.title || t.values.join(' · '), perf, ref, groups, bullets };

      // Recuadros
