    const PRESS_STORE_KEY = 'smx-press-config-v1';
    function pressStoreRead() { try { return JSON.parse(localStorage.getItem(PRESS_STORE_KEY) || '{}') || {}; } catch { return {}; } }
    function pressStoreWrite(o) {
      try {   // solo las últimas 12 semanas
        const keep = Object.keys(o).map(Number).sort((a, b) => b - a).slice(0, 12);
        const out = {}; keep.forEach(k => { out[k] = o[k]; });
        localStorage.setItem(PRESS_STORE_KEY, JSON.stringify(out));
      } catch {}
    }

    function PressModal({ open, onClose, allPosts }) {
      const lastClosed = useMemo(() => pressLastClosedWeek(), []);
      const weeks = useMemo(() => {
        const set = new Set((allPosts || []).filter(p => postYear(p) === PRESS_YEAR && p.week).map(p => p.week));
        return [...set].filter(w => w >= 2).sort((a, b) => b - a);
      }, [allPosts]);
      const [week, setWeek] = useState(null);
      const [followers, setFollowers] = useState(null);
      const [folDetail, setFolDetail] = useState(null);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      useEffect(() => {
        if (!open) return;
        setErr(null);
        if (week == null) setWeek(weeks.includes(lastClosed) ? lastClosed : weeks[0]);
        if (!followers) fetchPressFollowers().then(r => { setFolDetail(r); setFollowers(r.totals); }).catch(() => setFollowers({}));
      }, [open]);
      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [open, onClose]);
      const d = useMemo(() => (week ? computePressWeek(allPosts, week, followers) : null), [allPosts, week, followers]);
      const campOpts = useMemo(() => (week ? pressCampaignOptions(allPosts, week) : []), [allPosts, week]);
      const [boxes, setBoxes] = useState([null, null, null]);   // { camp, subs: string[], title, touched }
      const [topics, setTopics] = useState([]);
      // v37 — la press recuerda lo que armaste por semana (en este navegador)
      // y, para una semana nueva, parte de lo que usaste la semana anterior.
      const [origin, setOrigin] = useState(null);     // { kind: 'saved'|'prev'|'auto', from }
      const loadedFor = useRef(null);
      const skipSave = useRef(false);   // no guardar lo que solo se cargó o propuso
      const autoBoxes = () => [0, 1, 2].map(i => campOpts[i]
        ? { camp: campOpts[i].name, subs: [...campOpts[i].subs.keys()], title: campOpts[i].name, touched: false } : null);
      const adapt = (cfg) => {
        // Ajusta una configuración a lo que sí existe en esta semana
        const bx = (cfg.boxes || [null, null, null]).map(b => {
          if (!b) return null;
          const o = campOpts.find(c => c.name === b.camp);
          if (!o) return null;
          // Si nunca acotaste subcampañas, se toman todas las de esta semana
          const subs = b.subsTouched ? (b.subs || []).filter(x => o.subs.has(x)) : [];
          return { ...b, subs: subs.length ? subs : [...o.subs.keys()] };
        });
        const tp = (cfg.topics || []).map(t => {
          if (t.dim === 'manual') return t;
          const avail = new Set(topicOptions(allPosts, week, t.dim).map(o => o.v));
          const values = (t.values || []).filter(v => avail.has(v));
          return { ...t, values, splitKeys: values.length ? (t.splitKeys || []) : [] };
        });
        return { boxes: bx, topics: tp };
      };
      useEffect(() => {
        if (!week || !campOpts) return;
        const store = pressStoreRead();
        let cfg = null, from = null, kind = 'auto';
        if (store[week]) { cfg = store[week]; kind = 'saved'; from = week; }
        else {
          const prev = Object.keys(store).map(Number).filter(w => w < week).sort((a, b) => b - a)[0];
          if (prev) { cfg = store[prev]; kind = 'prev'; from = prev; }
        }
        if (cfg) {
          const a = adapt(cfg);
          if (kind === 'prev') {   // huecos sin campaña vigente: se llenan con la propuesta automática
            const auto = autoBoxes().filter(b => b && !a.boxes.some(x => x && x.camp === b.camp));
            a.boxes = a.boxes.map(b => b || auto.shift() || null);
            a.topics = a.topics.filter(t => t.dim === 'manual' || t.values.length);
          }
          setBoxes(a.boxes); setTopics(a.topics);
        } else { setBoxes(autoBoxes()); setTopics([]); }
        setOrigin({ kind, from });
        loadedFor.current = week; skipSave.current = true;
      }, [week, campOpts]);
      useEffect(() => {   // guarda cada cambio de la semana en curso
        if (!week || loadedFor.current !== week) return;
        if (skipSave.current) { skipSave.current = false; return; }
        const store = pressStoreRead();
        store[week] = { boxes, topics, savedAt: Date.now() };
        pressStoreWrite(store);
      }, [boxes, topics]);
      const resetAuto = () => {
        const store = pressStoreRead(); delete store[week]; pressStoreWrite(store);
        skipSave.current = true; setBoxes(autoBoxes()); setTopics([]); setOrigin({ kind: 'auto', from: null });
      };
      const setBox = (i, patch) => setBoxes(bs => bs.map((b, k) => k === i ? (patch === null ? null : { ...(b || {}), ...patch }) : b));
      const boxData = useMemo(() => boxes.map(b => b && b.camp ? computeCampaignBox(allPosts, week, b.camp, b.subs) : null), [boxes, allPosts, week]);
      const addTopic = () => {
        const top = topicOptions(allPosts, week, 'campaign')[0];
        setTopics(ts => [...ts, { title: top ? top.v : '', touched: false, dim: 'campaign', values: top ? [top.v] : [], scope: 'all', split: 'product', splitKeys: [] }]);
      };
      if (!open) return null;

      const dl = async () => {
        setBusy(true); setErr(null);
        try {
          await buildPressPptx({ ...d, folDetail, topics: topics.map(t => computeTopic(allPosts, week, t)), boxes: boxes.map((b, i) => (b && boxData[i]) ? { title: b.title, data: boxData[i] } : null) });
        } catch (e) { setErr(e?.message || 'No se pudo generar el archivo.'); }
        finally { setBusy(false); }
      };
      const deltaTxtP = (v, dec = 0) => v == null ? '—' : `${v >= 0 ? '+' : ''}${(v * 100).toFixed(dec)}%`;
      const row = (k, v, dv, dec) => html`
        <div className="flex items-baseline justify-between py-1.5 text-[12px]">
          <span className="text-txt3">${k}</span>
          <span className="font-mono tabular-nums text-txt">${v}<span className=${"ml-2 text-[10px] " + (dv == null ? 'text-txt4' : dv >= 0 ? 'text-success' : 'text-amber')}>${deltaTxtP(dv, dec)}</span></span>
        </div>`;
      return html`
        <${Fragment}>
          <div className="fixed inset-0 z-40 fade-in" style=${{ background: 'rgba(0,0,0,0.6)' }} onClick=${onClose}/>
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick=${onClose}>
            <div role="dialog" aria-modal="true" aria-labelledby="h-press"
                 className="w-full max-w-md max-h-[90vh] overflow-y-auto rounded-2xl bg-surface border border-line2 fade-in p-6"
                 style=${{ boxShadow: '0 20px 60px rgba(0,0,0,0.5)' }} onClick=${(e) => e.stopPropagation()}>
              <div className="flex items-start justify-between mb-1">
                <h2 id="h-press" className="text-[16px] font-medium text-txt">Press semanal</h2>
                <button onClick=${onClose} aria-label="Cerrar" className="text-txt4 hover:text-txt"><${XIcon} size=${16}/></button>
              </div>
              <p className="text-[12px] text-txt4 mb-4">Descarga 3 slides en el formato del reporte (PPTX editable): la portada, el resumen de la semana (Performance Across SNS, Reach & Interactions, VTR y hasta 3 recuadros de campaña) y Followers (tabla de 14 semanas, meta 2026, newsletter y evolución). Puedes sumar slides de tema al final. Usa toda la cuenta, sin los filtros del dashboard.</p>

              <label className="block text-[10px] font-mono uppercase tracking-[0.16em] text-txt4 mb-1.5" htmlFor="press-week">Semana</label>
              <select id="press-week" value=${week || ''} onChange=${(e) => setWeek(+e.target.value)}
                      className="w-full text-[12px] bg-onSurface/[0.03] border border-line rounded-lg px-3 py-2 text-txt2 mb-4">
                ${weeks.map(w => { const [a, b] = pressWeekRange(w); return html`<option key=${w} value=${w}>S${w} · ${a.getDate()} ${MESES_ABBR(a)} – ${b.getDate()} ${MESES_ABBR(b)}${w === lastClosed ? ' (última cerrada)' : w > lastClosed ? ' (en curso)' : ''}</option>`; })}
              </select>

              ${d && html`
                <div className="rounded-xl border border-line px-4 py-2 mb-3">
                  ${row('Posts', String(d.perf.posts), pressDelta(d.perf.posts, d.prev.posts))}
                  ${row('Reach', fmtKpress(d.perf.reach), pressDelta(d.perf.reach, d.prev.reach))}
                  ${row('Interactions', fmtKpress(d.perf.inter), pressDelta(d.perf.inter, d.prev.inter))}
                  ${row('Followers', followers ? (d.fol ? fmtKpress(d.fol) : 'n/d') : '…', pressDelta(d.fol, d.folPrev), 2)}
                  <div className="flex items-baseline justify-between py-1.5 text-[12px]">
                    <span className="text-txt3">Average VTR</span>
                    <span className="font-mono tabular-nums text-txt">${d.vtr.avg != null ? d.vtr.avg.toFixed(1) + '%' : 'n/d'}
                      <span className="ml-2 text-[10px] text-txt4">${(d.vtr.avg != null && d.vtrPrev.avg != null) ? `${d.vtr.avg - d.vtrPrev.avg >= 0 ? '+' : ''}${(d.vtr.avg - d.vtrPrev.avg).toFixed(1)} pp` : '—'}</span>
                    </span>
                  </div>
                </div>
                ${d.pending > 0 && html`
                  <div className="rounded-lg border border-amber/40 bg-amber/[0.06] px-3 py-2 text-[11px] text-amber mb-3" role="status">
                    S${d.week} tiene ${d.pending} post${d.pending === 1 ? '' : 's'} sin métricas: los números pueden cambiar cuando se completen.
                  </div>`}
              `}
              ${origin && origin.kind !== 'auto' && html`
                <div className="flex items-center justify-between gap-2 rounded-lg bg-accent2/10 px-3 py-2 mb-3 text-[11px] text-txt2">
                  <span>${origin.kind === 'saved' ? `Recuperé lo que armaste para la S${origin.from}.` : `Partí de lo que usaste en la S${origin.from}.`}</span>
                  <button onClick=${resetAuto} className="text-accent hover:underline whitespace-nowrap">Volver a la propuesta automática</button>
                </div>`}
              <div className="text-[10px] font-mono uppercase tracking-[0.16em] text-txt4 mb-2 mt-1">Recuadros de campaña</div>
              <div className="space-y-2.5 mb-4">
                ${[0, 1, 2].map(i => {
                  const b = boxes[i];
                  const opt = b ? campOpts.find(c => c.name === b.camp) : null;
                  const m = boxData[i];
                  return html`
                    <div key=${i} className="rounded-xl border border-line px-3 py-2.5">
                      <div className="flex gap-2 items-center">
                        <span className="text-[10px] font-mono text-txt4 w-4">${i + 1}</span>
                        <select aria-label=${`Campaña del recuadro ${i + 1}`} value=${b?.camp || ''}
                                onChange=${(e) => {
                                  const v = e.target.value;
                                  if (!v) return setBox(i, null);
                                  const o = campOpts.find(c => c.name === v);
                                  setBox(i, { camp: v, subs: [...o.subs.keys()], title: (b && b.touched) ? b.title : v, touched: !!(b && b.touched) });
                                }}
                                className="flex-1 min-w-0 text-[12px] bg-onSurface/[0.03] border border-line rounded-lg px-2 py-1.5 text-txt2">
                          <option value="">— Sin recuadro —</option>
                          ${campOpts.map(c => html`<option key=${c.name} value=${c.name}>${c.name} · ${c.posts} post${c.posts === 1 ? '' : 's'}</option>`)}
                        </select>
                      </div>
                      ${b && opt && html`
                        <${Fragment}>
                          <input aria-label=${`Título del recuadro ${i + 1}`} value=${b.title}
                                 onChange=${(e) => setBox(i, { title: e.target.value, touched: true })}
                                 className="mt-2 w-full text-[12px] bg-onSurface/[0.03] border border-line rounded-lg px-2 py-1.5 text-txt" />
                          ${opt.subs.size > 1 && html`
                            <div className="flex flex-wrap gap-1.5 mt-2" role="group" aria-label="Subcampañas incluidas">
                              ${[...opt.subs.entries()].map(([sname, n]) => {
                                const on = b.subs.includes(sname);
                                return html`
                                  <button key=${sname} aria-pressed=${on}
                                          onClick=${() => {
                                            const subs = on ? b.subs.filter(x => x !== sname) : [...b.subs, sname];
                                            if (!subs.length) return;
                                            setBox(i, { subs, subsTouched: true });
                                          }}
                                          className=${"text-[10px] rounded-full px-2 py-0.5 border transition-colors " + (on ? "border-accent2/50 bg-accent2/10 text-txt" : "border-line text-txt4 hover:text-txt2")}>
                                    ${sname} · ${n}
                                  </button>`;
                              })}
                            </div>`}
                          ${m && html`
                            <div className="text-[10px] font-mono text-txt4 mt-2 tabular-nums">
                              ${m.posts} posts · ${fmtKpress(m.reach)} · ${fmtKpress(m.inter)}${m.vtr != null ? ` · VTR ${m.vtr.toFixed(2)}%` : ''} · top: ${m.top.label}
                            </div>`}
                        <//>`}
                    </div>`;
                })}
              </div>
              <div className="flex items-baseline justify-between mb-2 mt-1">
                <div className="text-[10px] font-mono uppercase tracking-[0.16em] text-txt4">Slides de tema</div>
                <span className="text-[10px] text-txt4">opcional</span>
              </div>
              <div className="space-y-2.5 mb-3">
                ${topics.map((t, i) => html`<${TopicEditor} key=${i} t=${t} i=${i} allPosts=${allPosts} week=${week}
                    onChange=${(nt) => setTopics(ts => ts.map((x, k) => k === i ? nt : x))}
                    onRemove=${() => setTopics(ts => ts.filter((_, k) => k !== i))} />`)}
                <button onClick=${addTopic}
                        className="w-full text-[12px] rounded-lg border border-dashed border-line2 py-2 text-txt3 hover:text-txt hover:border-accent2/50 transition-colors">
                  + Agregar slide de tema (dispositivo, campaña o lo que pida el cliente)
                </button>
              </div>
              ${err && html`<div className="text-[11px] text-amber mb-3" role="alert">${err}</div>`}
              <button onClick=${dl} disabled=${busy || !d || !followers}
                      className="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-accent text-ink text-[13px] font-medium hover:bg-accent2 hover:text-white disabled:opacity-50 transition-colors">
                <${DownloadIcon} size=${14}/> ${busy ? 'Generando…' : `Descargar PPTX S${week || ''}`}
              </button>
            </div>
          </div>
        <//>`;
    }
    function MESES_ABBR(d) { return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]; }

    // ============================================================
    // v24 — PERFIL POR FORMATO (gráfica de araña)
    // Índice 100 = promedio de la plataforma + pauta elegidas dentro del
    // filtro actual. Ejes = tasas por alcance (ponderadas Σ/Σ) + alcance
    // por post. Máx. 3 formatos, mín. 20 posts por formato.
    // ============================================================
    const PROFILE_MIN_N = 20;
    const PROFILE_AXES = [
      { key: 'reach_pp', label: 'Alcance por post', fmt: (v) => fmt(Math.round(v)) },
      { key: 'reactions', label: 'Reacciones', fmt: (v) => (v * 100).toFixed(2) + '%' },
      { key: 'comments', label: 'Comentarios', fmt: (v) => (v * 100).toFixed(3) + '%' },
      { key: 'shares', label: 'Compartidos', fmt: (v) => (v * 100).toFixed(3) + '%' },
      { key: 'saves', label: 'Guardados', fmt: (v) => (v * 100).toFixed(3) + '%' },
    ];
    const PROFILE_COLORS = [
      { stroke: '#2a78d6', dash: undefined, shape: 'circle' },
      { stroke: '#eb6834', dash: '6 4', shape: 'diamond' },
      { stroke: '#1baf7a', dash: '2 3', shape: 'square' },
    ];
    function profileRaw(list) {
      const reach = list.reduce((s, p) => s + (p.reach > 0 ? p.reach : 0), 0);
      const sum = (k) => list.reduce((s, p) => s + (p.reach > 0 ? (p[k] || 0) : 0), 0);
      const withReach = list.filter(p => p.reach > 0).length;
      return {
        n: list.length,
        reach_pp: withReach ? reach / withReach : 0,
        reactions: reach ? sum('reactions') / reach : 0,
        comments: reach ? sum('comments') / reach : 0,
        shares: reach ? sum('shares') / reach : 0,
        saves: reach ? sum('saves') / reach : 0,
      };
    }
    const isOrgP = (p) => /org/i.test(p.strategy || '');
    const isPaidP = (p) => /paid|pauta|pagad/i.test(p.strategy || '');

    function FormatProfileSection({ D, filters, chartTheme }) {
      const all = D.allPosts || [];
      const platLock = filters?.platforms?.length === 1 ? filters.platforms[0] : null;
      const platforms = useMemo(() => {
        const c = {}; for (const p of all) c[p.platform] = (c[p.platform] || 0) + 1;
        return Object.keys(c).sort((a, b) => c[b] - c[a]);
      }, [all]);
      const [plat, setPlat] = useState(null);
      const [pauta, setPauta] = useState('org');
      const curPlat = platLock || (plat && platforms.includes(plat) ? plat : (platforms.includes('Instagram') ? 'Instagram' : platforms[0]));
      const pautaLock = filters?.strategies?.length > 0;

      const scope = useMemo(() => all.filter(p => p.platform === curPlat &&
        (pautaLock || pauta === 'all' || (pauta === 'org' ? isOrgP(p) : isPaidP(p)))), [all, curPlat, pauta, pautaLock]);
      const base = useMemo(() => profileRaw(scope), [scope]);
      const formats = useMemo(() => {
        const by = {};
        for (const p of scope) { const f = p.format || 'Sin formato'; (by[f] = by[f] || []).push(p); }
        return Object.entries(by).map(([f, list]) => ({ f, n: list.length, raw: profileRaw(list) })).sort((a, b) => b.n - a.n);
      }, [scope]);
      const eligible = formats.filter(x => x.n >= PROFILE_MIN_N);
      const [sel, setSel] = useState(null);
      const selected = (sel || []).filter(f => eligible.some(e => e.f === f));
      const axes = PROFILE_AXES.filter(a => base[a.key] > 0);   // ejes sin dato en la plataforma se ocultan
      // Por defecto: formatos que miden todos los ejes (Stories no tiene guardados) y luego el resto
      const complete = eligible.filter(e => axes.every(a => e.raw[a.key] > 0));
      const defaults = [...complete, ...eligible.filter(e => !complete.includes(e))].slice(0, 3).map(e => e.f);
      const active = selected.length ? selected : defaults;
      const series = active.map(f => eligible.find(e => e.f === f)).filter(Boolean);
      const idx = (raw, k) => base[k] > 0 ? (raw[k] / base[k]) * 100 : 0;
      const data = axes.map(a => {
        const row = { axis: a.label, base: 100 };
        series.forEach(s => { row[s.f] = Math.round(idx(s.raw, a.key)); });
        return row;
      });
      const maxIdx = Math.max(200, ...data.flatMap(r => series.map(s => r[s.f] || 0)));
      const domainMax = Math.ceil(maxIdx / 100) * 100;
      const toggle = (f) => {
        const cur = active;
        if (cur.includes(f)) { if (cur.length > 1) setSel(cur.filter(x => x !== f)); }
        else if (cur.length < 3) setSel([...cur, f]);
      };
      const reading = series.map(s => {
        const vals = axes.filter(a => s.raw[a.key] > 0).map(a => ({ a: a.label, v: idx(s.raw, a.key) }));   // 0 = no aplica al formato
        const hi = [...vals].sort((x, y) => y.v - x.v)[0], lo = [...vals].sort((x, y) => x.v - y.v)[0];
        return { f: s.f, hi, lo };
      });
      const ct = chartTheme || {};

      return html`
        <section id="sec-perfil" className="px-4 md:px-7 py-7 relative group" aria-labelledby="h-perfil">
          <${SectionExportBtn} sectionId="sec-perfil" name="PerfilFormato" />
          <div className="flex flex-wrap items-baseline justify-between gap-4 mb-4">
            <div>
              <h2 id="h-perfil" className="text-[18px] font-medium text-txt">Perfil por formato</h2>
              <p className="text-txt4 text-[12px] mt-1">Índice 100 = promedio de ${curPlat} ${pautaLock ? '' : pauta === 'org' ? 'orgánico' : pauta === 'paid' ? 'pauta' : '(orgánico + pauta)'} en el filtro actual. Interacciones medidas por persona alcanzada.</p>
            </div>
            <div className="flex flex-wrap gap-2">
              ${platLock ? html`
                <span className="inline-flex items-center text-[11px] bg-accent2/10 border border-accent2/30 rounded-lg px-3 py-1.5 text-accent2">${platLock}</span>
              ` : html`
                <select aria-label="Plataforma del perfil" value=${curPlat} onChange=${(e) => { setPlat(e.target.value); setSel(null); }}
                        className="text-[11px] bg-onSurface/[0.03] border border-line rounded-lg px-3 py-1.5 text-txt2">
                  ${platforms.map(p => html`<option key=${p} value=${p}>${p}</option>`)}
                </select>`}
              ${!pautaLock && html`
                <div role="radiogroup" aria-label="Tipo de pauta del perfil" className="inline-flex rounded-lg border border-line overflow-hidden text-[11px]">
                  ${[['org', 'Orgánico'], ['paid', 'Pauta'], ['all', 'Todos']].map(([k, l]) => html`
                    <button key=${k} role="radio" aria-checked=${pauta === k} onClick=${() => { setPauta(k); setSel(null); }}
                            className=${"px-3 py-1.5 transition-colors " + (pauta === k ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>${l}</button>`)}
                </div>`}
            </div>
          </div>

          <div className="flex flex-wrap gap-1.5 mb-4" role="group" aria-label="Formatos a comparar (máximo 3)">
            ${formats.map(x => {
              const ok = x.n >= PROFILE_MIN_N, on = active.includes(x.f);
              const ci = active.indexOf(x.f);
              return html`
                <button key=${x.f} disabled=${!ok} aria-pressed=${on} onClick=${() => toggle(x.f)}
                        title=${ok ? '' : `Se necesitan al menos ${PROFILE_MIN_N} posts`}
                        className=${"text-[11px] rounded-full px-2.5 py-1 border transition-colors inline-flex items-center gap-1.5 " +
                          (!ok ? "border-line text-faint cursor-not-allowed" : on ? "border-line2 bg-onSurface/[0.04] text-txt" : "border-line text-txt3 hover:text-txt")}>
                  ${on && html`<span aria-hidden="true" style=${{ width: 10, height: 0, borderTop: `2px ${PROFILE_COLORS[ci].dash ? 'dashed' : 'solid'} ${PROFILE_COLORS[ci].stroke}` }}></span>`}
                  ${x.f} · ${x.n}${ok ? '' : ' (n<' + PROFILE_MIN_N + ')'}
                </button>`;
            })}
          </div>

          ${series.length === 0 ? html`
            <div className="rounded-xl bg-surface border border-line p-8 text-center text-[12px] text-txt4">
              No hay formatos con al menos ${PROFILE_MIN_N} posts en este filtro. Amplía el periodo o cambia de plataforma.
            </div>
          ` : html`
            <div className="grid lg:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)] gap-4">
              <div className="rounded-xl bg-surface border border-line p-4" role="img"
                   aria-label=${`Gráfica de araña de ${curPlat}: ` + series.map(s => s.f + ' ' + axes.map(a => a.label + ' ' + Math.round(idx(s.raw, a.key))).join(', ')).join('; ')}>
                <div style=${{ height: 360 }}>
                  <${ResponsiveContainer}>
                    <${RadarChart} data=${data} outerRadius="72%">
                      <${PolarGrid} stroke=${ct.grid || 'rgba(128,128,128,0.25)'} />
                      <${PolarAngleAxis} dataKey="axis" tick=${{ fill: ct.axisStrong || '#888', fontSize: 11 }} />
                      <${PolarRadiusAxis} domain=${[0, domainMax]} tickCount=${Math.min(6, domainMax / 100 + 1)} tick=${{ fill: ct.axis || '#888', fontSize: 10 }} axisLine=${false} angle=${54} />
                      <${Radar} name="Promedio (100)" dataKey="base" stroke=${ct.axis || '#888'} strokeDasharray="2 3" fill="none" strokeWidth=${1} isAnimationActive=${false} />
                      ${series.map((s, i) => html`
                        <${Radar} key=${s.f} name=${s.f} dataKey=${s.f} stroke=${PROFILE_COLORS[i].stroke} strokeDasharray=${PROFILE_COLORS[i].dash}
                                  fill=${PROFILE_COLORS[i].stroke} fillOpacity=${0.08} strokeWidth=${2} isAnimationActive=${false}
                                  dot=${{ r: 3, fill: PROFILE_COLORS[i].stroke, strokeWidth: 0 }} />`)}
                      <${Tooltip} formatter=${(v, name) => [Math.round(v), name]}
                                  contentStyle=${{ background: ct.tooltipBg, border: '1px solid ' + (ct.tooltipBorder || '#333'), borderRadius: 6, fontSize: 11, fontFamily: "'Bricolage Grotesque', system-ui, sans-serif", fontVariantNumeric: 'tabular-nums', color: ct.tooltipText }} />
                    <//>
                  <//>
                </div>
                <div className="flex flex-wrap gap-4 text-[11px] text-txt3 mt-1 justify-center">
                  ${series.map((s, i) => html`<span key=${s.f} className="inline-flex items-center gap-1.5"><span aria-hidden="true" style=${{ width: 14, height: 0, borderTop: `2px ${PROFILE_COLORS[i].dash ? 'dashed' : 'solid'} ${PROFILE_COLORS[i].stroke}` }}></span>${s.f}</span>`)}
                  <span className="inline-flex items-center gap-1.5"><span aria-hidden="true" style=${{ width: 14, height: 0, borderTop: '1px dotted currentColor' }}></span>Promedio = 100</span>
                </div>
              </div>

              <div className="space-y-3 min-w-0">
                <div className="rounded-xl bg-surface border border-line overflow-x-auto">
                  <table className="w-full text-sm">
                    <caption className="sr-only">Índices por formato (100 = promedio)</caption>
                    <thead>
                      <tr className="border-b border-line text-[9px] font-mono uppercase tracking-[0.15em] text-txt4">
                        <th scope="col" className="text-left py-2 px-3 font-medium">Eje</th>
                        ${series.map(s => html`<th key=${s.f} scope="col" className="text-right py-2 px-3 font-medium">${s.f}</th>`)}
                      </tr>
                    </thead>
                    <tbody>
                      ${axes.map(a => html`
                        <tr key=${a.key} className="border-b border-line/50 last:border-0">
                          <th scope="row" className="text-left py-2 px-3 text-[12px] text-txt3 font-normal">${a.label}</th>
                          ${series.map(s => {
                            const v = Math.round(idx(s.raw, a.key));
                            if (!(s.raw[a.key] > 0)) return html`<td key=${s.f} className="py-2 px-3 text-right font-mono text-[11px] text-faint" title="El formato no registra esta métrica">n/a</td>`;
                            return html`<td key=${s.f} className="py-2 px-3 text-right font-mono tabular-nums text-[12px]" title=${a.fmt(s.raw[a.key]) + ' vs promedio ' + a.fmt(base[a.key])}>
                              <span className=${v >= 120 ? 'text-success' : v <= 80 ? 'text-amber' : 'text-txt'}>${v}</span>
                              <span className="text-[10px] text-txt4 ml-1.5">${a.fmt(s.raw[a.key])}</span>
                            </td>`;
                          })}
                        </tr>`)}
                    </tbody>
                  </table>
                </div>
                <div className="rounded-xl bg-surface border border-line p-4">
                  <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2">Lectura</div>
                  ${reading.map(r => html`
                    <p key=${r.f} className="text-[12px] text-txt3 leading-relaxed mb-1.5 last:mb-0">
                      <span className="text-txt2 font-medium">${r.f}:</span> su fuerte es ${r.hi.a.toLowerCase()} (${Math.round(r.hi.v)})
                      y su punto débil ${r.lo.a.toLowerCase()} (${Math.round(r.lo.v)}).
                    </p>`)}
                  <p className="text-[10px] text-txt4 mt-2">Verde ≥ 120 · ámbar ≤ 80 · n/a = el formato no registra esa métrica. Solo formatos con ${PROFILE_MIN_N}+ posts.</p>
                </div>
              </div>
            </div>
          `}
        </section>`;
    }

    // v25 — encabezado de bloque plegable (Análisis / Control)
    function GroupBlock({ id, label, hint, count, open, onToggle, children }) {
      return html`
        <div className="px-4 md:px-7 pt-8" id=${'grp-' + id}>
          <button onClick=${onToggle} aria-expanded=${open} aria-controls=${'grp-body-' + id}
                  className="w-full flex items-center justify-between gap-4 rounded-2xl bg-surface px-5 py-4 text-left hover:bg-onSurface/[0.03] transition-colors">
            <span className="min-w-0">
              <span className="block text-[16px] font-medium text-txt">${label}</span>
              <span className="block text-[12px] text-txt4 mt-0.5">${hint} · ${count} secciones</span>
            </span>
            <span className="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-mono text-txt3">
              ${open ? 'Ocultar' : 'Mostrar'}
              <${ChevronDownIcon} size=${14} className=${open ? 'rotate-180 transition-transform' : 'transition-transform'}/>
            </span>
          </button>
        </div>
        ${open && html`<div id=${'grp-body-' + id}>${children}</div>`}`;
    }

    const MenuIcon = ({ size = 18, className = '' }) => html`
      <svg xmlns="http://www.w3.org/2000/svg" width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth=${1.8} strokeLinecap="round" className=${className} aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>`;

    function App() {
      const { data, loading, refreshing, error, errors, fetchedAt, refresh, autoRefreshMin } = useDashboardData();
      const [selected, setSelected] = useState(null);
      const [exportOpen, setExportOpen] = useState(false);
      const [pressOpen, setPressOpen] = useState(false);
      const [mobileNav, setMobileNav] = useState(false);
      const [openGroups, setOpenGroups] = useState(() => {
        try { return JSON.parse(localStorage.getItem('smx-groups') || '{}') || {}; } catch { return {}; }
      });
      // Abre todos los bloques sin guardarlo como preferencia; devuelve cómo regresar
      const expandAllForPdf = useCallback(() => new Promise(resolve => {
        let before = null;
        setOpenGroups(prev => { before = prev; return { ...prev, analisis: true, control: true }; });
        setTimeout(() => resolve(() => setOpenGroups(before || {})), 1800);
      }), []);
      const setGroup = useCallback((k, v) => setOpenGroups(prev => {
        const next = { ...prev, [k]: v };
        try { localStorage.setItem('smx-groups', JSON.stringify(next)); } catch {}
        return next;
      }), []);
      const [kpiTrace, setKpiTrace] = useState(null);
      const allPosts = data?.allPosts || [];
      const { filters, setFilters, clear, isActive } = useFilters(allPosts);
      const { theme, toggleTheme, chart: chartTheme } = useTheme();

      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('smx-sidebar-collapsed') === '1'; } catch { return false; }
      });
      const toggleSidebar = useCallback(() => {
        setSidebarCollapsed(prev => {
          const next = !prev;
          try { localStorage.setItem('smx-sidebar-collapsed', next ? '1' : '0'); } catch {}
          return next;
        });
      }, []);

      // baseMeta y filteredData se recalculan SOLO cuando cambian
      // los datos crudos o los filtros — nunca durante un re-render normal.
      const baseMeta = data?.meta || null;
      // allPosts ya se calculó arriba, antes de useFilters (lo necesita
      // para poder recortar selecciones que dejan de tener sentido).

      const filteredData = useMemo(() => {
        if (!data || !baseMeta) return null;
        const filtered = applyFilters(allPosts, filters);
        const result = computeAggregates(filtered, baseMeta);
        // Expone el año seleccionado en meta para que TrendSection/PlatformsGrid
        // sepan qué año usar al calcular los 7 días de la semana en modo diario.
        result.meta.selected_year = filters.year;
        return result;
      }, [data, allPosts, baseMeta, filters]);

      // OJO: este hook tiene que vivir ANTES de los early-return de abajo
      // (loading/error) — un useMemo colocado después de un return
      // condicional rompe las Rules of Hooks (a veces se ejecuta, a veces
      // no) y React tira el error #310.
      // v21 — benchmarks por segmento sobre TODA la base (no depende de filtros)
      const benchmarks = useMemo(() => buildBenchmarks(allPosts), [allPosts]);

      const anomalyCount = useMemo(() => {
        if (!filteredData || filteredData.global.posts === 0) return 0;
        return computeAnomalies(filteredData).length;
      }, [filteredData]);

      if (loading) return html`<${LoadingState}/>`;
      if (error)   return html`<${ErrorState} message=${error} onRetry=${refresh}/>`;
      if (!data || !filteredData) return html`<${ErrorState} message="Sin datos disponibles." onRetry=${refresh}/>`;

      const D = filteredData;
      const noResults = D.global.posts === 0;

      return html`
        <div className="min-h-screen bg-ink text-txt flex">
          <${ScrollProgressBar}/>
          <div className="hidden lg:block shrink-0">
          <${Sidebar}
            openGroups=${openGroups} onOpenGroup=${(k) => setGroup(k, true)}
            collapsed=${sidebarCollapsed}
            onToggle=${toggleSidebar}
            liveAlcance=${D.global.reach}
            livePosts=${D.global.posts}
            fetchedAt=${fetchedAt}
            autoRefreshMin=${autoRefreshMin}
            theme=${theme}
            onToggleTheme=${toggleTheme}
            onOpenExport=${() => setExportOpen(true)}
            anomalyCount=${noResults ? 0 : anomalyCount}
          />
          </div>
          ${mobileNav && html`
            <div className="lg:hidden fixed inset-0 z-50 flex" role="dialog" aria-modal="true" aria-label="Menú de secciones">
              <div className="absolute inset-0 bg-black/55" onClick=${() => setMobileNav(false)}></div>
              <div className="relative h-full shadow-2xl">
                <${Sidebar}
                  openGroups=${openGroups} onOpenGroup=${(k) => setGroup(k, true)} onNavigate=${() => setMobileNav(false)}
                  collapsed=${false} onToggle=${() => setMobileNav(false)}
                  liveAlcance=${D.global.reach} livePosts=${D.global.posts}
                  fetchedAt=${fetchedAt} autoRefreshMin=${autoRefreshMin}
                  theme=${theme} onToggleTheme=${toggleTheme}
                  onOpenExport=${() => { setMobileNav(false); setExportOpen(true); }}
                  anomalyCount=${noResults ? 0 : anomalyCount} />
              </div>
            </div>`}

          <div className="flex-1 min-w-0 flex flex-col">
            <div className="lg:hidden flex items-center justify-between gap-3 px-4 pt-3">
              <button onClick=${() => setMobileNav(true)} aria-label="Abrir menú de secciones"
                      className="w-9 h-9 rounded-lg bg-surface flex items-center justify-center text-txt2"><${MenuIcon}/></button>
              <span className="text-[11px] font-mono uppercase tracking-[0.18em] text-txt3">Samsung MX · Performance</span>
              <span className="w-9"></span>
            </div>
            <${FilterBar}
              baseMeta=${baseMeta}
              filters=${filters}
              setFilters=${setFilters}
              clear=${clear}
              isActive=${isActive}
              postsInScope=${D.global.posts}
              totalPosts=${baseMeta.total_posts}
              allPosts=${allPosts}
            />

            <${TopBar} fetchedAt=${fetchedAt} onRefresh=${refresh} refreshing=${refreshing} autoRefreshMin=${autoRefreshMin} allPosts=${allPosts} onPick=${setSelected} onOpenPress=${() => setPressOpen(true)} onExpandAll=${expandAllForPdf}/>

            ${errors && errors.length > 0 && html`
              <div className="px-4 md:px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Aviso</span> · No se pudo cargar
                  ${errors.length === 1 ? ' ' + errors[0].platform : ` ${errors.length} pestañas`}.
                  Las demás se muestran con normalidad.
                </div>
              </div>
            `}

            ${baseMeta.orphans_no_week > 0 && filters.weeks.length > 0 && html`
              <div className="px-4 md:px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Nota</span> ·
                  Hay ${baseMeta.orphans_no_week} ${baseMeta.orphans_no_week === 1 ? 'post' : 'posts'} sin semana asignada en tu Sheet
                  (${Object.entries(baseMeta.orphans_no_week_by_platform).map(([p,n]) => `${p}: ${n}`).join(', ')})
                  — se excluyen del filtro actual de semana.
                </div>
              </div>
            `}

            ${baseMeta.orphans_no_stage > 0 && filters.stages.length > 0 && html`
              <div className="px-4 md:px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Nota</span> ·
                  Hay ${baseMeta.orphans_no_stage} ${baseMeta.orphans_no_stage === 1 ? 'post' : 'posts'} sin etapa asignada en tu Sheet
                  (${Object.entries(baseMeta.orphans_no_stage_by_platform).map(([p,n]) => `${p}: ${n}`).join(', ')})
                  — se excluyen del filtro actual de etapa.
                </div>
              </div>
            `}

            ${noResults ? html`
              <div className="px-4 md:px-7 py-32 text-center">
                <div className="font-mono text-[11px] uppercase tracking-[0.2em] text-amber mb-4">Sin resultados</div>
                <h2 className="text-3xl text-txt mb-3 font-medium">No hay posts que cumplan los filtros.</h2>
                <p className="text-txt3 text-sm mb-6">Prueba ampliando el rango de semanas o quitando alguna selección.</p>
                <button onClick=${clear}
                        className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-accent text-ink text-sm font-medium hover:bg-accent2 hover:text-white transition-colors">
                  Limpiar filtros
                </button>
              </div>
            ` : html`
              <main>
                <${HeroSection} D=${D} chartTheme=${chartTheme}
                  kpis=${html`<${KpiRow} embedded D=${D} onTrace=${(key) => setKpiTrace(computeKpiTrace(D, key))} rawPosts=${allPosts} filters=${filters}/>`} />
                <${InsightsPanel}  D=${D}/>
                <${PlatformsGrid}  D=${D} filters=${filters} setFilters=${setFilters}/>
                <${TrendSection}   D=${D} chartTheme=${chartTheme}/>
                <${TopPostsTable}  D=${D} onPick=${setSelected} filters=${filters} benchmarks=${benchmarks}/>
                <${VtrSection}         D=${D} onPick=${setSelected}/>
                <${FollowerGoalsSection} fetchedAt=${fetchedAt} chartTheme=${chartTheme}/>

                <${GroupBlock} id="analisis" label="Análisis" hint="Mezcla, perfil por formato, promedios, comparativas, catálogo, cadencia, horarios y simulador"
                  count=${8} open=${!!openGroups.analisis} onToggle=${() => setGroup('analisis', !openGroups.analisis)}>
                  <${MixSection}     D=${D} filters=${filters} setFilters=${setFilters}/>
                  <${FormatProfileSection} D=${D} filters=${filters} chartTheme=${chartTheme}/>
                  <${AveragesSection}    D=${D}/>
                  <${ComparativasSection} D=${D} rawPosts=${allPosts} filters=${filters} chartTheme=${chartTheme}/>
                  <${CatalogSection}     D=${D} filters=${filters} setFilters=${setFilters}/>
                  <${CadenceSection}     D=${D}/>
                  <${HorariosSection}    D=${D}/>
                  <${SimuladorSection}   allPosts=${allPosts}/>
                <//>

                <${GroupBlock} id="control" label="Control" hint=${`Anomalías${anomalyCount ? ` (${anomalyCount})` : ''} y calidad de datos`}
                  count=${2} open=${!!openGroups.control} onToggle=${() => setGroup('control', !openGroups.control)}>
                  <${AnomaliesSection}   D=${D} onPick=${setSelected} rawPosts=${allPosts}/>
                  <${DataQualitySection} D=${D} onPick=${setSelected} rawPosts=${allPosts}/>
                <//>
              </main>
            `}

            <${DiagnosticPanel} />

            <${Footer} fetchedAt=${fetchedAt} totalPosts=${baseMeta.total_posts}/>
          </div>

          ${selected && html`<${DetailDrawer} post=${selected} benchmarks=${benchmarks} onClose=${() => setSelected(null)}/>`}
          ${kpiTrace && html`<${KpiTraceDrawer} trace=${kpiTrace} onClose=${() => setKpiTrace(null)} onPick=${(p) => { setKpiTrace(null); setSelected(p); }}/>`}
          <${ExportModal} open=${exportOpen} onClose=${() => setExportOpen(false)} D=${D} filters=${filters}/>
          <${PressModal} open=${pressOpen} onClose=${() => setPressOpen(false)} allPosts=${allPosts}/>
        </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
</html>
