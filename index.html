                  ${[['#5DCAA5', 'Stay & Play'], ['#F0B358', 'Tendencia'], ['#888', 'Todo TikTok (punteada)']].map(([c, l]) => html`<span key=${l} className="inline-flex items-center gap-1.5 text-[11px] text-txt3"><span className="w-2.5 h-2.5 rounded-full" style=${{ background: c }}></span>${l}</span>`)}
                </div>`}
              </div>
            </div>

            <div className="rounded-xl bg-surface p-5 overflow-x-auto">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div className="text-[13px] font-medium text-txt">Posts de Tendencia y Stay & Play</div>
                <div className="inline-flex items-center rounded-lg bg-onSurface/[0.04] p-0.5" role="radiogroup" aria-label="Grupo">
                  ${[['all', 'Ambos'], ['tend', 'Tendencia'], ['stay', 'Stay & Play']].map(([k, l]) => html`
                    <button key=${k} role="radio" aria-checked=${focus === k} onClick=${() => setFocus(k)}
                            className=${"px-2.5 py-1 rounded-md text-[11px] transition-colors " + (focus === k ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>${l}</button>`)}
                </div>
              </div>
              ${!focusList.length ? html`<div className="text-[12px] text-txt4 py-4">No hay posts de este grupo en el filtro actual.</div>` : html`
              <table className="w-full text-[12px] whitespace-nowrap">
                <thead><tr>
                  <th className="text-left py-2 px-2">Fecha</th><th className="text-left py-2 px-2">Grupo</th><th className="text-left py-2 px-2">Campaña · subcampaña</th>
                  <th className="text-right py-2 px-2">Duración</th><th className="text-right py-2 px-2">VTR</th><th className="text-right py-2 px-2">Vista prom.</th>
                  <th className="text-right py-2 px-2">ER básico</th><th className="text-right py-2 px-2">Alcance</th><th className="text-right py-2 px-2">Compart.</th>
                  <th className="text-right py-2 px-2">Guard.</th><th className="text-right py-2 px-2">Seguidores</th><th className="text-right py-2 px-2">Link</th>
                </tr></thead>
                <tbody>
                  ${[...focusList].sort((a, b) => (parseDate(b.date) || 0) - (parseDate(a.date) || 0)).map((p, i) => {
                    const g = ttGroupOf(p);
                    const up = (v, m) => v == null || m == null ? '' : v >= m ? 'text-success' : 'text-amber';
                    return html`<tr key=${i} onClick=${() => onPick && onPick(p)} className="cursor-pointer hover:bg-onSurface/[0.03]">
                      <td className="py-2 px-2 font-mono text-[11px] text-txt3">${dateShort(p.date)}</td>
                      <td className="py-2 px-2"><span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style=${{ background: g.color }}></span>${g.l}</span></td>
                      <td className="py-2 px-2 text-txt3 max-w-[220px] truncate" title=${`${p.campaign || ''} · ${p.subcampaign || ''}`}>${p.campaign || '—'}${p.subcampaign ? ' · ' + p.subcampaign : ''}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${p.duration ? p.duration + ' s' : '—'}</td>
                      <td className=${"py-2 px-2 text-right tabular-nums " + up(p.vtr, medVtr)}>${p.vtr > 0 ? pct(p.vtr) : '—'}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${p.avg_watch_time > 0 ? num1(p.avg_watch_time, ' s') : '—'}</td>
                      <td className=${"py-2 px-2 text-right tabular-nums " + up(p.basic_er, medBer)}>${pct(p.basic_er)}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(p.reach)}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(p.shares)}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(p.saves)}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${p.new_followers != null ? fmtFull(p.new_followers) : '—'}</td>
                      <td className="py-2 px-2 text-right"><${PostLink} p=${p} compact /></td>
                    </tr>`;
                  })}
                </tbody>
              </table>
              <div className="text-[11px] text-txt4 mt-2">Verde/ámbar: arriba o abajo de la mediana de TikTok del filtro (VTR ${pct(medVtr)} · ER básico ${pct(medBer)}).</div>`}
            </div>`}
        </section>`;
    }

    // ============================================================
    // v75 — MAPA DE CONTENIDO (estilo simulación de agentes)
    // Red de campañas · conceptos · productos · influencers · piezas,
    // enjambre de posts (duración × índice) y recetas en vivo.
    // Índice = ER básico del post ÷ ER básico mediano de su plataforma
    // en la vista actual (1× = post típico de esa plataforma). Así las
    // plataformas se comparan entre sí sin que TikTok aplaste a X.
    // ============================================================
    const MAP_TYPES = {
      campaign:   { label: 'Campaña',    color: '#5B7CFA' },
      concept:    { label: 'Concepto',   color: '#F08C3A' },
      product:    { label: 'Producto',   color: '#2FB083' },
      influencer: { label: 'Influencer', color: '#A55EEA' },
      piece:      { label: 'Pieza',      color: '#3FB6C8' },
    };
    const MAP_TYPE_LIMIT = { campaign: 12, concept: 16, product: 14, influencer: 12, piece: 14 };
    const MAP_HOT = '#F0386B';
    const MAP_GOOD = '#2FB083', MAP_BAD = '#E5484D';
    const MAP_SKIP = /^(n\/?a|na|ninguno|ninguna|no aplica|sin .*|-|—|0)$/i;
    const MAP_DUR = [
      { k: '≤10 s', lo: 0, hi: 10 }, { k: '11–15 s', lo: 10, hi: 15 }, { k: '16–20 s', lo: 15, hi: 20 },
      { k: '21–30 s', lo: 20, hi: 30 }, { k: '31–45 s', lo: 30, hi: 45 }, { k: '46–60 s', lo: 45, hi: 60 },
      { k: '60 s+', lo: 60, hi: 600 },
    ];
    const MAP_DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const mapDurB = (d) => (d > 0 ? MAP_DUR.find(b => d > b.lo && d <= b.hi) || null : null);
    const mapMed = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
    const mapMean = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : null);
    const mapRateOk = (p) => p.basic_er != null && p.basic_er > 0 && p.reach > 0 &&
      !((p.platform === 'Instagram' || p.platform === 'Facebook') && p.format === 'Stories');
    const mapX = (v) => (v == null ? '—' : (v >= 9.95 ? v.toFixed(0) : v.toFixed(1)) + '×');
    const mapPct = (v) => (v == null ? '—' : v.toFixed(1) + '%');
    const mapTrunc = (s, n = 16) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
    function mapHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
    function mapRng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const mapReduced = () => typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function computeContentMap(posts) {
      const rated = posts.filter(mapRateOk);
      const byPlat = {};
      for (const p of rated) (byPlat[p.platform] = byPlat[p.platform] || []).push(p.basic_er);
      const platMed = {};
      for (const [k, v] of Object.entries(byPlat)) platMed[k] = mapMed(v);
      const items = rated.map((p, i) => {
        const d = parseDate(p.date);
        return {
          p, i, idx: p.basic_er / platMed[p.platform],
          dur: p.duration > 0 ? p.duration : null,
          week: p.week, vtr: p.vtr != null && isFinite(p.vtr) ? p.vtr : null,
          day: d ? d.getDay() : null, j: mapHash(String(p.link || '') + i), nodes: [],
        };
      });
      // ---- nodos
      const raw = new Map();
      const keyOf = (type, name) => {
        const n = String(name || '').trim();
        if (!n || MAP_SKIP.test(n)) return null;
        return { id: type + '|' + foldTxt(n), type, name: n };
      };
      for (const it of items) {
        const p = it.p;
        const ks = [keyOf('campaign', p.campaign), keyOf('concept', p.subcampaign), keyOf('product', p.product),
          isInfluencer(p) ? keyOf('influencer', p.influencer_name) : null,
          keyOf('piece', p.platform + ' · ' + (p.format || 'Sin formato'))].filter(Boolean);
        const seen = new Set();
        for (const k of ks) {
          if (seen.has(k.id)) continue; seen.add(k.id);
          if (!raw.has(k.id)) raw.set(k.id, { id: k.id, type: k.type, names: new Map(), items: [] });
          const r = raw.get(k.id); r.items.push(it); r.names.set(k.name, (r.names.get(k.name) || 0) + 1);
          it.nodes.push(k.id);
        }
      }
      const kept = new Set();
      const nodes = [];
      for (const type of Object.keys(MAP_TYPES)) {
        const list = [...raw.values()].filter(r => r.type === type && r.items.length >= 3)
          .sort((a, b) => b.items.length - a.items.length).slice(0, MAP_TYPE_LIMIT[type]);
        for (const r of list) {
          kept.add(r.id);
          const name = [...r.names.entries()].sort((a, b) => b[1] - a[1])[0][0];
          const vt = r.items.map(x => x.vtr).filter(v => v != null);
          nodes.push({ id: r.id, type, name, n: r.items.length, idx: mapMed(r.items.map(x => x.idx)),
            er: mapMed(r.items.map(x => x.p.basic_er)), vtr: vt.length >= 3 ? mapMean(vt) : null, items: r.items,
            r: Math.min(19, 3.5 + Math.sqrt(r.items.length) * 0.95) });
        }
      }
      // ---- conexiones (co-ocurrencia en el mismo post)
      const em = new Map();
      for (const it of items) {
        const ids = it.nodes.filter(id => kept.has(id));
        for (let a = 0; a < ids.length; a++) for (let b = a + 1; b < ids.length; b++) {
          const k = ids[a] < ids[b] ? ids[a] + '~' + ids[b] : ids[b] + '~' + ids[a];
          em.set(k, (em.get(k) || 0) + 1);
        }
      }
      const minW = items.length > 400 ? 2 : 1;
      const edges = [...em.entries()].filter(([, w]) => w >= minW).sort((a, b) => b[1] - a[1]).slice(0, 300)
        .map(([k, w]) => { const [a, b] = k.split('~'); return { a, b, w }; });
      const linked = new Set(edges.flatMap(e => [e.a, e.b]));
      const finalNodes = nodes.filter(n => linked.has(n.id));
      // ---- zona de duración con mejor índice (todas las plataformas, videos)
      const durStats = MAP_DUR.map(b => {
        const xs = items.filter(x => x.dur != null && x.dur > b.lo && x.dur <= b.hi);
        return { ...b, n: xs.length, idx: mapMed(xs.map(x => x.idx)) };
      });
      const bestDur = durStats.filter(b => b.n >= 15).sort((a, b) => b.idx - a.idx)[0] || null;
      const weeks = posts.map(p => p.week).filter(w => w != null);
      return { items, nodes: finalNodes, edges, platMed, bestDur, durStats,
        lastWeek: weeks.length ? Math.max(...weeks) : null, total: posts.length };
    }

    function computeRecipes(items) {
      const plats = {};
      for (const it of items) (plats[it.p.platform] = plats[it.p.platform] || []).push(it);
      const best = (groups, min) => groups.filter(g => g.n >= min).sort((a, b) => b.idx - a.idx)[0] || null;
      const grp = (xs, keyFn) => {
        const m = new Map();
        for (const x of xs) { const k = keyFn(x); if (k == null) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
        return [...m.entries()].map(([k, v]) => ({ k, n: v.length, idx: mapMed(v.map(x => x.idx)),
          vtr: (() => { const vs = v.map(x => x.vtr).filter(z => z != null); return vs.length >= 3 ? mapMean(vs) : null; })() }));
      };
      return Object.entries(plats).filter(([, xs]) => xs.length >= 15).map(([pl, xs]) => {
        const fmt = best(grp(xs, x => x.p.format || null), 8);
        const durs = grp(xs.filter(x => x.dur != null), x => (mapDurB(x.dur) || {}).k || null);
        const dur = (() => { const d = best(durs, 6); return d && d.idx >= 1 ? d : null; })();
        const shortest = MAP_DUR.map(b => durs.find(d => d.k === b.k)).find(d => d && d.n >= 6) || null;
        const day = best(grp(xs, x => (x.day == null ? null : MAP_DAYS[x.day])), 6);
        const worstDay = grp(xs, x => (x.day == null ? null : MAP_DAYS[x.day])).filter(g => g.n >= 6).sort((a, b) => a.idx - b.idx)[0] || null;
        return { pl, n: xs.length, fmt, dur, shortest, day, worstDay };
      }).sort((a, b) => b.n - a.n);
    }

    function useCountUp(target, dur = 900) {
      const [v, setV] = useState(0);
      useEffect(() => {
        if (target == null || !isFinite(target)) { setV(target); return; }
        if (mapReduced()) { setV(target); return; }
        let raf; const t0 = performance.now();
        const tick = (t) => { const k = Math.min(1, (t - t0) / dur); setV(target * (1 - Math.pow(1 - k, 3))); if (k < 1) raf = requestAnimationFrame(tick); };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [target]);
      return v;
    }

    function MapCounter({ label, value, fmtFn, tone }) {
      const v = useCountUp(value);
      return html`<div className="min-w-0">
        <div className="text-[9px] font-mono uppercase tracking-[0.2em] text-txt4 mb-1">${label}</div>
        <div className=${"font-mono tabular-nums text-[22px] leading-none " + (tone || 'text-txt')}>${v == null ? '—' : fmtFn(v)}</div>
      </div>`;
    }

    // ---------- Red (fuerzas propias, sin librerías) ----------
    const NET_W = 760, NET_H = 540;
    function useForceLayout(nodes, edges) {
      const [pos, setPos] = useState({});
      useEffect(() => {
        if (!nodes.length) { setPos({}); return; }
        const rnd = mapRng(nodes.length * 7919 + edges.length * 31);
        const P = nodes.map(n => ({ id: n.id, r: n.r, x: NET_W / 2 + (rnd() - 0.5) * NET_W * 0.85, y: NET_H / 2 + (rnd() - 0.5) * NET_H * 0.85, vx: 0, vy: 0 }));
        const ix = new Map(P.map((p, i) => [p.id, i]));
        const maxW = Math.max(1, ...edges.map(e => e.w));
        const E = edges.map(e => ({ a: ix.get(e.a), b: ix.get(e.b), w: e.w })).filter(e => e.a != null && e.b != null);
        let alpha = 1;
        const step = () => {
          for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
            const A = P[i], B = P[j];
            let dx = B.x - A.x, dy = B.y - A.y; const d2 = dx * dx + dy * dy || 0.01; const d = Math.sqrt(d2);
            let f = 3200 * alpha / d2; const minD = A.r + B.r + 12;
            if (d < minD) f += (minD - d) * 0.25;
            dx /= d; dy /= d; A.vx -= dx * f; A.vy -= dy * f; B.vx += dx * f; B.vy += dy * f;
          }
          for (const e of E) {
            const A = P[e.a], B = P[e.b]; const dx = B.x - A.x, dy = B.y - A.y; const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const k = 0.006 * (1 + 2 * Math.sqrt(e.w / maxW)) * alpha; const f = (d - 125) * k;
            A.vx += dx / d * f; A.vy += dy / d * f; B.vx -= dx / d * f; B.vy -= dy / d * f;
          }
          for (const p of P) {
            p.vx += (NET_W / 2 - p.x) * 0.0022 * alpha; p.vy += (NET_H / 2 - p.y) * 0.0042 * alpha;
            p.vx *= 0.62; p.vy *= 0.62; p.x += p.vx; p.y += p.vy;
            p.x = Math.max(p.r + 6, Math.min(NET_W - p.r - 70, p.x)); p.y = Math.max(p.r + 10, Math.min(NET_H - p.r - 12, p.y));
          }
          alpha *= 0.986;
        };
        const snap = () => setPos(Object.fromEntries(P.map(p => [p.id, { x: p.x, y: p.y }])));
        if (mapReduced()) { while (alpha > 0.02) step(); snap(); return; }
        let raf;
        const loop = () => { step(); step(); snap(); if (alpha > 0.02) raf = requestAnimationFrame(loop); };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, [nodes, edges]);
      return pos;
    }

    function MapNetwork({ M, sel, setSel, hover, setHover, colorMode }) {
      const pos = useForceLayout(M.nodes, M.edges);
      const focus = sel || hover;
      const nbr = useMemo(() => {
        if (!focus) return null;
        const s = new Set([focus]);
        for (const e of M.edges) { if (e.a === focus) s.add(e.b); if (e.b === focus) s.add(e.a); }
        return s;
      }, [focus, M.edges]);
      const maxW = Math.max(1, ...M.edges.map(e => e.w));
      const fillOf = (n) => {
        if (colorMode === 'type') return MAP_TYPES[n.type].color;
        if (n.idx == null) return 'rgb(var(--c-faint))';
        return n.idx >= 1.15 ? MAP_GOOD : n.idx <= 0.85 ? MAP_BAD : 'rgb(var(--c-txt4))';
      };
      const showLabel = useMemo(() => {
        const out = new Map(); const boxes = [];
        const pri = (n) => (n.id === focus ? 1e6 : nbr && nbr.has(n.id) ? 1e5 + n.n : n.n);
        for (const n of [...M.nodes].sort((a, b) => pri(b) - pri(a))) {
          const p = pos[n.id]; if (!p) continue;
          const len = Math.min(n.id === focus ? 28 : 16, n.name.length);
          const wl = len * 5.7 + 6; const left = p.x + n.r + wl > NET_W - 2;
          const bx = left ? { x0: p.x - n.r - wl, x1: p.x - n.r - 2, y0: p.y - 7, y1: p.y + 7 } : { x0: p.x + n.r + 2, x1: p.x + n.r + wl, y0: p.y - 7, y1: p.y + 7 };
          const hit = boxes.some(o => !(bx.x1 < o.x0 || bx.x0 > o.x1 || bx.y1 < o.y0 || bx.y0 > o.y1));
          if (!hit || n.id === focus) { out.set(n.id, left); boxes.push(bx); }
        }
        return out;
      }, [pos, M.nodes, focus, nbr]);
      const ordered = focus ? [...M.edges.filter(e => e.a !== focus && e.b !== focus), ...M.edges.filter(e => e.a === focus || e.b === focus)] : M.edges;
      return html`<svg viewBox=${`0 0 ${NET_W} ${NET_H}`} className="w-full h-auto block select-none" role="img"
          aria-label="Red de campañas, conceptos, productos, influencers y piezas conectados por los posts que comparten"
          onClick=${(e) => { if (e.target.tagName === 'svg') setSel(null); }}>
        <g>
          ${ordered.map(e => {
            const a = pos[e.a], b = pos[e.b]; if (!a || !b) return null;
            const on = focus && (e.a === focus || e.b === focus);
            const w = 0.6 + 2.6 * Math.sqrt(e.w / maxW);
            return html`<line key=${e.a + e.b} x1=${a.x} y1=${a.y} x2=${b.x} y2=${b.y}
              stroke=${on ? MAP_HOT : 'rgb(var(--c-txt))'} strokeWidth=${on ? Math.max(2, w * 1.4) : w}
              strokeOpacity=${on ? 0.95 : focus ? 0.035 : 0.09} strokeLinecap="round"/>`;
          })}
        </g>
        <g>
          ${M.nodes.map(n => {
            const p = pos[n.id]; if (!p) return null;
            const dim = nbr && !nbr.has(n.id);
            const isSel = focus === n.id;
            return html`<g key=${n.id} transform=${`translate(${p.x},${p.y})`} style=${{ cursor: 'pointer', transition: 'opacity .25s' }}
                opacity=${dim ? 0.18 : 1}
                onMouseEnter=${() => setHover(n.id)} onMouseLeave=${() => setHover(null)}
                onClick=${(ev) => { ev.stopPropagation(); setSel(sel === n.id ? null : n.id); }}>
              <title>${MAP_TYPES[n.type].label + ': ' + n.name + ' · ' + n.n + ' posts · índice ' + mapX(n.idx)}</title>
              ${isSel && html`<circle r=${n.r + 6} fill="none" stroke=${MAP_HOT} strokeWidth="2.5"/>`}
              <circle r=${n.r} fill=${fillOf(n)} stroke="rgb(var(--c-surface))" strokeWidth="2"/>
              
            </g>`;
          })}
        </g>
        <g style=${{ pointerEvents: 'none' }}>
          ${M.nodes.map(n => {
            const p = pos[n.id]; if (!p || !showLabel.has(n.id)) return null;
            const dim = nbr && !nbr.has(n.id); const isSel = focus === n.id;
            return html`<g key=${n.id} transform=${`translate(${p.x},${p.y})`} opacity=${dim ? 0.25 : 1}><text x=${showLabel.get(n.id) ? -(n.r + 5) : n.r + 5} y="3.5" textAnchor=${showLabel.get(n.id) ? 'end' : 'start'} fontSize="10.5" fill="rgb(var(--c-txt))"
                stroke="rgb(var(--c-surface))" strokeWidth="3.5" strokeLinejoin="round" paintOrder="stroke" style=${{ pointerEvents: 'none', fontWeight: isSel || n.n >= 60 ? 600 : 400 }}>${mapTrunc(n.name, isSel ? 28 : 16)}</text></g>`;
          })}
        </g>
      </svg>`;
    }

    // ---------- Enjambre (canvas) ----------
    const SW_W = 760, SW_H = 420, SW_L = 46, SW_R = 14, SW_T = 18, SW_B = 34;
    function swarmTarget(it, mode) {
      const yv = Math.log10(Math.max(0.1, Math.min(10, it.idx)));
      const y = SW_T + (1 - (yv + 1) / 2) * (SW_H - SW_T - SW_B) + (it.j - 0.5) * 6;
      if (mode === 'week') {
        const w = Math.max(1, Math.min(53, it.week || 1));
        return { x: SW_L + 8 + (w - 1) / 52 * (SW_W - SW_L - SW_R - 16) + (it.j - 0.5) * 9, y };
      }
      if (it.dur == null) return { x: SW_L + 10 + it.j * 44, y };
      const d = Math.min(it.dur, 120);
      return { x: SW_L + 78 + Math.sqrt(d / 120) * (SW_W - SW_L - SW_R - 92) + (it.j - 0.5) * 7, y };
    }
    const swarmDurX = (d) => SW_L + 78 + Math.sqrt(Math.min(d, 120) / 120) * (SW_W - SW_L - SW_R - 92);
    const swarmY = (v) => SW_T + (1 - (Math.log10(v) + 1) / 2) * (SW_H - SW_T - SW_B);
    const cssVar = (name) => (getComputedStyle(document.documentElement).getPropertyValue(name) || '').trim();
    const cssRgb = (name, a = 1) => { const v = cssVar(name); return v.includes(',') || v.startsWith('#') || v.startsWith('rgb') ? v : `rgba(${v.split(/\s+/).join(',')},${a})`; };

    function MapSwarm({ M, mode, colorMode, focusSet, onPick }) {
      const ref = useRef(null);
      const st = useRef({ cur: null, from: null, t0: 0, raf: 0, hover: null });
      const [tip, setTip] = useState(null);
      const colorOf = (it) => colorMode === 'infl' ? (isInfluencer(it.p) ? MAP_HOT : null) : (PLAT_COLORS[it.p.platform] || '#888');
      const draw = useCallback(() => {
        const cv = ref.current; if (!cv) return;
        const dpr = window.devicePixelRatio || 1;
        if (cv.width !== SW_W * dpr) { cv.width = SW_W * dpr; cv.height = SW_H * dpr; }
        const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, SW_W, SW_H);
        const txt3 = cssRgb('--c-txt3'), txt4 = cssRgb('--c-txt4'), grid = cssRgb('--c-txt', 0.07), muted = cssRgb('--c-txt4', 0.55);
        g.font = '10px "JetBrains Mono", ui-monospace, monospace';
        // zona ganadora
        if (mode === 'dur' && M.bestDur) {
          const x0 = swarmDurX(M.bestDur.lo), x1 = swarmDurX(M.bestDur.hi);
          g.fillStyle = 'rgba(240,56,107,0.08)'; g.fillRect(x0, SW_T, x1 - x0, SW_H - SW_T - SW_B);
          g.fillStyle = MAP_HOT; g.textAlign = 'center';
          g.fillText('MEJOR ZONA · ' + mapX(M.bestDur.idx), (x0 + x1) / 2, SW_T - 5);
        }
        // eje y (índice)
        g.textAlign = 'right';
        for (const v of [0.1, 0.3, 1, 3, 10]) {
          const y = swarmY(v);
          g.fillStyle = v === 1 ? txt3 : txt4; g.fillText(mapX(v), SW_L - 8, y + 3);
          if (v === 1) { g.fillStyle = grid; g.fillRect(SW_L, y - 0.75, SW_W - SW_L - SW_R, 1.5); }
        }
        // eje x
        g.textAlign = 'center'; g.fillStyle = txt4;
        const yb = SW_H - SW_B + 18;
        if (mode === 'dur') {
          g.fillText('SIN VIDEO', SW_L + 32, yb);
          for (const d of [5, 15, 30, 60, 120]) g.fillText(d === 120 ? '120 s+' : d + ' s', swarmDurX(d), yb);
        } else {
          for (const w of [1, 10, 20, 30, 40, 50]) g.fillText('S' + w, SW_L + 8 + (w - 1) / 52 * (SW_W - SW_L - SW_R - 16), yb);
        }
        // puntos
        const s = st.current; const now = performance.now();
        const k = s.from ? Math.min(1, (now - s.t0) / 1500) : 1;
        const items = M.items; const r = items.length > 1500 ? 2.1 : items.length > 600 ? 2.6 : 3.2;
        const order = focusSet ? [...items.filter(it => !focusSet.has(it.i)), ...items.filter(it => focusSet.has(it.i))] : items;
        for (const it of order) {
          const to = s.cur[it.i]; let x = to.x, y = to.y;
          if (s.from && k < 1) {
            const f = s.from[it.i]; const kk = Math.max(0, Math.min(1, (k - it.j * 0.3) / 0.7)); const e = 1 - Math.pow(1 - kk, 3);
            x = f.x + (to.x - f.x) * e; y = f.y + (to.y - f.y) * e;
          }
          it._x = x; it._y = y;
          const c = colorOf(it);
          const on = focusSet ? focusSet.has(it.i) : true;
          g.globalAlpha = on ? (c ? 0.88 : 0.5) : 0.07;
          g.fillStyle = c || muted;
          g.beginPath(); g.arc(x, y, focusSet && on ? r + 1.1 : r, 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;
        if (s.hover) { const h = s.hover; g.strokeStyle = cssRgb('--c-txt'); g.lineWidth = 1.5; g.beginPath(); g.arc(h._x, h._y, r + 3, 0, Math.PI * 2); g.stroke(); }
        if (k < 1) s.raf = requestAnimationFrame(draw);
      }, [M, mode, colorMode, focusSet]);

      // posiciones: dispersión inicial → destino (animado)
      useEffect(() => {
        const s = st.current; cancelAnimationFrame(s.raf);
        const target = {}; for (const it of M.items) target[it.i] = swarmTarget(it, mode);
        let from = s.cur;
        if (!from || Object.keys(from).length !== M.items.length) {
          const rnd = mapRng(M.items.length);
          from = {}; for (const it of M.items) from[it.i] = { x: SW_L + rnd() * (SW_W - SW_L - SW_R), y: SW_T + rnd() * (SW_H - SW_T - SW_B) };
        }
        s.from = mapReduced() ? null : from; s.cur = target; s.t0 = performance.now();
        s.raf = requestAnimationFrame(draw);
        return () => cancelAnimationFrame(s.raf);
      }, [M, mode]);
      useEffect(() => { if (st.current.cur) { cancelAnimationFrame(st.current.raf); st.current.raf = requestAnimationFrame(draw); } }, [draw]);
      useEffect(() => {
        const mo = new MutationObserver(() => requestAnimationFrame(draw));
        mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        return () => mo.disconnect();
      }, [draw]);

      const locate = (e) => {
        const cv = ref.current; const rc = cv.getBoundingClientRect();
        const x = (e.clientX - rc.left) * SW_W / rc.width, y = (e.clientY - rc.top) * SW_H / rc.height;
        let best = null, bd = 64;
        for (const it of M.items) { if (it._x == null) continue; const dx = it._x - x, dy = it._y - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = it; } }
        return { best, rc, x, y };
      };
      const onMove = (e) => {
        const { best, rc } = locate(e);
        st.current.hover = best; draw();
        setTip(best ? { it: best, left: best._x * rc.width / SW_W, top: best._y * rc.height / SW_H } : null);
      };
      return html`<div className="relative">
        <canvas ref=${ref} className="w-full h-auto block" style=${{ aspectRatio: SW_W + ' / ' + SW_H, cursor: tip ? 'pointer' : 'default' }}
          role="img" aria-label="Enjambre de posts: cada punto es un post, a la derecha más largo, arriba más engagement que su plataforma"
          onMouseMove=${onMove} onMouseLeave=${() => { st.current.hover = null; setTip(null); draw(); }}
          onClick=${(e) => { const { best } = locate(e); if (best) onPick(best.p); }}></canvas>
        ${tip && html`<div className="absolute pointer-events-none z-10 rounded-lg px-3 py-2 text-[11px] shadow-lg"
            style=${{ left: Math.min(tip.left + 12, 9999), top: tip.top + 12, background: 'var(--ch-tip-bg)', color: 'var(--ch-tip-text)', border: '1px solid var(--ch-tip-border)', maxWidth: 260 }}>
          <div className="font-medium">${tip.it.p.platform} · ${tip.it.p.format || 'Sin formato'}${tip.it.dur ? ' · ' + Math.round(tip.it.dur) + ' s' : ''}</div>
          <div style=${{ color: 'var(--ch-tip-label)' }}>${[tip.it.p.campaign, tip.it.p.subcampaign].filter(x => x && !MAP_SKIP.test(String(x).trim())).join(' · ') || '—'}</div>
          <div className="font-mono tabular-nums mt-1">ER ${mapPct(tip.it.p.basic_er)} · ${mapX(tip.it.idx)} su plataforma${tip.it.vtr != null ? ' · VTR ' + mapPct(tip.it.vtr) : ''}</div>
        </div>`}
      </div>`;
    }

    function MapBar({ v, color }) {
      const w = v == null ? 0 : Math.max(4, Math.min(100, Math.log10(Math.max(0.1, Math.min(10, v))) * 50 + 50));
      return html`<span className="inline-block w-[64px] h-[6px] rounded-full bg-onSurface/[0.08] align-middle overflow-hidden">

              <div className="flex flex-wrap gap-x-4 gap-y-1 text-[10.5px] text-txt3 mt-1">
                ${swColor === 'plat'
                  ? platShare.map(([p, c]) => html`<span key=${p} className="inline-flex items-center gap-1.5"><span className="w-[8px] h-[8px] rounded-full" style=${{ background: PLAT_COLORS[p] || '#888' }}></span>${p} <span className="text-txt4 font-mono">${Math.round(c / M.items.length * 100)}%</span></span>`)
                  : html`<span className="inline-flex items-center gap-1.5"><span className="w-[8px] h-[8px] rounded-full" style=${{ background: MAP_HOT }}></span>Con influencer</span><span className="inline-flex items-center gap-1.5"><span className="w-[8px] h-[8px] rounded-full bg-txt4/60"></span>Marca</span>`}
                <span className="text-txt4">Arriba = más ER que su plataforma · toca un punto para abrir el post</span>
              </div>
            </div>
            <${MapConsole} lines=${lines}/>
          </div>

          <div className="text-[9px] font-mono uppercase tracking-[0.2em] text-txt4 mb-2 mt-6">Recetas que hoy funcionan</div>
          <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">
            ${recipes.map(r => html`<div key=${r.pl} className="rounded-xl bg-surface border border-line p-4">
              <div className="flex items-center gap-2 mb-3">
                <span className="w-[9px] h-[9px] rounded-full" style=${{ background: PLAT_COLORS[r.pl] || '#888' }}></span>
                <span className="text-[13px] text-txt font-medium">${r.pl}</span>
                <span className="ml-auto text-[10.5px] text-txt4 font-mono">ER típico ${mapPct(M.platMed[r.pl])}</span>
              </div>
              <div className="space-y-2 text-[12px]">
                ${r.fmt && html`<div className="flex items-baseline gap-2"><span className="text-txt4 w-[64px] shrink-0">Pieza</span><span className="text-txt2">${r.fmt.k}</span><span className="ml-auto font-mono tabular-nums" style=${{ color: mapIdxColor(r.fmt.idx) }}>${mapX(r.fmt.idx)}</span><span className="text-txt4 font-mono text-[10px] w-[44px] text-right">${r.fmt.n}</span></div>`}
                ${r.dur && html`<div className="flex items-baseline gap-2"><span className="text-txt4 w-[64px] shrink-0">Duración</span><span className="text-txt2">${r.dur.k}${r.dur.vtr != null && r.shortest && r.shortest.k !== r.dur.k && r.shortest.vtr != null ? html` <span className="text-txt4">· VTR ${mapPct(r.dur.vtr)} vs ${mapPct(r.shortest.vtr)} en ${r.shortest.k}</span>` : ''}</span><span className="ml-auto font-mono tabular-nums" style=${{ color: mapIdxColor(r.dur.idx) }}>${mapX(r.dur.idx)}</span><span className="text-txt4 font-mono text-[10px] w-[44px] text-right">${r.dur.n}</span></div>`}
                ${r.day && html`<div className="flex items-baseline gap-2"><span className="text-txt4 w-[64px] shrink-0">Día</span><span className="text-txt2">${r.day.k}${r.worstDay && r.worstDay.k !== r.day.k ? html` <span className="text-txt4">· evitar ${r.worstDay.k.toLowerCase()} (${mapX(r.worstDay.idx)})</span>` : ''}</span><span className="ml-auto font-mono tabular-nums" style=${{ color: mapIdxColor(r.day.idx) }}>${mapX(r.day.idx)}</span><span className="text-txt4 font-mono text-[10px] w-[44px] text-right">${r.day.n}</span></div>`}
              </div>
            </div>`)}
          </div>
          <p className="text-[10.5px] text-txt4 mt-2">Mediana del índice de cada grupo; la última columna es el número de posts. Mínimo 8 posts por pieza y 6 por duración o día. Muestra qué acompaña a los mejores resultados, no prueba que lo cause.</p>
        </section>`;
    }

    // ============================================================
    // SimuladorSection — calculadora de metas al revés: en vez de
    // "hice X posts, obtuve Y", parte de la meta que pide el cliente y
    // calcula cuántos posts de cada plataforma/formato hacen falta,
    // usando el promedio histórico por post como base. Se ancla SIEMPRE
    // al histórico completo de 2026 (a propósito, para que la base de
    // comparación no cambie con los filtros del resto del dashboard) y
    // se puede acotar por Tipo de contenido (Local/Regional/Global) y
    // Pauta (Orgánico/Paid).
    // ============================================================
    const SIM_MIN_SAMPLE = 3;
    const SIM_METRICS = [
      { key: 'reach', label: 'Alcance',        avgKey: 'avgReach' },
      { key: 'inter', label: 'Interacciones',  avgKey: 'avgInter' },
      { key: 'views', label: 'Reproducciones', avgKey: 'avgViews' },
      { key: 'clics', label: 'Clics',          avgKey: 'avgClics' },
    ];

    function computeSimGroups(posts2026, contentTypeScope, strategyScope) {
      const scoped = posts2026.filter(p => {
        if (contentTypeScope !== 'all' && p.content_type !== contentTypeScope) return false;
        if (strategyScope !== 'all' && p.strategy !== strategyScope) return false;
        return true;
      });
      const map = new Map();
      for (const p of scoped) {
        if (!p.platform || !p.format) continue;
        const key = p.platform + '|' + p.format;
        if (!map.has(key)) map.set(key, { platform: p.platform, format: p.format, n: 0, reach: 0, inter: 0, views: 0, clics: 0 });
        const g = map.get(key);
        g.n++;
        g.reach += p.reach || 0;
        g.inter += p.interactions || 0;
        g.views += p.views || 0;
        g.clics += p.clics || 0;
      }
      return [...map.values()].map(g => ({
        ...g,
        avgReach: g.n ? g.reach / g.n : 0,
        avgInter: g.n ? g.inter / g.n : 0,
        avgViews: g.n ? g.views / g.n : 0,
        avgClics: g.n ? g.clics / g.n : 0,
      }));
    }

    function SimScopeToggle({ label, options, value, onChange }) {
      return html`
        <div>
          <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">${label}</div>
          <div className="inline-flex items-center rounded-lg bg-onSurface/[0.04] p-0.5" role="radiogroup" aria-label=${label}>
            <button onClick=${() => onChange('all')} role="radio" aria-checked=${value === 'all'}
              className=${"px-3 py-1.5 rounded-md text-[11px] transition-colors " + (value === 'all' ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
              Todos
            </button>
            ${options.map(o => html`
              <button key=${o} onClick=${() => onChange(o)} role="radio" aria-checked=${value === o}
                className=${"px-3 py-1.5 rounded-md text-[11px] transition-colors " + (value === o ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
                ${o}
              </button>
            `)}
          </div>
        </div>`;
    }

    function SimuladorSection({ allPosts }) {
      const posts2026 = useMemo(() => (allPosts || []).filter(p => p.year === 2026), [allPosts]);

      const contentTypeOptions = useMemo(() =>
        [...new Set(posts2026.map(p => p.content_type).filter(Boolean))].sort(), [posts2026]);
      const strategyOptions = useMemo(() =>
        [...new Set(posts2026.map(p => p.strategy).filter(Boolean))].sort(), [posts2026]);

      const [contentTypeScope, setContentTypeScope] = useState('all');
      const [strategyScope, setStrategyScope] = useState('all');
      const [goalMetric, setGoalMetric] = useState('reach');
      const [goalTarget, setGoalTarget] = useState('');
      const [allocations, setAllocations] = useState({});
      const [simAll, setSimAll] = useState(false);   // v60 — por default solo las 10 combinaciones con mejor promedio

      // Si cambia el universo (tipo de contenido / pauta), las filas ya
      // no son las mismas — se resetea lo planeado para no dejar
      // números "fantasma" de una combinación que ya no aplica.
      useEffect(() => { setAllocations({}); }, [contentTypeScope, strategyScope]);

      const groups = useMemo(
        () => computeSimGroups(posts2026, contentTypeScope, strategyScope),
        [posts2026, contentTypeScope, strategyScope]
      );

      const metricCfg = SIM_METRICS.find(m => m.key === goalMetric);
      const sortedGroups = useMemo(
        () => [...groups].sort((a, b) => b[metricCfg.avgKey] - a[metricCfg.avgKey]),
        [groups, metricCfg]
      );

      const totalHistPosts = groups.reduce((s, g) => s + g.n, 0);

      const setAlloc = (key, val) => {
        const n = val === '' ? '' : Math.max(0, Math.round(Number(val) || 0));
        setAllocations(prev => ({ ...prev, [key]: n }));
      };

      const target = Number(goalTarget) || 0;
      const totalProjected = sortedGroups.reduce((s, g) => {
        const key = g.platform + '|' + g.format;
        const n = Number(allocations[key]) || 0;
        return s + n * g[metricCfg.avgKey];
      }, 0);
      const progressPct = target > 0 ? Math.min(100, (totalProjected / target) * 100) : 0;
      const delta = target - totalProjected;

      const autocompletar = () => {
        if (target <= 0 || totalHistPosts === 0) return;
        const next = {};
        for (const g of sortedGroups) {
          const key = g.platform + '|' + g.format;
          const share = g.n / totalHistPosts;
          const goalForGroup = target * share;
          const avg = g[metricCfg.avgKey];
          next[key] = avg > 0 ? Math.ceil(goalForGroup / avg) : 0;
        }
        setAllocations(next);
      };

      return html`
        <section id="sec-simulador" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-simulador" name="Simulador" />
          <div className="mb-5">
            <h2 className="text-[18px] font-medium text-txt">Simulador de metas</h2>
            <p className="text-txt4 text-[12px] mt-1">
              Parte de la meta que te piden y calcula cuántos posts de cada plataforma/formato hacen falta, usando el promedio histórico por post.
              Basado siempre en el histórico completo de 2026 (${fmtFull(totalHistPosts)} posts en el alcance elegido), sin importar los filtros de arriba.
            </p>
          </div>

          <div className="rounded-xl bg-surface border border-line p-5 mb-4">
            <div className="flex flex-wrap gap-6 mb-5">
              <${SimScopeToggle} label="Tipo de contenido" options=${contentTypeOptions} value=${contentTypeScope} onChange=${setContentTypeScope} />
              <${SimScopeToggle} label="Pauta" options=${strategyOptions} value=${strategyScope} onChange=${setStrategyScope} />
            </div>

            <div className="flex flex-wrap items-end gap-4">
              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Métrica meta</div>
                <div className="inline-flex items-center rounded-lg bg-onSurface/[0.04] p-0.5" role="radiogroup" aria-label="Métrica meta">
                  ${SIM_METRICS.map((m, i) => html`
                    <button key=${m.key} onClick=${() => setGoalMetric(m.key)} role="radio" aria-checked=${goalMetric === m.key}
                      className=${"px-3 py-1.5 rounded-md text-[11px] transition-colors " + (goalMetric === m.key ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
                      ${m.label}
                    </button>
                  `)}
                </div>
              </div>
              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Meta</div>
                <input type="number" min="0" value=${goalTarget}
                       onChange=${(e) => setGoalTarget(e.target.value)}
                       placeholder="Ej. 5000000"
                       className="h-[34px] w-[160px] px-3 rounded-lg border border-line bg-onSurface/[0.03] text-[12px] text-txt tabular-nums placeholder:text-txt4 focus:outline-none focus:border-line2" />
              </div>
              <button onClick=${autocompletar} disabled=${target <= 0}
                      className="h-[34px] px-3.5 rounded-lg border border-accent2/30 text-accent text-[11px] hover:text-white hover:bg-accent2 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-accent transition-colors">
                Autocompletar
              </button>
            </div>
          </div>

          ${sortedGroups.length === 0 ? html`
            <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
              <div className="text-txt3 text-[13px]">Sin posts en 2026 para esta combinación de Tipo de contenido / Pauta.</div>
            </div>
          ` : html`
            <div className="rounded-xl bg-surface border border-line overflow-x-auto mb-4">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-line text-[10px] font-mono uppercase tracking-[0.15em] text-txt4">
                    <th className="text-left py-2.5 px-4 font-medium">Plataforma</th>
                    <th className="text-left py-2.5 px-4 font-medium">Formato</th>
                    <th className="text-right py-2.5 px-4 font-medium">Posts hist. 2026</th>
                    <th className="text-right py-2.5 px-4 font-medium">Prom. ${metricCfg.label}/post</th>
                    <th className="text-right py-2.5 px-4 font-medium">Posts a planear</th>
                    <th className="text-right py-2.5 pl-2 pr-4 font-medium">Subtotal</th>
                  </tr>
                </thead>
                <tbody>
                  ${(simAll ? sortedGroups : sortedGroups.filter((g, i) => i < 10 || Number(allocations[g.platform + '|' + g.format]) > 0)).map(g => {
                    const key = g.platform + '|' + g.format;
                    const n = allocations[key] ?? '';
                    const subtotal = (Number(n) || 0) * g[metricCfg.avgKey];
                    const lowSample = g.n < SIM_MIN_SAMPLE;
                    return html`
                      <tr key=${key} className="border-b border-line/50 last:border-0">
                        <td className="py-2.5 px-4">
                          <span className="inline-flex items-center gap-2 text-[12px] text-txt2"><svg width="8" height="8" viewBox="0 0 8 8" className="shrink-0" aria-hidden="true"><circle cx="4" cy="4" r="4" fill=${PLAT_COLORS[g.platform]} /></svg>${g.platform}</span>
                        </td>
                        <td className="py-2.5 px-4 text-[12px] text-txt2">${g.format}</td>
                        <td className="py-2.5 px-4 text-right font-mono tabular-nums text-[11px]">
                          <span className=${lowSample ? "text-amber" : "text-txt4"} title=${lowSample ? `Muestra baja (menos de ${SIM_MIN_SAMPLE} posts) — promedio poco confiable` : ''}>${g.n}${lowSample ? ' ⚠' : ''}</span>
                        </td>
                        <td className="py-2.5 px-4 text-right font-mono tabular-nums text-[12px] text-txt">${fmt(g[metricCfg.avgKey])}</td>
                        <td className="py-2.5 px-4 text-right">
                          <input type="number" min="0" value=${n}
                                 onChange=${(e) => setAlloc(key, e.target.value)}
                                 placeholder="0"
                                 className="h-[30px] w-[80px] px-2 rounded-md border border-line bg-onSurface/[0.03] text-[12px] text-txt text-right tabular-nums placeholder:text-txt4 focus:outline-none focus:border-line2" />
                        </td>
                        <td className="py-2.5 pl-2 pr-4 text-right font-mono tabular-nums text-[12px] text-txt2">${fmt(subtotal)}</td>
                      </tr>`;
                  })}
                </tbody>
              </table>
              ${sortedGroups.length > 10 && html`<div className="text-center py-3">
                <button onClick=${() => setSimAll(v => !v)} className="text-[12px] text-txt3 hover:text-txt rounded-lg bg-onSurface/[0.04] hover:bg-onSurface/[0.07] px-4 py-2 transition-colors">
                  ${simAll ? 'Ver solo las 10 con mejor promedio' : `Ver las ${sortedGroups.length} combinaciones`}</button></div>`}
            </div>

            <div className="rounded-xl bg-surface border border-line p-5">
              <div className="flex flex-wrap items-baseline justify-between gap-3 mb-3">
                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4">Proyectado vs. meta (${metricCfg.label})</div>
                <div className="text-[13px] font-mono tabular-nums">
                  <span className="text-txt">${fmt(totalProjected)}</span>
                  <span className="text-faint"> / ${target > 0 ? fmt(target) : '—'}</span>
                </div>
              </div>
              <div className="h-2 rounded-full bg-onSurface/[0.06] overflow-hidden">
                <div className=${"bar-grow h-full rounded-full transition-all " + (delta <= 0 && target > 0 ? "bg-success" : "bg-accent2")}
                     style=${{ width: `${progressPct}%` }}></div>
              </div>
              ${target > 0 && html`
                <div className=${"text-[11px] font-mono mt-2 " + (delta <= 0 ? "text-success" : "text-txt3")}>
                  ${delta <= 0 ? `Meta cubierta — ${fmt(Math.abs(delta))} de sobra` : `Te faltan ${fmt(delta)} para llegar a la meta`}
                </div>
              `}
            </div>
          `}
        </section>`;
    }

    // ============================================================
    // DetailDrawer
    // ============================================================
    function DrawerStat({ label, value }) {
      return html`
        <div className="border-b border-line py-3 min-w-0">
          <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1">${label}</div>
          <div className="font-mono text-[14px] text-txt tabular-nums break-all">${value}</div>
        </div>`;
    }
    function DrawerTag({ label, value }) {
      if (!value) return null;
      return html`
        <div className="flex flex-col">
          <span className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4">${label}</span>
          <span className="text-[13px] text-txt2 mt-0.5">${value}</span>
        </div>`;
    }

    // ============================================================
    // v21 — Componentes de miniatura y benchmark
    // ============================================================


    function deltaTone(d) {
      if (d == null) return 'text-txt4';
      if (d >= 10) return 'text-success';
      if (d <= -10) return 'text-amber';
      return 'text-txt3';
    }
    function deltaTxt(d) {
      if (d == null) return '—';
      // ≥ +100% se lee mejor como múltiplo (p. ej. +3,417% → 35.2×)
      if (d >= 100) return `${(1 + d / 100).toFixed(1)}×`;
      const s = d > 0 ? '+' : d < 0 ? '−' : '±';
      return `${s}${Math.abs(d).toFixed(0)}%`;
    }

    function BenchPill({ b }) {
      if (!b) return html`<span className="text-faint text-[11px]">—</span>`;
      if (!b.enough) return html`<span className="text-faint text-[10px] font-mono" title=${`Segmento ${b.label}: n=${b.n}, muestra insuficiente (mín. ${BENCH_MIN_N})`}>${'n<' + BENCH_MIN_N}</span>`;
      const d = b.d_basic_er;
      return html`
        <span className=${"font-mono tabular-nums text-[12px] " + deltaTone(d)}
              title=${`ER básico vs. segmento ${b.label} (n=${b.n}): ${b.basic_er != null ? erFmt(b.basic_er) : '—'}`}
              aria-label=${d == null ? 'Sin comparación' : `${deltaTxt(d)} contra el ER básico de su segmento`}>
          ${deltaTxt(d)}
        </span>`;
    }

    function BenchRow({ label, post, bench, d, fmtFn }) {
      return html`
        <div className="grid grid-cols-[1fr_auto_auto_auto] items-baseline gap-3 py-2 text-[12px]">
          <span className="text-txt3">${label}</span>
          <span className="font-mono tabular-nums text-txt">${post}</span>
          <span className="font-mono tabular-nums text-txt4 text-[11px]">vs ${bench}</span>
          <span className=${"font-mono tabular-nums text-[12px] w-14 text-right " + deltaTone(d)}>${deltaTxt(d)}</span>
        </div>`;
    }

    function BenchBlock({ post, b }) {
      if (!b) return null;
      return html`
        <div className="mb-1">
          <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2 mt-1">Vs. su segmento</div>
          <div className="rounded-xl bg-surface border border-line px-3.5 py-2.5">
            <div className="text-[11px] text-txt2 mb-1">${b.label}</div>
            <div className="text-[10px] font-mono text-txt4 mb-1.5">
              ${b.enough ? `Benchmark histórico · ${b.n} posts comparables` : `Solo ${b.n} post${b.n === 1 ? '' : 's'} comparable${b.n === 1 ? '' : 's'} — se necesitan ${BENCH_MIN_N} para comparar`}
            </div>
            ${b.enough && html`
              <${Fragment}>
                <${BenchRow} label="ER básico" post=${erFmt(post.basic_er)} bench=${b.basic_er != null ? erFmt(b.basic_er) : '—'} d=${b.d_basic_er} />
                <${BenchRow} label="ER views" post=${erFmt(post.er)} bench=${b.er != null ? erFmt(b.er) : '—'} d=${b.d_er} />
                <${BenchRow} label="Alcance (vs. mediana)" post=${fmt(post.reach)} bench=${fmt(b.reachMed)} d=${b.d_reach} />
              <//>
            `}
          </div>
        </div>`;
    }

    function DetailDrawer({ post, onClose, benchmarks }) {
      useEffect(() => {
        if (!post) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [post, onClose]);

      if (!post) return null;
      const color = PLAT_COLORS[post.platform];

      return html`
        <${Fragment}>
          <div className="fixed inset-0 z-40 fade-in" style=${{ background: 'rgba(0,0,0,0.6)' }} onClick=${onClose}/>
          <aside role="dialog" aria-modal="true" aria-label=${`Detalle del post de ${post.platform}`}
                 className="fixed top-0 right-0 bottom-0 w-full sm:w-[480px] z-50 bg-ink border-l border-line2 zoom-from-row flex flex-col"
                 style=${{ boxShadow: '-20px 0 40px rgba(0,0,0,0.4)', transformOrigin: `0 ${(window.__smxPickY || 0)}px` }}>
            <div className="flex items-center justify-between px-5 py-4 border-b border-line">
              <div className="flex items-center gap-2.5">
                <svg width="8" height="8" viewBox="0 0 8 8" className="shrink-0" aria-hidden="true"><circle cx="4" cy="4" r="4" fill=${color} /></svg>
                <span className="text-[14px] text-txt font-medium">${post.platform}</span>
              </div>
              <button onClick=${onClose} aria-label="Cerrar detalle" autoFocus
                      className="w-7 h-7 rounded-md hover:bg-onSurface/[0.06] flex items-center justify-center text-txt3 hover:text-txt transition-colors">
                <${XIcon} size=${15}/>
              </button>
            </div>

            <div className="flex-1 overflow-y-auto">
              <div className="px-5 py-5 drawer-body">
                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-accentSoft mb-2">
                  ${dateFmt(post.date)} · Semana ${post.week || '—'}
                </div>
                <h3 className="text-[20px] text-txt leading-tight mb-1.5 font-medium">
                  ${post.product || html`<span className="italic text-txt4">Producto sin asignar</span>`}
                </h3>
                ${post.campaign && html`

                      ${post.avg_watch_time > 0 && html`<${DrawerStat} label="Tiempo prom. visto" value=${`${post.avg_watch_time.toFixed(1)}s`} />`}

                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2 mt-6">Clasificación</div>
                <div className="rounded-xl bg-surface border border-line p-3.5 grid grid-cols-2 gap-3">

                  <${DrawerTag} label="Etapa" value=${post.stage} />
                  <${DrawerTag} label="Objetivo" value=${post.objective} />
                  <${DrawerTag} label="IA" value=${post.ai} />
                  ${post.is_influencer === 'Sí' && html`<${DrawerTag} label="Influencer" value=${post.influencer_name || 'Sí'} />`}
                </div>
              </div>
            </div>

            ${sheetRowUrl(post.platform, post._row) && html`
              <div className="px-5 pt-4 text-[12px] text-txt3 flex items-center gap-2">
                En el Sheet: <${SheetRow} p=${post} /> <span className="text-txt4">(${SHEET_TABS[post.platform]}, fila ${post._row})</span>
              </div>`}
            ${post.link && html`
              <div className="border-t border-line px-5 py-4">
                <a href=${post.link} target="_blank" rel="noopener noreferrer"
                   className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-accent text-ink text-[13px] font-medium hover:bg-accent2 hover:text-white transition-colors">

    // ============================================================
    // ExportModal — reportes "bomberazo" para la clienta: elige un
    // resumen agrupado (dimensión + métricas) o el listado de posts
    // individuales (columnas a elegir), usando los filtros ya activos
    // en el dashboard, y lo manda a un Apps Script que arma una hoja
    // nueva en un Google Sheets maestro.
    // ============================================================
    function ExportModal({ open, onClose, D, filters }) {
      const [mode, setMode] = useState('summary'); // 'summary' | 'raw'
      const [groupBy, setGroupBy] = useState('platform');
      const [selectedMetrics, setSelectedMetrics] = useState(DEFAULT_REPORT_METRICS);
      const [selectedColumns, setSelectedColumns] = useState(DEFAULT_RAW_COLUMNS);
      const [title, setTitle] = useState('');
      const [titleTouched, setTitleTouched] = useState(false);
      const [status, setStatus] = useState('idle'); // idle | loading | success | error
      const [errorMsg, setErrorMsg] = useState(null);
      const [dateFrom, setDateFrom] = useState('');   // 'YYYY-MM-DD' o ''
      const [dateTo, setDateTo] = useState('');
      const [splitBy, setSplitBy] = useState('none'); // none | year | month | week

      const dimLabel = REPORT_DIMENSIONS.find((d) => d.key === groupBy)?.label || groupBy;

      // Si cambian los parámetros del reporte, borra un resultado/error
      // viejo para que no se quede pegado un "listo" que ya no aplica.
      useEffect(() => {
        setStatus('idle'); setErrorMsg(null);
      }, [mode, groupBy, selectedMetrics, selectedColumns, dateFrom, dateTo, splitBy]);

      // Sugiere un título automáticamente mientras el usuario no lo edite.
      useEffect(() => {
        if (!titleTouched) setTitle(suggestedReportTitle(filters, mode, dimLabel));
      }, [filters, mode, dimLabel, titleTouched]);

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [open, onClose]);

      if (!open) return null;

      const toggleMetric = (key) => {
        setSelectedMetrics((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]);
      };
      const toggleColumn = (key) => {
        setSelectedColumns((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]);
      };

      // Posts dentro del alcance de los filtros del dashboard + el rango
      // de fechas propio del reporte (si lo hay).
      const scopedPosts = (() => {
        let list = D.allPosts || [];
        if (dateFrom || dateTo) {
          const f = dateFrom ? new Date(dateFrom + 'T00:00:00') : null;
          const t = dateTo ? new Date(dateTo + 'T23:59:59') : null;
          list = list.filter((p) => {
            const d = parseDate(p.date);
            if (!d) return false;
            return (!f || d >= f) && (!t || d <= t);
          });
        }
        return list;
      })();
      const postsInScope = scopedPosts.length;

      // Clave/etiqueta del periodo al que pertenece un post según "Dividir por".
      const periodOf = (p) => {
        const y = postYear(p);
        if (!y) return null;
        if (splitBy === 'year') return { k: y, l: String(y) };
        if (splitBy === 'month') {
          const m = postMonth(p);
          return m ? { k: y * 100 + m, l: `${MONTH_NAMES[m - 1]} ${y}` } : null;
        }
        if (splitBy === 'week') {
          return p.week != null ? { k: y * 100 + p.week, l: `S${String(p.week).padStart(2, '0')} ${y}` } : null;
        }
        return null;
      };

      const handleGenerate = () => {
        setStatus('loading'); setErrorMsg(null);
        try {
          const metrics = REPORT_METRICS.filter((m) => selectedMetrics.includes(m.key));
          const cols = RAW_COLUMNS.filter((c) => selectedColumns.includes(c.key));
          if (mode === 'summary' && metrics.length === 0) throw new Error('Elige al menos una métrica.');
          if (mode === 'raw' && cols.length === 0) throw new Error('Elige al menos una columna.');

          const buildData = (posts) => {
            if (mode === 'summary') {
              const sub = { ...computeAggregates(posts, D.meta), allPosts: posts };
              return {
                headers: [dimLabel, ...metrics.map((m) => m.label)],
                rows: groupedReportRows(sub, groupBy).map(({ label, agg }) => [label, ...metrics.map((m) => m.fmt(agg[m.key] ?? 0))]),
              };
            }
            return { headers: cols.map((c) => c.label), rows: posts.map((p) => cols.map((c) => c.get(p))) };
          };

          if (scopedPosts.length === 0) throw new Error('No hay datos para los filtros/rango seleccionados.');
          if (typeof XLSX === 'undefined') throw new Error('No se pudo cargar la librería de Excel (revisa tu conexión y recarga la página).');

          // Hojas a generar: una sola, o una "Total" + una por periodo.
          const sheets = [];
          if (splitBy === 'none') {
            sheets.push({ name: title || 'Reporte', posts: scopedPosts });
          } else {
            sheets.push({ name: 'Total', posts: scopedPosts });
            const buckets = new Map();
            for (const p of scopedPosts) {
              const per = periodOf(p);
              if (!per) continue;
              if (!buckets.has(per.k)) buckets.set(per.k, { l: per.l, posts: [] });
              buckets.get(per.k).posts.push(p);
            }
            [...buckets.entries()].sort((a, b) => a[0] - b[0])
              .forEach(([, b]) => sheets.push({ name: b.l, posts: b.posts }));
          }

          // Arma el workbook 100% en el navegador — no sale ningún dato
          // a ningún servidor externo.
          const wb = XLSX.utils.book_new();
          const usedNames = new Set();
          for (const sh of sheets) {
            const { headers, rows } = buildData(sh.posts);
            if (rows.length === 0) continue;
            const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
            ws['!cols'] = headers.map((h, i) => {
              const maxLen = Math.max(
                String(h ?? '').length,
                ...rows.slice(0, 500).map((r) => String(r[i] ?? '').length)
              );
              return { wch: Math.min(Math.max(maxLen + 2, 10), 40) };
            });
            let name = sanitizeSheetTabName(sh.name);
            let n = 2;
            while (usedNames.has(name.toLowerCase())) name = sanitizeSheetTabName(sh.name).substring(0, 28) + ' ' + (n++);
            usedNames.add(name.toLowerCase());
            XLSX.utils.book_append_sheet(wb, ws, name);
          }
          if (wb.SheetNames.length === 0) throw new Error('No hay datos para los filtros/selección actuales.');
          XLSX.writeFile(wb, `${sanitizeFileName(title || 'Reporte')}.xlsx`);

          setStatus('success');
        } catch (err) {
          setErrorMsg(String(err.message || err));
          setStatus('error');
        }
      };

      return html`
        <${Fragment}>
          <div className="fixed inset-0 z-40 fade-in" style=${{ background: 'rgba(0,0,0,0.6)' }} onClick=${onClose}/>
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick=${onClose}>
            <div role="dialog" aria-modal="true" aria-label="Exportar reporte"
                 className="w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-2xl bg-surface border border-line2 fade-in"
                 style=${{ boxShadow: '0 20px 60px rgba(0,0,0,0.5)' }}
                 onClick=${(e) => e.stopPropagation()}>

              <div className="flex items-center justify-between px-5 py-4 border-b border-line sticky top-0 bg-surface z-10">
                <div className="flex items-center gap-2.5">
                  <${SheetIcon} size=${16} className="text-accent"/>
                  <span className="text-[14px] text-txt font-medium">Exportar reporte</span>
                </div>
                <button aria-label="Cerrar" onClick=${onClose}
                        className="w-7 h-7 rounded-md hover:bg-onSurface/[0.06] flex items-center justify-center text-txt3 hover:text-txt transition-colors">
                  <${XIcon} size=${15}/>
                </button>
              </div>

              <div className="px-5 py-5">
                <div className="text-[11px] text-txt3 leading-relaxed mb-4">
                  Usa los filtros que ya tienes activos arriba
                  (<span className="text-txt2 font-medium">${fmtFull(postsInScope)} posts</span> en el rango actual)
                  y elige qué descargar en un Excel (.xlsx) — se abre directo en Excel o se importa a Google Sheets con "Archivo → Importar".
                </div>

                <div className="flex rounded-lg bg-onSurface/[0.04] p-0.5 mb-4" role="radiogroup" aria-label="Tipo de exportación">
                  <button onClick=${() => setMode('summary')} role="radio" aria-checked=${mode === 'summary'}
                          className=${"flex-1 px-3 py-2 rounded-md text-[12px] transition-colors " +
                            (mode === 'summary' ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
                    Resumen agrupado
                  </button>
                  <button onClick=${() => setMode('raw')} role="radio" aria-checked=${mode === 'raw'}
                          className=${"flex-1 px-3 py-2 rounded-md text-[12px] transition-colors " +
                            (mode === 'raw' ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
                    Posts individuales
                  </button>
                </div>

                ${mode === 'summary' ? html`
                  <div className="mb-4">
                    <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Agrupar por</div>
                    <div className="flex flex-wrap gap-1.5">
                      ${REPORT_DIMENSIONS.map((d) => html`
                        <button key=${d.key} onClick=${() => setGroupBy(d.key)}
                                className=${"px-2.5 py-1 rounded-full border text-[11px] transition-colors " +
                                  (groupBy === d.key ? "border-accent2/40 bg-accent2/12 text-txt" : "border-line text-txt3 hover:text-txt2 hover:border-line2")}>
                          ${d.label}
                        </button>`)}
                    </div>
                  </div>

                  <div className="mb-5">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-txt4">Métricas</div>
                      <div className="flex gap-2 text-[10px] font-mono uppercase tracking-wider">
                        <button onClick=${() => setSelectedMetrics(REPORT_METRICS.map((m) => m.key))} className="text-txt4 hover:text-txt">Todas</button>
                        <button onClick=${() => setSelectedMetrics([])} className="text-txt4 hover:text-txt">Limpiar</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 max-h-[180px] overflow-y-auto pr-1">
                      ${REPORT_METRICS.map((m) => {
                        const isOn = selectedMetrics.includes(m.key);
                        return html`
                          <button key=${m.key} onClick=${() => toggleMetric(m.key)}
                                  className="flex items-center gap-2 text-left text-[11px] px-2 py-1.5 rounded-md hover:bg-onSurface/[0.04] transition-colors">
                            <span className=${"w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 " +
                              (isOn ? "bg-accent border-accent" : "border-line2 bg-onSurface/[0.03]")}>
                              ${isOn && html`<${CheckIcon} size=${9} className="text-ink"/>`}
                            </span>
                            <span className="text-txt2 truncate" title=${m.label}>${m.label}</span>
                          </button>`;
                      })}
                    </div>
                  </div>
                ` : html`
                  <div className="mb-5">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-txt4">Columnas</div>
                      <div className="flex gap-2 text-[10px] font-mono uppercase tracking-wider">
                        <button onClick=${() => setSelectedColumns(RAW_COLUMNS.map((c) => c.key))} className="text-txt4 hover:text-txt">Todas</button>
                        <button onClick=${() => setSelectedColumns([])} className="text-txt4 hover:text-txt">Limpiar</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 max-h-[220px] overflow-y-auto pr-1">
                      ${RAW_COLUMNS.map((c) => {
                        const isOn = selectedColumns.includes(c.key);
                        return html`
                          <button key=${c.key} onClick=${() => toggleColumn(c.key)}
                                  className="flex items-center gap-2 text-left text-[11px] px-2 py-1.5 rounded-md hover:bg-onSurface/[0.04] transition-colors">
                            <span className=${"w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 " +
                              (isOn ? "bg-accent border-accent" : "border-line2 bg-onSurface/[0.03]")}>
                              ${isOn && html`<${CheckIcon} size=${9} className="text-ink"/>`}
                            </span>
                            <span className="text-txt2 truncate" title=${c.label}>${c.label}</span>
                          </button>`;
                      })}
                    </div>
                  </div>
                `}

                <div className="mb-4">
                  <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Rango de fechas (opcional)</div>
                  <div className="flex items-center gap-2">
                    <input type="date" value=${dateFrom} onChange=${(e) => setDateFrom(e.target.value)}
                           className="flex-1 px-3 py-1.5 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50"/>
                    <span className="text-txt4 text-[11px]">a</span>
                    <input type="date" value=${dateTo} onChange=${(e) => setDateTo(e.target.value)}
                           className="flex-1 px-3 py-1.5 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50"/>
                    ${(dateFrom || dateTo) && html`
                      <button onClick=${() => { setDateFrom(''); setDateTo(''); }} className="text-[10px] font-mono uppercase tracking-wider text-txt4 hover:text-txt">Limpiar</button>
                    `}
                  </div>
                </div>

                <div className="mb-5">
                  <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Dividir en pestañas por</div>
                  <div className="flex flex-wrap gap-1.5">
                    ${[['none', 'Sin dividir'], ['year', 'Año'], ['month', 'Mes'], ['week', 'Semana']].map(([k, l]) => html`
                      <button key=${k} onClick=${() => setSplitBy(k)}
                              className=${"px-2.5 py-1 rounded-full border text-[11px] transition-colors " +
                                (splitBy === k ? "border-accent2/40 bg-accent2/12 text-txt" : "border-line text-txt3 hover:text-txt2 hover:border-line2")}>
                        ${l}
                      </button>`)}
                  </div>
                  ${splitBy !== 'none' && html`
                    <div className="text-[10px] text-txt4 mt-2">Incluye una pestaña "Total" y una pestaña por cada ${splitBy === 'year' ? 'año' : splitBy === 'month' ? 'mes' : 'semana'}.</div>
                  `}
                </div>

                <div className="mb-5">
                  <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Título de la hoja</div>
                  <input type="text" value=${title}
                         onChange=${(e) => { setTitle(e.target.value); setTitleTouched(true); }}
                         className="w-full px-3 py-2 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50"/>
                </div>

                ${status === 'error' && html`
                  <div className="mb-4 rounded-lg bg-amber/10 border border-amber/30 px-3 py-2 text-[11px] text-amber leading-relaxed">
                    ${errorMsg}
                  </div>
                `}

                ${status === 'success' && html`
                  <div className="mb-4 rounded-lg bg-success/10 border border-success/30 px-3 py-3 text-[12px] text-txt2 leading-relaxed">
                    <div className="flex items-center gap-2 text-success">
                      <${CheckIcon} size=${13}/>
                      <span className="font-medium">Excel descargado</span>
                    </div>
                    <div className="text-txt3 mt-1">Revisa tu carpeta de Descargas — el archivo ya está listo para abrir o subir a Google Sheets.</div>
                  </div>
                `}

                <button onClick=${handleGenerate} disabled=${status === 'loading'}
                        className="w-full inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-accent text-ink text-sm font-medium hover:bg-accent2 hover:text-white transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                  ${status === 'loading'
                    ? html`<${SpinnerIcon} size=${14}/> Generando…`
                    : html`<${DownloadIcon} size=${14}/> Descargar Excel`}
                </button>
              </div>
            </div>
          </div>
        <//>`;
    }

    // ============================================================
    // App principal
    // ============================================================
    // ============================================================
    // v21 — META 2026 · CRECIMIENTO DE FOLLOWERS
    // Lee "Followers" y "Status vs Meta 2026". No depende de los filtros.
    // ============================================================
    const GOAL_STATUS = {
      cumplida:  { label: 'Meta cumplida', cls: 'text-success border-success/40 bg-success/[0.08]' },
      en_ruta:   { label: 'En ruta',       cls: 'text-success border-success/40 bg-success/[0.08]' },
      en_riesgo: { label: 'En riesgo',     cls: 'text-amber border-amber/40 bg-amber/[0.08]' },
    };

    function FollowerGoalCard({ g, chartTheme }) {
      const color = PLAT_COLORS[g.name] || 'rgb(var(--c-accent))';
      const st = GOAL_STATUS[g.status];
      const barPct = Math.max(0, Math.min(100, g.pct));
      const projPct = Math.max(0, Math.min(100, g.projectedPct));
      const sign = (v) => (v >= 0 ? '+' : '−') + fmt(Math.abs(Math.round(v)));
      return html`
        <article className="rounded-xl bg-surface border border-line p-5 min-w-0 flex flex-col" aria-label=${`Meta de followers ${g.name}`}>
          <div className="flex items-center justify-between gap-3 mb-3">

    function FollowerGoalsSection({ fetchedAt, chartTheme, embedded, platforms }) {
      const [state, setState] = useState({ loading: true, goals: [], error: null });
      useEffect(() => {
        let alive = true;
        fetchFollowerGoals()
          .then(goals => { if (alive) setState({ loading: false, goals, error: null }); })
          .catch(e => { if (alive) setState({ loading: false, goals: [], error: e?.message || 'Error' }); });
        return () => { alive = false; };
      }, [fetchedAt]);

      const lastWeek = state.goals.reduce((m, g) => Math.max(m, g.lastWeek || 0), 0);
      const goals = platforms ? state.goals.filter(g => platforms.includes(FOL_PLATFORM(g.name))) : state.goals;
