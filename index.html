                  ${post.saves > 0 && html`<${DrawerStat} label="Guardados" value=${fmtFull(post.saves)} />`}
                  ${post.clics > 0 && html`<${DrawerStat} label="Clics" value=${fmtFull(post.clics)} />`}
                  ${post.repost > 0 && html`<${DrawerStat} label="Reposts" value=${fmtFull(post.repost)} />`}
                  <div className="py-3">
                    <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1">CTR</div>
                    <div className="font-mono text-[14px] text-txt tabular-nums">${erFmt(post.ctr)}</div>
                  </div>
                </div>

                ${(post.views > 0 || post.duration > 0) && html`
                  <${Fragment}>
                    <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2 mt-6">Video</div>
                    <div className="rounded-xl bg-surface border border-line px-3.5">
                      <${DrawerStat} label="Reproducciones" value=${fmtFull(post.views)} />
                      ${post.duration > 0 && html`<${DrawerStat} label="Duración" value=${`${post.duration}s`} />`}
                      ${post.avg_watch_time > 0 && html`<${DrawerStat} label="Tiempo prom. visto" value=${`${post.avg_watch_time.toFixed(1)}s`} />`}
                      ${post.vtr != null && html`<${DrawerStat} label="VTR" value=${erFmt(post.vtr)} />`}
                    </div>
                  <//>
                `}

                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2 mt-6">Clasificación</div>
                <div className="rounded-xl bg-surface border border-line p-3.5 grid grid-cols-2 gap-3">
                  <${DrawerTag} label="Formato" value=${post.format} />
                  <${DrawerTag} label="Tipo de contenido" value=${post.content_type} />
                  <${DrawerTag} label="Estrategia" value=${post.strategy} />
                  <${DrawerTag} label="Etapa" value=${post.stage} />
                  <${DrawerTag} label="Objetivo" value=${post.objective} />
                  <${DrawerTag} label="IA" value=${post.ai} />
                  ${post.is_influencer === 'Sí' && html`<${DrawerTag} label="Influencer" value=${post.influencer_name || 'Sí'} />`}
                </div>
              </div>
            </div>

            ${post.link && html`
              <div className="border-t border-line px-5 py-4">
                <a href=${post.link} target="_blank" rel="noopener noreferrer"
                   className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-accent text-ink text-[13px] font-medium hover:bg-accent2 hover:text-white transition-colors">
                  Ver publicación original <${ExtIcon} size=${14}/>
                </a>
              </div>
            `}
          </aside>
        <//>`;
    }

    // ============================================================
    // Footer
    // ============================================================
    // ============================================================
    // Panel de diagnóstico — visible si la URL incluye ?diag=1
    // o si la cuenta de S18 no concuerda con la base
    // ============================================================
    function DiagnosticPanel() {
      const [open, setOpen] = useState(false);  // colapsado por defecto; útil si vuelven a aparecer discrepancias
      const [d, setD] = useState(null);

      useEffect(() => {
        const t = setInterval(() => {
          if (window.__smxDebug) {
            setD({ ...window.__smxDebug });
          }
        }, 1000);
        return () => clearInterval(t);
      }, []);

      if (!d) return null;

      const platOrder = ['Facebook','Instagram','YouTube','TikTok','X','LinkedIn','Threads'];

      return html`
        <div className="border-t border-line mt-3 mx-7">
          <button
            onClick=${() => setOpen(!open)}
            className="w-full py-3 text-left text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 hover:text-accent transition-colors">
            ${open ? '▾' : '▸'} Diagnóstico de datos (build ${d.build})
          </button>
          ${open && html`
            <div className="pb-7 space-y-5">
              <div>
                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2">
                  Resumen por plataforma
                </div>
                <div className="overflow-x-auto">
                  <table className="text-[11px] font-mono w-full">
                    <thead>
                      <tr className="text-txt3 border-b border-line">
                        <th className="text-left py-2 pr-4">Plataforma</th>
                        <th className="text-right py-2 px-3">Raw rows<br/>(gviz)</th>
                        <th className="text-right py-2 px-3">Raw S18<br/>(gviz)</th>
                        <th className="text-right py-2 px-3">Posts ok<br/>(normalizados)</th>
                        <th className="text-right py-2 pl-3">Posts S18<br/>(dashboard)</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${platOrder.map(p => html`
                        <tr key=${p} className="border-b border-line/40 text-txt2">
                          <td className="py-2 pr-4">${p}</td>
                          <td className="text-right py-2 px-3">${d.rawCountByPlat?.[p] ?? '—'}</td>
                          <td className="text-right py-2 px-3 ${d.rawS18ByPlat?.[p] !== d.s18ByPlat?.[p] ? 'text-amber' : ''}">
                            ${d.rawS18ByPlat?.[p] ?? '—'}
                          </td>
                          <td className="text-right py-2 px-3">${d.byPlatform?.[p]?.posts_ok ?? '—'}</td>
                          <td className="text-right py-2 pl-3 ${d.s18ByPlat?.[p] !== (d.rawS18ByPlat?.[p] || 0) ? 'text-amber' : 'text-txt'}">
                            ${d.s18ByPlat?.[p] ?? 0}
                          </td>
                        </tr>
                      `)}
                      <tr className="text-txt font-medium">
                        <td className="py-2 pr-4">TOTAL</td>
                        <td className="text-right py-2 px-3">${Object.values(d.rawCountByPlat||{}).reduce((a,b)=>a+b,0)}</td>
                        <td className="text-right py-2 px-3">${Object.values(d.rawS18ByPlat||{}).reduce((a,b)=>a+b,0)}</td>
                        <td className="text-right py-2 px-3">${d.totalPosts}</td>
                        <td className="text-right py-2 pl-3">${d.totalS18}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div className="text-[10px] text-txt3 mt-2 leading-relaxed">
                  · <span className="text-txt">Raw rows</span> = filas que gviz devolvió desde tu Google Sheet en vivo (incluyendo vacías y descartadas).<br/>
                  · <span className="text-txt">Raw S18</span> = de esas, cuántas tienen Semana = 18 al leer el CSV crudo.<br/>
                  · <span className="text-txt">Posts ok</span> = cuántas pasaron la regla <code>hasAnyIdentity</code> (no son filas completamente vacías).<br/>
                  · <span className="text-txt">Posts S18</span> = el conteo final que muestra el dashboard.<br/>
                  · Si Raw S18 ≠ Posts S18, la regla de descarte está eliminando filas legítimas.<br/>
                  · Si Raw S18 ya es menor a lo esperado, el Google Sheet en vivo está devolviendo menos datos que tu .xlsx exportado.
                </div>
              </div>

              ${d.rawS18Rows?.Instagram?.length > 0 && html`
                <div>
                  <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2">
                    Filas RAW de Instagram en S18 (lo que recibió gviz)
                  </div>
                  <div className="overflow-x-auto">
                    <table className="text-[11px] font-mono w-full">
                      <thead>
                        <tr className="text-txt3 border-b border-line">
                          <th className="text-left py-2 pr-4">#</th>
                          <th className="text-left py-2 pr-4">Link</th>
                          <th className="text-left py-2 pr-4">Fecha</th>
                          <th className="text-left py-2 pr-4">Formato</th>
                          <th className="text-right py-2 pr-4">Alcance</th>
                          <th className="text-right py-2">Inter. Totales</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${d.rawS18Rows.Instagram.map((r, i) => html`
                          <tr key=${i} className="border-b border-line/40 text-txt2">
                            <td className="py-1.5 pr-4 text-txt4">${i+1}</td>
                            <td className="py-1.5 pr-4">${r.link}</td>
                            <td className="py-1.5 pr-4">${r.fecha || '—'}</td>
                            <td className="py-1.5 pr-4">${r.formato || '—'}</td>
                            <td className="py-1.5 pr-4 text-right">${r.alcance || '—'}</td>
                            <td className="py-1.5 text-right">${r.inter_totales || '—'}</td>
                          </tr>
                        `)}
                      </tbody>
                    </table>
                  </div>
                </div>
              `}

              <div className="text-[10px] text-txt4">
                Para inspección manual abre la consola del navegador (F12 → Console) y escribe: <code className="text-txt2">window.__smxDebug</code>
              </div>
            </div>
          `}
        </div>`;
    }

    function Footer({ fetchedAt, totalPosts }) {
      return html`
        <footer className="border-t border-line mt-3 mx-7">
          <div className="py-7 grid grid-cols-1 md:grid-cols-3 gap-5 items-end">
            <div>
              <div className="font-serif italic text-[20px] text-txt mb-1">Samsung MX.</div>
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4">Performance Brief · 2026</div>
            </div>
            <div className="text-[11px] text-txt3 leading-relaxed">
              Datos en vivo desde Google Sheets. Cualquier cambio en la base se refleja al recargar (auto-refresh activo).
            </div>
            <div className="text-right text-[10px] font-mono text-txt4">
              ${totalPosts.toLocaleString('es-MX')} posts indexados<br/>
              Última carga · ${fetchedAt ? new Date(fetchedAt).toLocaleString('es-MX') : '—'}
            </div>
          </div>
        </footer>`;
    }

    // ============================================================
    // App principal
    // ============================================================
    function App() {
      const { data, loading, refreshing, error, errors, fetchedAt, refresh, autoRefreshMin } = useDashboardData();
      const [selected, setSelected] = useState(null);
      const { filters, setFilters, clear, isActive } = useFilters();

      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('smx-sidebar-collapsed') === '1'; } catch { return false; }
      });
      const toggleSidebar = useCallback(() => {
        setSidebarCollapsed(prev => {
          const next = !prev;
          try { localStorage.setItem('smx-sidebar-collapsed', next ? '1' : '0'); } catch {}
          return next;
        });
      }, []);

      // baseMeta y filteredData se recalculan SOLO cuando cambian
      // los datos crudos o los filtros — nunca durante un re-render normal.
      const baseMeta = data?.meta || null;
      const allPosts = data?.allPosts || [];

      const filteredData = useMemo(() => {
        if (!data || !baseMeta) return null;
        const filtered = applyFilters(allPosts, filters);
        const result = computeAggregates(filtered, baseMeta);
        // Expone el año seleccionado en meta para que TrendSection/PlatformsGrid
        // sepan qué año usar al calcular los 7 días de la semana en modo diario.
        result.meta.selected_year = filters.year;
        return result;
      }, [data, allPosts, baseMeta, filters]);

      if (loading) return html`<${LoadingState}/>`;
      if (error)   return html`<${ErrorState} message=${error} onRetry=${refresh}/>`;
      if (!data || !filteredData) return html`<${ErrorState} message="Sin datos disponibles." onRetry=${refresh}/>`;

      const D = filteredData;
      const noResults = D.global.posts === 0;

      return html`
        <div className="min-h-screen bg-ink text-txt flex">
          <${Sidebar}
            collapsed=${sidebarCollapsed}
            onToggle=${toggleSidebar}
            liveAlcance=${D.global.reach}
            livePosts=${D.global.posts}
            fetchedAt=${fetchedAt}
            autoRefreshMin=${autoRefreshMin}
          />

          <div className="flex-1 min-w-0 flex flex-col">
            <${FilterBar}
              baseMeta=${baseMeta}
              filters=${filters}
              setFilters=${setFilters}
              clear=${clear}
              isActive=${isActive}
              postsInScope=${D.global.posts}
              totalPosts=${baseMeta.total_posts}
            />

            <${TopBar} fetchedAt=${fetchedAt} onRefresh=${refresh} refreshing=${refreshing} autoRefreshMin=${autoRefreshMin}/>

            ${errors && errors.length > 0 && html`
              <div className="px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Aviso</span> · No se pudo cargar
                  ${errors.length === 1 ? ' ' + errors[0].platform : ` ${errors.length} pestañas`}.
                  Las demás se muestran con normalidad.
                </div>
              </div>
            `}

            ${baseMeta.orphans_no_week > 0 && filters.weekRange && html`
              <div className="px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Nota</span> ·
                  Hay ${baseMeta.orphans_no_week} ${baseMeta.orphans_no_week === 1 ? 'post' : 'posts'} sin semana asignada en tu Sheet
                  ${' '}(${Object.entries(baseMeta.orphans_no_week_by_platform).map(([p,n]) => `${p}: ${n}`).join(', ')})
                  ${' '}— se excluyen del filtro actual de semana.
                </div>
              </div>
            `}

            ${noResults ? html`
              <div className="px-7 py-32 text-center">
                <div className="font-mono text-[11px] uppercase tracking-[0.2em] text-amber mb-4">Sin resultados</div>
                <h2 className="text-3xl text-txt mb-3 font-medium">No hay posts que cumplan los filtros.</h2>
                <p className="text-txt3 text-sm mb-6">Prueba ampliando el rango de semanas o quitando alguna selección.</p>
                <button onClick=${clear}
                        className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-accent text-ink text-sm font-medium hover:bg-accent2 hover:text-white transition-colors">
                  Limpiar filtros
                </button>
              </div>
            ` : html`
              <main>
                <${HeroSection}    D=${D}/>
                <${KpiRow}         D=${D}/>
                <${PlatformsGrid}  D=${D}/>
                <${TrendSection}   D=${D}/>
                <${MixSection}     D=${D}/>
                <${TopPostsTable}  D=${D} onPick=${setSelected}/>
                <${VtrSection}         D=${D}/>
                <${AveragesSection}    D=${D}/>
                <${ComparativasSection} D=${D} rawPosts=${allPosts} filters=${filters}/>
                <${CatalogSection}     D=${D}/>
              </main>
            `}

            <${DiagnosticPanel} />

            <${Footer} fetchedAt=${fetchedAt} totalPosts=${baseMeta.total_posts}/>
          </div>

          ${selected && html`<${DetailDrawer} post=${selected} onClose=${() => setSelected(null)}/>`}
        </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
</html>
