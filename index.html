    // ============================================================
    // InsightsPanel — lecturas automáticas del periodo filtrado.
    // Reglas deterministas sobre D (nada de llamadas externas): cada
    // función evalúa una condición y, si es lo bastante notable, agrega
    // una oración corta. Se ordenan por relevancia y se muestran las
    // primeras 4, para no saturar con obviedades.
    // ============================================================
    function computeInsights(D) {
      const insights = [];
      const g = D.global;
      if (!g || !g.posts) return insights;

      // 1) Plataforma líder (solo si hay más de una en el filtro actual
      // y de verdad domina — si no, no aporta nada decirlo)
      {
        const entries = Object.entries(D.by_platform || {});
        if (entries.length > 1 && g.reach > 0) {
          const [name, agg] = [...entries].sort((a, b) => b[1].reach - a[1].reach)[0];
          const share = (agg.reach / g.reach) * 100;
          if (share >= 25) {
            insights.push({
              id: 'platform-leader', tone: 'neutral', priority: share,
              parts: [
                { t: name, strong: true },
                { t: ' lideró el alcance con ' },
                { t: `${share.toFixed(0)}%`, strong: true },
                { t: ' de participación (' },
                { t: `${agg.posts} posts`, strong: true },
                { t: ').' },
              ],
            });
          }
        }
      }

      // 2) Tendencia semana a semana (últimas dos semanas con datos
      // dentro del filtro actual)
      {
        const weekKeys = Object.keys(D.by_week || {}).map(Number).sort((a, b) => a - b);
        if (weekKeys.length >= 2) {
          const currW = weekKeys[weekKeys.length - 1];
          const prevW = weekKeys[weekKeys.length - 2];
          const currReach = D.by_week[currW].reach;
          const prevReach = D.by_week[prevW].reach;
          if (prevReach > 0) {
            const delta = ((currReach - prevReach) / prevReach) * 100;
            if (Math.abs(delta) >= 8) {
              const up = delta > 0;
              insights.push({
                id: 'wow-trend', tone: up ? 'positive' : 'negative', priority: Math.abs(delta) * 0.9,
                parts: [
                  { t: 'El alcance ' },
                  { t: up ? 'subió' : 'bajó', strong: true },
                  { t: ` ${Math.abs(delta).toFixed(0)}%`, strong: true },
                  { t: ` en la ${wkLong(currW).toLowerCase()} vs. la ${wkLong(prevW).toLowerCase()}.` },
                ],
              });
            }
          }
        }
      }

      // 3) Mejor formato por ER — se exige un mínimo de posts para no
      // premiar a un formato con 1 publicación afortunada
      {
        const MIN = 3;
        const entries = Object.entries(D.by_format || {}).filter(([, v]) => v.posts >= MIN && v.er_avg > 0);
        if (entries.length >= 2) {
          const [name, agg] = entries.sort((a, b) => b[1].er_avg - a[1].er_avg)[0];
          insights.push({
            id: 'best-format', tone: 'positive', priority: 38,
            parts: [
              { t: name, strong: true },
              { t: ' fue el formato con mejor ER (' },
              { t: erFmt(agg.er_avg), strong: true },
              { t: `) entre los que tuvieron ${MIN}+ posts.` },
            ],
          });
        }
      }

      // 4) Campaña que concentra el alcance
      {
        const MIN = 3;
        const entries = Object.entries(D.by_campaign || {}).filter(([, v]) => v.posts >= MIN);
        if (entries.length >= 2 && g.reach > 0) {
          const [name, agg] = entries.sort((a, b) => b[1].reach - a[1].reach)[0];
          const share = (agg.reach / g.reach) * 100;
          if (share >= 15) {
            insights.push({
              id: 'top-campaign', tone: 'neutral', priority: share * 0.8,
              parts: [
                { t: 'La campaña ' },
                { t: name, strong: true },
                { t: ' concentró ' },
                { t: `${share.toFixed(0)}%`, strong: true },
                { t: ` del alcance total (${fmt(agg.reach)}).` },
              ],
            });
          }
        }
      }

      // 5) Post con mayor alcance del periodo filtrado
      {
        const posts = D.allPosts || [];
        if (posts.length >= 5) {
          const top = [...posts].sort((a, b) => (b.reach || 0) - (a.reach || 0))[0];
          if (top && top.reach) {
            insights.push({
              id: 'top-post', tone: 'positive', priority: 33,
              parts: [
                { t: 'El post con mayor alcance fue ' },
                { t: `${top.format || 'contenido'} de ${top.platform}`, strong: true },
                { t: top.campaign ? ` (${top.campaign})` : '' },
                { t: ' con ' },
                { t: fmt(top.reach), strong: true },
                { t: ' de alcance.' },
              ],
              post: top,
            });
          }
        }
      }

      return insights.sort((a, b) => b.priority - a.priority).slice(0, 4);
    }

    function InsightLine({ insight }) {
      const toneColor = insight.tone === 'positive' ? 'text-success' : insight.tone === 'negative' ? 'text-amber' : 'text-txt4';
      const glyph = insight.tone === 'positive' ? '↑' : insight.tone === 'negative' ? '↓' : '–';
      return html`
        <div className="flex items-start gap-2.5 py-1.5">
          <span className=${"font-mono text-[13px] leading-[1.4] mt-0.5 shrink-0 " + toneColor}>${glyph}</span>
          <p className="text-[13px] text-txt3 leading-relaxed">
            ${insight.parts.map((part, i) => part.strong
              ? html`<span key=${i} className="text-txt2 font-medium">${part.t}</span>`
              : html`<span key=${i}>${part.t}</span>`)}
            ${insight.post && safeLink(insight.post.link) && html` <${PostLink} p=${insight.post} />`}
          </p>
        </div>`;
    }

    function InsightsPanel({ D }) {
      const insights = useMemo(() => computeInsights(D), [D]);
      if (!insights.length) return null;
      return html`
        <section className="px-4 md:px-7 pb-8 -mt-2">
          <div className="text-[13px] font-medium text-txt mb-3">Lecturas del periodo</div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-x-10 gap-y-1">
            ${insights.map(ins => html`<${InsightLine} key=${ins.id} insight=${ins} />`)}
          </div>
        </section>`;
    }

    // ============================================================
    // KpiRow — strip de 6 cards
    // ============================================================
    // v62 — FLIP: al reordenar una tabla, cada fila se desliza de su posición
    // anterior a la nueva (se identifica por data-flip, no por el nodo de React).
    function useFlip(ref, dep) {
      const prev = useRef(null);
      React.useLayoutEffect(() => {
        const el = ref.current; if (!el) return;
        const rows = [...el.querySelectorAll('[data-flip]')];
        const now = new Map(rows.map(r => [r.getAttribute('data-flip'), r.getBoundingClientRect().top]));
        const before = prev.current;
        prev.current = now;
        if (!before || prefersReduced()) return;
        for (const r of rows) {
          const k = r.getAttribute('data-flip');
          const was = before.get(k);
          const dy = was == null ? 24 : was - now.get(k);
          if (!dy) continue;
          r.style.transition = 'none';
          r.style.transform = `translateY(${dy}px)`;
          r.style.opacity = was == null ? '0' : '';
        }
        el.getBoundingClientRect();
        requestAnimationFrame(() => {
          for (const r of rows) {
            if (!r.style.transform) continue;
            r.style.transition = 'transform 520ms cubic-bezier(.16,1,.3,1), opacity 320ms ease';
            r.style.transform = ''; r.style.opacity = '';
          }
        });
      }, [dep]);
    }

    // v61 — Cifra que cuenta hasta su valor al aparecer o al cambiar de filtro.
    // Arranca desde el valor anterior (no desde 0) para que se lea el cambio.
    const prefersReduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };
    function CountUp({ value, format, duration = 900 }) {
      const [shown, setShown] = useState(value);
      const [pulse, setPulse] = useState(0);
      const from = useRef(null);
      useEffect(() => {
        // Pulso solo si el cambio viene de una actualización del Sheet (no de un filtro)
        if (from.current != null && value != null && from.current !== value && Date.now() - (window.__smxRefreshAt || 0) < 2500) setPulse(k => k + 1);
      }, [value]);
      useEffect(() => {
        if (value == null || !isFinite(value) || prefersReduced() || document.documentElement.classList.contains('capturing')) { setShown(value); from.current = value; return; }
        const start = from.current == null ? 0 : from.current;
        if (start === value) { setShown(value); return; }
        let raf, t0;
        const ease = (t) => 1 - Math.pow(1 - t, 4);
        const tick = (t) => {
          if (t0 == null) t0 = t;
          const k = Math.min(1, (t - t0) / duration);
          setShown(start + (value - start) * ease(k));
          if (k < 1) raf = requestAnimationFrame(tick); else from.current = value;
        };
        raf = requestAnimationFrame(tick);
        return () => { cancelAnimationFrame(raf); from.current = value; };
      }, [value]);
      return html`<span key=${pulse} className=${"tabular-nums" + (pulse ? " value-pulse" : "")}>${shown == null ? '—' : format(shown)}</span>`;
    }

    function KpiCell({ label, value, sub, onClick, delta, deltaLabel, exact, num, format, cmps }) {
      return html`
        <div onClick=${onClick} ...${kbd(onClick, `Ver de dónde sale ${label}`)}
             className=${"min-w-0 rounded-lg -m-2 p-2 focus:outline-none focus-visible:ring-1 focus-visible:ring-accent2 " + (onClick ? "cursor-pointer hover:bg-onSurface/[0.03] transition-colors" : "")}
             title=${onClick ? `Ver de qué posts sale ${label}` : undefined}>
          <div className="text-[13px] text-txt3">${label}</div>
          <div className="text-txt tabular-nums mt-1.5" title=${exact || undefined}
               style=${{ fontSize: 'clamp(19px, 2.3vw, 34px)', fontWeight: 500, lineHeight: 1.05, letterSpacing: '-0.02em' }}>${num != null ? html`<${CountUp} value=${num} format=${format} />` : value}</div>
          ${sub && html`<div className="mt-2 text-[12px] text-txt4">${sub}</div>`}
          ${(cmps || []).length > 0 && html`<div className="mt-2 space-y-0.5">
            ${cmps.map((c, i) => html`<div key=${i} className="flex flex-wrap items-baseline gap-x-2 text-[12px] text-txt4" title=${c.t || ''}><${DeltaPill} pct=${c.v} /><span>${c.l}</span></div>`)}
          </div>`}
        </div>`;
    }

    function KpiRow({ D, onTrace, rawPosts, filters }) {
      const g = D.global;
      const heroDeltas = useMemo(() => computeHeroDeltas(D, rawPosts, filters), [D, rawPosts, filters]);
      const P = heroDeltas?.prev, Y = heroDeltas?.yoy;
      const cmp = (k) => [P && { v: P[k], l: heroDeltas.prevLabel, t: heroDeltas.prevTitle }, Y && { v: Y[k], l: heroDeltas.yoyLabel }].filter(x => x && x.v != null && isFinite(x.v));
      const sec = [
        ['ER total', erFmt(g.er_avg), P?.er_avg, onTrace ? () => onTrace('er_avg') : null, 'Mediana del ER total por post (interacciones totales, incluye reproducciones, ÷ alcance; sin Stories)'],
        ['ER básico', erFmt(g.basic_er_avg), null, null, 'Promedio del ER básico de cada post (sin Stories)'],
        ['CTR', g.ctr_avg > 0 ? erFmt(g.ctr_avg) : '—', null, null, 'Clics ÷ impresiones'],
        ['Comentarios', fmtFull(g.comments), P?.comments, onTrace ? () => onTrace('comments') : null],
        ['Compartidos', fmtFull(g.shares), null, null],
        ['Impresiones', g.impressions > 0 ? fmtFull(g.impressions) : '—', null, null],
      ];
      return html`
        <div className="rounded-2xl bg-surface p-6 md:p-7">
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-x-6 md:gap-x-8 gap-y-6">
            <${KpiCell} label="Alcance"        exact=${fmtFull(g.reach)} value=${fmt(g.reach)} num=${g.reach} format=${fmt} cmps=${cmp('reach')} onClick=${onTrace ? () => onTrace('reach') : undefined} />
            <${KpiCell} label="Interacciones"  exact=${fmtFull(g.inter)} value=${fmt(g.inter)} num=${g.inter} format=${fmt} cmps=${cmp('inter')} onClick=${onTrace ? () => onTrace('inter') : undefined} />
            <${KpiCell} label="Reproducciones" exact=${fmtFull(g.views)} value=${fmt(g.views)} num=${g.views} format=${fmt} cmps=${cmp('views')} onClick=${onTrace ? () => onTrace('views') : undefined} />
            <${KpiCell} label="VTR" value=${erFmt(g.vtr_avg)} num=${g.vtr_avg} format=${erFmt} sub="promedio por video" cmps=${cmp('vtr_avg')} />
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-x-6 md:gap-x-8 gap-y-4 mt-7 pt-6 items-start" style=${{ boxShadow: 'inset 0 1px 0 rgb(var(--c-txt) / 0.05)' }}>
            ${sec.map(([l, v, dv, fn, hint]) => html`
              <button key=${l} onClick=${fn || undefined} disabled=${!fn} title=${hint || (fn ? `Ver de qué posts sale ${l}` : undefined)}
                      className=${"text-left min-w-0 " + (fn ? "hover:text-accent cursor-pointer" : "cursor-default")}>
                <div className="text-[12px] text-txt4">${l}</div>
                <div className="flex items-baseline gap-2 mt-1"><span className="text-[17px] text-txt tabular-nums">${v}</span>${dv != null && html`<${DeltaPill} pct=${dv} />`}</div>
                ${l === 'ER total' && html`<div className="text-[11px] text-txt4 mt-0.5">mediana · incluye reproducciones</div>`}
              </button>`)}
          </div>
          <${PautaSplit} D=${D} />
        </div>`;
    }

    // v57 — Orgánico vs. pauta como tabla compacta dentro del mismo panel:
    // mezclarlos en un solo ER esconde el orgánico, pero no necesitan dos tarjetas.
    function PautaSplit({ D }) {
      const groups = useMemo(() => groupAgg(D.allPosts || [], p => p.strategy || 'Sin clasificar'), [D]);
      const totalReach = D.global?.reach || 0;
      const order = (k) => /org/i.test(k) ? 0 : /paid|pauta|pagad/i.test(k) ? 1 : /sin clasificar/i.test(k) ? 3 : 2;
      const entries = Object.entries(groups).sort((a, b) => order(a[0]) - order(b[0]) || b[1].reach - a[1].reach);
      if (entries.length < 2) return null;
      const labelOf = (k) => /^paid$/i.test(k) ? 'Pauta' : k;
      return html`
        <div className="mt-7 overflow-x-auto">
          <table className="w-full text-[13px] whitespace-nowrap no-zebra plain">
            <thead><tr>
              <th className="text-left py-2 px-3">Orgánico vs. pauta</th>
              <th className="text-right py-2 px-3">Posts</th>
              <th className="text-right py-2 px-3">Alcance</th>
              <th className="text-left py-2 px-3 w-[22%]">Parte del alcance</th>
              <th className="text-right py-2 px-3">ER básico</th>
              <th className="text-right py-2 px-3">ER total</th>
            </tr></thead>
            <tbody>
              ${entries.map(([k, s]) => {
                const share = totalReach > 0 ? (s.reach / totalReach) * 100 : 0;
                const muted = /sin clasificar/i.test(k);
                return html`<tr key=${k}>
                  <td className=${"py-2.5 px-3 " + (muted ? "text-amber" : "text-txt")}>${labelOf(k)}</td>
                  <td className="py-2.5 px-3 text-right tabular-nums text-txt2">${fmtFull(s.posts)}</td>
                  <td className="py-2.5 px-3 text-right tabular-nums text-txt">${fmtFull(s.reach)}</td>
                  <td className="py-2.5 px-3">
                    <div className="flex items-center gap-3"><div className="flex-1 h-1.5 rounded-full bg-onSurface/[0.06] overflow-hidden"><div className="bar-grow h-full rounded-full bg-txt3/60" style=${{ width: share + '%', background: 'rgb(var(--c-txt) / 0.45)' }}></div></div><span className="tabular-nums text-txt3 w-10 text-right">${share.toFixed(0)}%</span></div>
                  </td>
                  <td className="py-2.5 px-3 text-right tabular-nums text-txt">${erFmt(s.basic_er_avg)}</td>
                  <td className="py-2.5 px-3 text-right tabular-nums text-txt2">${erFmt(s.er_avg)}</td>
                </tr>`;
              })}
            </tbody>
          </table>
        </div>`;
    }

    // ============================================================
    // Trazabilidad de KPI — clic en un número del strip de arriba y ver
    // exactamente qué posts lo componen y cómo se calculó. Dos tipos:
    // "sum" (participan todos los posts del filtro, aunque sumen 0) y
    // "avg" (solo participan los posts con dato registrado — se listan
    // los excluidos para que quede claro por qué el denominador no es
    // el total de posts).
    // ============================================================
    const KPI_TRACE_CONFIG = {
      reach:     { field: 'reach',        type: 'sum', label: 'Alcance',        formula: 'Suma del campo "Alcance" de cada post dentro del filtro actual.' },
      inter:     { field: 'interactions', type: 'sum', label: 'Interacciones',  formula: 'Suma del campo "Interacciones" de cada post dentro del filtro actual.' },
      views:     { field: 'views',        type: 'sum', label: 'Reproducciones', formula: 'Suma del campo "Reproducciones" de cada post dentro del filtro actual (aplica principalmente a video).' },
      comments:  { field: 'comments',     type: 'sum', label: 'Comentarios',    formula: 'Suma del campo "Comentarios" de cada post dentro del filtro actual.' },
      er_avg:    { field: 'er',           type: 'ratio', label: 'ER total', formula: 'Mediana del ER total (interacciones totales, incluye reproducciones, ÷ alcance) de los posts del filtro: el valor del post típico. Se usa mediana porque hay posts con valores extremos (más reproducciones que alcance) que disparan un promedio. Se excluyen Stories, posts sin alcance y valores imposibles.' },
    };

    function computeKpiTrace(D, key) {
      const cfg = KPI_TRACE_CONFIG[key];
      if (!cfg) return null;
      const posts = D.allPosts || [];

      if (cfg.type === 'sum') {
        const total = posts.reduce((s, p) => s + (p[cfg.field] || 0), 0);
        const top = [...posts].sort((a, b) => (b[cfg.field] || 0) - (a[cfg.field] || 0)).slice(0, 12);
        return { ...cfg, key, total, postsCount: posts.length, top };
      }

      if (cfg.type === 'ratio') {
        const included = posts.filter(p => p.reach > 0 && p.er != null && !(p._flags || []).includes('er') && p.format !== 'Stories');
        const flagged = posts.filter(p => (p._flags || []).includes('er'));
        const num = 0;
        const den = included.length;
        const value = den ? medianOf(included.map(p => p.er)) : 0;
        const nz = included.filter(p => p.er !== 0);
        const mean = nz.length ? nz.reduce((s, p) => s + p.er, 0) / nz.length : 0;
        const top = [...included].sort((a, b) => (b.reach || 0) - (a.reach || 0)).slice(0, 12);
        return {
          ...cfg, key, value, num, den, mean, flagged,
          includedCount: included.length,
          excludedCount: posts.length - included.length,
          postsCount: posts.length, top,
        };
      }

      // avg
      const withValue = posts.filter(p => p[cfg.field] != null && p[cfg.field] !== 0);
      const sum = withValue.reduce((s, p) => s + p[cfg.field], 0);
      const avg = withValue.length ? sum / withValue.length : 0;
      const top = [...withValue].sort((a, b) => b[cfg.field] - a[cfg.field]).slice(0, 12);
      return {
        ...cfg, key, avg, sum,
        includedCount: withValue.length,
        excludedCount: posts.length - withValue.length,
        postsCount: posts.length, top,
      };
    }

    // v27 — link a la publicación original (columna "Link" del Sheet).
    // Abre en pestaña nueva y no dispara el click de la fila.
    const safeLink = (l) => { const u = (l || '').trim(); return /^https?:\/\//i.test(u) ? u : null; };
    function PostLink({ p, compact = false }) {
      const url = safeLink(p && p.link);
      if (!url) return html`<span className="text-faint text-[11px]" title="Este post no tiene link en el Sheet">—</span>`;
      return html`
        <a href=${url} target="_blank" rel="noopener noreferrer"
           onClick=${(e) => e.stopPropagation()} onKeyDown=${(e) => e.stopPropagation()}
           aria-label=${`Abrir publicación de ${p.platform}${p.date ? ', ' + dateShort(p.date) : ''} en una pestaña nueva`}
           title="Abrir publicación"
           className="inline-flex items-center gap-1 rounded-full bg-accent2/10 hover:bg-accent2/20 text-txt2 hover:text-txt px-2 py-0.5 text-[11px] font-sans whitespace-nowrap transition-colors">
          ${compact ? '' : 'Ver'} <${ExtIcon} size=${11}/>
        </a>`;
    }

    function SheetRow({ p }) {
      const url = p && sheetRowUrl(p.platform, p._row);
      if (!url) return html`<span className="text-faint text-[11px]" title="No se pudo ubicar la fila">—</span>`;
      return html`
        <a href=${url} target="_blank" rel="noopener noreferrer"
           onClick=${(e) => e.stopPropagation()} onKeyDown=${(e) => e.stopPropagation()}
           title=${`Abrir el Sheet en ${SHEET_TABS[p.platform]}, fila ${p._row}`}
           aria-label=${`Abrir el Sheet en la pestaña ${p.platform}, fila ${p._row}`}
           className="inline-flex items-center gap-1 rounded-full bg-onSurface/[0.05] hover:bg-onSurface/[0.1] text-txt2 hover:text-txt px-2 py-0.5 text-[11px] font-mono whitespace-nowrap transition-colors">
          ${PLAT_LETTERS[p.platform]} · ${p._row}
        </a>`;
    }

    function TraceRow({ trace, p, onPick }) {
      const color = PLAT_COLORS[p.platform];
      const val = trace.field === 'er' ? erFmt(p[trace.field]) : fmt(p[trace.field]);
      return html`
        <tr onClick=${() => onPick(p)} ...${kbd(() => onPick(p), `Ver post de ${p.platform}, ${dateShort(p.date)}`)}
            className="border-b border-line/50 last:border-0 hover:bg-onSurface/[0.025] focus:outline-none focus-visible:bg-accent2/10 cursor-pointer transition-colors">
          <td className="py-2 px-3">
            <span className="inline-flex items-center gap-2 text-[12px] text-txt2"><svg width="8" height="8" viewBox="0 0 8 8" className="shrink-0" aria-hidden="true"><circle cx="4" cy="4" r="4" fill=${color} /></svg>${p.platform}</span>
          </td>
          <td className="py-2 px-3 font-mono text-[11px] text-txt3">${dateShort(p.date)}</td>
          <td className="py-2 px-3 text-[12px] text-txt2 truncate max-w-[160px]" title=${p.campaign || ''}>${p.campaign || '—'}</td>
          <td className="py-2 px-3 text-right font-mono tabular-nums text-[12px] text-txt">${val}</td>
          <td className="py-2 pl-1 pr-3 text-right"><${PostLink} p=${p} compact /></td>
        </tr>`;
    }

    function KpiTraceDrawer({ trace, onClose, onPick }) {
      if (!trace) return null;
      const isSum = trace.type === 'sum';
      const isRatio = trace.type === 'ratio';
      return html`
        <div className="fixed inset-0 z-40 flex justify-end" style=${{ background: 'rgba(0,0,0,0.45)' }} onClick=${onClose}>
          <div role="dialog" aria-modal="true" aria-label=${`Trazabilidad de ${trace.label}`}
               className="w-full max-w-[540px] h-full bg-surface border-l border-line overflow-y-auto" onClick=${e => e.stopPropagation()}>
            <div className="sticky top-0 bg-surface border-b border-line px-6 py-4 flex items-center justify-between z-10">
              <div className="text-[13px] font-medium text-txt">Trazabilidad · ${trace.label}</div>
              <button onClick=${onClose} aria-label="Cerrar trazabilidad" autoFocus className="text-txt4 hover:text-txt transition-colors"><${XIcon} size=${18}/></button>
            </div>

            <div className="p-6 space-y-6">
              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Valor mostrado en el dashboard</div>
                <div className="font-medium text-txt tabular-nums" style=${{ fontSize: 'clamp(24px, 3vw, 34px)' }}>
                  ${isSum ? fmt(trace.total) : isRatio ? erFmt(trace.value) : erFmt(trace.avg)}
                </div>
              </div>

              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Fórmula</div>
                <p className="text-[13px] text-txt3 leading-relaxed">${trace.formula}</p>
              </div>

              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Alcance del cálculo</div>
                ${isSum ? html`
                  <p className="text-[13px] text-txt3 leading-relaxed">
                    Incluye los <span className="text-txt2 font-medium">${fmtFull(trace.postsCount)} posts</span> del filtro actual (aunque un post no tenga dato, cuenta como 0).
                  </p>
                ` : isRatio ? html`
                  <p className="text-[13px] text-txt3 leading-relaxed">
                    <span className="text-txt2 font-medium">${fmtFull(trace.includedCount)} de ${fmtFull(trace.postsCount)} posts</span> entran al cálculo
                    ${trace.excludedCount > 0 ? html` · <span className="text-amber">${fmtFull(trace.excludedCount)} excluido${trace.excludedCount === 1 ? '' : 's'}</span> (Stories, sin alcance, sin ER o con valor imposible)` : '.'}
                  </p>
                  <p className="text-[12px] text-txt4 mt-2">Mediana de ${fmtFull(trace.den)} posts = ${erFmt(trace.value)}</p>
                  ${trace.flagged.length > 0 && html`
                    <div className="mt-3 rounded-lg border border-amber/40 bg-amber/[0.06] px-3 py-2.5">
                      <div className="text-[11px] text-amber font-medium mb-1">${trace.flagged.length} post${trace.flagged.length === 1 ? '' : 's'} con ER Básico > 100% (revisar en el Sheet)</div>
                      ${trace.flagged.slice(0, 20).map((p, i) => html`
                        <div key=${i} onClick=${() => onPick(p)} ...${kbd(() => onPick(p), `Ver post de ${p.platform}, ${dateShort(p.date)}`)} className="text-[11px] font-mono text-txt3 cursor-pointer hover:text-txt py-0.5">
                          ${p.platform} · ${dateShort(p.date)} · ${p.format || '—'} · alcance ${fmtFull(p.reach || 0)} · ER Básico ${erFmt(p.basic_er)}
                        </div>`)}
                    </div>
                  `}
                ` : html`
                  <p className="text-[13px] text-txt3 leading-relaxed">
                    <span className="text-txt2 font-medium">${fmtFull(trace.includedCount)} de ${fmtFull(trace.postsCount)} posts</span> tienen ${trace.label.toLowerCase()} registrado y entran al promedio
                    ${trace.excludedCount > 0 ? html` · <span className="text-amber">${fmtFull(trace.excludedCount)} excluido${trace.excludedCount === 1 ? '' : 's'}</span> por no tener valor` : '.'}
                  </p>
                  <p className="text-[11px] font-mono text-faint mt-2">suma ${erFmt(trace.sum)} ÷ ${fmtFull(trace.includedCount)} posts = ${erFmt(trace.avg)}</p>
                `}
              </div>

              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2">
                  ${isSum ? 'Principales contribuyentes' : isRatio ? 'Posts con más peso (mayor alcance)' : 'Valores más altos que entran al promedio'}
                </div>
                <div className="rounded-xl border border-line overflow-hidden">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="border-b border-line text-[9px] font-mono uppercase tracking-[0.15em] text-txt4 bg-onSurface/[0.02]">
                        <th className="text-left py-2 px-3 font-medium">Plat.</th>
                        <th className="text-left py-2 px-3 font-medium">Fecha</th>
                        <th className="text-left py-2 px-3 font-medium">Campaña</th>
                        <th className="text-right py-2 px-3 font-medium">${isRatio ? 'ER del post' : trace.label}</th>
                        <th className="text-right py-2 pl-1 pr-3 font-medium">Link</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${trace.top.map((p, i) => html`<${TraceRow} key=${i} trace=${trace} p=${p} onPick=${onPick} />`)}
                    </tbody>
                  </table>
                </div>
                <div className="text-[10px] font-mono text-faint mt-2">Click en una fila para ver el post completo · mostrando los ${trace.top.length} con mayor aporte.</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    // ============================================================
    // PlatformsGrid
    // ============================================================

    function PlatformsGrid({ D, filters, setFilters }) {
      const platforms = Object.keys(D.by_platform)
        .sort((a,b) => D.by_platform[b].reach - D.by_platform[a].reach);

      // Clic en una tarjeta = filtrar todo el dashboard a esa plataforma.
      // Clic de nuevo sobre la misma (única) plataforma activa = quitar el filtro.
      const handlePlatformClick = (name) => toggleSingleFilter(setFilters, 'platforms', name);

      // Single-week mode: calculamos serie diaria por plataforma
      // (mismos 7 días Dom→Sáb que TrendSection)
      const weeksInScope = D.meta?.weeks_in_scope || D.meta?.weeks || [];
      const isDailyMode = weeksInScope.length === 1;

      const dailyByPlatform = useMemo(() => {
        if (!isDailyMode) return null;
        const wk = wkWeek(weeksInScope[0]);
        const year = wkYear(weeksInScope[0]);
        const days = weekDays(wk, year);

        const out = {};
        for (const plat of platforms) {
          const byKey = {};
          for (const d of days) byKey[isoDay(d)] = { key: isoDay(d), reach: 0 };
          for (const p of (D.allPosts || [])) {
            if (p.platform !== plat) continue;
            const dt = parseDate(p.date);
            if (!dt) continue;
            const key = isoDay(dt);
            if (byKey[key]) byKey[key].reach += p.reach || 0;
          }
          out[plat] = days.map(d => byKey[isoDay(d)]);
        }
        return out;
      }, [D, isDailyMode, weeksInScope, platforms.join(',')]);

      return html`
        <section id="sec-plataformas" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-plataformas" name="Plataformas" />
          <div className="flex items-baseline justify-between mb-4">
            <div>
              <h2 className="text-[18px] font-medium text-txt">Por plataforma</h2>
              <p className="text-txt4 text-[12px] mt-1">Ordenadas por alcance.</p>
            </div>
          </div>
          ${(() => {
            // v57 — Comparar plataformas es la tarea: una tabla ordenada con la
            // participación del alcance y una mini tendencia por fila se lee
            // mejor que siete tarjetas sueltas.
            const total = platforms.reduce((a, p) => a + (D.by_platform[p].reach || 0), 0);
            const maxShare = Math.max(...platforms.map(p => (D.by_platform[p].reach || 0) / (total || 1)));
            const seriesOf = (p) => dailyByPlatform ? dailyByPlatform[p].map(d => ({ v: d.reach })) :
              Object.keys(D.by_plat_week[p] || {}).sort((a, b) => +a - +b).map(w => ({ v: D.by_plat_week[p][w].reach }));
            return html`
            <div className="rounded-2xl bg-surface p-2 md:p-3 overflow-x-auto">
              <table className="w-full text-[13px] whitespace-nowrap">
                <thead><tr>
                  <th className="text-left py-2.5 px-3">Plataforma</th>
                  <th className="text-right py-2.5 px-3">Posts</th>
                  <th className="text-right py-2.5 px-3">Alcance</th>
                  <th className="text-left py-2.5 px-3 w-[18%]">Parte del alcance</th>
                  <th className="text-right py-2.5 px-3">Interacciones</th>
                  <th className="text-right py-2.5 px-3">ER total</th>
                  <th className="text-right py-2.5 px-3">ER básico</th>
                  <th className="text-right py-2.5 px-3">VTR</th>
                  <th className="text-left py-2.5 px-3 w-[140px]">${isDailyMode ? 'Alcance por día' : 'Alcance semanal'}</th>
                </tr></thead>
                <tbody>
                  ${platforms.map(p => {
                    const st = D.by_platform[p];
                    const share = total ? (st.reach || 0) / total : 0;
                    const active = filters.platforms.length === 1 && filters.platforms[0] === p;
                    const ser = seriesOf(p);
                    return html`<tr key=${p} onClick=${() => handlePlatformClick(p)} ...${kbd(() => handlePlatformClick(p), `Filtrar el dashboard a ${p}`)}
                        title=${active ? 'Quitar el filtro de plataforma' : `Filtrar todo el dashboard a ${p}`}
                        className=${"cursor-pointer transition-colors " + (active ? "bg-accent2/[0.07]" : "hover:bg-onSurface/[0.03]")}>
                      <td className="py-3 px-3"><span className="inline-flex items-center gap-2.5"><svg width="10" height="10" viewBox="0 0 10 10" className="shrink-0" aria-hidden="true"><circle cx="5" cy="5" r="5" fill=${PLAT_COLORS[p]} /></svg><span className="text-txt">${p}</span>${active && html`<span className="text-[11px] text-accent2">filtrada</span>`}</span></td>
                      <td className="py-3 px-3 text-right tabular-nums text-txt3">${fmtFull(st.posts)}</td>
                      <td className="py-3 px-3 text-right tabular-nums text-txt">${fmtFull(st.reach)}</td>
                      <td className="py-3 px-3"><div className="flex items-center gap-3"><div className="flex-1 h-1.5 rounded-full bg-onSurface/[0.06] overflow-hidden"><div className="bar-grow h-full rounded-full" style=${{ width: (maxShare ? share / maxShare * 100 : 0) + '%', background: 'rgb(var(--c-txt) / 0.45)' }}></div></div><span className="tabular-nums text-txt3 w-9 text-right">${(share * 100).toFixed(0)}%</span></div></td>
                      <td className="py-3 px-3 text-right tabular-nums text-txt2">${fmtFull(st.inter)}</td>
                      <td className="py-3 px-3 text-right tabular-nums text-txt2">${erFmt(st.er_avg)}</td>
                      <td className="py-3 px-3 text-right tabular-nums text-txt">${st.basic_er_avg > 0 ? erFmt(st.basic_er_avg) : '—'}</td>
                      <td className="py-3 px-3 text-right tabular-nums text-txt2">${st.vtr_avg > 0 ? erFmt(st.vtr_avg) : '—'}</td>
                      <td className="py-1.5 px-3"><div style=${{ width: 130, height: 28 }}>${ser.length > 1 ? html`
                        <${ResponsiveContainer} width="100%" height="100%"><${LineChart} data=${ser} margin=${{ top: 3, right: 2, left: 2, bottom: 3 }}>
                          <${YAxis} hide domain=${[0, 'dataMax']} /><${Line} type="linear" dataKey="v" stroke=${PLAT_COLORS[p]} strokeWidth=${1.4} dot=${false} isAnimationActive=${false} />
                        <//><//>` : ''}</div></td>
                    </tr>`;
                  })}
                </tbody>
              </table>
            </div>
            <p className="text-[12px] text-txt4 mt-3">Clic en una plataforma para filtrar todo el dashboard. La barra compara su parte del alcance contra la plataforma líder. ER total = mediana por post; ER básico = promedio por post. Ambos sin Stories.</p>`;
          })()}
        </section>`;
    }

    // ============================================================
    // TrendSection
    // ============================================================
    const TREND_METRICS = [
      { k:'reach',         l:'Alcance' },
      { k:'inter',         l:'Interacciones' },
      { k:'views',         l:'Reproducciones' },
      { k:'er_avg',        l:'ER total',    isPercent:true },
      { k:'basic_er_avg',  l:'ER básico',   isPercent:true },
    ];

    function TrendSection({ D, chartTheme, setFilters }) {
      const ct = chartTheme || CHART_VARS;
      const [metric, setMetric] = useState('reach');
      const isPercent = TREND_METRICS.find(m => m.k === metric)?.isPercent;

      // Single-week mode: si el filtro deja una sola semana en el rango,
      // cambia automáticamente a vista por día (Dom→Sáb de esa semana).
      const weeksInScope = D.meta?.weeks_in_scope || D.meta?.weeks || [];
      const isDailyMode = weeksInScope.length === 1;

      const series = useMemo(() => {
        if (isDailyMode) {
          const wk = wkWeek(weeksInScope[0]);
          const year = wkYear(weeksInScope[0]);   // v43: el año viene de la clave año-semana
          const days = weekDays(wk, year);

          // Inicializa los 7 días con ceros (Dom→Sáb)
          const byKey = {};
          for (const d of days) {
            byKey[isoDay(d)] = {
              date: d, posts: 0, reach: 0, inter: 0, views: 0,
              r: rateAccum(),
            };
          }

          // Acumula posts cuya fecha cae dentro de esos 7 días.
          let outOfWindow = 0;
          for (const p of (D.allPosts || [])) {
            const dt = parseDate(p.date);
            if (!dt) { outOfWindow++; continue; }
            const key = isoDay(dt);
            const agg = byKey[key];
            if (!agg) { outOfWindow++; continue; }
            agg.posts++;
            agg.reach += p.reach || 0;
            agg.inter += p.interactions || 0;
            agg.views += p.views || 0;
            rateAdd(agg.r, p);
          }

          const out = days.map(d => {
            const agg = byKey[isoDay(d)];
            let value;
            if (metric === 'er_avg')             value = rateFinal(agg.r).er_avg;
            else if (metric === 'basic_er_avg')  value = rateFinal(agg.r).basic_er_avg;
            else if (metric === 'inter')         value = agg.inter;
            else                                 value = agg[metric];   // reach | views
            return { week: isoDay(d), label: dayLabel(d), value, posts: agg.posts };
          });
          out._outOfWindow = outOfWindow;
          return out;
        }

        // Vista semanal estándar
        const ks = Object.keys(D.by_week).map(Number).sort((a, b) => a - b);
        const my = multiYear(ks);
        return ks.map(w => ({
          week: w, label: wkLabel(w, my), long: my ? wkLong(w) : `Semana ${wkWeek(w)}`,
          value: D.by_week[w][metric], posts: D.by_week[w].posts,
        }));
      }, [D, metric, isDailyMode]);

      // Rango fijo de la semana en daily mode (Dom→Sáb)
      const weekRangeLabel = useMemo(() => {
        if (!isDailyMode) return null;
        const wk = wkWeek(weeksInScope[0]);
        const year = wkYear(weeksInScope[0]);
        const days = weekDays(wk, year);
        return `${dayLabel(days[0])} → ${dayLabel(days[6])}`;
      }, [isDailyMode, weeksInScope, D.allPosts, D.meta?.selected_year]);

      const outOfWindow = isDailyMode ? (series._outOfWindow || 0) : 0;

      const xTickInterval = isDailyMode
        ? 0   // mostrar todos los días
        : Math.max(0, Math.floor(series.length / 12));

      // Marcadores de lanzamiento de campaña: primera semana con posts de
      // cada campaña DENTRO del scope filtrado actual (no del histórico
      // completo), para que la anotación siempre sea coherente con lo que
      // se está viendo. Solo aplica en vista semanal (en vista diaria de
      // una sola semana no aporta). Si dos campañas arrancan la misma
      // semana, se muestra solo la de más volumen para no saturar el eje;
      // y si hay muchas campañas en el rango, se limita a las 10 más
      // grandes para que las etiquetas no se amontonen.
      const campaignLaunches = useMemo(() => {
        if (isDailyMode) return [];
        const byCampaign = {};
        for (const p of (D.allPosts || [])) {
          if (!p.campaign || p.wk == null) continue;
          if (!byCampaign[p.campaign] || p.wk < byCampaign[p.campaign].week) {
            byCampaign[p.campaign] = { week: p.wk, count: 0 };
          }
        }
        for (const p of (D.allPosts || [])) {
          if (p.campaign && byCampaign[p.campaign]) byCampaign[p.campaign].count++;
        }
        let launches = Object.entries(byCampaign).map(([name, v]) => ({ name, week: v.week, count: v.count }));
        const byWeek = new Map();
        for (const l of [...launches].sort((a, b) => b.count - a.count)) {
          if (!byWeek.has(l.week)) byWeek.set(l.week, l);
        }
        launches = [...byWeek.values()];
        if (launches.length > 10) {
          launches = [...launches].sort((a, b) => b.count - a.count).slice(0, 10);
        }
        return launches.sort((a, b) => a.week - b.week);
      }, [D, isDailyMode]);
      const launchesSorted = [...campaignLaunches].sort((a, b) => a.week - b.week);

      return html`
        <section id="sec-tendencia" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-tendencia" name="Tendencia" />
          <div className="flex flex-wrap items-baseline justify-between gap-4 mb-4">
            <div>
              <h2 className="text-[18px] font-medium text-txt">${isDailyMode ? 'Evolución diaria' : 'Evolución semanal'}</h2>
              ${isDailyMode && weekRangeLabel ? html`
                <div className="text-[12px] text-txt4 mt-1">${wkLong(weeksInScope[0])} · ${weekRangeLabel}
                  ${setFilters && html` · <button onClick=${() => setFilters(prev => ({ ...prev, weeks: [] }))} className="text-accent hover:underline">← volver a todas las semanas</button>`}</div>
              ` : html`<div className="text-[12px] text-txt4 mt-1">Clic en una semana para entrar a ella</div>`}
            </div>
            <div className="inline-flex items-center rounded-lg bg-onSurface/[0.04] p-0.5" role="radiogroup" aria-label="Métrica de la evolución">
              ${TREND_METRICS.map((m, i) => html`
                <button key=${m.k} onClick=${() => setMetric(m.k)} role="radio" aria-checked=${metric === m.k}
                  className=${"px-3 py-1.5 rounded-md text-[11px] transition-colors " +
                    (metric === m.k ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
                  ${m.l}
                </button>
              `)}
            </div>
          </div>
          <div className="rounded-xl bg-surface border border-line p-5">
            <div className="h-64">
              <${ResponsiveContainer}>
                <${ComposedChart} data=${series} syncId="trend" margin=${{ top:30, right:16, left:8, bottom:0 }}
                  style=${{ cursor: !isDailyMode && setFilters ? 'pointer' : 'default' }}
                  onClick=${(e) => !isDailyMode && setFilters && e && e.activePayload && e.activePayload[0] && toggleWeekFilter(setFilters, e.activePayload[0].payload.week)}>
                  <${CartesianGrid} stroke=${ct.tooltipBorder} strokeDasharray="0" vertical=${false} />
                  <${XAxis} dataKey="label" hide />
                  <${YAxis} yAxisId="band" hide />
                  <${YAxis} yAxisId="left" stroke=${ct.axisStrong} fontSize=${11}
                            tickLine=${false} axisLine=${false}
                            tickFormatter=${isPercent ? (v) => v.toFixed(1) + '%' : fmt}
                            width=${isPercent ? 56 : 96} />
                  <${Tooltip}
                    cursor=${{ fill: 'rgba(76,110,245,0.08)' }}
                    contentStyle=${{ background:ct.tooltipBg, border:`1px solid ${ct.tooltipBorder}`, borderRadius:6, padding:'8px 12px', fontSize:11, fontFamily: "'Bricolage Grotesque', system-ui, sans-serif", fontVariantNumeric: 'tabular-nums', color:ct.tooltipText }}
                    labelStyle=${{ color: ct.tooltipLabel }}
                    itemStyle=${{ color: ct.tooltipText }}
                    itemSorter=${(it) => it.dataKey === 'value' ? 0 : 1}
                    labelFormatter=${(label) => isDailyMode ? label : ((series.find(r => r.label === label) || {}).long || label)}
                    formatter=${(v, name) => {
                      if (name === 'value') return [isPercent ? erFmt(v) : fmt(v), TREND_METRICS.find(m => m.k === metric)?.l];
                      return [v, 'Posts publicados'];
                    }} />
                  <${Bar} yAxisId="band" dataKey="posts" fill="transparent" isAnimationActive=${false} />
                  <${Line} yAxisId="left" type="monotone" dataKey="value"
                           isAnimationActive=${true} animationDuration=${750} animationEasing="ease-in-out"
                           stroke="#4C6EF5" strokeWidth=${2}
                           dot=${{ fill:'#4C6EF5', r:3, strokeWidth:0 }} activeDot=${{ r:5, fill:ct.tooltipBg, stroke:'#4C6EF5', strokeWidth:2 }} />
                  ${launchesSorted.map((l, i) => html`
                    <${ReferenceLine} key=${l.name} yAxisId="left" x=${(series.find(r => r.week === l.week) || {}).label || wkLabel(l.week)}
                      stroke="#F0B358" strokeOpacity=${0.5} strokeDasharray="3 3"
                      label=${(props) => {
                        // Marcador numerado arriba de la línea; el nombre va en la lista de abajo (antes se encimaban)
                        const vb = props.viewBox || {};
                        return html`<g><title>${l.name} · ${wkLong(l.week)}</title>
                          <circle cx=${vb.x} cy=${(vb.y || 0) - 13} r=${8} fill="#F0B358" fillOpacity=${0.18} />
                          <text x=${vb.x} y=${(vb.y || 0) - 9.5} textAnchor="middle" fontSize=${10} fontWeight=${600} fill="#F0B358">${i + 1}</text></g>`;
                      }} />
                  `)}
                <//>
              <//>
            </div>
            <!-- v60 — El volumen de posts va en su propia franja (antes compartía gráfica con un segundo eje, que se presta a malas lecturas) -->
            <div className="text-[11px] text-txt4 mt-3 pl-1">Posts publicados</div>
            <div className="h-20">
              <${ResponsiveContainer}>
                <${BarChart} data=${series} syncId="trend" margin=${{ top:4, right:16, left:8, bottom:8 }}
                  style=${{ cursor: !isDailyMode && setFilters ? 'pointer' : 'default' }}
                  onClick=${(e) => !isDailyMode && setFilters && e && e.activePayload && e.activePayload[0] && toggleWeekFilter(setFilters, e.activePayload[0].payload.week)}>
                  <${XAxis} dataKey="label" stroke=${ct.axisStrong} fontSize=${11} tickLine=${false} axisLine=${false}
                            interval=${isDailyMode ? 0 : 'preserveStartEnd'} minTickGap=${22} />
                  <${YAxis} stroke=${ct.axis} fontSize=${10} tickLine=${false} axisLine=${false} width=${isPercent ? 56 : 96} allowDecimals=${false} tickCount=${3} />
                  <${Tooltip} cursor=${{ fill: 'rgba(76,110,245,0.14)' }} content=${() => null} formatter=${(v) => [v, 'Posts']}
                    contentStyle=${{ background:ct.tooltipBg, border:`1px solid ${ct.tooltipBorder}`, borderRadius:6, padding:'6px 10px', fontSize:11, color:ct.tooltipText }}
                    labelStyle=${{ color: ct.tooltipLabel }} labelFormatter=${(label) => isDailyMode ? label : ((series.find(r => r.label === label) || {}).long || label)} />
                  <${Bar} dataKey="posts" fill="rgba(127,127,140,0.45)" radius=${[2, 2, 0, 0]} maxBarSize=${22} />
                <//>
              <//>
            </div>
            ${launchesSorted.length > 0 && html`
              <div className="flex flex-wrap gap-1.5 mt-4">
                ${launchesSorted.map((l, i) => html`<span key=${l.name} className="inline-flex items-center gap-1.5 rounded-full bg-amber/10 pl-1 pr-2.5 py-0.5 text-[11px] text-txt2">
                  <span className="w-[18px] h-[18px] rounded-full bg-amber/20 text-amber text-[10px] font-semibold inline-flex items-center justify-center">${i + 1}</span>
                  ${l.name}<span className="text-txt4">${wkLabel(l.week, launchesSorted.some(x => wkYear(x.week) !== wkYear(l.week)))}</span></span>`)}
              </div>`}
            <div className="flex flex-wrap gap-x-5 gap-y-1 mt-4 text-[11px] text-txt3">
              <div className="flex items-center gap-2"><span className="w-3 h-0.5 rounded" style=${{ background: '#4C6EF5' }}></span><span>${TREND_METRICS.find(m => m.k === metric)?.l}</span></div>

              ${campaignLaunches.length > 0 && html`
                <div className="flex items-center gap-2"><span style=${{ width: 12, borderTop: '2px dashed #F0B358' }}></span><span>Lanzamiento de campaña</span></div>
              `}
              ${isDailyMode && outOfWindow > 0 && html`
                <div className="text-amber" title="Posts marcados como esta semana pero con fecha fuera del rango Dom→Sáb">
                  ⚠ ${outOfWindow} post${outOfWindow === 1 ? '' : 's'} con fecha fuera de la semana
                </div>
              `}
              ${isDailyMode && html`<div className="ml-auto text-accent/60">vista diaria automática</div>`}
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // MixSection
    // ============================================================
    function MixSection({ D, filters, setFilters }) {
      const strats = Object.entries(D.by_strategy)
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.posts - a.posts);
      const fmts = Object.entries(D.by_format)
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.reach - a.reach);
      const stagesArr = Object.entries(D.by_stage || {})
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.reach - a.reach);
      const totalPosts = D.global.posts;
      const max = fmts[0]?.reach || 1;
      const maxStage = stagesArr[0]?.reach || 1;

      return html`
        <section id="sec-mezcla" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-mezcla" name="Mezcla" />
          <div className="flex items-baseline justify-between mb-5">
            <div>
              <h2 className="text-[18px] font-medium text-txt">Mezcla</h2>
            </div>
            <div className="text-[11px] font-mono text-txt4">Estrategia · formato · etapa</div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <div className="rounded-xl bg-surface border border-line p-5">
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-4">Pautado vs Orgánico</div>
              ${strats.length === 0 && html`<div className="text-faint text-sm">Sin datos de estrategia.</div>`}
              <div className="space-y-4">
                ${strats.slice(0, 4).map(s => {
                  const isPaid = (s.name||'').toLowerCase().includes('pauta') || (s.name||'').toLowerCase().includes('paid');
                  const color = isPaid ? '#F0B358' : '#4C6EF5';
                  const pctPosts = totalPosts ? Math.round(s.posts/totalPosts*100) : 0;
                  const isActiveRow = filters?.strategies?.length === 1 && filters.strategies[0] === s.name;
                  return html`
                    <div key=${s.name}

    // ============================================================
    // VtrSection — VTR general, por plataforma, por duración + top videos
    // ============================================================
    function computeVtrStats(posts) {
      // Un post es "video" si tiene VTR registrado y no es Story.
      // (Stories no se cuentan en VTR — definido en la base de datos.)
      const videos = posts.filter(p => p.vtr != null && isFinite(p.vtr));   // v73: todo valor capturado, como la BDD

      // v72: VTR = promedio simple por video (igual que la BDD). La v20 lo
      // ponderaba por views y la pauta dominaba el resultado.
      function aggBucket(list) {
        if (!list.length) return { n: 0, vtr: null, views: 0, duration_avg: null };
        const sumViews = list.reduce((a, p) => a + (p.views || 0), 0);
        const sumVtr = list.reduce((a, p) => a + (p.vtr || 0), 0);
        const sumDur = list.reduce((a, p) => a + (p.duration || 0), 0);
        const nWithDur = list.filter(p => p.duration > 0).length;
        return {
          n: list.length,
          vtr: sumVtr / list.length,
          views: sumViews,
          duration_avg: nWithDur > 0 ? sumDur / nWithDur : null,
        };
      }

      const general = aggBucket(videos);

      const byPlatform = {};
      const platOrder = ['Facebook','Instagram','YouTube','TikTok','X','LinkedIn','Threads'];
      for (const plat of platOrder) {
        const platVideos = videos.filter(p => p.platform === plat);
        if (platVideos.length > 0) byPlatform[plat] = aggBucket(platVideos);
      }

      const short = videos.filter(p => p.duration != null && p.duration <= 30);
      const long  = videos.filter(p => p.duration != null && p.duration  > 30);
      const byDuration = {
        short: { ...aggBucket(short), label: '≤ 30 segundos' },
        long:  { ...aggBucket(long),  label: '> 30 segundos' },
      };

      // Top 10 videos por VTR — filtramos los que tienen pocas views para
      // evitar que dominen videos con VTR alto pero base mínima.
      // Umbral: top 25% en views.
      const viewsSorted = videos.map(v => v.views || 0).sort((a, b) => b - a);
      const viewsThreshold = viewsSorted[Math.floor(viewsSorted.length * 0.25)] || 0;
      const topVideos = videos
        .filter(p => (p.views || 0) >= Math.max(viewsThreshold, 1000))
        .sort((a, b) => (b.vtr || 0) - (a.vtr || 0))
        .slice(0, 10);

      return { general, byPlatform, byDuration, topVideos, totalVideos: videos.length };
    }

    // ============================================================
    // ComparativasSection — Week-over-Week
    // ============================================================
    function deltaPct(curr, prev) {
      if (prev == null || prev === 0) return null;
      return ((curr - prev) / prev) * 100;
    }

    function DeltaPill({ pct, invert }) {
      // invert=true para métricas donde "menos es mejor" (no aplicable aquí, pero por si acaso)
      if (pct == null || !isFinite(pct)) {
        return html`<span className="text-[11px] font-mono text-faint">—</span>`;
      }
      const isUp = pct > 0;
      const isNeutral = Math.abs(pct) < 0.5;
      const good = invert ? !isUp : isUp;
      const color = isNeutral ? 'text-txt4' : good ? 'text-success' : 'text-amber';
      const arrow = isNeutral ? '·' : isUp ? '↑' : '↓';
      const sign = pct > 0 ? '+' : '';
      return html`
        <span className=${"text-[11px] font-mono tabular-nums " + color}>
          ${arrow} ${pct >= 900 ? `${(1 + pct / 100).toLocaleString('es-MX', { maximumFractionDigits: (1 + pct / 100) >= 100 ? 0 : 1 })}×` : `${sign}${pct.toLocaleString('es-MX', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`}
        </span>`;
    }

    function CompareKpiCard({ label, curr, prev, isPercent }) {
      const pct = deltaPct(curr, prev);
      const fmtVal = isPercent ? erFmt : fmt;
      return html`
        <div className="rounded-xl bg-surface border border-line px-5 py-4 min-w-0">
          <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">${label}</div>
          <div className="font-medium text-txt tabular-nums leading-tight break-all" style=${{ fontSize: 'clamp(16px, 1.8vw, 24px)' }}>${fmtVal(curr)}</div>
          <div className="flex items-baseline gap-2 mt-2 flex-wrap">
            <${DeltaPill} pct=${pct} />
            <span className="text-[10px] font-mono text-faint break-all">vs ${fmtVal(prev)}</span>
          </div>
        </div>`;
    }

    // Calcula un agregado simple desde una lista de posts (sin pasar por aggAdd)
    function quickAgg(posts) {
      let reach=0, inter=0, views=0, comments=0;
      const r = rateAccum();
      for (const p of posts) {
        reach += p.reach || 0;
        inter += p.interactions || 0;
        views += p.views || 0;
        comments += p.comments || 0;
        rateAdd(r, p);
      }
      const n = posts.length;
      const rates = rateFinal(r);
      return {
        posts: n,
        reach, inter, views, comments,
        er_avg: rates.er_avg,
        basic_er_avg: rates.basic_er_avg,
        vtr_avg: rates.vtr_avg,
        reach_per_post: n ? reach / n : 0,
        inter_per_post: n ? inter / n : 0,
        views_per_post: n ? views / n : 0,
      };
    }

    // ============================================================
    // computeHeroDeltas — deltas semana actual vs. semana anterior para
    // pintar badges de tendencia en el strip de KPIs del hero. Solo
    // aplica cuando el filtro de Semana tiene exactamente una semana
    // seleccionada (si no, no hay una "semana actual" inequívoca que
    // comparar, así que no se muestra ningún badge). Compara esa semana
    // contra la anterior, ignorando el filtro de semana pero respetando
    // el resto de filtros activos — igual que el modo Week-over-Week de
    // Comparativas.
    // ============================================================
    // v65 — Comparativos del Resumen para cualquier periodo filtrado:
    //  · vs. periodo anterior: el mismo número de semanas justo antes.
    //  · vs. mismo periodo del año anterior: las mismas semanas, un año atrás.
    // Cada comparativo solo se muestra si ese periodo tiene datos en al menos
    // el 80% de sus semanas (si no, compararía contra un periodo a medias).
    const wkIdx = (k) => wkYear(k) * 52 + (Math.min(wkWeek(k), 52) - 1);
    const idxWk = (i) => Math.floor(i / 52) * 100 + (i % 52) + 1;
    function computeHeroDeltas(D, rawPosts, filters) {
      const curWks = [...new Set((D.allPosts || []).map(p => p.wk).filter(Boolean))].sort((a, b) => a - b);
      if (!curWks.length) return null;
      const scoped = applyFilters(rawPosts || [], { ...filters, weeks: [], months: [], year: 'all' });
      const first = wkIdx(curWks[0]), last = wkIdx(curWks[curWks.length - 1]);
      const n = last - first + 1;
      const rangeOf = (i0, i1) => { const set = new Set(); for (let i = i0; i <= i1; i++) set.add(idxWk(i)); return set; };
      const build = (set) => {
        const posts = scoped.filter(p => set.has(p.wk));
        const covered = new Set(posts.map(p => p.wk)).size;
        if (!posts.length || covered / set.size < 0.8) return null;
        return quickAgg(posts);
      };
      const cur = quickAgg(D.allPosts || []);
      const mk = (prev) => prev && ({
        reach: deltaPct(cur.reach, prev.reach), inter: deltaPct(cur.inter, prev.inter), views: deltaPct(cur.views, prev.views),
        er_avg: deltaPct(cur.er_avg, prev.er_avg), comments: deltaPct(cur.comments, prev.comments), posts: deltaPct(cur.posts, prev.posts),
        vtr_avg: deltaPct(cur.vtr_avg, prev.vtr_avg),
      });
      const prevSet = rangeOf(first - n, first - 1);
      const yoySet = new Set([...rangeOf(first, last)].map(k => k - 100));
      const prev = mk(build(prevSet)), yoy = mk(build(yoySet));
      if (!prev && !yoy) return null;
      const my = (a, b) => wkYear(a) !== wkYear(b);
      const prevFirst = idxWk(first - n), prevLast = idxWk(first - 1);
      return {
        prev, yoy,
        prevLabel: n === 1 ? `vs ${wkLabel(prevFirst, my(prevFirst, curWks[0]))}` : `vs ${n} semanas previas`,
        prevTitle: n === 1 ? wkLong(prevFirst) : `${wkLabel(prevFirst, true)} a ${wkLabel(prevLast, true)}`,
        yoyLabel: `vs mismo periodo ${wkYear(curWks[0]) - 1}`,
        // compatibilidad con el resto del código
        currentWeek: curWks[curWks.length - 1], prevWeek: prevLast,
      };
    }

    function ComparativasSection({ D, rawPosts, filters, chartTheme, setFilters }) {
      const ct = chartTheme || CHART_VARS;
      const [mode, setMode] = useState('wow'); // 'wow' | 'entities'

      // ============================================================
      // Modo 1 · Week-over-Week (semana actual vs. semana anterior)
      // ============================================================
      const selWeeks = filters?.weeks;
      const isSingleWeek = selWeeks && selWeeks.length === 1;
      const currentWeek = isSingleWeek ? selWeeks[0] : null;
      const prevWeek = currentWeek != null ? wkPrev(currentWeek) : null;

      // Para comparar manzanas con manzanas, aplicamos TODOS los demás filtros
      // (año, plataformas, campañas, tipo contenido, pauta) pero ignoramos el de semana
      const compareData = useMemo(() => {
        if (!isSingleWeek || prevWeek == null) return null;
        const filtersNoWeek = { ...filters, weeks: [], year: 'all' };
        const scopedPosts = applyFilters(rawPosts || [], filtersNoWeek);
        const currentPosts = scopedPosts.filter(p => p.wk === currentWeek);
        const prevPosts = scopedPosts.filter(p => p.wk === prevWeek);

        if (prevPosts.length === 0) return { noPrev: true, currentWeek, prevWeek };

        // Por plataforma
        const platforms = [...new Set([...currentPosts, ...prevPosts].map(p => p.platform))].sort();
        const byPlatform = platforms.map(plat => ({
          name: plat,
          curr: quickAgg(currentPosts.filter(p => p.platform === plat)),
          prev: quickAgg(prevPosts.filter(p => p.platform === plat)),
        }));

        // Por formato
        const formats = [...new Set([...currentPosts, ...prevPosts]
          .map(p => p.format).filter(Boolean))].sort();
        const byFormat = formats.map(fmt => ({
          name: fmt,
          curr: quickAgg(currentPosts.filter(p => p.format === fmt)),
          prev: quickAgg(prevPosts.filter(p => p.format === fmt)),
        }));

        return {
          currentWeek, prevWeek,
          curr: quickAgg(currentPosts),
          prev: quickAgg(prevPosts),
          byPlatform, byFormat,
          currentPostsCount: currentPosts.length,
          prevPostsCount: prevPosts.length,
        };
      }, [rawPosts, filters, isSingleWeek, currentWeek, prevWeek]);

      // ============================================================
      // Modo 2 · Entidad vs. entidad (campaña, subcampaña, etapa,
      // pauta o tipo de contenido — una contra otra dentro del mismo
      // campo). Se alinean por "semana relativa" (S1, S2, S3... desde
      // el primer post de cada lado) para poder comparar el ritmo aunque
      // hayan vivido en semanas distintas del calendario.
      // ============================================================
      const [dim, setDim] = useState('campaigns');
      const [entA, setEntA] = useState(null);
      const [entB, setEntB] = useState(null);

      // Al cambiar de dimensión la selección anterior ya no aplica
      useEffect(() => { setEntA(null); setEntB(null); }, [dim]);

      const dimField = FACET_FIELD_MAP[dim];
      const dimLabel = COMPARE_DIMENSIONS.find(d => d.key === dim)?.label || dim;

      // Universo base: todos los filtros activos MENOS la dimensión
      // que se está comparando (así Lado A / Lado B pueden tomar
      // cualquier valor de esa dimensión, no solo lo ya filtrado arriba)
      const entityPool = useMemo(() => {
        return applyFilters(rawPosts || [], { ...filters, [dim]: [] });
      }, [rawPosts, filters, dim]);

      const entityOptions = useMemo(() => {
        const set = new Set();
        for (const p of entityPool) {
          const v = p[dimField];
          if (v != null && v !== '') set.add(v);
        }
        return [...set].sort();
      }, [entityPool, dimField]);

      const entityCompare = useMemo(() => {
        if (!entA || !entB) return null;
        const postsA = entityPool.filter(p => p[dimField] === entA);
        const postsB = entityPool.filter(p => p[dimField] === entB);
        if (postsA.length === 0 || postsB.length === 0) return { empty: true };

        const seriesFor = (posts) => {
          const byWeek = {};
          for (const p of posts) {
            if (p.wk == null) continue;
            (byWeek[p.wk] = byWeek[p.wk] || []).push(p);
          }
          return Object.keys(byWeek).map(Number).sort((a, b) => a - b)
            .map((w, i) => ({ relIndex: i + 1, week: w, ...quickAgg(byWeek[w]) }));
        };
        const seriesA = seriesFor(postsA);
        const seriesB = seriesFor(postsB);
        const maxLen = Math.max(seriesA.length, seriesB.length);
        const trend = Array.from({ length: maxLen }, (_, i) => ({
          relIndex: i + 1,
          reachA: seriesA[i] ? seriesA[i].reach : null,
          reachB: seriesB[i] ? seriesB[i].reach : null,
        }));

        const platforms = [...new Set([...postsA, ...postsB].map(p => p.platform))].sort();
        const byPlatform = platforms.map(plat => ({
          name: plat,
          curr: quickAgg(postsA.filter(p => p.platform === plat)),
          prev: quickAgg(postsB.filter(p => p.platform === plat)),
        }));

        return {
          curr: quickAgg(postsA), prev: quickAgg(postsB),
          trend, byPlatform,
          weeksA: seriesA.length, weeksB: seriesB.length,
          postsA: postsA.length, postsB: postsB.length,
        };
      }, [entA, entB, entityPool, dimField]);

      const ModeHeader = html`
        <div className="flex flex-wrap items-baseline justify-between gap-4 mb-5">
          <div>
            <h2 className="text-[18px] font-medium text-txt">Comparativas</h2>
            <p className="text-txt4 text-[12px] mt-1">
              ${mode === 'wow' ? 'Compara una semana contra la anterior.' : `Compara dos ${dimLabel.toLowerCase()}s, semana relativa a semana relativa.`}
            </p>
          </div>
          <div className="inline-flex items-center rounded-lg bg-onSurface/[0.04] p-0.5 shrink-0" role="radiogroup" aria-label="Tipo de comparativa">
            <button onClick=${() => setMode('wow')} role="radio" aria-checked=${mode === 'wow'}
              className=${"px-3 py-1.5 rounded-md text-[11px] transition-colors " + (mode === 'wow' ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
              Semana vs. anterior
            </button>
            <button onClick=${() => setMode('entities')} role="radio" aria-checked=${mode === 'entities'}
              className=${"px-3 py-1.5 rounded-md text-[11px] transition-colors " + (mode === 'entities' ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>
              Comparar entidades
            </button>
          </div>
        </div>`;

      // ---------------- Render: Modo WoW ----------------
      if (mode === 'wow') {
        if (!isSingleWeek) {
          return html`
            <section id="sec-comparativas" className="px-4 md:px-7 py-7 relative group">
              <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
              ${ModeHeader}

    // ============================================================
    // AnomaliesSection — detector de posts atípicos.
    // Método: por cada plataforma con muestra suficiente, calcula la
    // mediana y el MAD (desviación absoluta mediana) de alcance y de ER
    // por post, y marca los que se alejan demasiado del "modified
    // z-score" (Iglewicz & Hoaglin) — más robusto que media/desv. estándar
    // cuando la data tiene posts virales que distorsionarían un promedio
    // normal. Umbral estándar de la literatura: |z| >= 3.5.
    // ============================================================
    const ANOMALY_MIN_GROUP = 6;
    const ANOMALY_Z_THRESHOLD = 3.5;

    function median(arr) {
      if (!arr.length) return 0;
      const s = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(s.length / 2);
      return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    }

    function computeAnomalies(D) {
      const posts = D.allPosts || [];
      const byPlatform = {};
      for (const p of posts) {
        if (!p.platform) continue;
        (byPlatform[p.platform] = byPlatform[p.platform] || []).push(p);
      }

      const found = [];
      for (const group of Object.values(byPlatform)) {
        if (group.length < ANOMALY_MIN_GROUP) continue;

        // --- Alcance ---
        const reaches = group.map(p => p.reach || 0);
        const medR = median(reaches);
        const madR = median(reaches.map(r => Math.abs(r - medR)));
        if (madR > 0) {
          for (const p of group) {
            const z = 0.6745 * ((p.reach || 0) - medR) / madR;
            if (Math.abs(z) >= ANOMALY_Z_THRESHOLD) {
              found.push({ post: p, metric: 'reach', z, direction: z > 0 ? 'up' : 'down', value: p.reach || 0, baseline: medR });
            }
          }
        }

        // --- ER ---
        const ers = group.map(p => p.er).filter(v => v != null && v !== 0);
        if (ers.length >= ANOMALY_MIN_GROUP) {
          const medE = median(ers);
          const madE = median(ers.map(v => Math.abs(v - medE)));
          if (madE > 0) {
            for (const p of group) {
              if (p.er == null || p.er === 0) continue;
              const z = 0.6745 * (p.er - medE) / madE;
              if (Math.abs(z) >= ANOMALY_Z_THRESHOLD) {
                found.push({ post: p, metric: 'er', z, direction: z > 0 ? 'up' : 'down', value: p.er, baseline: medE });
              }
            }
          }
        }
      }

      // Si un mismo post califica por alcance Y por ER, nos quedamos con
      // la métrica de mayor severidad para no listarlo dos veces
      const byPostKey = new Map();
      for (const a of found) {
        const key = a.post.link || `${a.post.platform}|${a.post.date}|${a.post.campaign}|${a.post.format}|${a.post.reach}`;
        const prev = byPostKey.get(key);
        if (!prev || Math.abs(a.z) > Math.abs(prev.z)) byPostKey.set(key, a);
      }

      return [...byPostKey.values()].sort((a, b) => Math.abs(b.z) - Math.abs(a.z)).slice(0, 12);
    }

    function AnomalyRow({ a, onPick }) {

      const metricLabel = a.metric === 'reach' ? 'Alcance' : 'ER';

      const baselineFmt = a.metric === 'reach' ? fmt(a.baseline) : erFmt(a.baseline);

          ${(capDup > 0 || capCampos > 0) && html`

                    className="w-full mb-4 flex flex-wrap items-center justify-between gap-2 rounded-xl bg-amber/[0.08] px-4 py-3 text-left hover:bg-amber/[0.14] transition-colors">
