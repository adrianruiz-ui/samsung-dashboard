<body>
  <div id="root"></div>

  <script type="module">
    // ============================================================
    // IMPORTS desde CDN (esm.sh) — sin build step
    // ============================================================
    import React, { useState, useEffect, useCallback, useMemo, useRef, Fragment } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import {
      ResponsiveContainer, AreaChart, Area, BarChart, Bar,
      LineChart, Line, ComposedChart, XAxis, YAxis, Tooltip, CartesianGrid,
    } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    // ============================================================
    // CONFIG — Edita estas constantes para tu deploy
    // ============================================================
    const SHEET_ID = '1TcmeDE08Df6Qk4lzRe6PhIBq5qOBUCC_vvHZq4UWD98';
    const CACHE_TTL_MIN = 5;       // cuánto tiempo cachea localmente
    const AUTO_REFRESH_MIN = 5;    // polling automático en background; 0 = desactivado

    // ============================================================
    // CLIENTE GOOGLE SHEETS
    // ============================================================
    const SHEET_TABS = {
      Facebook:  '📘 Facebook',
      Instagram: '📷 Instagram',
      YouTube:   '▶️ YouTube',
      TikTok:    '🎵 TikTok',
      X:         '𝕏 X',
      LinkedIn:  '💼 LinkedIn',
      Threads:   '🧵 Threads',
    };
    const PLATFORMS = Object.keys(SHEET_TABS);

    function buildSheetUrl(tabName) {
      if (!SHEET_ID) throw new Error('Falta SHEET_ID en la configuración del archivo.');
      // RANGO EXPLÍCITO: A2:AI10000 fuerza a gviz a leer hasta la fila 10000.
      // Antes usábamos A2:AI (sin límite) y gviz a veces corta cuando hay
      // gaps de filas vacías entre los datos.
      const params = new URLSearchParams({
        tqx: 'out:csv',
        sheet: tabName,
        range: 'A2:AI10000',
      });
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params.toString()}`;
    }

    async function fetchTab(platformName) {
      const tabName = SHEET_TABS[platformName];
      const res = await fetch(buildSheetUrl(tabName), { redirect: 'follow' });
      if (!res.ok) throw new Error(`Error al cargar "${tabName}": HTTP ${res.status}`);
      const csvText = await res.text();
      if (csvText.trim().startsWith('<')) {
        throw new Error(`"${tabName}" no devolvió CSV. ¿El Sheet es público?`);
      }
      const parsed = Papa.parse(csvText, {
        header: true, skipEmptyLines: 'greedy', dynamicTyping: false,
      });
      return parsed.data.map(row => ({ ...row, _platform: platformName }));
    }

    async function fetchAllPlatforms() {
      const results = await Promise.allSettled(
        PLATFORMS.map(p => fetchTab(p).then(rows => ({ platform: p, rows })))
      );
      const data = {}; const errors = [];
      for (let i = 0; i < results.length; i++) {
        const r = results[i]; const platform = PLATFORMS[i];
        if (r.status === 'fulfilled') data[platform] = r.value.rows;
        else { errors.push({ platform, message: r.reason?.message || String(r.reason) }); data[platform] = []; }
      }
      return { data, errors, fetchedAt: Date.now() };
    }

    // ============================================================
    // TRANSFORMACIÓN — columnas español → claves internas + agregados
    // ============================================================
    const COL_MAP = {
      'Link': 'link', 'Fecha': 'date', 'Semana': 'week', 'Mes': 'month', 'Año': 'year',
      'Formato': 'format', 'Tipo Contenido': 'content_type', 'Tipo Pauta': 'strategy',
      'Campaña': 'campaign', 'Subcampaña': 'subcampaign', 'Etapa': 'stage',
      'Producto': 'product', 'Objetivo': 'objective', 'Audio': 'audio',
      'Subtítulos': 'subtitles', 'IA': 'ai', 'Duración (seg)': 'duration',
      'Alcance': 'reach', 'Impresiones': 'impressions', 'Reacciones': 'reactions',
      'Comentarios': 'comments', 'Compartidos': 'shares', 'Guardados': 'saves',
      'Repost': 'repost', 'Clics': 'clics', 'Views': 'views',
      'Inter. Básicas': 'basic_interactions', 'Inter. Totales': 'interactions',
      'ER Básico %': 'basic_er', 'ER Views %': 'er', 'CTR %': 'ctr',
      'T. Prom. Vista': 'avg_watch_time', 'VTR %': 'vtr',
      '¿Influencer?': 'is_influencer', 'Nombre Influencer': 'influencer_name',
    };
    const NUMERIC_KEYS = new Set([
      'week','year','duration','reach','impressions','reactions','comments','shares',
      'saves','repost','clics','views','basic_interactions','interactions',
      'basic_er','er','ctr','avg_watch_time','vtr',
    ]);

    function toNum(v) {
      if (v == null || v === '') return null;
      if (typeof v === 'number') return v;
      let s = String(v).trim();
      if (s === '' || s === '—' || s === '-' || s === '#N/A' || s === '#DIV/0!') return null;
      s = s.replace(/%\s*$/, '');
      if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
      else if (s.includes(',') && !s.includes('.')) {
        const lastComma = s.lastIndexOf(',');
        const after = s.length - lastComma - 1;
        if (after <= 2 && s.split(',').length === 2) s = s.replace(',', '.');
        else s = s.replace(/,/g, '');
      }
      const n = parseFloat(s);
      return isNaN(n) ? null : n;
    }

    function normalizeRow(row, platform) {
      const out = { platform };
      for (const [esKey, enKey] of Object.entries(COL_MAP)) {
        if (esKey in row) {
          const raw = row[esKey];
          if (NUMERIC_KEYS.has(enKey)) out[enKey] = toNum(raw);
          else out[enKey] = raw === '' ? null : raw;
        }
      }
      // Considera la fila como una publicación válida si tiene CUALQUIER campo
      // identificador. Antes descartábamos filas sin link/alcance/interacciones,
      // lo que excluía posts recientes con métricas aún sin levantar.
      const hasAnyIdentity =
        out.link || out.date || out.week != null || out.format ||
        out.product || out.campaign || out.subcampaign || out.objective ||
        (out.reach != null && out.reach > 0) ||
        (out.interactions != null && out.interactions > 0);
      if (!hasAnyIdentity) return null;
      return out;
    }

    function emptyAgg() {
      return {
        reach:0, impressions:0, inter:0, views:0,
        reactions:0, comments:0, shares:0, saves:0, clics:0,
        posts:0,
        _er_sum:0, _er_n:0, _basic_er_sum:0, _basic_er_n:0,
        _vtr_sum:0, _vtr_n:0, _ctr_sum:0, _ctr_n:0,
      };
    }
    function aggAdd(a, p) {
      a.reach += p.reach || 0; a.impressions += p.impressions || 0;
      a.inter += p.interactions || 0; a.views += p.views || 0;
      a.reactions += p.reactions || 0; a.comments += p.comments || 0;
      a.shares += p.shares || 0; a.saves += p.saves || 0; a.clics += p.clics || 0;
      a.posts += 1;
      if (p.er != null && p.er !== 0) { a._er_sum += p.er; a._er_n += 1; }
      if (p.basic_er != null && p.basic_er !== 0) { a._basic_er_sum += p.basic_er; a._basic_er_n += 1; }
      if (p.vtr != null && p.vtr !== 0) { a._vtr_sum += p.vtr; a._vtr_n += 1; }
      if (p.ctr != null && p.ctr !== 0) { a._ctr_sum += p.ctr; a._ctr_n += 1; }
    }
    function aggFinalize(a) {
      const o = { ...a };
      o.er_avg = a._er_n ? a._er_sum / a._er_n : 0;
      o.basic_er_avg = a._basic_er_n ? a._basic_er_sum / a._basic_er_n : 0;
      o.vtr_avg = a._vtr_n ? a._vtr_sum / a._vtr_n : 0;
      o.ctr_avg = a._ctr_n ? a._ctr_sum / a._ctr_n : 0;
      // Promedios por publicación (totales / # posts)
      o.reach_per_post = a.posts > 0 ? a.reach / a.posts : 0;
      o.inter_per_post = a.posts > 0 ? a.inter / a.posts : 0;
      o.views_per_post = a.posts > 0 ? a.views / a.posts : 0;
      delete o._er_sum; delete o._er_n; delete o._basic_er_sum; delete o._basic_er_n;
      delete o._vtr_sum; delete o._vtr_n;
      delete o._ctr_sum; delete o._ctr_n;
      return o;
    }
    function groupAgg(posts, keyFn) {
      const map = new Map();
      for (const p of posts) {
        const k = keyFn(p);
        if (k == null || k === '') continue;
        if (!map.has(k)) map.set(k, emptyAgg());
        aggAdd(map.get(k), p);
      }
      const r = {}; for (const [k,v] of map) r[k] = aggFinalize(v); return r;
    }
    function nestedGroupAgg(posts, outerFn, innerFn) {
      const outer = {};
      for (const p of posts) {
        const ko = outerFn(p), ki = innerFn(p);
        if (ko == null || ki == null || ki === '') continue;
        if (!outer[ko]) outer[ko] = new Map();
        if (!outer[ko].has(ki)) outer[ko].set(ki, emptyAgg());
        aggAdd(outer[ko].get(ki), p);
      }
      const r = {};
      for (const [ko, inner] of Object.entries(outer)) {
        r[ko] = {}; for (const [ki, v] of inner) r[ko][ki] = aggFinalize(v);
      }
      return r;
    }

    /**
     * Normaliza filas crudas de todas las pestañas en un array de posts.
     * Se ejecuta UNA VEZ al cargar — no depende de filtros.
     */
    function normalizeAll(rawByPlatform) {
      const allPosts = [];
      const _diagByPlat = {};  // diagnóstico
      for (const [platform, rows] of Object.entries(rawByPlatform)) {
        let raw = 0, ok = 0;
        for (const r of rows) {
          raw++;
          const p = normalizeRow(r, platform);
          if (p) { allPosts.push(p); ok++; }
        }
        _diagByPlat[platform] = { raw_rows: raw, posts_ok: ok };
      }
      // Diagnóstico visible en consola, window.__smxDebug y panel #6
      const _s18 = allPosts.filter(p => p.week === 18);
      const _s18ByPlat = {};
      for (const p of _s18) _s18ByPlat[p.platform] = (_s18ByPlat[p.platform]||0)+1;

      // Captura filas crudas tal como las devolvió gviz/papaparse — para detectar
      // si el Sheet en vivo está enviando menos filas de las que parecen estar
      // presentes en la base de datos
      const _rawCountByPlat = {};
      const _rawS18ByPlat = {};
      const _rawS18Rows = {};   // sólo IG para inspección detallada
      for (const [platform, rows] of Object.entries(rawByPlatform)) {
        _rawCountByPlat[platform] = rows.length;
        const s18raw = rows.filter(r => {
          const s = r['Semana'];
          if (s == null || s === '') return false;
          const n = parseFloat(String(s).replace(',', '.'));
          return n === 18;
        });
        _rawS18ByPlat[platform] = s18raw.length;
        if (platform === 'Instagram' || platform === 'Facebook') {
          _rawS18Rows[platform] = s18raw.map(r => ({
            link: r['Link'] ? '✓' : '—',
            fecha: r['Fecha'],
            formato: r['Formato'],
            alcance: r['Alcance'],
            inter_totales: r['Inter. Totales'],
          }));
        }
      }

      console.log('%c[Samsung MX dashboard · build ' + BUILD_VERSION + ']',
        'color:#AFA9EC;font-weight:bold;font-size:13px');
      console.log('Filas crudas devueltas por gviz:', _rawCountByPlat);
      console.log('Filas crudas con Semana=18:', _rawS18ByPlat);
      console.log('Posts válidos por plataforma:', _diagByPlat);
      console.log('Total posts: ' + allPosts.length + '  ·  S18: ' + _s18.length);
      console.log('S18 por plataforma:', _s18ByPlat);
      console.log('Detalle de filas RAW S18 (FB e IG):');
      console.table(_rawS18Rows.Facebook || []);
      console.table(_rawS18Rows.Instagram || []);

      window.__smxDebug = {
        build: BUILD_VERSION,
        rawCountByPlat: _rawCountByPlat,
        rawS18ByPlat: _rawS18ByPlat,
        rawS18Rows: _rawS18Rows,
        byPlatform: _diagByPlat,
        s18ByPlat: _s18ByPlat,
        totalPosts: allPosts.length,
        totalS18: _s18.length,
        allPosts,
      };
      // Meta global: dominio completo de los datos (independiente de filtros)
      const weeks = [...new Set(allPosts.map(p => p.week).filter(Boolean))].sort((a,b)=>a-b);
      // FIX: comparar como Date objects, no strings, para que date_min/max sean
      // cronológicos (antes "31/12/2025" > "01/01/2026" alfabéticamente)
      const dates = allPosts.map(p => parseDate(p.date)).filter(Boolean);
      const campaigns = [...new Set(allPosts.map(p => p.campaign).filter(Boolean))].sort();
      const subcampaigns = [...new Set(allPosts.map(p => p.subcampaign).filter(Boolean))].sort();
      const content_types = [...new Set(allPosts.map(p => p.content_type).filter(Boolean))].sort();
      const strategies = [...new Set(allPosts.map(p => p.strategy).filter(Boolean))].sort();
      const platforms = [...new Set(allPosts.map(p => p.platform))].sort();
      // Años presentes — derivados de fecha o del campo "Año" del Sheet
      const yearsSet = new Set();
      for (const p of allPosts) {
        if (p.year && +p.year > 1900) yearsSet.add(+p.year);
        const dt = parseDate(p.date);
        if (dt) yearsSet.add(dt.getFullYear());
      }
      const years = [...yearsSet].sort((a,b) => b - a);  // recientes primero

      // Semanas con datos por año — para el slider, que muestra sólo
      // las semanas relevantes al año filtrado
      const weeksByYear = {};
      for (const p of allPosts) {
        if (p.week == null) continue;
        let y = null;
        if (p.year && +p.year > 1900) y = +p.year;
        else {
          const dt = parseDate(p.date);
          if (dt) y = dt.getFullYear();
        }
        if (!y) continue;
        if (!weeksByYear[y]) weeksByYear[y] = new Set();
        weeksByYear[y].add(p.week);
      }
      const weeksByYearArr = {};
      for (const y of Object.keys(weeksByYear)) {
        weeksByYearArr[y] = [...weeksByYear[y]].sort((a,b) => a-b);
      }

      // Mapa campaña → subcampañas (para el filtro encadenado)
      const subBy = {};
      for (const p of allPosts) {
        if (p.campaign && p.subcampaign) {
          if (!subBy[p.campaign]) subBy[p.campaign] = new Set();
          subBy[p.campaign].add(p.subcampaign);
        }
      }
      const subcampaignsByCampaign = Object.fromEntries(
        Object.entries(subBy).map(([k, v]) => [k, [...v].sort()])
      );

      // Detectar posts huérfanos (sin Semana asignada) — útil para que el
      // usuario sepa que tiene filas en su Sheet sin clasificar
      const orphansNoWeek = allPosts.filter(p => p.week == null);
      const orphansByPlatform = {};
      for (const p of orphansNoWeek) {
        orphansByPlatform[p.platform] = (orphansByPlatform[p.platform] || 0) + 1;
      }

      const meta = {
        total_posts: allPosts.length,
        platforms,
        weeks,
        weeks_by_year: weeksByYearArr,
        years,
        campaigns,
        subcampaigns,
        content_types,
        strategies,
        subcampaignsByCampaign,
        date_min: dates.length ? dates.reduce((a,b) => a<b?a:b) : null,
        date_max: dates.length ? dates.reduce((a,b) => a>b?a:b) : null,
        orphans_no_week: orphansNoWeek.length,
        orphans_no_week_by_platform: orphansByPlatform,
      };
      return { allPosts, meta };
    }

    /**
     * Aplica los filtros al array de posts.
     * Filtros vacíos = no filtra esa dimensión.
     */
    // Helper: deriva el año de un post desde p.year o desde parseDate(p.date)
    function postYear(p) {
      if (p.year && +p.year > 1900) return +p.year;
      const dt = parseDate(p.date);
      if (dt) return dt.getFullYear();
      return null;
    }

    function applyFilters(allPosts, filters) {
      const { year, weekRange, platforms, campaigns, subcampaigns, contentTypes, strategies } = filters;
      return allPosts.filter(p => {
        if (year && year !== 'all') {
          const py = postYear(p);
          if (py !== year) return false;
        }
        if (weekRange) {
          if (p.week == null) return false;
          if (p.week < weekRange[0] || p.week > weekRange[1]) return false;
        }
        if (platforms && platforms.length > 0 && !platforms.includes(p.platform)) return false;
        if (campaigns && campaigns.length > 0 && !campaigns.includes(p.campaign)) return false;
        if (subcampaigns && subcampaigns.length > 0 && !subcampaigns.includes(p.subcampaign)) return false;
        if (contentTypes && contentTypes.length > 0 && !contentTypes.includes(p.content_type)) return false;
        if (strategies && strategies.length > 0 && !strategies.includes(p.strategy)) return false;
        return true;
      });
    }

    /**
     * Computa todos los agregados sobre un set de posts (ya filtrado o no).
     * Esta función SÍ se ejecuta en cada cambio de filtros.
     */
    function computeAggregates(posts, baseMeta) {
      const global = aggFinalize(posts.reduce((acc, p) => { aggAdd(acc, p); return acc; }, emptyAgg()));
      const by_platform = groupAgg(posts, p => p.platform);
      const by_week = groupAgg(posts.filter(p => p.week), p => p.week);
      const by_plat_week = nestedGroupAgg(posts.filter(p => p.week), p => p.platform, p => p.week);
      const by_format = groupAgg(posts, p => p.format);
      const by_product = groupAgg(posts, p => p.product);
      const by_strategy = groupAgg(posts, p => p.strategy);
      const by_campaign = groupAgg(posts, p => p.campaign);
      const by_objective = groupAgg(posts, p => p.objective);

      // Meta del subset filtrado (para la sección "viendo")
      const weeksInScope = [...new Set(posts.map(p => p.week).filter(Boolean))].sort((a,b)=>a-b);
      // FIX: parsear a Date para que el min/max sea cronológico, no alfabético
      const datesInScope = posts.map(p => parseDate(p.date)).filter(Boolean);

      return {
        global, by_platform, by_week, by_plat_week, by_format, by_product,

          date_min_scope: datesInScope.length ? datesInScope.reduce((a,b) => a<b?a:b) : null,
          date_max_scope: datesInScope.length ? datesInScope.reduce((a,b) => a>b?a:b) : null,

    /**
     * Función legado para compatibilidad: normaliza + agrega sin filtros.
     * Solo se usa para inicialización de cache.

    function transformAll(rawByPlatform) {
      const { allPosts, meta } = normalizeAll(rawByPlatform);

    // ============================================================
    // FORMATTERS
    // ============================================================
    const fmt = (n) => {
      if (n == null || isNaN(n)) return '—';
      const a = Math.abs(n);
      if (a >= 1e9) return (n/1e9).toFixed(1) + 'B';
      if (a >= 1e6) return (n/1e6).toFixed(1) + 'M';
      if (a >= 1e3) return (n/1e3).toFixed(1) + 'K';
      return Math.round(n).toLocaleString('es-MX');
    };
    const fmtFull = (n) => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('es-MX');
    const erFmt = (n) => n == null ? '—' : Number(n).toFixed(2) + '%';

    // Parser robusto de fechas. Tu Sheet puede tener fechas en varios formatos:
    //   - "2026-04-27" (ISO)              ← parsea nativo
    //   - "27/04/2026" (DD/MM/YYYY MX)    ← parsea custom (nativo lo lee mal)
    //   - "27/04/26"   (DD/MM/YY)         ← parsea custom
    //   - "27 abr 2026"                    ← parsea custom (mes en español corto)
    //   - "05-ene", "05 ene"               ← parsea custom (sin año)
    //   - Date object (Excel / Google)     ← parsea nativo
    const ES_MONTHS = {
      'ene':1,'enero':1, 'feb':2,'febrero':2, 'mar':3,'marzo':3,
      'abr':4,'abril':4, 'may':5,'mayo':5, 'jun':6,'junio':6,
      'jul':7,'julio':7, 'ago':8,'agosto':8, 'sep':9,'sept':9,'septiembre':9,
      'oct':10,'octubre':10, 'nov':11,'noviembre':11, 'dic':12,'diciembre':12,
    };
    function parseDate(d) {
      if (!d) return null;
      if (d instanceof Date && !isNaN(d)) return d;
      const s = String(d).trim();
      if (!s) return null;

      // ISO: 2026-04-27 — parser nativo lo interpreta como UTC, ajustamos con T12 para evitar shift de día
      const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) {
        const dt = new Date(+iso[1], +iso[2] - 1, +iso[3]);
        if (!isNaN(dt)) return dt;
      }

      // DD/MM/YYYY o DD-MM-YYYY (formato MX común)
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
      if (dmy) {
        const day = +dmy[1], month = +dmy[2] - 1;
        let year = +dmy[3];
        if (year < 100) year += 2000;
        const dt = new Date(year, month, day);
        if (!isNaN(dt)) return dt;
      }

      // DD-mes-YYYY o DD mes YYYY (con mes en español)
      const dmyEs = s.match(/^(\d{1,2})[\s\-](\p{L}+)(?:[\s\-](\d{2,4}))?$/u);
      if (dmyEs) {
        const day = +dmyEs[1];
        const monthKey = dmyEs[2].toLowerCase().replace('.','');
        const month = ES_MONTHS[monthKey];
        if (month) {
          let year = dmyEs[3] ? +dmyEs[3] : new Date().getFullYear();
          if (year < 100) year += 2000;
          const dt = new Date(year, month - 1, day);
          if (!isNaN(dt)) return dt;
        }
      }

      // Último recurso: parser nativo
      const dt = new Date(s);
      if (!isNaN(dt)) return dt;
      return null;
    }

    const dateFmt = (d) => {
      const dt = parseDate(d);
      if (!dt) return d ? String(d) : '—';
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
    };
    const dateShort = (d) => {
      const dt = parseDate(d);
      if (!dt) return d ? String(d) : '—';
      return dt.toLocaleDateString('es-MX', { day:'2-digit', month:'short' });
    };

    // === Helpers para vista diaria ===
    // weekDays(N, año) → array de 7 Date objects (Dom→Sáb) que componen
    // la semana N del año, usando convención US/MX:
    //   Semana 1 = semana que contiene el 1 de enero, inicia en domingo.
    function weekDays(weekNum, year) {
      const jan1 = new Date(year, 0, 1);
      const dow = jan1.getDay();                // 0=Dom .. 6=Sáb
      const start = new Date(year, 0, 1 - dow + (weekNum - 1) * 7);
      return Array.from({ length: 7 }, (_, i) =>
        new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }
    const DAY_NAMES_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayLabel = (d) => `${DAY_NAMES_ES[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;

    // Infiere el año dominante de un conjunto de posts (por fecha o por p.year)
    function inferYear(posts) {
      const counts = {};
      for (const p of posts || []) {
        let y = null;
        if (p.year && +p.year > 1900) y = +p.year;
        else {
          const dt = parseDate(p.date);
          if (dt) y = dt.getFullYear();
        }
        if (y) counts[y] = (counts[y] || 0) + 1;
      }
      const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
      return sorted.length ? +sorted[0][0] : new Date().getFullYear();
    }
    const timeAgo = (ts) => {
      if (!ts) return '—';
      const diff = Math.floor((Date.now() - ts) / 1000);
      if (diff < 60) return 'hace un momento';
      if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
      if (diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
      return `hace ${Math.floor(diff/86400)} d`;
    };

      Facebook:'#3B6FB8', Instagram:'#C73E6B', TikTok:'#1FA9B0',
      X:'#2A2A2A', YouTube:'#C53030', Threads:'#525252', LinkedIn:'#1F4D8C',

    // ============================================================
    // EXPORTACIÓN — PNG por sección y PDF global
    // ============================================================
    function buildFileName(suffix) {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `samsung-mx_${suffix}_${yyyy}-${mm}-${dd}`;
    }

    async function captureSection(sectionId) {
      const el = document.getElementById(sectionId);
      if (!el) throw new Error('Sección no encontrada: ' + sectionId);
      if (typeof window.html2canvas !== 'function') {
        throw new Error('html2canvas no está cargado todavía. Recarga la página.');
      }
      // backgroundColor: '#0A0A0F' replica el bg-ink del dashboard
      // scale: 2 = retina-quality
      // useCORS: para que las imágenes externas (si las hay) no rompan la captura
      return await window.html2canvas(el, {
        backgroundColor: '#0A0A0F',
        scale: 2,
        useCORS: true,
        logging: false,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight,
      });
    }

    async function exportSectionAsPng(sectionId, name) {
      try {
        const canvas = await captureSection(sectionId);
        const link = document.createElement('a');
        link.download = buildFileName(name) + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        console.error('Error exportando PNG:', e);
        alert('No se pudo exportar la imagen: ' + e.message);
      }
    }

    async function exportFullDashboardPdf(onProgress) {
      try {
        if (typeof window.jspdf === 'undefined') {
          throw new Error('jsPDF no está cargado. Recarga la página.');
        }
        const { jsPDF } = window.jspdf;
        // Secciones en el orden que aparecen en el dashboard
        const sections = [
          { id: 'sec-resumen',      name: 'Resumen' },
          { id: 'sec-plataformas',  name: 'Plataformas' },
          { id: 'sec-tendencia',    name: 'Tendencia' },
          { id: 'sec-mezcla',       name: 'Mezcla' },
          { id: 'sec-top-posts',    name: 'Top posts' },
          { id: 'sec-vtr',          name: 'VTR' },
          { id: 'sec-promedios',    name: 'Promedios' },
          { id: 'sec-comparativas', name: 'Comparativas' },
          { id: 'sec-catalogo',     name: 'Catálogo' },
        ];
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const padding = 24;
        let firstPage = true;

        const present = sections.filter(s => document.getElementById(s.id));
        for (let i = 0; i < present.length; i++) {
          const { id, name } = present[i];
          if (onProgress) onProgress(i + 1, present.length, name);
          const canvas = await captureSection(id);
          if (!firstPage) pdf.addPage();
          firstPage = false;
          // Encajar la imagen en la página manteniendo aspecto
          const maxW = pageW - padding * 2;
          const maxH = pageH - padding * 2;
          const ratio = Math.min(maxW / canvas.width, maxH / canvas.height);
          const w = canvas.width * ratio;
          const h = canvas.height * ratio;
          // Fondo oscuro para que matchee con el dashboard
          pdf.setFillColor(10, 10, 15);
          pdf.rect(0, 0, pageW, pageH, 'F');
          pdf.addImage(canvas.toDataURL('image/png'), 'PNG',
            (pageW - w) / 2, (pageH - h) / 2, w, h);
        }
        pdf.save(buildFileName('dashboard') + '.pdf');
      } catch (e) {
        console.error('Error exportando PDF:', e);
        alert('No se pudo exportar el PDF: ' + e.message);
      }
    }

    // ============================================================
    // CACHE local + HOOK de datos con auto-refresh
    // ============================================================
    // BUILD_VERSION: cámbialo cuando subas una versión nueva.
    // Al cambiar, automáticamente se invalida cualquier caché viejo del navegador.
    const BUILD_VERSION = '2026-05-19-v15';
    const CACHE_KEY = 'smx-dashboard-cache-' + BUILD_VERSION;
    const CACHE_TTL_MS = CACHE_TTL_MIN * 60 * 1000;

    // Limpia automáticamente caches de builds viejos al cargar.
    try {
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('smx-dashboard-cache-') && k !== CACHE_KEY) {
          localStorage.removeItem(k);
        }
      });
    } catch {}

    function readCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const p = JSON.parse(raw);
        if (Date.now() - p.fetchedAt > CACHE_TTL_MS) return null;
        return p;
      } catch { return null; }
    }
    function writeCache(p) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(p)); } catch {} }
    function clearCache() { try { localStorage.removeItem(CACHE_KEY); } catch {} }

    function useDashboardData() {
      const [state, setState] = useState({
        data: null, loading: true, refreshing: false,
        error: null, errors: [], fetchedAt: null,
      });
      const inFlightRef = useRef(false);

      const load = useCallback(async ({ skipCache = false } = {}) => {
        if (inFlightRef.current) return;

        if (!skipCache) {
          const cached = readCache();
          if (cached) {
            try {
              const data = transformAll(cached.rawByPlatform);
              setState(s => ({ ...s, data, loading:false, errors: cached.errors||[], fetchedAt: cached.fetchedAt }));
              return;
            } catch { clearCache(); }
          }
        }

        inFlightRef.current = true;
        setState(s => ({ ...s, loading: !s.data, refreshing: !!s.data, error: null }));

        try {
          const { data: rawByPlatform, errors, fetchedAt } = await fetchAllPlatforms();
          const data = transformAll(rawByPlatform);
          writeCache({ rawByPlatform, errors, fetchedAt });
          setState({ data, loading:false, refreshing:false, error:null, errors, fetchedAt });
        } catch (e) {
          setState(s => ({ ...s, loading:false, refreshing:false, error: e?.message || 'Error desconocido' }));
        } finally {
          inFlightRef.current = false;
        }
      }, []);

      useEffect(() => { load(); }, [load]);

      useEffect(() => {
        const onVis = () => { if (document.visibilityState === 'visible') load(); };
        document.addEventListener('visibilitychange', onVis);
        return () => document.removeEventListener('visibilitychange', onVis);
      }, [load]);

      useEffect(() => {
        if (AUTO_REFRESH_MIN <= 0) return;
        const id = setInterval(() => {
          if (document.visibilityState === 'visible') load({ skipCache: true });
        }, AUTO_REFRESH_MIN * 60 * 1000);
        return () => clearInterval(id);
      }, [load]);

      const refresh = useCallback(() => { clearCache(); return load({ skipCache: true }); }, [load]);
      return { ...state, refresh, autoRefreshMin: AUTO_REFRESH_MIN };
    }

    // ============================================================
    // FILTROS — estado, sync con URL, filtro encadenado
    // ============================================================
    const EMPTY_FILTERS = {
      year: 2026,             // 2025 | 2026 | 'all'
      weekRange: null,        // [min, max] o null
      platforms: [],          // [] = todas
      campaigns: [],
      subcampaigns: [],
      contentTypes: [],       // [] = todos (Local / Global / LAO / ...)
      strategies: [],         // [] = todas (Orgánico / Pagado / ...)
    };

    function readFiltersFromUrl() {
      try {
        const sp = new URLSearchParams(window.location.search);
        const f = { ...EMPTY_FILTERS };
        const y = sp.get('y');
        if (y === '2025' || y === '2026') f.year = +y;
        else if (y === 'all')              f.year = 'all';
        // si no hay ?y= en URL → conserva el default 2026
        const wr = sp.get('w');
        if (wr) {
          const [a, b] = wr.split('-').map(Number);
          if (!isNaN(a) && !isNaN(b)) f.weekRange = [Math.min(a,b), Math.max(a,b)];
        }
        const arr = (k) => {
          const v = sp.get(k);
          return v ? v.split('|').filter(Boolean) : [];
        };
        f.platforms = arr('p');
        f.campaigns = arr('c');
        f.subcampaigns = arr('sc');
        f.contentTypes = arr('ct');
        f.strategies = arr('st');
        return f;
      } catch { return EMPTY_FILTERS; }
    }

    function writeFiltersToUrl(f) {
      try {
        const sp = new URLSearchParams();
        // sólo escribir ?y= si no es el default 2026
        if (f.year !== 2026) sp.set('y', String(f.year));
        if (f.weekRange) sp.set('w', `${f.weekRange[0]}-${f.weekRange[1]}`);
        if (f.platforms?.length)    sp.set('p',  f.platforms.join('|'));
        if (f.campaigns?.length)    sp.set('c',  f.campaigns.join('|'));
        if (f.subcampaigns?.length) sp.set('sc', f.subcampaigns.join('|'));
        if (f.contentTypes?.length) sp.set('ct', f.contentTypes.join('|'));
        if (f.strategies?.length)   sp.set('st', f.strategies.join('|'));
        const qs = sp.toString();
        const newUrl = window.location.pathname + (qs ? '?' + qs : '');
        window.history.replaceState(null, '', newUrl);
      } catch {}
    }

    function useFilters(initial = EMPTY_FILTERS) {
      const [filters, setFiltersRaw] = useState(() => {
        // Hidrata desde URL al cargar
        try {
          if (typeof window !== 'undefined') return readFiltersFromUrl();
        } catch {}
        return initial;
      });

      const setFilters = useCallback((updater) => {
        setFiltersRaw(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          writeFiltersToUrl(next);
          return next;
        });
      }, []);

      const isActive = (
        (filters.year != null && filters.year !== 2026) ||
        (filters.weekRange != null) ||
        filters.platforms.length > 0 ||
        filters.campaigns.length > 0 ||
        filters.subcampaigns.length > 0 ||
        filters.contentTypes.length > 0 ||
        filters.strategies.length > 0
      );

      const clear = useCallback(() => setFilters(EMPTY_FILTERS), [setFilters]);

      return { filters, setFilters, clear, isActive };
    }

    /**
     * Hook utilitario: cierra el popover al click fuera o al presionar ESC.
     */
    function useClickOutside(ref, handler) {
      useEffect(() => {
        const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) handler(); };
        const onKey = (e) => { if (e.key === 'Escape') handler(); };
        document.addEventListener('mousedown', onClick);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onClick);
          document.removeEventListener('keydown', onKey);
        };
      }, [ref, handler]);
    }

    function WeekRangeControl({ weeks, value, onChange }) {
      if (!weeks.length) return null;
      const min = weeks[0];
      const max = weeks[weeks.length - 1];
      const [a, b] = value || [min, max];

      const setLow = (v) => onChange([Math.min(v, b), b]);
      const setHigh = (v) => onChange([a, Math.max(v, a)]);

      const pctA = max === min ? 0 : ((a - min) / (max - min)) * 100;
      const pctB = max === min ? 100 : ((b - min) / (max - min)) * 100;

      return html`
        <div className="px-4 py-4 min-w-[280px]">
          <div className="flex items-baseline justify-between mb-3">
            <span className="text-[10px] font-mono uppercase tracking-wider text-txt4">Rango</span>
            <span className="font-mono text-sm text-txt tabular-nums">
              S${a} <span className="text-faint">→</span> S${b}
            </span>

            <div className="absolute top-1/2 left-0 right-0 h-1 bg-white/[0.08] rounded -translate-y-1/2"></div>
            <div className="absolute top-1/2 h-1 bg-accent rounded -translate-y-1/2"
                 style=${{ left: pctA + '%', right: (100 - pctB) + '%' }}></div>
            <input type="range" min=${min} max=${max} value=${a}
                   onChange=${e => setLow(parseInt(e.target.value))}
                   className="absolute top-0 left-0 w-full h-8 appearance-none bg-transparent pointer-events-none"/>
            <input type="range" min=${min} max=${max} value=${b}
                   onChange=${e => setHigh(parseInt(e.target.value))}
                   className="absolute top-0 left-0 w-full h-8 appearance-none bg-transparent pointer-events-none"/>
          </div>

          <div className="flex justify-between mt-2 text-[10px] font-mono text-faint">
            <span>S${min}</span>
            <span>S${max}</span>
          </div>

          <div className="flex justify-between mt-4 pt-3 border-t border-line text-[10px] font-mono uppercase tracking-wider">
            <button onClick=${() => onChange(null)} className="text-txt4 hover:text-txt">Quitar filtro</button>
            <button onClick=${() => onChange([min, max])} className="text-txt4 hover:text-txt">Todo</button>
          </div>

          <style>${`
            input[type="range"] { pointer-events: none; }
            input[type="range"]::-webkit-slider-thumb {
              pointer-events: auto;
              -webkit-appearance: none;
              appearance: none;
              width: 14px; height: 14px;
              border-radius: 50%;
              background: #FFFFFF;
              border: 2px solid #AFA9EC;
              box-shadow: 0 0 0 4px rgba(175,169,236,0.15);
              cursor: pointer;
            }
            input[type="range"]::-moz-range-thumb {
              pointer-events: auto;
              width: 14px; height: 14px;
              border-radius: 50%;
              background: #FFFFFF;
              border: 2px solid #AFA9EC;
              box-shadow: 0 0 0 4px rgba(175,169,236,0.15);
              cursor: pointer;
            }
            input[type="range"]::-webkit-slider-runnable-track { background: transparent; }
            input[type="range"]::-moz-range-track { background: transparent; }
          `}</style>
        </div>`;
    }

    /**
     * Componente principal: la barra completa de filtros.
     */
    function FilterBar({ baseMeta, filters, setFilters, clear, isActive, postsInScope, totalPosts }) {
      const { weeks, platforms, campaigns, subcampaignsByCampaign } = baseMeta;

      // Semanas disponibles para el slider — dependen del año filtrado
      const availableWeeks = useMemo(() => {
        if (filters.year === 'all') return weeks;
        return baseMeta.weeks_by_year?.[filters.year] || [];
      }, [filters.year, weeks, baseMeta.weeks_by_year]);

      // Subcampañas disponibles en función de las campañas seleccionadas
      const availableSubcampaigns = useMemo(() => {
        if (!filters.campaigns.length) return baseMeta.subcampaigns;
        const set = new Set();
        for (const c of filters.campaigns) {
          (subcampaignsByCampaign[c] || []).forEach(s => set.add(s));
        }
        return [...set].sort();
      }, [filters.campaigns, baseMeta.subcampaigns, subcampaignsByCampaign]);

      // Toggles
      const toggleArr = (key) => (val) => {
        setFilters(prev => {
          const arr = prev[key];
          const next = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
          // Si cambian campañas, limpia subcampañas que ya no son válidas
          let cleaned = { ...prev, [key]: next };
          if (key === 'campaigns') {
            const newSubsAvail = next.length === 0
              ? baseMeta.subcampaigns
              : [...new Set(next.flatMap(c => subcampaignsByCampaign[c] || []))];
            cleaned.subcampaigns = prev.subcampaigns.filter(s => newSubsAvail.includes(s));
          }
          return cleaned;
        });
      };

      const selectAll = (key, options) => () => {
        setFilters(prev => ({ ...prev, [key]: [...options] }));
      };
      const clearKey = (key) => () => {
        setFilters(prev => ({ ...prev, [key]: [] }));
      };

      const setWeekRange = (range) => {
        setFilters(prev => ({ ...prev, weekRange: range }));
      };

      const setYear = (y) => {
        // Al cambiar de año, limpiamos weekRange porque las semanas se
        // reinterpretan en el contexto del año seleccionado y el rango anterior
        // podría no aplicar (o ser confuso).
        setFilters(prev => ({ ...prev, year: y, weekRange: null }));
      };

      const yearOptions = [
        { v: 2025,  l: '2025' },
        { v: 2026,  l: '2026' },
        { v: 'all', l: 'Todo' },
      ];

      const weekSummary = filters.weekRange
        ? `S${filters.weekRange[0]}–S${filters.weekRange[1]}`
        : 'Todas';

      const arrSummary = (arr, total) => {
        if (arr.length === 0) return 'Todas';
        if (arr.length === 1) return arr[0].length > 16 ? arr[0].slice(0,14) + '…' : arr[0];
        return `${arr.length} de ${total}`;
      };

      return html`
        <div className="border-b border-line bg-ink/85 sticky top-0 z-20" style=${{backdropFilter: 'blur(12px)'}}>
          <div className="px-7 py-3 flex items-center gap-3 flex-wrap">

            <div className="flex items-center rounded-lg border border-line bg-white/[0.02] overflow-hidden shrink-0">
              <span className="text-[10px] font-mono uppercase tracking-[0.15em] text-faint px-2.5 py-1.5 border-r border-line">Año</span>
              ${yearOptions.map((o, i) => html`
                <button key=${o.v}
                  onClick=${() => setYear(o.v)}
                  className=${"px-2.5 py-1.5 text-[11px] transition-colors " +
                    (i > 0 ? "border-l border-line " : "") +
                    (filters.year === o.v
                      ? "bg-accent2/15 text-txt"
                      : "text-txt3 hover:text-txt hover:bg-white/[0.03]")}>
                  ${o.l}
                </button>
              `)}
            </div>

            <${FilterPopover}
              label="Semana"
              summary=${weekSummary}
              badgeCount=${filters.weekRange ? 1 : 0}
            >
              ${({}) => html`<${WeekRangeControl} weeks=${availableWeeks} value=${filters.weekRange} onChange=${setWeekRange}/>`}
            <//>

            <${FilterPopover}
              label="Plataforma"
              summary=${arrSummary(filters.platforms, platforms.length)}
              badgeCount=${filters.platforms.length}
            >
              ${() => html`<${MultiSelectPanel}
                options=${platforms}
                selected=${filters.platforms}
                onToggle=${toggleArr('platforms')}
                onSelectAll=${selectAll('platforms', platforms)}
                onClear=${clearKey('platforms')}
              />`}
            <//>

            <${FilterPopover}
              label="Campaña"
              summary=${arrSummary(filters.campaigns, campaigns.length)}
              badgeCount=${filters.campaigns.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${campaigns}
                selected=${filters.campaigns}
                onToggle=${toggleArr('campaigns')}
                onSelectAll=${selectAll('campaigns', campaigns)}
                onClear=${clearKey('campaigns')}
              />`}
            <//>

            <${FilterPopover}
              label="Subcampaña"
              summary=${arrSummary(filters.subcampaigns, availableSubcampaigns.length)}
              badgeCount=${filters.subcampaigns.length}
              wide
            >
              ${() => html`<${MultiSelectPanel}
                options=${availableSubcampaigns}
                selected=${filters.subcampaigns}
                onToggle=${toggleArr('subcampaigns')}
                onSelectAll=${selectAll('subcampaigns', availableSubcampaigns)}
                onClear=${clearKey('subcampaigns')}
                emptyLabel=${filters.campaigns.length ? 'Esta campaña no tiene subcampañas' : 'Sin subcampañas'}
              />`}
            <//>

            <${FilterPopover}
              label="Tipo contenido"
              summary=${arrSummary(filters.contentTypes, (baseMeta.content_types || []).length)}
              badgeCount=${filters.contentTypes.length}
            >
              ${() => html`<${MultiSelectPanel}
                options=${baseMeta.content_types || []}
                selected=${filters.contentTypes}
                onToggle=${toggleArr('contentTypes')}
                onSelectAll=${selectAll('contentTypes', baseMeta.content_types || [])}
                onClear=${clearKey('contentTypes')}
                emptyLabel="Sin tipos de contenido"
              />`}
            <//>

            <${FilterPopover}
              label="Pauta"
              summary=${arrSummary(filters.strategies, (baseMeta.strategies || []).length)}
              badgeCount=${filters.strategies.length}
            >
              ${() => html`<${MultiSelectPanel}
                options=${baseMeta.strategies || []}
                selected=${filters.strategies}
                onToggle=${toggleArr('strategies')}
                onSelectAll=${selectAll('strategies', baseMeta.strategies || [])}
                onClear=${clearKey('strategies')}
                emptyLabel="Sin tipos de pauta"
              />`}
            <//>

            <div className="flex-1 min-w-[8px]"></div>

            <div className="text-[11px] font-mono text-txt4 tabular-nums">
              <span className=${isActive ? "text-txt" : ""}>${postsInScope.toLocaleString('es-MX')}</span>
              <span className="text-faint"> de ${totalPosts.toLocaleString('es-MX')} posts</span>
            </div>

            ${isActive && html`
              <button onClick=${clear}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-medium border border-amber/40 text-amber hover:bg-amber/10 transition-colors">
                <${XIcon} size=${11}/> Limpiar
              </button>
            `}
          </div>
        </div>`;
    }

    function PlatformsGrid({ D }) {
      const platforms = Object.keys(D.by_platform)
        .sort((a,b) => D.by_platform[b].reach - D.by_platform[a].reach);

      // Single-week mode: calculamos serie diaria por plataforma
      // (mismos 7 días Dom→Sáb que TrendSection)
      const weeksInScope = D.meta?.weeks_in_scope || D.meta?.weeks || [];
      const isDailyMode = weeksInScope.length === 1;

      const dailyByPlatform = useMemo(() => {
        if (!isDailyMode) return null;
        const wk = weeksInScope[0];
        const sy = D.meta?.selected_year;
        const year = (typeof sy === 'number') ? sy : inferYear(D.allPosts);
        const days = weekDays(wk, year);

        const out = {};
        for (const plat of platforms) {
          const byKey = {};
          for (const d of days) byKey[isoDay(d)] = { key: isoDay(d), reach: 0 };
          for (const p of (D.allPosts || [])) {
            if (p.platform !== plat) continue;
            const dt = parseDate(p.date);
            if (!dt) continue;
            const key = isoDay(dt);
            if (byKey[key]) byKey[key].reach += p.reach || 0;
          }
          out[plat] = days.map(d => byKey[isoDay(d)]);
        }
        return out;
      }, [D, isDailyMode, weeksInScope, platforms.join(',')]);

      return html`
        <section id="sec-plataformas" className="px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-plataformas" name="Plataformas" />
          <div className="flex items-baseline justify-between mb-4">

          </div>

            ${platforms.map(p => html`
              <${PlatformCard}
                key=${p}
                name=${p}
                stat=${D.by_platform[p]}
                weekly=${dailyByPlatform ? null : D.by_plat_week[p]}
                dailySeries=${dailyByPlatform ? dailyByPlatform[p] : null} />
            `)}
          </div>
        </section>`;
    }

    // ============================================================
    // TrendSection
    // ============================================================
    const TREND_METRICS = [
      { k:'reach',         l:'Alcance' },
      { k:'inter',         l:'Interacciones' },
      { k:'views',         l:'Reproducciones' },
      { k:'er_avg',        l:'ER total',    isPercent:true },
      { k:'basic_er_avg',  l:'ER básico',   isPercent:true },
    ];

    function TrendSection({ D }) {
      const [metric, setMetric] = useState('reach');
      const isPercent = TREND_METRICS.find(m => m.k === metric)?.isPercent;

      // Single-week mode: si el filtro deja una sola semana en el rango,
      // cambia automáticamente a vista por día (Dom→Sáb de esa semana).
      const weeksInScope = D.meta?.weeks_in_scope || D.meta?.weeks || [];
      const isDailyMode = weeksInScope.length === 1;

      const series = useMemo(() => {
        if (isDailyMode) {
          const wk = weeksInScope[0];
          // Si el usuario filtró un año específico (no 'all'), úsalo;
          // si está en 'all', infiere del dominante en los posts en scope.
          const sy = D.meta?.selected_year;
          const year = (typeof sy === 'number') ? sy : inferYear(D.allPosts);
          const days = weekDays(wk, year);

          // Inicializa los 7 días con ceros (Dom→Sáb)
          const byKey = {};
          for (const d of days) {
            byKey[isoDay(d)] = {
              date: d, posts: 0, reach: 0, inter: 0, views: 0,
              er_sum: 0, er_n: 0,
              basic_er_sum: 0, basic_er_n: 0,
            };
          }

          // Acumula posts cuya fecha cae dentro de esos 7 días.
          let outOfWindow = 0;
          for (const p of (D.allPosts || [])) {
            const dt = parseDate(p.date);
            if (!dt) { outOfWindow++; continue; }
            const key = isoDay(dt);
            const agg = byKey[key];
            if (!agg) { outOfWindow++; continue; }
            agg.posts++;
            agg.reach += p.reach || 0;
            agg.inter += p.interactions || 0;
            agg.views += p.views || 0;
            if (p.er != null) { agg.er_sum += p.er; agg.er_n++; }
            if (p.basic_er != null) { agg.basic_er_sum += p.basic_er; agg.basic_er_n++; }
          }

          const out = days.map(d => {
            const agg = byKey[isoDay(d)];
            let value;
            if (metric === 'er_avg')             value = agg.er_n > 0 ? agg.er_sum / agg.er_n : 0;
            else if (metric === 'basic_er_avg')  value = agg.basic_er_n > 0 ? agg.basic_er_sum / agg.basic_er_n : 0;
            else if (metric === 'inter')         value = agg.inter;
            else                                 value = agg[metric];   // reach | views
            return { week: isoDay(d), label: dayLabel(d), value, posts: agg.posts };
          });
          out._outOfWindow = outOfWindow;
          return out;
        }

        // Vista semanal estándar
        return Object.keys(D.by_week).sort((a,b) => +a - +b).map(w => ({
          week: +w, label: 'S' + w,
          value: D.by_week[w][metric], posts: D.by_week[w].posts,
        }));
      }, [D, metric, isDailyMode]);

      // Rango fijo de la semana en daily mode (Dom→Sáb)
      const weekRangeLabel = useMemo(() => {
        if (!isDailyMode) return null;
        const wk = weeksInScope[0];
        const sy = D.meta?.selected_year;
        const year = (typeof sy === 'number') ? sy : inferYear(D.allPosts);
        const days = weekDays(wk, year);
        return `${dayLabel(days[0])} → ${dayLabel(days[6])}`;
      }, [isDailyMode, weeksInScope, D.allPosts, D.meta?.selected_year]);

      const outOfWindow = isDailyMode ? (series._outOfWindow || 0) : 0;

      const xTickInterval = isDailyMode
        ? 0   // mostrar todos los días
        : Math.max(0, Math.floor(series.length / 12));

      return html`
        <section id="sec-tendencia" className="px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-tendencia" name="Tendencia" />
          <div className="flex flex-wrap items-baseline justify-between gap-4 mb-4">
            <div>
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-accent mb-1.5">§ 03</div>
              <h2 className="text-[18px] font-medium text-txt">${isDailyMode ? 'Evolución diaria' : 'Evolución semanal'}</h2>
              ${isDailyMode && weekRangeLabel && html`
                <div className="text-[10px] font-mono text-txt4 mt-1">Semana ${weeksInScope[0]} · ${weekRangeLabel}</div>
              `}
            </div>
            <div className="flex rounded-lg border border-line bg-white/[0.02] overflow-hidden">
              ${TREND_METRICS.map((m, i) => html`
                <button key=${m.k} onClick=${() => setMetric(m.k)}
                  className=${"px-3 py-1.5 text-[11px] transition-colors " +
                    (i > 0 ? "border-l border-line " : "") +
                    (metric === m.k ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-white/[0.03]")}>
                  ${m.l}
                </button>
              `)}
            </div>
          </div>
          <div className="rounded-xl bg-surface border border-line p-5">
            <div className="h-72">
              <${ResponsiveContainer}>
                <${ComposedChart} data=${series} margin=${{ top:10, right:16, left:8, bottom:8 }}>
                  <${CartesianGrid} stroke="rgba(255,255,255,0.05)" strokeDasharray="0" vertical=${false} />
                  <${XAxis} dataKey="label" stroke="#6B6B78" fontSize=${11}
                            tickLine=${false} axisLine=${{ stroke: 'rgba(255,255,255,0.08)' }}
                            interval=${xTickInterval} />
                  <${YAxis} yAxisId="left" stroke="#6B6B78" fontSize=${11}
                            tickLine=${false} axisLine=${false}
                            tickFormatter=${isPercent ? (v) => v.toFixed(1) + '%' : fmt}
                            width=${48} />
                  <${YAxis} yAxisId="right" orientation="right" stroke="#4A4A55" fontSize=${11}
                            tickLine=${false} axisLine=${false} width=${32} />
                  <${Tooltip}
                    cursor=${{ fill: 'rgba(175,169,236,0.05)' }}
                    contentStyle=${{ background:'#1A1A22', border:'1px solid rgba(255,255,255,0.10)', borderRadius:6, padding:'8px 12px', fontSize:11, fontFamily:'JetBrains Mono, monospace', color:'#FFFFFF' }}
                    labelStyle=${{ color: '#888894' }}
                    labelFormatter=${(label) => isDailyMode ? label : `Semana ${String(label).slice(1)}`}
                    formatter=${(v, name) => {
                      if (name === 'value') return [isPercent ? erFmt(v) : fmt(v), TREND_METRICS.find(m => m.k === metric)?.l];
                      return [v, 'Posts'];
                    }} />
                  <${Bar} yAxisId="right" dataKey="posts" fill="rgba(255,255,255,0.06)" />
                  <${Line} yAxisId="left" type="monotone" dataKey="value"
                           stroke="#AFA9EC" strokeWidth=${2}
                           dot=${{ fill:'#AFA9EC', r:3, strokeWidth:0 }} activeDot=${{ r:5, fill:'#FFFFFF', stroke:'#AFA9EC', strokeWidth:2 }} />
                <//>
              <//>
            </div>
            <div className="flex gap-5 mt-3 pt-3 border-t border-line text-[10px] font-mono text-txt4">
              <div className="flex items-center gap-2"><span className="w-3 h-0.5 bg-accent"></span><span>${TREND_METRICS.find(m => m.k === metric)?.l}</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-2 bg-white/10 rounded-sm"></span><span>Volumen de posts</span></div>
              ${isDailyMode && outOfWindow > 0 && html`
                <div className="text-amber" title="Posts marcados como esta semana pero con fecha fuera del rango Dom→Sáb">
                  ⚠ ${outOfWindow} post${outOfWindow === 1 ? '' : 's'} con fecha fuera de la semana
                </div>
              `}
              ${isDailyMode && html`<div className="ml-auto text-accent/60">vista diaria automática</div>`}
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // MixSection
    // ============================================================

        .map(([k,v]) => ({ name:k, ...v }))

      const max = fmts[0]?.reach || 1;

      return html`
        <section id="sec-mezcla" className="px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-mezcla" name="Mezcla" />
          <div className="flex items-baseline justify-between mb-5">

              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-accent mb-1.5">§ 04</div>

                ${strats.slice(0, 4).map(s => {
                  const isPaid = (s.name||'').toLowerCase().includes('pauta') || (s.name||'').toLowerCase().includes('paid');
                  const color = isPaid ? '#F0B358' : '#AFA9EC';
                  const pctPosts = totalPosts ? Math.round(s.posts/totalPosts*100) : 0;
                  return html`
                    <div key=${s.name}>
                      <div className="flex items-baseline justify-between mb-1.5">
                        <div className="flex items-baseline gap-3">
                          <span className="text-[15px] text-txt font-medium">${s.name || '—'}</span>
                          <span className="text-[11px] font-mono text-txt4">${pctPosts}% de posts</span>

                      </div>

    // ============================================================
    // VtrSection — VTR general, por plataforma, por duración + top videos
    // ============================================================
    function computeVtrStats(posts) {
      // Un post es "video" si tiene VTR registrado y no es Story.
      // (Stories no se cuentan en VTR — definido en la base de datos.)
      const videos = posts.filter(p =>
        p.vtr != null &&
        p.format !== 'Stories'
      );

      // Promedio aritmético simple del VTR%: cada video pesa igual,
      // independiente del número de views.
      function aggBucket(list) {
        if (!list.length) return { n: 0, vtr: null, views: 0, duration_avg: null };
        const sumVtr = list.reduce((a, p) => a + (p.vtr || 0), 0);
        const sumViews = list.reduce((a, p) => a + (p.views || 0), 0);
        const sumDur = list.reduce((a, p) => a + (p.duration || 0), 0);
        const nWithDur = list.filter(p => p.duration > 0).length;
        return {
          n: list.length,
          vtr: sumVtr / list.length,
          views: sumViews,
          duration_avg: nWithDur > 0 ? sumDur / nWithDur : null,
        };
      }

      const general = aggBucket(videos);

      const byPlatform = {};
      const platOrder = ['Facebook','Instagram','YouTube','TikTok','X','LinkedIn','Threads'];
      for (const plat of platOrder) {
        const platVideos = videos.filter(p => p.platform === plat);
        if (platVideos.length > 0) byPlatform[plat] = aggBucket(platVideos);
      }

      const short = videos.filter(p => p.duration != null && p.duration <= 30);
      const long  = videos.filter(p => p.duration != null && p.duration  > 30);
      const byDuration = {
        short: { ...aggBucket(short), label: '≤ 30 segundos' },
        long:  { ...aggBucket(long),  label: '> 30 segundos' },
      };

      // Top 10 videos por VTR — filtramos los que tienen pocas views para
      // evitar que dominen videos con VTR alto pero base mínima.
      // Umbral: top 25% en views.
      const viewsSorted = videos.map(v => v.views || 0).sort((a, b) => b - a);
      const viewsThreshold = viewsSorted[Math.floor(viewsSorted.length * 0.25)] || 0;
      const topVideos = videos
        .filter(p => (p.views || 0) >= Math.max(viewsThreshold, 1000))
        .sort((a, b) => (b.vtr || 0) - (a.vtr || 0))
        .slice(0, 10);

      return { general, byPlatform, byDuration, topVideos, totalVideos: videos.length };
    }

    function AveragesSection({ D }) {
      const g = D.global;

      // Por plataforma — ordenado por alcance/post por defecto
      const platforms = Object.entries(D.by_platform || {})
        .map(([name, v]) => ({ name, ...v }));

      // Por formato — toma los formatos con al menos algún post
      const formats = Object.entries(D.by_format || {})
        .map(([name, v]) => ({ name, ...v }))
        .filter(f => f.posts > 0);

      return html`
        <section id="sec-promedios" className="px-7 py-7 relative group">

    // ============================================================
    // ComparativasSection — Week-over-Week
    // ============================================================
    function deltaPct(curr, prev) {
      if (prev == null || prev === 0) return null;
      return ((curr - prev) / prev) * 100;
    }

    function DeltaPill({ pct, invert }) {
      // invert=true para métricas donde "menos es mejor" (no aplicable aquí, pero por si acaso)
      if (pct == null || !isFinite(pct)) {
        return html`<span className="text-[11px] font-mono text-faint">—</span>`;
      }
      const isUp = pct > 0;
      const isNeutral = Math.abs(pct) < 0.5;
      const good = invert ? !isUp : isUp;
      const color = isNeutral ? 'text-txt4' : good ? 'text-success' : 'text-amber';
      const arrow = isNeutral ? '·' : isUp ? '↑' : '↓';
      const sign = pct > 0 ? '+' : '';
      return html`
        <span className=${"text-[11px] font-mono tabular-nums " + color}>
          ${arrow} ${sign}${pct.toFixed(1)}%
        </span>`;
    }

    function CompareKpiCard({ label, curr, prev, isPercent }) {
      const pct = deltaPct(curr, prev);
      const fmtVal = isPercent ? erFmt : fmt;
      return html`
        <div className="rounded-xl bg-surface border border-line px-5 py-4">
          <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">${label}</div>
          <div className="text-[24px] font-medium text-txt tabular-nums leading-none">${fmtVal(curr)}</div>
          <div className="flex items-baseline gap-2 mt-2">
            <${DeltaPill} pct=${pct} />
            <span className="text-[10px] font-mono text-faint">vs ${fmtVal(prev)}</span>
          </div>
        </div>`;
    }

    // Calcula un agregado simple desde una lista de posts (sin pasar por aggAdd)
    function quickAgg(posts) {
      let reach=0, inter=0, views=0, er_sum=0, er_n=0, basic_sum=0, basic_n=0, vtr_sum=0, vtr_n=0;
      for (const p of posts) {
        reach += p.reach || 0;
        inter += p.interactions || 0;
        views += p.views || 0;
        if (p.er != null && p.er !== 0)             { er_sum += p.er; er_n++; }
        if (p.basic_er != null && p.basic_er !== 0) { basic_sum += p.basic_er; basic_n++; }
        if (p.vtr != null && p.vtr !== 0)           { vtr_sum += p.vtr; vtr_n++; }
      }
      const n = posts.length;
      return {
        posts: n,
        reach, inter, views,
        er_avg: er_n ? er_sum / er_n : 0,
        basic_er_avg: basic_n ? basic_sum / basic_n : 0,
        vtr_avg: vtr_n ? vtr_sum / vtr_n : 0,
        reach_per_post: n ? reach / n : 0,
        inter_per_post: n ? inter / n : 0,
        views_per_post: n ? views / n : 0,
      };
    }

    function ComparativasSection({ D, rawPosts, filters }) {
      // Auto-activación: si el filtro tiene exactamente una semana, activamos WoW
      const weekRange = filters?.weekRange;
      const isSingleWeek = weekRange && weekRange[0] === weekRange[1];
      const currentWeek = isSingleWeek ? weekRange[0] : null;
      const prevWeek = currentWeek != null ? currentWeek - 1 : null;

      // Para comparar manzanas con manzanas, aplicamos TODOS los demás filtros
      // (año, plataformas, campañas, tipo contenido, pauta) pero ignoramos el de semana
      const compareData = useMemo(() => {
        if (!isSingleWeek || prevWeek == null || prevWeek < 1) return null;
        const filtersNoWeek = { ...filters, weekRange: null };
        const scopedPosts = applyFilters(rawPosts || [], filtersNoWeek);
        const currentPosts = scopedPosts.filter(p => p.week === currentWeek);
        const prevPosts = scopedPosts.filter(p => p.week === prevWeek);

        if (prevPosts.length === 0) return { noPrev: true, currentWeek, prevWeek };

        // Por plataforma
        const platforms = [...new Set([...currentPosts, ...prevPosts].map(p => p.platform))].sort();
        const byPlatform = platforms.map(plat => ({
          name: plat,
          curr: quickAgg(currentPosts.filter(p => p.platform === plat)),
          prev: quickAgg(prevPosts.filter(p => p.platform === plat)),
        }));

        // Por formato
        const formats = [...new Set([...currentPosts, ...prevPosts]
          .map(p => p.format).filter(Boolean))].sort();
        const byFormat = formats.map(fmt => ({
          name: fmt,
          curr: quickAgg(currentPosts.filter(p => p.format === fmt)),
          prev: quickAgg(prevPosts.filter(p => p.format === fmt)),
        }));

        return {
          currentWeek, prevWeek,
          curr: quickAgg(currentPosts),
          prev: quickAgg(prevPosts),
          byPlatform, byFormat,
          currentPostsCount: currentPosts.length,
          prevPostsCount: prevPosts.length,
        };
      }, [rawPosts, filters, isSingleWeek, currentWeek, prevWeek]);

      // Estado vacío 1: no hay filtro de semana
      if (!isSingleWeek) {
        return html`
          <section id="sec-comparativas" className="px-7 py-7 relative group">
            <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
            <div className="flex items-baseline justify-between mb-5">
              <div>
                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-accent mb-1.5">§ 08</div>
                <h2 className="text-[18px] font-medium text-txt">Comparativas · WoW</h2>
                <p className="text-txt4 text-[12px] mt-1">Compara una semana contra la anterior.</p>
              </div>
            </div>
            <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
              <div className="text-txt3 text-[13px] mb-1">Filtra exactamente una semana en la barra superior</div>
              <div className="text-faint text-[11px] font-mono">para activar la comparativa Week-over-Week</div>
            </div>
          </section>`;
      }

      // Estado vacío 2: no hay datos en semana anterior
      if (!compareData || compareData.noPrev) {
        return html`
          <section id="sec-comparativas" className="px-7 py-7 relative group">
            <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
            <div className="flex items-baseline justify-between mb-5">
              <div>
                <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-accent mb-1.5">§ 08</div>
                <h2 className="text-[18px] font-medium text-txt">Comparativas · WoW</h2>
                <p className="text-txt4 text-[12px] mt-1">S${currentWeek} vs S${prevWeek}</p>
              </div>
            </div>
            <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
              <div className="text-txt3 text-[13px] mb-1">No hay datos en S${prevWeek} para comparar</div>
              <div className="text-faint text-[11px] font-mono">Prueba con una semana posterior o limpia los demás filtros</div>
            </div>
          </section>`;
      }

      const c = compareData;

      return html`
        <section id="sec-comparativas" className="px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
          <div className="flex items-baseline justify-between mb-5">
            <div>
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-accent mb-1.5">§ 08</div>
              <h2 className="text-[18px] font-medium text-txt">Comparativas · WoW</h2>
              <p className="text-txt4 text-[12px] mt-1">
                S${c.currentWeek} (${c.currentPostsCount} posts) vs S${c.prevWeek} (${c.prevPostsCount} posts)
              </p>
            </div>
          </div>

          <!-- KPI deltas -->
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 mb-3">
            <${CompareKpiCard} label="Alcance"        curr=${c.curr.reach}        prev=${c.prev.reach}        />
            <${CompareKpiCard} label="Interacciones"  curr=${c.curr.inter}        prev=${c.prev.inter}        />
            <${CompareKpiCard} label="Reproducciones" curr=${c.curr.views}        prev=${c.prev.views}        />
            <${CompareKpiCard} label="Posts"          curr=${c.curr.posts}        prev=${c.prev.posts}        />
            <${CompareKpiCard} label="ER total"       curr=${c.curr.er_avg}       prev=${c.prev.er_avg}       isPercent />
            <${CompareKpiCard} label="ER básico"      curr=${c.curr.basic_er_avg} prev=${c.prev.basic_er_avg} isPercent />
            <${CompareKpiCard} label="VTR"            curr=${c.curr.vtr_avg}      prev=${c.prev.vtr_avg}      isPercent />
            <${CompareKpiCard} label="Alcance/post"   curr=${c.curr.reach_per_post} prev=${c.prev.reach_per_post} />
          </div>

          <!-- Tablas WoW por plataforma y por formato -->
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <${CompareTable}
              title="Por plataforma"
              rows=${c.byPlatform}
              currentWeek=${c.currentWeek}
              prevWeek=${c.prevWeek}
              showBadge=${true}
            />
            <${CompareTable}
              title="Por formato"
              rows=${c.byFormat}
              currentWeek=${c.currentWeek}
              prevWeek=${c.prevWeek}
              showBadge=${false}
            />
          </div>
        </section>`;
    }

    function CompareTable({ title, rows, currentWeek, prevWeek, showBadge }) {
      // Ordenar por alcance del periodo actual descendente
      const sorted = [...rows].sort((a, b) => (b.curr.reach || 0) - (a.curr.reach || 0));
      return html`
        <div className="rounded-xl bg-surface border border-line p-5">
          <div className="flex items-baseline justify-between mb-4">
            <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4">${title}</div>
            <div className="text-[10px] font-mono text-faint">S${currentWeek} → S${prevWeek}</div>

          <div className="overflow-x-auto">
            <table className="text-[12px] font-mono w-full">
              <thead>

                </tr>
              </thead>
              <tbody>
                ${sorted.length === 0 && html`
                  <tr><td colSpan=${6} className="py-8 text-center text-faint">Sin datos.</td></tr>
                `}
                ${sorted.map(r => {
                  const reachDelta = deltaPct(r.curr.reach, r.prev.reach);
                  const interDelta = deltaPct(r.curr.inter, r.prev.inter);
                  const color = showBadge ? PLAT_COLORS[r.name] : null;
                  return html`
                    <tr key=${r.name} className="border-b border-line/40 last:border-0 hover:bg-white/[0.025] transition-colors">
                      <td className="py-2.5 pr-3">
                        ${color ? html`
                          <div className="flex items-center gap-2.5">
                            <span className="w-5 h-5 rounded flex items-center justify-center text-[9px] text-white font-medium" style=${{ background: color }}>${PLAT_LETTERS[r.name]}</span>
                            <span className="text-txt text-[13px] font-sans">${r.name}</span>
                          </div>` : html`
                          <span className="text-txt text-[13px] font-sans truncate inline-block max-w-[200px]" title=${r.name}>${r.name}</span>
                        `}
                      </td>
                      <td className="text-right py-2.5 px-2 tabular-nums text-txt">${fmt(r.curr.reach)}</td>
                      <td className="text-right py-2.5 px-2"><${DeltaPill} pct=${reachDelta} /></td>
                      <td className="text-right py-2.5 px-2 tabular-nums text-txt2">${fmt(r.curr.inter)}</td>
                      <td className="text-right py-2.5 px-2"><${DeltaPill} pct=${interDelta} /></td>
                      <td className="text-right py-2.5 pl-2 tabular-nums text-txt3">${r.curr.posts}<span className="text-faint"> / ${r.prev.posts}</span></td>
                    </tr>`;
                })}
              </tbody>
            </table>
          </div>
        </div>`;
    }

        <div className="flex flex-col">

          <aside className="fixed top-0 right-0 bottom-0 w-full sm:w-[480px] z-50 bg-ink border-l border-line2 slide-in flex flex-col"
                 style=${{ boxShadow: '-20px 0 40px rgba(0,0,0,0.4)' }}>
