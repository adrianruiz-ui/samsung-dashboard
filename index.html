    const ORG_COLOR = '#5DCAA5', PAID_COLOR = '#4C6EF5';

    function HeroSection({ D, chartTheme, kpis }) {
      const ct = chartTheme || CHART_THEME.dark;
      const g = D.global;
      const [metric, setMetric] = useState(() => { try { return localStorage.getItem('smx-hero-metric') || 'reach'; } catch { return 'reach'; } });
      const pickMetric = (k) => { setMetric(k); try { localStorage.setItem('smx-hero-metric', k); } catch {} };
      const M = HERO_METRICS.find(m => m.k === metric) || HERO_METRICS[0];

      // Semana a semana, separado en orgánico y pauta
      const trend = useMemo(() => {
        const map = new Map();
        for (const p of (D.allPosts || [])) {
          if (!p.week) continue;
          if (!map.has(p.week)) map.set(p.week, { week: +p.week, label: 'S' + p.week, org: 0, paid: 0, postsOrg: 0, postsPaid: 0 });
          const r = map.get(p.week), v = M.f(p);
          if (isPaidP(p)) { r.paid += v; r.postsPaid++; } else { r.org += v; r.postsOrg++; }
        }
        const arr = [...map.values()].sort((a, b) => a.week - b.week);
        arr.forEach((d, i) => {
          d.total = d.org + d.paid;
          const win = arr.slice(Math.max(0, i - 3), i + 1);
          d.ma4 = win.reduce((a, x) => a + x.org + x.paid, 0) / win.length;
        });
        return arr;
      }, [D, metric]);
      const avg = trend.length ? trend.reduce((a, d) => a + d.total, 0) / trend.length : 0;
      const maxW = trend.reduce((m, d) => d.total > (m?.total ?? -1) ? d : m, null);
      const lastW = trend[trend.length - 1];
      const sumOrg = trend.reduce((a, d) => a + d.org, 0), sumPaid = trend.reduce((a, d) => a + d.paid, 0);
      const shareOrg = (sumOrg + sumPaid) ? sumOrg / (sumOrg + sumPaid) : 0;
      const nPlat = Object.keys(D.by_platform).length;

      const TipBox = ({ active, payload }) => {

        const d = payload[0].payload;
        const row = (c, l, v) => html`<div style=${{ display: 'flex', justifyContent: 'space-between', gap: 14 }}>
          <span><span style=${{ display: 'inline-block', width: 8, height: 8, borderRadius: 2, background: c, marginRight: 6 }}></span>${l}</span><b>${v}</b></div>`;

            ${row(ORG_COLOR, `Orgánico (${d.postsOrg} posts)`, fmtFull(d.org) + ' · ' + pct(d.org, d.total))}
            <div style=${{ height: 6 }}></div>
            ${row('transparent', 'Total', fmtFull(d.total))}
            <div style=${{ color: ct.tooltipLabel }}>Promedio 4 sem.: ${fmtFull(d.ma4)}</div>
            <div style=${{ color: ct.tooltipLabel }}>${avg ? ((d.total / avg - 1) * 100 >= 0 ? '+' : '') + ((d.total / avg - 1) * 100).toFixed(0) + '% vs. promedio semanal' : ''}</div>

            <span className="text-txt font-medium"> ${fmt(g.reach)} de alcance</span>,
            <span className="text-txt font-medium"> ${fmt(g.inter)} interacciones</span> y
            <span className="text-txt font-medium"> ${fmt(g.views)} reproducciones</span>${' en '}${nWeeks} ${nWeeks === 1 ? 'semana activa' : 'semanas activas'}.

          <div className="rounded-2xl bg-surface p-5 md:p-6 mt-4">
            <div className="flex flex-wrap items-start justify-between gap-4 mb-4">

                  <div className="text-[15px] font-medium text-txt">${M.l} semanal</div>

                    ${HERO_METRICS.map(m => html`
                      <button key=${m.k} role="radio" aria-checked=${metric === m.k} onClick=${() => pickMetric(m.k)}
                              className=${"px-2.5 py-1 rounded-md text-[11px] transition-colors " + (metric === m.k ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>${m.l}</button>`)}
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-[12px] text-txt3 mt-2">
                  <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style=${{ background: PAID_COLOR }}></span>Pauta · ${pct(sumPaid, sumOrg + sumPaid)}</span>
                  <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style=${{ background: ORG_COLOR }}></span>Orgánico · ${pct(sumOrg, sumOrg + sumPaid)}</span>
                  <span className="inline-flex items-center gap-1.5"><span className="w-4 h-0.5 rounded" style=${{ background: ct.tooltipText, opacity: 0.7 }}></span>Promedio móvil 4 sem.</span>
                  <span className="inline-flex items-center gap-1.5"><span className="w-4 border-t border-dashed" style=${{ borderColor: '#F0B358' }}></span>Promedio del periodo</span>
                </div>
              </div>
              <div className="flex flex-wrap gap-x-6 gap-y-2 text-right">
                <div>

                ${lastW && html`<div>

              </div>`}

    // ============================================================
    // InsightsPanel — lecturas automáticas del periodo filtrado.
    // Reglas deterministas sobre D (nada de llamadas externas): cada
    // función evalúa una condición y, si es lo bastante notable, agrega
    // una oración corta. Se ordenan por relevancia y se muestran las
    // primeras 4, para no saturar con obviedades.
    // ============================================================
    function computeInsights(D) {
      const insights = [];
      const g = D.global;
      if (!g || !g.posts) return insights;

      // 1) Plataforma líder (solo si hay más de una en el filtro actual
      // y de verdad domina — si no, no aporta nada decirlo)
      {
        const entries = Object.entries(D.by_platform || {});
        if (entries.length > 1 && g.reach > 0) {
          const [name, agg] = [...entries].sort((a, b) => b[1].reach - a[1].reach)[0];
          const share = (agg.reach / g.reach) * 100;
          if (share >= 25) {
            insights.push({
              id: 'platform-leader', tone: 'neutral', priority: share,
              parts: [
                { t: name, strong: true },
                { t: ' lideró el alcance con ' },
                { t: `${share.toFixed(0)}%`, strong: true },
                { t: ' de participación (' },
                { t: `${agg.posts} posts`, strong: true },
                { t: ').' },
              ],
            });
          }
        }
      }

      // 2) Tendencia semana a semana (últimas dos semanas con datos
      // dentro del filtro actual)
      {
        const weekKeys = Object.keys(D.by_week || {}).map(Number).sort((a, b) => a - b);
        if (weekKeys.length >= 2) {
          const currW = weekKeys[weekKeys.length - 1];
          const prevW = weekKeys[weekKeys.length - 2];
          const currReach = D.by_week[currW].reach;
          const prevReach = D.by_week[prevW].reach;
          if (prevReach > 0) {
            const delta = ((currReach - prevReach) / prevReach) * 100;
            if (Math.abs(delta) >= 8) {
              const up = delta > 0;
              insights.push({
                id: 'wow-trend', tone: up ? 'positive' : 'negative', priority: Math.abs(delta) * 0.9,
                parts: [
                  { t: 'El alcance ' },
                  { t: up ? 'subió' : 'bajó', strong: true },
                  { t: ` ${Math.abs(delta).toFixed(0)}%`, strong: true },
                  { t: ` en la semana ${currW} vs. la semana ${prevW}.` },
                ],
              });
            }
          }
        }
      }

      // 3) Mejor formato por ER — se exige un mínimo de posts para no
      // premiar a un formato con 1 publicación afortunada
      {
        const MIN = 3;
        const entries = Object.entries(D.by_format || {}).filter(([, v]) => v.posts >= MIN && v.er_avg > 0);
        if (entries.length >= 2) {
          const [name, agg] = entries.sort((a, b) => b[1].er_avg - a[1].er_avg)[0];
          insights.push({
            id: 'best-format', tone: 'positive', priority: 38,
            parts: [
              { t: name, strong: true },
              { t: ' fue el formato con mejor ER (' },
              { t: erFmt(agg.er_avg), strong: true },
              { t: `) entre los que tuvieron ${MIN}+ posts.` },
            ],
          });
        }
      }

      // 4) Campaña que concentra el alcance
      {
        const MIN = 3;
        const entries = Object.entries(D.by_campaign || {}).filter(([, v]) => v.posts >= MIN);
        if (entries.length >= 2 && g.reach > 0) {
          const [name, agg] = entries.sort((a, b) => b[1].reach - a[1].reach)[0];
          const share = (agg.reach / g.reach) * 100;
          if (share >= 15) {
            insights.push({
              id: 'top-campaign', tone: 'neutral', priority: share * 0.8,
              parts: [
                { t: 'La campaña ' },
                { t: name, strong: true },
                { t: ' concentró ' },
                { t: `${share.toFixed(0)}%`, strong: true },
                { t: ` del alcance total (${fmt(agg.reach)}).` },
              ],
            });
          }
        }
      }

      // 5) Post con mayor alcance del periodo filtrado
      {
        const posts = D.allPosts || [];
        if (posts.length >= 5) {
          const top = [...posts].sort((a, b) => (b.reach || 0) - (a.reach || 0))[0];
          if (top && top.reach) {
            insights.push({
              id: 'top-post', tone: 'positive', priority: 33,
              parts: [
                { t: 'El post con mayor alcance fue ' },
                { t: `${top.format || 'contenido'} de ${top.platform}`, strong: true },
                { t: top.campaign ? ` (${top.campaign})` : '' },
                { t: ' con ' },
                { t: fmt(top.reach), strong: true },
                { t: ' de alcance.' },
              ],
              post: top,
            });
          }
        }
      }

      return insights.sort((a, b) => b.priority - a.priority).slice(0, 4);
    }

    function InsightLine({ insight }) {
      const toneColor = insight.tone === 'positive' ? 'text-success' : insight.tone === 'negative' ? 'text-amber' : 'text-accent';
      const glyph = insight.tone === 'positive' ? '↑' : insight.tone === 'negative' ? '↓' : '•';
      return html`
        <div className="flex items-start gap-2.5 py-1.5 first:pt-0 last:pb-0">
          <span className=${"font-mono text-[13px] leading-[1.4] mt-0.5 shrink-0 " + toneColor}>${glyph}</span>
          <p className="text-[13px] text-txt3 leading-relaxed">
            ${insight.parts.map((part, i) => part.strong
              ? html`<span key=${i} className="text-txt2 font-medium">${part.t}</span>`
              : html`<span key=${i}>${part.t}</span>`)}
            ${insight.post && safeLink(insight.post.link) && html` <${PostLink} p=${insight.post} />`}
          </p>
        </div>`;
    }

    function InsightsPanel({ D }) {
      const insights = useMemo(() => computeInsights(D), [D]);
      if (!insights.length) return null;
      return html`
        <section className="px-4 md:px-7 pb-5">
          <div className="rounded-xl bg-surface border border-line p-5">
            <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1">Lecturas del periodo</div>
            <div className="text-[10px] font-mono text-faint mb-3">Generadas automáticamente a partir del filtro actual</div>
            <div>
              ${insights.map(ins => html`<${InsightLine} key=${ins.id} insight=${ins} />`)}
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // KpiRow — strip de 6 cards
    // ============================================================
    function KpiCell({ label, value, sub, accent, onClick, delta, deltaLabel, exact, big }) {
      return html`
        <div onClick=${onClick} ...${kbd(onClick, `Ver de dónde sale ${label}`)}
             className=${"rounded-xl bg-surface border border-line px-4 py-4 min-w-0 relative group focus:outline-none focus-visible:ring-1 focus-visible:ring-accent2 " +
               (onClick ? "cursor-pointer hover:border-line2 transition-colors" : "")}
             title=${onClick ? `Ver de dónde sale ${label}` : undefined}>
          <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2 flex items-center justify-between">
            <span>${label}</span>
            ${onClick && html`<span className="opacity-0 group-hover:opacity-100 transition-opacity text-accent2 normal-case tracking-normal">trazar ↗</span>`}
          </div>
          <div className=${"font-medium tabular-nums break-all " + (accent ? "text-accent" : "text-txt")}
               title=${exact || undefined}
               style=${{ fontSize: big ? 'clamp(22px, 2vw, 30px)' : 'clamp(18px, 1.7vw, 24px)', lineHeight: 1.15, letterSpacing: '-0.01em' }}>${value}</div>
          ${delta !== undefined && html`
            <div className="flex items-center gap-1.5 mt-2 flex-wrap">
              <${DeltaPill} pct=${delta} />
              ${deltaLabel && html`<span className="text-[9px] font-mono text-faint">${deltaLabel}</span>`}
            </div>
          `}
          ${sub && html`<div className=${"text-[10px] text-txt4 font-mono break-all " + (delta !== undefined ? "mt-1.5" : "mt-2")}>${sub}</div>`}
        </div>`;
    }

    function KpiRow({ D, onTrace, rawPosts, filters, embedded }) {
      const g = D.global;
      const heroDeltas = useMemo(() => computeHeroDeltas(D, rawPosts, filters), [D, rawPosts, filters]);
      const dLabel = heroDeltas ? `vs S${heroDeltas.prevWeek}` : null;
      return html`
        <section className=${embedded ? '' : 'px-7 pb-5'}>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
            <${KpiCell} big label="Alcance"        exact=${fmtFull(g.reach)} value=${fmt(g.reach)}       sub=${`${fmt(g.impressions)} impresiones`} delta=${heroDeltas?.reach} deltaLabel=${dLabel} onClick=${onTrace ? () => onTrace('reach') : undefined} />
            <${KpiCell} big label="Interacciones"  exact=${fmtFull(g.inter)} value=${fmt(g.inter)}       sub=${`${fmt(g.reactions)} reacciones`} delta=${heroDeltas?.inter} deltaLabel=${dLabel} onClick=${onTrace ? () => onTrace('inter') : undefined} />
            <${KpiCell} big label="Reproducciones" exact=${fmtFull(g.views)} value=${fmt(g.views)}       sub="views totales" delta=${heroDeltas?.views} deltaLabel=${dLabel} onClick=${onTrace ? () => onTrace('views') : undefined} />
            <${KpiCell} big label="VTR"            value=${erFmt(g.vtr_avg)}  sub="ponderado por views" accent />
          </div>
          <div className="mt-3 rounded-xl bg-surface px-4 py-3 flex flex-wrap gap-x-8 gap-y-2 text-[13px]">
            ${[
              ['ER ponderado', erFmt(g.er_avg), heroDeltas?.er_avg, onTrace ? () => onTrace('er_avg') : null],
              ['ER básico', erFmt(g.basic_er_avg)],
              ['CTR', erFmt(g.ctr_avg)],
              ['Comentarios', fmt(g.comments), heroDeltas?.comments, onTrace ? () => onTrace('comments') : null],
              ['Compartidos', fmt(g.shares)],
              ['Posts', fmtFull(g.posts), heroDeltas?.posts],
            ].map(([l, v, dv, fn]) => html`
              <button key=${l} onClick=${fn || undefined} disabled=${!fn}
                      className=${"inline-flex items-baseline gap-2 text-left " + (fn ? "hover:text-accent cursor-pointer" : "cursor-default")}
                      title=${fn ? `Ver de dónde sale ${l}` : undefined}>
                <span className="text-txt3">${l}</span>
                <span className="text-txt font-medium tabular-nums">${v}</span>
                ${dv != null && html`<${DeltaPill} pct=${dv} />`}
              </button>`)}
          </div>
          <${PautaSplit} D=${D} />
        </section>`;
    }

    // ============================================================
    // v20 — PautaSplit: orgánico vs. pauta lado a lado. Mezclarlos en un
    // solo ER esconde el desempeño orgánico (la pauta trae mucho alcance
    // con ER bajo y arrastra el promedio hacia abajo).
    // ============================================================
    function PautaSplit({ D }) {
      const groups = useMemo(() => groupAgg(D.allPosts || [], p => p.strategy || 'Sin clasificar'), [D]);
      const totalReach = D.global?.reach || 0;
      const order = (k) => /org/i.test(k) ? 0 : /paid|pauta|pagad/i.test(k) ? 1 : /sin clasificar/i.test(k) ? 3 : 2;
      const entries = Object.entries(groups).sort((a, b) => order(a[0]) - order(b[0]) || b[1].reach - a[1].reach);
      if (entries.length < 2) return null;
      const labelOf = (k) => /^paid$/i.test(k) ? 'Pauta' : k;
      return html`
        <div className="mt-3 grid gap-3" style=${{ gridTemplateColumns: `repeat(auto-fit, minmax(220px, 1fr))` }}>
          ${entries.map(([k, s]) => {
            const share = totalReach > 0 ? (s.reach / totalReach) * 100 : 0;
            const muted = /sin clasificar/i.test(k);
            return html`
              <div key=${k} className=${"rounded-xl bg-surface border px-4 py-3.5 min-w-0 " + (muted ? "border-amber/40" : "border-line")}>
                <div className="flex items-center justify-between mb-2">
                  <span className=${"text-[9px] font-mono uppercase tracking-[0.18em] " + (muted ? "text-amber" : "text-txt4")}>${labelOf(k)}</span>
                  <span className="text-[10px] font-mono text-txt4">${s.posts} posts · ${share.toFixed(0)}% del alcance</span>
                </div>
                <div className="flex items-baseline justify-between gap-3">
                  <div className="min-w-0">
                    <div className="text-[18px] font-medium tabular-nums text-accent leading-tight">${erFmt(s.basic_er_avg)}</div>
                    <div className="text-[9px] font-mono uppercase tracking-wider text-txt4 mt-1">ER básico pond.</div>
                  </div>
                  <div className="text-right">
                    <div className="text-[14px] tabular-nums text-txt2 leading-tight">${erFmt(s.er_avg)}</div>
                    <div className="text-[9px] font-mono uppercase tracking-wider text-txt4 mt-1">ER views pond.</div>
                  </div>
                  <div className="text-right">
                    <div className="text-[14px] tabular-nums text-txt2 leading-tight">${fmt(s.reach)}</div>
                    <div className="text-[9px] font-mono uppercase tracking-wider text-txt4 mt-1">alcance</div>
                  </div>
                </div>
              </div>`;
          })}
        </div>`;
    }

    // ============================================================
    // Trazabilidad de KPI — clic en un número del strip de arriba y ver
    // exactamente qué posts lo componen y cómo se calculó. Dos tipos:
    // "sum" (participan todos los posts del filtro, aunque sumen 0) y
    // "avg" (solo participan los posts con dato registrado — se listan
    // los excluidos para que quede claro por qué el denominador no es
    // el total de posts).
    // ============================================================
    const KPI_TRACE_CONFIG = {
      reach:     { field: 'reach',        type: 'sum', label: 'Alcance',        formula: 'Suma del campo "Alcance" de cada post dentro del filtro actual.' },
      inter:     { field: 'interactions', type: 'sum', label: 'Interacciones',  formula: 'Suma del campo "Interacciones" de cada post dentro del filtro actual.' },
      views:     { field: 'views',        type: 'sum', label: 'Reproducciones', formula: 'Suma del campo "Reproducciones" de cada post dentro del filtro actual (aplica principalmente a video).' },
      comments:  { field: 'comments',     type: 'sum', label: 'Comentarios',    formula: 'Suma del campo "Comentarios" de cada post dentro del filtro actual.' },
      er_avg:    { field: 'er',           type: 'ratio', label: 'ER ponderado', formula: 'Σ Interacciones totales ÷ Σ Alcance de los posts del filtro. Cada post pesa según su alcance (misma fórmula que el Sheet, aplicada al conjunto). Se excluyen posts sin alcance y posts con valores imposibles (ER Básico > 100%).' },
    };

    function computeKpiTrace(D, key) {
      const cfg = KPI_TRACE_CONFIG[key];
      if (!cfg) return null;
      const posts = D.allPosts || [];

      if (cfg.type === 'sum') {
        const total = posts.reduce((s, p) => s + (p[cfg.field] || 0), 0);
        const top = [...posts].sort((a, b) => (b[cfg.field] || 0) - (a[cfg.field] || 0)).slice(0, 12);
        return { ...cfg, key, total, postsCount: posts.length, top };
      }

      if (cfg.type === 'ratio') {
        const included = posts.filter(p => p.reach > 0 && p.er != null && !(p._flags || []).includes('er'));
        const flagged = posts.filter(p => (p._flags || []).includes('er'));
        const num = included.reduce((s, p) => s + (p.interactions != null ? p.interactions : p.er * p.reach / 100), 0);
        const den = included.reduce((s, p) => s + p.reach, 0);
        const value = den ? (num / den) * 100 : 0;
        const nz = included.filter(p => p.er !== 0);
        const mean = nz.length ? nz.reduce((s, p) => s + p.er, 0) / nz.length : 0;
        const top = [...included].sort((a, b) => (b.reach || 0) - (a.reach || 0)).slice(0, 12);
        return {
          ...cfg, key, value, num, den, mean, flagged,
          includedCount: included.length,
          excludedCount: posts.length - included.length,
          postsCount: posts.length, top,
        };
      }

      // avg
      const withValue = posts.filter(p => p[cfg.field] != null && p[cfg.field] !== 0);
      const sum = withValue.reduce((s, p) => s + p[cfg.field], 0);
      const avg = withValue.length ? sum / withValue.length : 0;
      const top = [...withValue].sort((a, b) => b[cfg.field] - a[cfg.field]).slice(0, 12);
      return {
        ...cfg, key, avg, sum,
        includedCount: withValue.length,
        excludedCount: posts.length - withValue.length,
        postsCount: posts.length, top,
      };
    }

    // v27 — link a la publicación original (columna "Link" del Sheet).
    // Abre en pestaña nueva y no dispara el click de la fila.
    const safeLink = (l) => { const u = (l || '').trim(); return /^https?:\/\//i.test(u) ? u : null; };
    function PostLink({ p, compact = false }) {
      const url = safeLink(p && p.link);
      if (!url) return html`<span className="text-faint text-[11px]" title="Este post no tiene link en el Sheet">—</span>`;
      return html`
        <a href=${url} target="_blank" rel="noopener noreferrer"
           onClick=${(e) => e.stopPropagation()} onKeyDown=${(e) => e.stopPropagation()}
           aria-label=${`Abrir publicación de ${p.platform}${p.date ? ', ' + dateShort(p.date) : ''} en una pestaña nueva`}
           title="Abrir publicación"
           className="inline-flex items-center gap-1 rounded-full bg-accent2/10 hover:bg-accent2/20 text-txt2 hover:text-txt px-2 py-0.5 text-[11px] font-sans whitespace-nowrap transition-colors">
          ${compact ? '' : 'Ver'} <${ExtIcon} size=${11}/>
        </a>`;
    }

    function SheetRow({ p }) {
      const url = p && sheetRowUrl(p.platform, p._row);
      if (!url) return html`<span className="text-faint text-[11px]" title="No se pudo ubicar la fila">—</span>`;
      return html`
        <a href=${url} target="_blank" rel="noopener noreferrer"
           onClick=${(e) => e.stopPropagation()} onKeyDown=${(e) => e.stopPropagation()}
           title=${`Abrir el Sheet en ${SHEET_TABS[p.platform]}, fila ${p._row}`}
           aria-label=${`Abrir el Sheet en la pestaña ${p.platform}, fila ${p._row}`}
           className="inline-flex items-center gap-1 rounded-full bg-onSurface/[0.05] hover:bg-onSurface/[0.1] text-txt2 hover:text-txt px-2 py-0.5 text-[11px] font-mono whitespace-nowrap transition-colors">
          ${PLAT_LETTERS[p.platform]} · ${p._row}
        </a>`;
    }

    function TraceRow({ trace, p, onPick }) {
      const color = PLAT_COLORS[p.platform];
      const val = trace.field === 'er' ? erFmt(p[trace.field]) : fmt(p[trace.field]);
      return html`
        <tr onClick=${() => onPick(p)} ...${kbd(() => onPick(p), `Ver post de ${p.platform}, ${dateShort(p.date)}`)}
            className="border-b border-line/50 last:border-0 hover:bg-onSurface/[0.025] focus:outline-none focus-visible:bg-accent2/10 cursor-pointer transition-colors">
          <td className="py-2 px-3">
            <span className="font-mono text-[10px] font-semibold text-white px-1.5 py-0.5 rounded" style=${{ background: color }}>${PLAT_LETTERS[p.platform]}</span>
          </td>
          <td className="py-2 px-3 font-mono text-[11px] text-txt3">${dateShort(p.date)}</td>
          <td className="py-2 px-3 text-[12px] text-txt2 truncate max-w-[160px]" title=${p.campaign || ''}>${p.campaign || '—'}</td>
          <td className="py-2 px-3 text-right font-mono tabular-nums text-[12px] text-txt">${val}</td>
          <td className="py-2 pl-1 pr-3 text-right"><${PostLink} p=${p} compact /></td>
        </tr>`;
    }

    function KpiTraceDrawer({ trace, onClose, onPick }) {
      if (!trace) return null;
      const isSum = trace.type === 'sum';
      const isRatio = trace.type === 'ratio';
      return html`
        <div className="fixed inset-0 z-40 flex justify-end" style=${{ background: 'rgba(0,0,0,0.45)' }} onClick=${onClose}>
          <div role="dialog" aria-modal="true" aria-label=${`Trazabilidad de ${trace.label}`}
               className="w-full max-w-[540px] h-full bg-surface border-l border-line overflow-y-auto" onClick=${e => e.stopPropagation()}>
            <div className="sticky top-0 bg-surface border-b border-line px-6 py-4 flex items-center justify-between z-10">
              <div className="text-[13px] font-medium text-txt">Trazabilidad · ${trace.label}</div>
              <button onClick=${onClose} aria-label="Cerrar trazabilidad" autoFocus className="text-txt4 hover:text-txt transition-colors"><${XIcon} size=${18}/></button>
            </div>

            <div className="p-6 space-y-6">
              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Valor mostrado en el dashboard</div>
                <div className="font-medium text-txt tabular-nums" style=${{ fontSize: 'clamp(24px, 3vw, 34px)' }}>
                  ${isSum ? fmt(trace.total) : isRatio ? erFmt(trace.value) : erFmt(trace.avg)}
                </div>
              </div>

              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Fórmula</div>
                <p className="text-[13px] text-txt3 leading-relaxed">${trace.formula}</p>
              </div>

              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Alcance del cálculo</div>
                ${isSum ? html`
                  <p className="text-[13px] text-txt3 leading-relaxed">
                    Incluye los <span className="text-txt2 font-medium">${fmtFull(trace.postsCount)} posts</span> del filtro actual (aunque un post no tenga dato, cuenta como 0).
                  </p>
                ` : isRatio ? html`
                  <p className="text-[13px] text-txt3 leading-relaxed">
                    <span className="text-txt2 font-medium">${fmtFull(trace.includedCount)} de ${fmtFull(trace.postsCount)} posts</span> entran al cálculo
                    ${trace.excludedCount > 0 ? html` · <span className="text-amber">${fmtFull(trace.excludedCount)} excluido${trace.excludedCount === 1 ? '' : 's'}</span> (sin alcance, sin ER o con valor imposible)` : '.'}
                  </p>
                  <p className="text-[11px] font-mono text-faint mt-2">Σ interacciones ${fmtFull(Math.round(trace.num))} ÷ Σ alcance ${fmtFull(Math.round(trace.den))} = ${erFmt(trace.value)}</p>
                  <p className="text-[11px] font-mono text-faint mt-1">Referencia · promedio simple por post (método v19): ${erFmt(trace.mean)}</p>
                  ${trace.flagged.length > 0 && html`
                    <div className="mt-3 rounded-lg border border-amber/40 bg-amber/[0.06] px-3 py-2.5">
                      <div className="text-[11px] text-amber font-medium mb-1">${trace.flagged.length} post${trace.flagged.length === 1 ? '' : 's'} con ER Básico > 100% (revisar en el Sheet)</div>
                      ${trace.flagged.slice(0, 20).map((p, i) => html`
                        <div key=${i} onClick=${() => onPick(p)} ...${kbd(() => onPick(p), `Ver post de ${p.platform}, ${dateShort(p.date)}`)} className="text-[11px] font-mono text-txt3 cursor-pointer hover:text-txt py-0.5">
                          ${p.platform} · ${dateShort(p.date)} · ${p.format || '—'} · alcance ${fmtFull(p.reach || 0)} · ER Básico ${erFmt(p.basic_er)}
                        </div>`)}
                    </div>
                  `}
                ` : html`
                  <p className="text-[13px] text-txt3 leading-relaxed">
                    <span className="text-txt2 font-medium">${fmtFull(trace.includedCount)} de ${fmtFull(trace.postsCount)} posts</span> tienen ${trace.label.toLowerCase()} registrado y entran al promedio
                    ${trace.excludedCount > 0 ? html` · <span className="text-amber">${fmtFull(trace.excludedCount)} excluido${trace.excludedCount === 1 ? '' : 's'}</span> por no tener valor` : '.'}
                  </p>
                  <p className="text-[11px] font-mono text-faint mt-2">suma ${erFmt(trace.sum)} ÷ ${fmtFull(trace.includedCount)} posts = ${erFmt(trace.avg)}</p>
                `}
              </div>

              <div>
                <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-2">
                  ${isSum ? 'Principales contribuyentes' : isRatio ? 'Posts con más peso (mayor alcance)' : 'Valores más altos que entran al promedio'}
                </div>
                <div className="rounded-xl border border-line overflow-hidden">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="border-b border-line text-[9px] font-mono uppercase tracking-[0.15em] text-txt4 bg-onSurface/[0.02]">
                        <th className="text-left py-2 px-3 font-medium">Plat.</th>
                        <th className="text-left py-2 px-3 font-medium">Fecha</th>
                        <th className="text-left py-2 px-3 font-medium">Campaña</th>
                        <th className="text-right py-2 px-3 font-medium">${isRatio ? 'ER del post' : trace.label}</th>
                        <th className="text-right py-2 pl-1 pr-3 font-medium">Link</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${trace.top.map((p, i) => html`<${TraceRow} key=${i} trace=${trace} p=${p} onPick=${onPick} />`)}
                    </tbody>
                  </table>
                </div>
                <div className="text-[10px] font-mono text-faint mt-2">Click en una fila para ver el post completo · mostrando los ${trace.top.length} con mayor aporte.</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    // ============================================================
    // PlatformsGrid
    // ============================================================
    function PlatformCard({ name, stat, weekly, dailySeries, onClick, active }) {
      const color = PLAT_COLORS[name];
      // Si recibimos dailySeries, la usamos directo (modo single-week).
      // Si no, derivamos serie semanal a partir de `weekly`.
      const series = dailySeries
        ? dailySeries.map(d => ({ w: d.key, reach: d.reach }))
        : Object.keys(weekly || {}).sort((a,b) => +a - +b)
            .map(w => ({ w:+w, reach: weekly[w].reach }));

      return html`
        <div onClick=${onClick} ...${kbd(onClick, `Filtrar el dashboard a ${name}`)} aria-pressed=${!!active}
             title="Clic para filtrar el dashboard a ${name}"
             className=${"rounded-xl bg-surface border p-4 flex flex-col gap-3 transition-colors cursor-pointer " +
               (active ? "border-accent2 ring-1 ring-accent2/50 bg-accent2/[0.04]" : "border-line hover:border-line2")}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="font-mono text-[10px] font-semibold text-white px-1.5 py-0.5 rounded"
                    style=${{ background: color }}>${PLAT_LETTERS[name]}</span>
              <span className="text-[13px] text-txt">${name}</span>
              ${active && html`<span className="text-[9px] font-mono uppercase tracking-wider text-accent2 border border-accent2/40 rounded-full px-1.5 py-0.5">filtrado</span>`}
            </div>
            <span className="font-mono text-[10px] text-txt4">${stat.posts} posts</span>
          </div>
          <div className="flex items-baseline justify-between gap-3">
            <div className="min-w-0">
              <div className="font-medium text-txt tabular-nums leading-tight break-all" style=${{ fontSize: 'clamp(14px, 1.6vw, 20px)' }}>${fmt(stat.reach)}</div>
              <div className="text-[9px] font-mono uppercase tracking-wider text-txt4 mt-1.5">alcance</div>
            </div>
            <div className="text-right">
              <div className="text-[14px] tabular-nums" style=${{ color }}>${erFmt(stat.er_avg)}</div>
              <div className="text-[9px] font-mono uppercase tracking-wider text-txt4 mt-1.5">ER total</div>
              ${stat.basic_er_avg > 0 && html`
                <div className="text-[10px] font-mono text-txt3 mt-1.5 tabular-nums">Básico ${erFmt(stat.basic_er_avg)}</div>
              `}
            </div>
          </div>
          <div className="h-10 -mx-1">
            ${series.length > 1 ? html`
              <${ResponsiveContainer}>
                <${AreaChart} data=${series} margin=${{ top:2, right:0, left:0, bottom:0 }}>
                  <defs>
                    <linearGradient id=${`g-${name}`} x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor=${color} stopOpacity=${0.4} />
                      <stop offset="100%" stopColor=${color} stopOpacity=${0} />
                    </linearGradient>
                  </defs>
                  <${Area} type="monotone" dataKey="reach" stroke=${color} strokeWidth=${1.2} fill=${`url(#g-${name})`} />
                <//>
              <//>
            ` : html`<div className="h-full flex items-end"><div className="w-full h-px bg-line2"/></div>`}
          </div>
          <div className="grid grid-cols-3 gap-2 pt-2.5 border-t border-line text-[10px] font-mono">
            <div className="min-w-0"><div className="text-txt4">Inter.</div><div className="text-txt2 mt-0.5 break-all">${fmt(stat.inter)}</div></div>
            <div className="min-w-0"><div className="text-txt4">Views</div><div className="text-txt2 mt-0.5 break-all">${fmt(stat.views)}</div></div>
            <div><div className="text-txt4">VTR</div><div className="text-txt2 mt-0.5">${erFmt(stat.vtr_avg)}</div></div>
          </div>
        </div>`;
    }

    function PlatformsGrid({ D, filters, setFilters }) {
      const platforms = Object.keys(D.by_platform)
        .sort((a,b) => D.by_platform[b].reach - D.by_platform[a].reach);

      // Clic en una tarjeta = filtrar todo el dashboard a esa plataforma.
      // Clic de nuevo sobre la misma (única) plataforma activa = quitar el filtro.
      const handlePlatformClick = (name) => toggleSingleFilter(setFilters, 'platforms', name);

      // Single-week mode: calculamos serie diaria por plataforma
      // (mismos 7 días Dom→Sáb que TrendSection)
      const weeksInScope = D.meta?.weeks_in_scope || D.meta?.weeks || [];
      const isDailyMode = weeksInScope.length === 1;

      const dailyByPlatform = useMemo(() => {
        if (!isDailyMode) return null;
        const wk = weeksInScope[0];
        const sy = D.meta?.selected_year;
        const year = (typeof sy === 'number') ? sy : inferYear(D.allPosts);
        const days = weekDays(wk, year);

        const out = {};
        for (const plat of platforms) {
          const byKey = {};
          for (const d of days) byKey[isoDay(d)] = { key: isoDay(d), reach: 0 };
          for (const p of (D.allPosts || [])) {
            if (p.platform !== plat) continue;
            const dt = parseDate(p.date);
            if (!dt) continue;
            const key = isoDay(dt);
            if (byKey[key]) byKey[key].reach += p.reach || 0;
          }
          out[plat] = days.map(d => byKey[isoDay(d)]);
        }
        return out;
      }, [D, isDailyMode, weeksInScope, platforms.join(',')]);

      return html`
        <section id="sec-plataformas" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-plataformas" name="Plataformas" />
          <div className="flex items-baseline justify-between mb-4">
            <div>
              <h2 className="text-[18px] font-medium text-txt">Por plataforma</h2>
            </div>
            <div className="text-[11px] font-mono text-txt4">
              ${isDailyMode ? 'Tendencia diaria · ' : ''}Ordenadas por alcance
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2.5">
            ${platforms.map(p => html`
              <${PlatformCard}
                key=${p}
                name=${p}
                stat=${D.by_platform[p]}
                weekly=${dailyByPlatform ? null : D.by_plat_week[p]}
                dailySeries=${dailyByPlatform ? dailyByPlatform[p] : null}
                onClick=${() => handlePlatformClick(p)}
                active=${filters.platforms.length === 1 && filters.platforms[0] === p} />
            `)}
          </div>
        </section>`;
    }

    // ============================================================
    // TrendSection
    // ============================================================
    const TREND_METRICS = [
      { k:'reach',         l:'Alcance' },
      { k:'inter',         l:'Interacciones' },
      { k:'views',         l:'Reproducciones' },
      { k:'er_avg',        l:'ER total',    isPercent:true },
      { k:'basic_er_avg',  l:'ER básico',   isPercent:true },
    ];

    function TrendSection({ D, chartTheme }) {
      const ct = chartTheme || CHART_THEME.dark;
      const [metric, setMetric] = useState('reach');
      const isPercent = TREND_METRICS.find(m => m.k === metric)?.isPercent;

      // Single-week mode: si el filtro deja una sola semana en el rango,
      // cambia automáticamente a vista por día (Dom→Sáb de esa semana).
      const weeksInScope = D.meta?.weeks_in_scope || D.meta?.weeks || [];
      const isDailyMode = weeksInScope.length === 1;

      const series = useMemo(() => {
        if (isDailyMode) {
          const wk = weeksInScope[0];
          // Si el usuario filtró un año específico (no 'all'), úsalo;
          // si está en 'all', infiere del dominante en los posts en scope.
          const sy = D.meta?.selected_year;
          const year = (typeof sy === 'number') ? sy : inferYear(D.allPosts);
          const days = weekDays(wk, year);

          // Inicializa los 7 días con ceros (Dom→Sáb)
          const byKey = {};
          for (const d of days) {
            byKey[isoDay(d)] = {
              date: d, posts: 0, reach: 0, inter: 0, views: 0,
              r: rateAccum(),
            };
          }

          // Acumula posts cuya fecha cae dentro de esos 7 días.
          let outOfWindow = 0;
          for (const p of (D.allPosts || [])) {
            const dt = parseDate(p.date);
            if (!dt) { outOfWindow++; continue; }
            const key = isoDay(dt);
            const agg = byKey[key];
            if (!agg) { outOfWindow++; continue; }
            agg.posts++;
            agg.reach += p.reach || 0;
            agg.inter += p.interactions || 0;
            agg.views += p.views || 0;
            rateAdd(agg.r, p);
          }

          const out = days.map(d => {
            const agg = byKey[isoDay(d)];
            let value;
            if (metric === 'er_avg')             value = rateFinal(agg.r).er_avg;
            else if (metric === 'basic_er_avg')  value = rateFinal(agg.r).basic_er_avg;
            else if (metric === 'inter')         value = agg.inter;
            else                                 value = agg[metric];   // reach | views
            return { week: isoDay(d), label: dayLabel(d), value, posts: agg.posts };
          });
          out._outOfWindow = outOfWindow;
          return out;
        }

        // Vista semanal estándar
        return Object.keys(D.by_week).sort((a,b) => +a - +b).map(w => ({
          week: +w, label: 'S' + w,
          value: D.by_week[w][metric], posts: D.by_week[w].posts,
        }));
      }, [D, metric, isDailyMode]);

      // Rango fijo de la semana en daily mode (Dom→Sáb)
      const weekRangeLabel = useMemo(() => {
        if (!isDailyMode) return null;
        const wk = weeksInScope[0];
        const sy = D.meta?.selected_year;
        const year = (typeof sy === 'number') ? sy : inferYear(D.allPosts);
        const days = weekDays(wk, year);
        return `${dayLabel(days[0])} → ${dayLabel(days[6])}`;
      }, [isDailyMode, weeksInScope, D.allPosts, D.meta?.selected_year]);

      const outOfWindow = isDailyMode ? (series._outOfWindow || 0) : 0;

      const xTickInterval = isDailyMode
        ? 0   // mostrar todos los días
        : Math.max(0, Math.floor(series.length / 12));

      // Marcadores de lanzamiento de campaña: primera semana con posts de
      // cada campaña DENTRO del scope filtrado actual (no del histórico
      // completo), para que la anotación siempre sea coherente con lo que
      // se está viendo. Solo aplica en vista semanal (en vista diaria de
      // una sola semana no aporta). Si dos campañas arrancan la misma
      // semana, se muestra solo la de más volumen para no saturar el eje;
      // y si hay muchas campañas en el rango, se limita a las 10 más
      // grandes para que las etiquetas no se amontonen.
      const campaignLaunches = useMemo(() => {
        if (isDailyMode) return [];
        const byCampaign = {};
        for (const p of (D.allPosts || [])) {
          if (!p.campaign || p.week == null) continue;
          if (!byCampaign[p.campaign] || p.week < byCampaign[p.campaign].week) {
            byCampaign[p.campaign] = { week: p.week, count: 0 };
          }
        }
        for (const p of (D.allPosts || [])) {
          if (p.campaign && byCampaign[p.campaign]) byCampaign[p.campaign].count++;
        }
        let launches = Object.entries(byCampaign).map(([name, v]) => ({ name, week: v.week, count: v.count }));
        const byWeek = new Map();
        for (const l of [...launches].sort((a, b) => b.count - a.count)) {
          if (!byWeek.has(l.week)) byWeek.set(l.week, l);
        }
        launches = [...byWeek.values()];
        if (launches.length > 10) {
          launches = [...launches].sort((a, b) => b.count - a.count).slice(0, 10);
        }
        return launches.sort((a, b) => a.week - b.week);
      }, [D, isDailyMode]);

      return html`
        <section id="sec-tendencia" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-tendencia" name="Tendencia" />
          <div className="flex flex-wrap items-baseline justify-between gap-4 mb-4">
            <div>
              <h2 className="text-[18px] font-medium text-txt">${isDailyMode ? 'Evolución diaria' : 'Evolución semanal'}</h2>
              ${isDailyMode && weekRangeLabel && html`
                <div className="text-[10px] font-mono text-txt4 mt-1">Semana ${weeksInScope[0]} · ${weekRangeLabel}</div>
              `}
            </div>
            <div className="flex rounded-lg border border-line bg-onSurface/[0.02] overflow-hidden">
              ${TREND_METRICS.map((m, i) => html`
                <button key=${m.k} onClick=${() => setMetric(m.k)}
                  className=${"px-3 py-1.5 text-[11px] transition-colors " +
                    (i > 0 ? "border-l border-line " : "") +
                    (metric === m.k ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                  ${m.l}
                </button>
              `)}
            </div>
          </div>
          <div className="rounded-xl bg-surface border border-line p-5">
            <div className="h-72">
              <${ResponsiveContainer}>
                <${ComposedChart} data=${series} margin=${{ top:44, right:16, left:8, bottom:8 }}>
                  <${CartesianGrid} stroke=${ct.tooltipBorder} strokeDasharray="0" vertical=${false} />
                  <${XAxis} dataKey="label" stroke=${ct.axisStrong} fontSize=${11}
                            tickLine=${false} axisLine=${{ stroke: ct.tooltipBorder }}
                            interval=${xTickInterval} />
                  <${YAxis} yAxisId="left" stroke=${ct.axisStrong} fontSize=${11}
                            tickLine=${false} axisLine=${false}
                            tickFormatter=${isPercent ? (v) => v.toFixed(1) + '%' : fmt}
                            width=${48} />
                  <${YAxis} yAxisId="right" orientation="right" stroke=${ct.axis} fontSize=${11}
                            tickLine=${false} axisLine=${false} width=${32} />
                  <${Tooltip}
                    cursor=${{ fill: 'rgba(76,110,245,0.08)' }}
                    contentStyle=${{ background:ct.tooltipBg, border:`1px solid ${ct.tooltipBorder}`, borderRadius:6, padding:'8px 12px', fontSize:11, fontFamily: "'Bricolage Grotesque', system-ui, sans-serif", fontVariantNumeric: 'tabular-nums', color:ct.tooltipText }}
                    labelStyle=${{ color: ct.tooltipLabel }}
                    labelFormatter=${(label) => isDailyMode ? label : `Semana ${String(label).slice(1)}`}
                    formatter=${(v, name) => {
                      if (name === 'value') return [isPercent ? erFmt(v) : fmt(v), TREND_METRICS.find(m => m.k === metric)?.l];
                      return [v, 'Posts'];
                    }} />
                  <${Bar} yAxisId="right" dataKey="posts" fill=${ct.tooltipBorder} />
                  <${Line} yAxisId="left" type="monotone" dataKey="value"
                           stroke="#4C6EF5" strokeWidth=${2}
                           dot=${{ fill:'#4C6EF5', r:3, strokeWidth:0 }} activeDot=${{ r:5, fill:ct.tooltipBg, stroke:'#4C6EF5', strokeWidth:2 }} />
                  ${[...campaignLaunches].sort((a, b) => a.week - b.week).map((l, i) => html`
                    <${ReferenceLine} key=${l.name} yAxisId="left" x=${'S' + l.week}
                      stroke="#F0B358" strokeOpacity=${0.55} strokeDasharray="3 3"
                      label=${(props) => {
                        const vb = props.viewBox || {};
                        const row = i % 3;
                        const name = l.name.length > 14 ? l.name.slice(0, 13) + '…' : l.name;
                        return html`<text x=${vb.x} y=${(vb.y || 0) - 6 - row * 12} textAnchor="middle" fontSize=${9} fill="#F0B358"><title>${l.name} · S${l.week}</title>${name}</text>`;
                      }} />
                  `)}
                <//>
              <//>
            </div>
            <div className="flex gap-5 mt-3 pt-3 border-t border-line text-[10px] font-mono text-txt4">
              <div className="flex items-center gap-2"><span className="w-3 h-0.5 bg-accent"></span><span>${TREND_METRICS.find(m => m.k === metric)?.l}</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-2 bg-white/10 rounded-sm"></span><span>Volumen de posts</span></div>
              ${campaignLaunches.length > 0 && html`
                <div className="flex items-center gap-2"><span className="w-3 h-0.5 border-t border-dashed" style=${{ borderColor: '#F0B358' }}></span><span>Lanzamiento de campaña</span></div>
              `}
              ${isDailyMode && outOfWindow > 0 && html`
                <div className="text-amber" title="Posts marcados como esta semana pero con fecha fuera del rango Dom→Sáb">
                  ⚠ ${outOfWindow} post${outOfWindow === 1 ? '' : 's'} con fecha fuera de la semana
                </div>
              `}
              ${isDailyMode && html`<div className="ml-auto text-accent/60">vista diaria automática</div>`}
            </div>
          </div>
        </section>`;
    }

    // ============================================================
    // MixSection
    // ============================================================
    function MixSection({ D, filters, setFilters }) {
      const strats = Object.entries(D.by_strategy)
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.posts - a.posts);
      const fmts = Object.entries(D.by_format)
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.reach - a.reach);
      const stagesArr = Object.entries(D.by_stage || {})
        .map(([k,v]) => ({ name:k, ...v }))
        .sort((a,b) => b.reach - a.reach);
      const totalPosts = D.global.posts;
      const max = fmts[0]?.reach || 1;
      const maxStage = stagesArr[0]?.reach || 1;

      return html`
        <section id="sec-mezcla" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-mezcla" name="Mezcla" />
          <div className="flex items-baseline justify-between mb-5">
            <div>
              <h2 className="text-[18px] font-medium text-txt">Mezcla</h2>
            </div>
            <div className="text-[11px] font-mono text-txt4">Estrategia · formato · etapa</div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <div className="rounded-xl bg-surface border border-line p-5">
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-4">Pautado vs Orgánico</div>
              ${strats.length === 0 && html`<div className="text-faint text-sm">Sin datos de estrategia.</div>`}
              <div className="space-y-4">
                ${strats.slice(0, 4).map(s => {
                  const isPaid = (s.name||'').toLowerCase().includes('pauta') || (s.name||'').toLowerCase().includes('paid');
                  const color = isPaid ? '#F0B358' : '#4C6EF5';
                  const pctPosts = totalPosts ? Math.round(s.posts/totalPosts*100) : 0;
                  const isActiveRow = filters?.strategies?.length === 1 && filters.strategies[0] === s.name;
                  return html`
                    <div key=${s.name}
                         onClick=${() => toggleSingleFilter(setFilters, 'strategies', s.name)}
                         title="Clic para filtrar por esta estrategia"
                         className=${"cursor-pointer rounded-lg -mx-2 px-2 py-1 transition-colors " + (isActiveRow ? "bg-accent2/10 ring-1 ring-accent2/40" : "hover:bg-onSurface/[0.03]")}>
                      <div className="flex items-baseline justify-between mb-1.5">
                        <div className="flex items-baseline gap-3">
                          <span className="text-[15px] text-txt font-medium">${s.name || '—'}</span>
                          <span className="text-[11px] font-mono text-txt4">${pctPosts}% de posts</span>
                        </div>
                        <div className="font-mono tabular-nums text-[14px] text-txt">${fmt(s.reach)}</div>
                      </div>
                      <div className="h-1 bg-onSurface/[0.06] rounded"><div className="h-full rounded" style=${{ width: pctPosts + '%', background: color }}/></div>
                      <div className="flex justify-between mt-1.5 text-[10px] font-mono text-txt4">
                        <span>${s.posts} posts · ER ${erFmt(s.er_avg)} · básico ${erFmt(s.basic_er_avg)}</span>
                        <span>${fmt(s.inter)} interacciones</span>
                      </div>
                    </div>`;
                })}
              </div>
            </div>
            <div className="rounded-xl bg-surface border border-line p-5">
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-4">Por formato (alcance)</div>
              <div className="grid grid-cols-12 items-baseline gap-3 mb-2 pb-2 border-b border-line/40">
                <div className="col-span-3 text-[9px] font-mono uppercase tracking-wider text-faint">Formato</div>
                <div className="col-span-5"></div>
                <div className="col-span-2 text-right text-[9px] font-mono uppercase tracking-wider text-faint">Alcance</div>
                <div className="col-span-1 text-right text-[9px] font-mono uppercase tracking-wider text-faint">ER</div>
                <div className="col-span-1 text-right text-[9px] font-mono uppercase tracking-wider text-faint">Bás.</div>
              </div>
              <div className="space-y-2.5">
                ${fmts.slice(0, 8).map(f => {
                  const w = (f.reach / max) * 100;
                  const isActiveRow = filters?.formats?.length === 1 && filters.formats[0] === f.name;
                  return html`
                    <div key=${f.name}
                         onClick=${() => toggleSingleFilter(setFilters, 'formats', f.name)}
                         title="Clic para filtrar por este formato"
                         className=${"grid grid-cols-12 items-baseline gap-3 cursor-pointer rounded-lg -mx-2 px-2 py-1 transition-colors " + (isActiveRow ? "bg-accent2/10 ring-1 ring-accent2/40" : "hover:bg-onSurface/[0.03]")}>
                      <div className="col-span-3 text-[13px] text-txt2 truncate" title=${f.name}>${f.name}</div>
                      <div className="col-span-5 h-px bg-onSurface/[0.06] relative">
                        <div className="absolute left-0 top-1/2 -translate-y-1/2 h-1.5 rounded-sm bg-accent"
                             style=${{ width: w + '%' }}/>
                      </div>
                      <div className="col-span-2 text-right font-mono text-[11px] text-txt">${fmt(f.reach)}</div>
                      <div className="col-span-1 text-right font-mono text-[11px] text-txt4 tabular-nums" title="ER total">${erFmt(f.er_avg)}</div>
                      <div className="col-span-1 text-right font-mono text-[11px] text-txt4 tabular-nums" title="ER básico">${erFmt(f.basic_er_avg)}</div>
                    </div>`;
                })}
              </div>
            </div>
          </div>

          <div className="rounded-xl bg-surface border border-line p-5 mt-3">
            <div className="flex items-baseline justify-between mb-4">
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4">Por etapa</div>
              ${D.meta?.orphans_no_stage > 0 && html`
                <div className="text-[10px] font-mono text-amber" title="Posts sin valor en la columna Etapa — no aparecen en este desglose">
                  ${D.meta.orphans_no_stage} ${D.meta.orphans_no_stage === 1 ? 'post' : 'posts'} sin etapa (no incluidos)
                </div>
              `}
            </div>
            ${stagesArr.length === 0 && html`<div className="text-faint text-sm">Sin datos de etapa. Revisa que la columna "Etapa" tenga valores en tu Sheet.</div>`}
            <div className="grid grid-cols-12 items-baseline gap-3 mb-2 pb-2 border-b border-line/40">
              <div className="col-span-3 text-[9px] font-mono uppercase tracking-wider text-faint">Etapa</div>
              <div className="col-span-5"></div>
              <div className="col-span-2 text-right text-[9px] font-mono uppercase tracking-wider text-faint">Alcance</div>
              <div className="col-span-1 text-right text-[9px] font-mono uppercase tracking-wider text-faint">ER</div>
              <div className="col-span-1 text-right text-[9px] font-mono uppercase tracking-wider text-faint">Posts</div>
            </div>
            <div className="space-y-2.5">
              ${stagesArr.map(s => {
                const w = (s.reach / maxStage) * 100;
                const isActiveRow = filters?.stages?.length === 1 && filters.stages[0] === s.name;
                return html`
                  <div key=${s.name}
                       onClick=${() => toggleSingleFilter(setFilters, 'stages', s.name)}

    // ============================================================

          return [...filtered]

    // ============================================================
    // VtrSection — VTR general, por plataforma, por duración + top videos
    // ============================================================
    function computeVtrStats(posts) {
      // Un post es "video" si tiene VTR registrado y no es Story.
      // (Stories no se cuentan en VTR — definido en la base de datos.)
      const videos = posts.filter(p =>
        p.vtr != null &&
        p.format !== 'Stories'
      );

      // v20: VTR ponderado por views — cada video pesa según sus
      // reproducciones (antes: promedio simple, cada video pesaba igual).
      // Si ningún video del bucket tiene views, cae al promedio simple.
      function aggBucket(list) {
        if (!list.length) return { n: 0, vtr: null, views: 0, duration_avg: null };
        const sumVtrW = list.reduce((a, p) => a + (p.views > 0 ? (p.vtr || 0) * p.views : 0), 0);
        const sumViews = list.reduce((a, p) => a + (p.views || 0), 0);
        const sumVtr = list.reduce((a, p) => a + (p.vtr || 0), 0);
        const sumDur = list.reduce((a, p) => a + (p.duration || 0), 0);
        const nWithDur = list.filter(p => p.duration > 0).length;
        return {
          n: list.length,
          vtr: sumViews > 0 ? sumVtrW / sumViews : sumVtr / list.length,
          views: sumViews,
          duration_avg: nWithDur > 0 ? sumDur / nWithDur : null,
        };
      }

      const general = aggBucket(videos);

      const byPlatform = {};
      const platOrder = ['Facebook','Instagram','YouTube','TikTok','X','LinkedIn','Threads'];
      for (const plat of platOrder) {
        const platVideos = videos.filter(p => p.platform === plat);
        if (platVideos.length > 0) byPlatform[plat] = aggBucket(platVideos);
      }

      const short = videos.filter(p => p.duration != null && p.duration <= 30);
      const long  = videos.filter(p => p.duration != null && p.duration  > 30);
      const byDuration = {
        short: { ...aggBucket(short), label: '≤ 30 segundos' },
        long:  { ...aggBucket(long),  label: '> 30 segundos' },
      };

      // Top 10 videos por VTR — filtramos los que tienen pocas views para
      // evitar que dominen videos con VTR alto pero base mínima.
      // Umbral: top 25% en views.
      const viewsSorted = videos.map(v => v.views || 0).sort((a, b) => b - a);
      const viewsThreshold = viewsSorted[Math.floor(viewsSorted.length * 0.25)] || 0;
      const topVideos = videos
        .filter(p => (p.views || 0) >= Math.max(viewsThreshold, 1000))
        .sort((a, b) => (b.vtr || 0) - (a.vtr || 0))
        .slice(0, 10);

      return { general, byPlatform, byDuration, topVideos, totalVideos: videos.length };
    }

    // ============================================================
    // AveragesSection — promedios por publicación (alcance/inter/views)
    // ============================================================

    function AveragesSection({ D }) {
      const g = D.global;

      // Por plataforma — ordenado por alcance/post por defecto
      const platforms = Object.entries(D.by_platform || {})
        .map(([name, v]) => ({ name, ...v }));

      // Por formato — toma los formatos con al menos algún post
      const formats = Object.entries(D.by_format || {})
        .map(([name, v]) => ({ name, ...v }))
        .filter(f => f.posts > 0);

      return html`
        <section id="sec-promedios" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-promedios" name="Promedios" />
          <div className="flex items-baseline justify-between mb-5">
            <div>
              <h2 className="text-[18px] font-medium text-txt">Promedios por publicación</h2>
              <p className="text-txt4 text-[12px] mt-1">Total dividido entre número de posts. Ordenable por columna.</p>
            </div>
            <div className="text-[11px] font-mono text-txt4">${g.posts} posts en el filtro</div>
          </div>

          <!-- KPI row de promedios globales -->
          <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5 mb-3">
            <div className="rounded-xl bg-surface border border-line px-5 py-4 min-w-0">
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Alcance promedio</div>
              <div className="font-medium text-txt tabular-nums leading-tight break-all" style=${{ fontSize: 'clamp(16px, 1.8vw, 24px)' }}>${fmt(g.reach_per_post)}</div>

            <div className="rounded-xl bg-surface border border-line px-5 py-4 min-w-0">
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Interacciones promedio</div>
              <div className="font-medium text-txt tabular-nums leading-tight break-all" style=${{ fontSize: 'clamp(16px, 1.8vw, 24px)' }}>${fmt(g.inter_per_post)}</div>
              <div className="text-[10px] font-mono text-faint mt-2">por publicación</div>
            </div>
            <div className="rounded-xl bg-surface border border-line px-5 py-4 min-w-0">
              <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Reproducciones promedio</div>
              <div className="font-medium text-txt tabular-nums leading-tight break-all" style=${{ fontSize: 'clamp(16px, 1.8vw, 24px)' }}>${fmt(g.views_per_post)}</div>
              <div className="text-[10px] font-mono text-faint mt-2">por publicación</div>

          <!-- Tablas: por plataforma + por formato -->
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <${AveragesTable}
              title="Por plataforma"

              getLabel=${(e) => PLAT_LETTERS[e.name]}
            />

              entries=${formats}
            />

        </section>`;
    }

    // ============================================================
    // ComparativasSection — Week-over-Week
    // ============================================================
    function deltaPct(curr, prev) {
      if (prev == null || prev === 0) return null;
      return ((curr - prev) / prev) * 100;
    }

    function DeltaPill({ pct, invert }) {
      // invert=true para métricas donde "menos es mejor" (no aplicable aquí, pero por si acaso)
      if (pct == null || !isFinite(pct)) {
        return html`<span className="text-[11px] font-mono text-faint">—</span>`;
      }
      const isUp = pct > 0;
      const isNeutral = Math.abs(pct) < 0.5;
      const good = invert ? !isUp : isUp;
      const color = isNeutral ? 'text-txt4' : good ? 'text-success' : 'text-amber';
      const arrow = isNeutral ? '·' : isUp ? '↑' : '↓';
      const sign = pct > 0 ? '+' : '';
      return html`
        <span className=${"text-[11px] font-mono tabular-nums " + color}>
          ${arrow} ${sign}${pct.toFixed(1)}%
        </span>`;
    }

    function CompareKpiCard({ label, curr, prev, isPercent }) {
      const pct = deltaPct(curr, prev);
      const fmtVal = isPercent ? erFmt : fmt;
      return html`
        <div className="rounded-xl bg-surface border border-line px-5 py-4 min-w-0">
          <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">${label}</div>
          <div className="font-medium text-txt tabular-nums leading-tight break-all" style=${{ fontSize: 'clamp(16px, 1.8vw, 24px)' }}>${fmtVal(curr)}</div>
          <div className="flex items-baseline gap-2 mt-2 flex-wrap">
            <${DeltaPill} pct=${pct} />
            <span className="text-[10px] font-mono text-faint break-all">vs ${fmtVal(prev)}</span>
          </div>
        </div>`;
    }

    // Calcula un agregado simple desde una lista de posts (sin pasar por aggAdd)
    function quickAgg(posts) {
      let reach=0, inter=0, views=0, comments=0;
      const r = rateAccum();
      for (const p of posts) {
        reach += p.reach || 0;
        inter += p.interactions || 0;
        views += p.views || 0;
        comments += p.comments || 0;
        rateAdd(r, p);
      }
      const n = posts.length;
      const rates = rateFinal(r);
      return {
        posts: n,
        reach, inter, views, comments,
        er_avg: rates.er_avg,
        basic_er_avg: rates.basic_er_avg,
        vtr_avg: rates.vtr_avg,
        reach_per_post: n ? reach / n : 0,
        inter_per_post: n ? inter / n : 0,
        views_per_post: n ? views / n : 0,
      };
    }

    // ============================================================
    // computeHeroDeltas — deltas semana actual vs. semana anterior para
    // pintar badges de tendencia en el strip de KPIs del hero. Solo
    // aplica cuando el filtro de Semana tiene exactamente una semana
    // seleccionada (si no, no hay una "semana actual" inequívoca que
    // comparar, así que no se muestra ningún badge). Compara esa semana
    // contra la anterior, ignorando el filtro de semana pero respetando
    // el resto de filtros activos — igual que el modo Week-over-Week de
    // Comparativas.
    // ============================================================
    function computeHeroDeltas(D, rawPosts, filters) {
      const selWeeks = filters?.weeks;
      const isSingleWeek = selWeeks && selWeeks.length === 1;
      if (!isSingleWeek) return null;

      const currentWeek = selWeeks[0];
      const prevWeek = currentWeek - 1;
      const filtersNoWeek = { ...filters, weeks: [] };
      const scoped = applyFilters(rawPosts || [], filtersNoWeek);
      const currentPosts = scoped.filter(p => p.week === currentWeek);
      const prevPosts = scoped.filter(p => p.week === prevWeek);

      if (!prevPosts || prevPosts.length === 0) return null;

      const curr = quickAgg(currentPosts);
      const prev = quickAgg(prevPosts);
      return {
        currentWeek, prevWeek,
        reach:    deltaPct(curr.reach, prev.reach),
        inter:    deltaPct(curr.inter, prev.inter),
        views:    deltaPct(curr.views, prev.views),
        er_avg:   deltaPct(curr.er_avg, prev.er_avg),
        comments: deltaPct(curr.comments, prev.comments),
        posts:    deltaPct(curr.posts, prev.posts),
      };
    }

    function ComparativasSection({ D, rawPosts, filters, chartTheme }) {
      const ct = chartTheme || CHART_THEME.dark;
      const [mode, setMode] = useState('wow'); // 'wow' | 'entities'

      // ============================================================
      // Modo 1 · Week-over-Week (semana actual vs. semana anterior)
      // ============================================================
      const selWeeks = filters?.weeks;
      const isSingleWeek = selWeeks && selWeeks.length === 1;
      const currentWeek = isSingleWeek ? selWeeks[0] : null;
      const prevWeek = currentWeek != null ? currentWeek - 1 : null;

      // Para comparar manzanas con manzanas, aplicamos TODOS los demás filtros
      // (año, plataformas, campañas, tipo contenido, pauta) pero ignoramos el de semana
      const compareData = useMemo(() => {
        if (!isSingleWeek || prevWeek == null || prevWeek < 1) return null;
        const filtersNoWeek = { ...filters, weeks: [] };
        const scopedPosts = applyFilters(rawPosts || [], filtersNoWeek);
        const currentPosts = scopedPosts.filter(p => p.week === currentWeek);
        const prevPosts = scopedPosts.filter(p => p.week === prevWeek);

        if (prevPosts.length === 0) return { noPrev: true, currentWeek, prevWeek };

        // Por plataforma
        const platforms = [...new Set([...currentPosts, ...prevPosts].map(p => p.platform))].sort();
        const byPlatform = platforms.map(plat => ({
          name: plat,
          curr: quickAgg(currentPosts.filter(p => p.platform === plat)),
          prev: quickAgg(prevPosts.filter(p => p.platform === plat)),
        }));

        // Por formato
        const formats = [...new Set([...currentPosts, ...prevPosts]
          .map(p => p.format).filter(Boolean))].sort();
        const byFormat = formats.map(fmt => ({
          name: fmt,
          curr: quickAgg(currentPosts.filter(p => p.format === fmt)),
          prev: quickAgg(prevPosts.filter(p => p.format === fmt)),
        }));

        return {
          currentWeek, prevWeek,
          curr: quickAgg(currentPosts),
          prev: quickAgg(prevPosts),
          byPlatform, byFormat,
          currentPostsCount: currentPosts.length,
          prevPostsCount: prevPosts.length,
        };
      }, [rawPosts, filters, isSingleWeek, currentWeek, prevWeek]);

      // ============================================================
      // Modo 2 · Entidad vs. entidad (campaña, subcampaña, etapa,
      // pauta o tipo de contenido — una contra otra dentro del mismo
      // campo). Se alinean por "semana relativa" (S1, S2, S3... desde
      // el primer post de cada lado) para poder comparar el ritmo aunque
      // hayan vivido en semanas distintas del calendario.
      // ============================================================
      const [dim, setDim] = useState('campaigns');
      const [entA, setEntA] = useState(null);
      const [entB, setEntB] = useState(null);

      // Al cambiar de dimensión la selección anterior ya no aplica
      useEffect(() => { setEntA(null); setEntB(null); }, [dim]);

      const dimField = FACET_FIELD_MAP[dim];
      const dimLabel = COMPARE_DIMENSIONS.find(d => d.key === dim)?.label || dim;

      // Universo base: todos los filtros activos MENOS la dimensión
      // que se está comparando (así Lado A / Lado B pueden tomar
      // cualquier valor de esa dimensión, no solo lo ya filtrado arriba)
      const entityPool = useMemo(() => {
        return applyFilters(rawPosts || [], { ...filters, [dim]: [] });
      }, [rawPosts, filters, dim]);

      const entityOptions = useMemo(() => {
        const set = new Set();
        for (const p of entityPool) {
          const v = p[dimField];
          if (v != null && v !== '') set.add(v);
        }
        return [...set].sort();
      }, [entityPool, dimField]);

      const entityCompare = useMemo(() => {
        if (!entA || !entB) return null;
        const postsA = entityPool.filter(p => p[dimField] === entA);
        const postsB = entityPool.filter(p => p[dimField] === entB);
        if (postsA.length === 0 || postsB.length === 0) return { empty: true };

        const seriesFor = (posts) => {
          const byWeek = {};
          for (const p of posts) {
            if (p.week == null) continue;
            (byWeek[p.week] = byWeek[p.week] || []).push(p);
          }
          return Object.keys(byWeek).map(Number).sort((a, b) => a - b)
            .map((w, i) => ({ relIndex: i + 1, week: w, ...quickAgg(byWeek[w]) }));
        };
        const seriesA = seriesFor(postsA);
        const seriesB = seriesFor(postsB);
        const maxLen = Math.max(seriesA.length, seriesB.length);
        const trend = Array.from({ length: maxLen }, (_, i) => ({
          relIndex: i + 1,
          reachA: seriesA[i] ? seriesA[i].reach : null,
          reachB: seriesB[i] ? seriesB[i].reach : null,
        }));

        const platforms = [...new Set([...postsA, ...postsB].map(p => p.platform))].sort();
        const byPlatform = platforms.map(plat => ({
          name: plat,
          curr: quickAgg(postsA.filter(p => p.platform === plat)),
          prev: quickAgg(postsB.filter(p => p.platform === plat)),
        }));

        return {
          curr: quickAgg(postsA), prev: quickAgg(postsB),
          trend, byPlatform,
          weeksA: seriesA.length, weeksB: seriesB.length,
          postsA: postsA.length, postsB: postsB.length,
        };
      }, [entA, entB, entityPool, dimField]);

      const ModeHeader = html`
        <div className="flex flex-wrap items-baseline justify-between gap-4 mb-5">
          <div>
            <h2 className="text-[18px] font-medium text-txt">Comparativas</h2>
            <p className="text-txt4 text-[12px] mt-1">
              ${mode === 'wow' ? 'Compara una semana contra la anterior.' : `Compara dos ${dimLabel.toLowerCase()}s, semana relativa a semana relativa.`}
            </p>
          </div>
          <div className="flex rounded-lg border border-line bg-onSurface/[0.02] overflow-hidden shrink-0">
            <button onClick=${() => setMode('wow')}
              className=${"px-3 py-1.5 text-[11px] transition-colors " + (mode === 'wow' ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
              Semana vs. anterior
            </button>
            <button onClick=${() => setMode('entities')}
              className=${"px-3 py-1.5 text-[11px] border-l border-line transition-colors " + (mode === 'entities' ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
              Comparar entidades
            </button>
          </div>
        </div>`;

      // ---------------- Render: Modo WoW ----------------
      if (mode === 'wow') {
        if (!isSingleWeek) {
          return html`
            <section id="sec-comparativas" className="px-4 md:px-7 py-7 relative group">
              <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
              ${ModeHeader}
              <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
                <div className="text-txt3 text-[13px] mb-1">Filtra exactamente una semana en la barra superior</div>
                <div className="text-faint text-[11px] font-mono">para activar la comparativa Week-over-Week</div>
              </div>
            </section>`;
        }

        if (!compareData || compareData.noPrev) {
          return html`
            <section id="sec-comparativas" className="px-4 md:px-7 py-7 relative group">
              <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
              ${ModeHeader}
              <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
                <div className="text-txt3 text-[13px] mb-1">No hay datos en S${prevWeek} para comparar</div>
                <div className="text-faint text-[11px] font-mono">Prueba con una semana posterior o limpia los demás filtros</div>
              </div>
            </section>`;
        }

        const c = compareData;
        return html`
          <section id="sec-comparativas" className="px-4 md:px-7 py-7 relative group">
            <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
            ${ModeHeader}
            <div className="text-[11px] font-mono text-txt4 -mt-3 mb-4">
              S${c.currentWeek} (${c.currentPostsCount} posts) vs S${c.prevWeek} (${c.prevPostsCount} posts)
            </div>

            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 mb-3">
              <${CompareKpiCard} label="Alcance"        curr=${c.curr.reach}        prev=${c.prev.reach}        />
              <${CompareKpiCard} label="Interacciones"  curr=${c.curr.inter}        prev=${c.prev.inter}        />
              <${CompareKpiCard} label="Reproducciones" curr=${c.curr.views}        prev=${c.prev.views}        />
              <${CompareKpiCard} label="Posts"          curr=${c.curr.posts}        prev=${c.prev.posts}        />
              <${CompareKpiCard} label="ER total"       curr=${c.curr.er_avg}       prev=${c.prev.er_avg}       isPercent />
              <${CompareKpiCard} label="ER básico"      curr=${c.curr.basic_er_avg} prev=${c.prev.basic_er_avg} isPercent />
              <${CompareKpiCard} label="VTR"            curr=${c.curr.vtr_avg}      prev=${c.prev.vtr_avg}      isPercent />
              <${CompareKpiCard} label="Alcance/post"   curr=${c.curr.reach_per_post} prev=${c.prev.reach_per_post} />
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
              <${CompareTable}
                title="Por plataforma"
                rows=${c.byPlatform}
                rightLabel=${`S${c.currentWeek} → S${c.prevWeek}`}
                showBadge=${true}
              />
              <${CompareTable}
                title="Por formato"
                rows=${c.byFormat}
                rightLabel=${`S${c.currentWeek} → S${c.prevWeek}`}
                showBadge=${false}
              />
            </div>
          </section>`;
      }

      // ---------------- Render: Modo Entidad vs. entidad ----------------
      const e = entityCompare;
      return html`
        <section id="sec-comparativas" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-comparativas" name="Comparativas" />
          ${ModeHeader}

          <div className="flex flex-wrap gap-1.5 mb-4">
            ${COMPARE_DIMENSIONS.map(d => html`
              <button key=${d.key} onClick=${() => setDim(d.key)}
                className=${"px-2.5 py-1 rounded-full text-[11px] border transition-colors " +
                  (dim === d.key ? "border-accent2/40 bg-accent2/12 text-txt" : "border-line text-txt3 hover:text-txt2 hover:border-line2")}>
                ${d.label}
              </button>`)}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
            <div>
              <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Lado A</div>
              <select value=${entA || ''} onChange=${ev => setEntA(ev.target.value || null)}
                className="w-full px-3 py-2 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50">
                <option value="">Elige ${dimLabel.toLowerCase()}...</option>
                ${entityOptions.map(o => html`<option key=${o} value=${o} disabled=${o === entB}>${o}</option>`)}
              </select>
            </div>
            <div>
              <div className="text-[9px] font-mono uppercase tracking-[0.18em] text-txt4 mb-1.5">Lado B</div>
              <select value=${entB || ''} onChange=${ev => setEntB(ev.target.value || null)}
                className="w-full px-3 py-2 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50">
                <option value="">Elige ${dimLabel.toLowerCase()}...</option>
                ${entityOptions.map(o => html`<option key=${o} value=${o} disabled=${o === entA}>${o}</option>`)}
              </select>
            </div>
          </div>

          ${(!entA || !entB) && html`
            <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
              <div className="text-txt3 text-[13px] mb-1">Elige ${dimLabel.toLowerCase()} para Lado A y otra distinta para Lado B</div>
              <div className="text-faint text-[11px] font-mono">Las opciones respetan los demás filtros activos arriba</div>
            </div>
          `}

          ${entA && entB && e?.empty && html`
