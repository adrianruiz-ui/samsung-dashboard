    // en el dashboard, y lo manda a un Apps Script que arma una hoja
    // nueva en un Google Sheets maestro.
    // ============================================================
    function ExportModal({ open, onClose, D, filters }) {
      const [mode, setMode] = useState('summary'); // 'summary' | 'raw'
      const [groupBy, setGroupBy] = useState('platform');
      const [selectedMetrics, setSelectedMetrics] = useState(DEFAULT_REPORT_METRICS);
      const [selectedColumns, setSelectedColumns] = useState(DEFAULT_RAW_COLUMNS);
      const [title, setTitle] = useState('');
      const [titleTouched, setTitleTouched] = useState(false);
      const [status, setStatus] = useState('idle'); // idle | loading | success | error
      const [errorMsg, setErrorMsg] = useState(null);

      const dimLabel = REPORT_DIMENSIONS.find((d) => d.key === groupBy)?.label || groupBy;

      // Si cambian los parámetros del reporte, borra un resultado/error
      // viejo para que no se quede pegado un "listo" que ya no aplica.
      useEffect(() => {
        setStatus('idle'); setErrorMsg(null);
      }, [mode, groupBy, selectedMetrics, selectedColumns]);

      // Sugiere un título automáticamente mientras el usuario no lo edite.
      useEffect(() => {
        if (!titleTouched) setTitle(suggestedReportTitle(filters, mode, dimLabel));
      }, [filters, mode, dimLabel, titleTouched]);

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [open, onClose]);

      if (!open) return null;

      const toggleMetric = (key) => {
        setSelectedMetrics((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]);
      };
      const toggleColumn = (key) => {
        setSelectedColumns((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]);
      };

      const postsInScope = D.global.posts;

      const handleGenerate = () => {
        setStatus('loading'); setErrorMsg(null);
        try {
          let headers, rows;
          if (mode === 'summary') {
            const metrics = REPORT_METRICS.filter((m) => selectedMetrics.includes(m.key));
            if (metrics.length === 0) throw new Error('Elige al menos una métrica.');
            headers = [dimLabel, ...metrics.map((m) => m.label)];
            const groupedRows = groupedReportRows(D, groupBy);
            rows = groupedRows.map(({ label, agg }) => [label, ...metrics.map((m) => m.fmt(agg[m.key] ?? 0))]);
          } else {
            const cols = RAW_COLUMNS.filter((c) => selectedColumns.includes(c.key));
            if (cols.length === 0) throw new Error('Elige al menos una columna.');
            headers = cols.map((c) => c.label);
            rows = (D.allPosts || []).map((p) => cols.map((c) => c.get(p)));
          }
          if (rows.length === 0) throw new Error('No hay datos para los filtros/selección actuales.');
          if (typeof XLSX === 'undefined') throw new Error('No se pudo cargar la librería de Excel (revisa tu conexión y recarga la página).');

          // Arma el workbook 100% en el navegador — no sale ningún dato
          // a ningún servidor externo.
          const wb = XLSX.utils.book_new();
          const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
          ws['!cols'] = headers.map((h, i) => {
            const maxLen = Math.max(
              String(h ?? '').length,
              ...rows.map((r) => String(r[i] ?? '').length)
            );
            return { wch: Math.min(Math.max(maxLen + 2, 10), 40) };
          });
          XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetTabName(title || 'Reporte'));
          XLSX.writeFile(wb, `${sanitizeFileName(title || 'Reporte')}.xlsx`);

          setStatus('success');
        } catch (err) {
          setErrorMsg(String(err.message || err));
          setStatus('error');
        }
      };

      return html`
        <${Fragment}>
          <div className="fixed inset-0 z-40 fade-in" style=${{ background: 'rgba(0,0,0,0.6)' }} onClick=${onClose}/>
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick=${onClose}>
            <div className="w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-2xl bg-surface border border-line2 fade-in"
                 style=${{ boxShadow: '0 20px 60px rgba(0,0,0,0.5)' }}
                 onClick=${(e) => e.stopPropagation()}>

              <div className="flex items-center justify-between px-5 py-4 border-b border-line sticky top-0 bg-surface z-10">
                <div className="flex items-center gap-2.5">
                  <${SheetIcon} size=${16} className="text-accent"/>
                  <span className="text-[14px] text-txt font-medium">Exportar reporte</span>
                </div>
                <button onClick=${onClose}
                        className="w-7 h-7 rounded-md hover:bg-onSurface/[0.06] flex items-center justify-center text-txt3 hover:text-txt transition-colors">
                  <${XIcon} size=${15}/>
                </button>
              </div>

              <div className="px-5 py-5">
                <div className="text-[11px] text-txt3 leading-relaxed mb-4">
                  Usa los filtros que ya tienes activos arriba
                  (<span className="text-txt2 font-medium">${fmtFull(postsInScope)} posts</span> en el rango actual)
                  y elige qué descargar en un Excel (.xlsx) — se abre directo en Excel o se importa a Google Sheets con "Archivo → Importar".
                </div>

                <div className="flex rounded-lg border border-line overflow-hidden mb-4">
                  <button onClick=${() => setMode('summary')}
                          className=${"flex-1 px-3 py-2 text-[12px] transition-colors " +
                            (mode === 'summary' ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                    Resumen agrupado
                  </button>
                  <button onClick=${() => setMode('raw')}
                          className=${"flex-1 px-3 py-2 text-[12px] border-l border-line transition-colors " +
                            (mode === 'raw' ? "bg-accent2/15 text-txt" : "text-txt3 hover:text-txt hover:bg-onSurface/[0.03]")}>
                    Posts individuales
                  </button>
                </div>

                ${mode === 'summary' ? html`
                  <div className="mb-4">
                    <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Agrupar por</div>
                    <div className="flex flex-wrap gap-1.5">
                      ${REPORT_DIMENSIONS.map((d) => html`
                        <button key=${d.key} onClick=${() => setGroupBy(d.key)}
                                className=${"px-2.5 py-1 rounded-full border text-[11px] transition-colors " +
                                  (groupBy === d.key ? "border-accent2/40 bg-accent2/12 text-txt" : "border-line text-txt3 hover:text-txt2 hover:border-line2")}>
                          ${d.label}
                        </button>`)}
                    </div>
                  </div>

                  <div className="mb-5">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-txt4">Métricas</div>
                      <div className="flex gap-2 text-[10px] font-mono uppercase tracking-wider">
                        <button onClick=${() => setSelectedMetrics(REPORT_METRICS.map((m) => m.key))} className="text-txt4 hover:text-txt">Todas</button>
                        <button onClick=${() => setSelectedMetrics([])} className="text-txt4 hover:text-txt">Limpiar</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 max-h-[180px] overflow-y-auto pr-1">
                      ${REPORT_METRICS.map((m) => {
                        const isOn = selectedMetrics.includes(m.key);
                        return html`
                          <button key=${m.key} onClick=${() => toggleMetric(m.key)}
                                  className="flex items-center gap-2 text-left text-[11px] px-2 py-1.5 rounded-md hover:bg-onSurface/[0.04] transition-colors">
                            <span className=${"w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 " +
                              (isOn ? "bg-accent border-accent" : "border-line2 bg-onSurface/[0.03]")}>
                              ${isOn && html`<${CheckIcon} size=${9} className="text-ink"/>`}
                            </span>
                            <span className="text-txt2 truncate" title=${m.label}>${m.label}</span>
                          </button>`;
                      })}
                    </div>
                  </div>
                ` : html`
                  <div className="mb-5">
                    <div className="flex items-center justify-between mb-2">
                      <div className="text-[10px] font-mono uppercase tracking-wider text-txt4">Columnas</div>
                      <div className="flex gap-2 text-[10px] font-mono uppercase tracking-wider">
                        <button onClick=${() => setSelectedColumns(RAW_COLUMNS.map((c) => c.key))} className="text-txt4 hover:text-txt">Todas</button>
                        <button onClick=${() => setSelectedColumns([])} className="text-txt4 hover:text-txt">Limpiar</button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-1.5 max-h-[220px] overflow-y-auto pr-1">
                      ${RAW_COLUMNS.map((c) => {
                        const isOn = selectedColumns.includes(c.key);
                        return html`
                          <button key=${c.key} onClick=${() => toggleColumn(c.key)}
                                  className="flex items-center gap-2 text-left text-[11px] px-2 py-1.5 rounded-md hover:bg-onSurface/[0.04] transition-colors">
                            <span className=${"w-3.5 h-3.5 rounded border flex items-center justify-center shrink-0 " +
                              (isOn ? "bg-accent border-accent" : "border-line2 bg-onSurface/[0.03]")}>
                              ${isOn && html`<${CheckIcon} size=${9} className="text-ink"/>`}
                            </span>
                            <span className="text-txt2 truncate" title=${c.label}>${c.label}</span>
                          </button>`;
                      })}
                    </div>
                  </div>
                `}

                <div className="mb-5">
                  <div className="text-[10px] font-mono uppercase tracking-wider text-txt4 mb-2">Título de la hoja</div>
                  <input type="text" value=${title}
                         onChange=${(e) => { setTitle(e.target.value); setTitleTouched(true); }}
                         className="w-full px-3 py-2 rounded-lg border border-line bg-onSurface/[0.02] text-[12px] text-txt focus:outline-none focus:border-accent2/50"/>
                </div>

                ${status === 'error' && html`
                  <div className="mb-4 rounded-lg bg-amber/10 border border-amber/30 px-3 py-2 text-[11px] text-amber leading-relaxed">
                    ${errorMsg}
                  </div>
                `}

                ${status === 'success' && html`
                  <div className="mb-4 rounded-lg bg-success/10 border border-success/30 px-3 py-3 text-[12px] text-txt2 leading-relaxed">
                    <div className="flex items-center gap-2 text-success">
                      <${CheckIcon} size=${13}/>
                      <span className="font-medium">Excel descargado</span>
                    </div>
                    <div className="text-txt3 mt-1">Revisa tu carpeta de Descargas — el archivo ya está listo para abrir o subir a Google Sheets.</div>
                  </div>
                `}

                <button onClick=${handleGenerate} disabled=${status === 'loading'}
                        className="w-full inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-accent text-ink text-sm font-medium hover:bg-accent2 hover:text-white transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
                  ${status === 'loading'
                    ? html`<${SpinnerIcon} size=${14}/> Generando…`
                    : html`<${DownloadIcon} size=${14}/> Descargar Excel`}
                </button>
              </div>
            </div>
          </div>
        <//>`;
    }

    // ============================================================
    // App principal
    // ============================================================
    function App() {
      const { data, loading, refreshing, error, errors, fetchedAt, refresh, autoRefreshMin } = useDashboardData();
      const [selected, setSelected] = useState(null);
      const [exportOpen, setExportOpen] = useState(false);
      const [kpiTrace, setKpiTrace] = useState(null);
      const allPosts = data?.allPosts || [];
      const { filters, setFilters, clear, isActive } = useFilters(allPosts);
      const { theme, toggleTheme, chart: chartTheme } = useTheme();

      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('smx-sidebar-collapsed') === '1'; } catch { return false; }
      });
      const toggleSidebar = useCallback(() => {
        setSidebarCollapsed(prev => {
          const next = !prev;
          try { localStorage.setItem('smx-sidebar-collapsed', next ? '1' : '0'); } catch {}
          return next;
        });
      }, []);

      // baseMeta y filteredData se recalculan SOLO cuando cambian
      // los datos crudos o los filtros — nunca durante un re-render normal.
      const baseMeta = data?.meta || null;
      // allPosts ya se calculó arriba, antes de useFilters (lo necesita
      // para poder recortar selecciones que dejan de tener sentido).

      const filteredData = useMemo(() => {
        if (!data || !baseMeta) return null;
        const filtered = applyFilters(allPosts, filters);
        const result = computeAggregates(filtered, baseMeta);
        // Expone el año seleccionado en meta para que TrendSection/PlatformsGrid
        // sepan qué año usar al calcular los 7 días de la semana en modo diario.
        result.meta.selected_year = filters.year;
        return result;
      }, [data, allPosts, baseMeta, filters]);

      // OJO: este hook tiene que vivir ANTES de los early-return de abajo
      // (loading/error) — un useMemo colocado después de un return
      // condicional rompe las Rules of Hooks (a veces se ejecuta, a veces
      // no) y React tira el error #310.
      const anomalyCount = useMemo(() => {
        if (!filteredData || filteredData.global.posts === 0) return 0;
        return computeAnomalies(filteredData).length;
      }, [filteredData]);

      if (loading) return html`<${LoadingState}/>`;
      if (error)   return html`<${ErrorState} message=${error} onRetry=${refresh}/>`;
      if (!data || !filteredData) return html`<${ErrorState} message="Sin datos disponibles." onRetry=${refresh}/>`;

      const D = filteredData;
      const noResults = D.global.posts === 0;

      return html`
        <div className="min-h-screen bg-ink text-txt flex">
          <${Sidebar}
            collapsed=${sidebarCollapsed}
            onToggle=${toggleSidebar}
            liveAlcance=${D.global.reach}
            livePosts=${D.global.posts}
            fetchedAt=${fetchedAt}
            autoRefreshMin=${autoRefreshMin}
            theme=${theme}
            onToggleTheme=${toggleTheme}
            onOpenExport=${() => setExportOpen(true)}
          />

          <div className="flex-1 min-w-0 flex flex-col">
            <${FilterBar}
              baseMeta=${baseMeta}
              filters=${filters}
              setFilters=${setFilters}
              clear=${clear}
              isActive=${isActive}
              postsInScope=${D.global.posts}
              totalPosts=${baseMeta.total_posts}
              allPosts=${allPosts}
            />

            <${TopBar} fetchedAt=${fetchedAt} onRefresh=${refresh} refreshing=${refreshing} autoRefreshMin=${autoRefreshMin} allPosts=${allPosts} onPick=${setSelected}/>

            ${errors && errors.length > 0 && html`
              <div className="px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Aviso</span> · No se pudo cargar
                  ${errors.length === 1 ? ' ' + errors[0].platform : ` ${errors.length} pestañas`}.
                  Las demás se muestran con normalidad.
                </div>
              </div>
            `}

            ${baseMeta.orphans_no_week > 0 && filters.weeks.length > 0 && html`
              <div className="px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Nota</span> ·
                  Hay ${baseMeta.orphans_no_week} ${baseMeta.orphans_no_week === 1 ? 'post' : 'posts'} sin semana asignada en tu Sheet
                  (${Object.entries(baseMeta.orphans_no_week_by_platform).map(([p,n]) => `${p}: ${n}`).join(', ')})
                  — se excluyen del filtro actual de semana.
                </div>
              </div>
            `}

            ${baseMeta.orphans_no_stage > 0 && filters.stages.length > 0 && html`
              <div className="px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Nota</span> ·
                  Hay ${baseMeta.orphans_no_stage} ${baseMeta.orphans_no_stage === 1 ? 'post' : 'posts'} sin etapa asignada en tu Sheet
                  (${Object.entries(baseMeta.orphans_no_stage_by_platform).map(([p,n]) => `${p}: ${n}`).join(', ')})
                  — se excluyen del filtro actual de etapa.
                </div>
              </div>
            `}

            ${!noResults && anomalyCount > 0 && html`
              <div className="px-7 mb-3">
                <button onClick=${() => document.getElementById('sec-anomalias')?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
                        className="w-full text-left rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber hover:bg-amber/15 transition-colors flex items-center gap-2">
                  <${AlertIcon} size=${13}/>
                  <span><span className="font-mono uppercase tracking-wider">${anomalyCount} anomalía${anomalyCount === 1 ? '' : 's'} detectada${anomalyCount === 1 ? '' : 's'}</span> en el filtro actual — clic para ver el detalle</span>
                </button>
              </div>
            `}

            ${noResults ? html`
              <div className="px-7 py-32 text-center">
                <div className="font-mono text-[11px] uppercase tracking-[0.2em] text-amber mb-4">Sin resultados</div>
                <h2 className="text-3xl text-txt mb-3 font-medium">No hay posts que cumplan los filtros.</h2>
                <p className="text-txt3 text-sm mb-6">Prueba ampliando el rango de semanas o quitando alguna selección.</p>
                <button onClick=${clear}
                        className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-accent text-ink text-sm font-medium hover:bg-accent2 hover:text-white transition-colors">
                  Limpiar filtros
                </button>
              </div>
            ` : html`
              <main>
                <${HeroSection}    D=${D} chartTheme=${chartTheme}/>
                <${InsightsPanel}  D=${D}/>
                <${KpiRow}         D=${D} onTrace=${(key) => setKpiTrace(computeKpiTrace(D, key))} rawPosts=${allPosts} filters=${filters}/>
                <${PlatformsGrid}  D=${D} filters=${filters} setFilters=${setFilters}/>
                <${TrendSection}   D=${D} chartTheme=${chartTheme}/>
                <${MixSection}     D=${D} filters=${filters} setFilters=${setFilters}/>
                <${TopPostsTable}  D=${D} onPick=${setSelected} filters=${filters}/>
                <${VtrSection}         D=${D}/>
                <${AveragesSection}    D=${D}/>
                <${ComparativasSection} D=${D} rawPosts=${allPosts} filters=${filters} chartTheme=${chartTheme}/>
                <${CatalogSection}     D=${D} filters=${filters} setFilters=${setFilters}/>
                <${AnomaliesSection}   D=${D} onPick=${setSelected}/>
                <${CadenceSection}     D=${D}/>
                <${SimuladorSection}   allPosts=${allPosts}/>
              </main>
            `}

            <${DiagnosticPanel} />

            <${Footer} fetchedAt=${fetchedAt} totalPosts=${baseMeta.total_posts}/>
          </div>

          ${selected && html`<${DetailDrawer} post=${selected} onClose=${() => setSelected(null)}/>`}
          ${kpiTrace && html`<${KpiTraceDrawer} trace=${kpiTrace} onClose=${() => setKpiTrace(null)} onPick=${(p) => { setKpiTrace(null); setSelected(p); }}/>`}
          <${ExportModal} open=${exportOpen} onClose=${() => setExportOpen(false)} D=${D} filters=${filters}/>
        </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
</html>
