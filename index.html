    // ============================================================
    // v21 — CALIDAD DE DATOS (sobre el filtro actual)
    // ============================================================
    function hasMetrics(p) {
      return (p.reach > 0) || (p.impressions > 0) || (p.interactions > 0) || (p.views > 0);
    }
    // ============================================================
    // v41 — ERRORES DE CAPTURA: links duplicados y campos mal llenados.
    // Se revisa contra TODA la base (no solo el filtro) para encontrar el
    // duplicado aunque esté en otra semana o pestaña.
    // ============================================================
    const LINK_ID_PARAMS = ['v', 'fbid', 'story_fbid', 'id', 'p'];
    function normLinkKey(l) {
      const s = (l || '').trim();
      const m = s.match(/^https?:\/\/(?:www\.|m\.|mobile\.)?([^?#\s]+)(\?[^#\s]*)?/i);
      if (!m) return null;
      if (/imgur\.com|\.(png|jpe?g|webp|gif)$/i.test(m[1])) return null;     // referencias de imagen (Stories)
      let key = m[1].replace(/\/+$/, '').toLowerCase();
      if (m[2]) {
        const q = new URLSearchParams(m[2]);
        const keep = LINK_ID_PARAMS.filter(k => q.get(k)).map(k => `${k}=${q.get(k)}`);
        if (keep.length) key += '?' + keep.join('&');
      }
      return key;
    }
    const PLAT_DOMAIN = { Facebook: /facebook\.com|fb\.watch|fb\.com/i, Instagram: /instagram\.com/i, YouTube: /youtube\.com|youtu\.be/i,
                          TikTok: /tiktok\.com/i, X: /(?:^|\/\/|\.)(x|twitter)\.com/i, LinkedIn: /linkedin\.com|lnkd\.in/i, Threads: /threads\.(net|com)/i };
    const PLAT_FORMATS = {
      Facebook: ['Video', 'Foto', 'Stories', 'Reels', 'Carrusel', 'Live', 'Texto'],
      Instagram: ['Reels', 'Foto', 'Stories', 'Carrusel', 'Live'],
      YouTube: ['Video', 'Short', 'Live'],
      TikTok: ['Video', 'Foto', 'Carrusel', 'Live'],
      X: ['Foto', 'Video', 'Carrusel', 'Texto', 'Live'],
      LinkedIn: ['Video', 'Texto', 'Live', 'Foto', 'Carrusel'],
      Threads: ['Foto', 'Carrusel', 'Texto', 'Video'],
    };
    const CATALOG = { strategy: ['Orgánico', 'Paid'], content_type: ['Global', 'Local', 'Regional'] };
    const MES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const foldTxt = (v) => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
    const where = (p) => `${p.platform}${p._row ? ' fila ' + p._row : ''}`;

    function computeCaptureChecks(all) {
      const out = new Map();   // post → [tags]
      const add = (p, t) => { if (!out.has(p)) out.set(p, []); const a = out.get(p); if (!a.includes(t)) a.push(t); };
      // 1) Links duplicados
      const byLink = new Map();
      for (const p of all) { const k = normLinkKey(p.link); if (!k) continue; if (!byLink.has(k)) byLink.set(k, []); byLink.get(k).push(p); }
      for (const list of byLink.values()) {
        if (list.length < 2) continue;
        for (const p of list) {
          const others = list.filter(o => o !== p);
          const mixed = others.some(o => isPaidP(o) !== isPaidP(p));
          add(p, `${mixed ? 'Mismo link en orgánico y pauta' : 'Link duplicado'} (también en ${others.slice(0, 2).map(where).join(', ')}${others.length > 2 ? '…' : ''})`);
        }
      }
      // 2) Escritura inconsistente (mayúsculas, acentos, espacios)
      const FIELDS = [['campaign', 'Campaña'], ['subcampaign', 'Subcampaña'], ['product', 'Producto'], ['stage', 'Etapa'], ['format', 'Formato'], ['content_type', 'Tipo Contenido'], ['strategy', 'Tipo Pauta']];
      for (const [f, label] of FIELDS) {
        const g = new Map();
        for (const p of all) { const v = p[f]; if (v == null || String(v).trim() === '') continue; const k = foldTxt(v); if (!g.has(k)) g.set(k, new Map()); const m = g.get(k); m.set(v, (m.get(v) || 0) + 1); }
        const winner = new Map();
        for (const [k, m] of g) if (m.size > 1) winner.set(k, [...m.entries()].sort((a, b) => b[1] - a[1])[0][0]);
        for (const p of all) {
          const v = p[f]; if (v == null) continue;
          const w = winner.get(foldTxt(v));
          if (w && v !== w) add(p, String(v).trim() === String(w).trim()
            ? `${label} con espacios de más: "${String(v).trim()}"`
            : `${label} escrito distinto: "${v}" (la mayoría usa "${w}")`);
        }
      }
      // 2a) Clasificación creativa: Tendencia / Stay & Play escritos distinto
      //     (el laboratorio de TikTok agrupa por este texto)
      for (const p of all) {
        for (const [f, label] of [['campaign', 'Campaña'], ['subcampaign', 'Subcampaña']]) {
          const v = String(p[f] || ''); if (!v.trim()) continue;
          const fv = foldTxt(v);
          if (RX_STAY.test(fv) && !v.includes('Stay & Play')) add(p, `Clasificación: ${label} "${v.trim()}" escrito distinto (usar "Stay & Play")`);
          else if (RX_TEND.test(fv) && !/(^|[^A-Za-zÁ-ú])Tendencia([^A-Za-zÁ-ú]|$)/.test(v)) add(p, `Clasificación: ${label} "${v.trim()}" escrito distinto (usar "Tendencia")`);
          else if (/\btrend/.test(fv) && !RX_TEND.test(fv)) add(p, `Clasificación: ${label} "${v.trim()}" ¿es Tendencia? (si lo es, escribe "Tendencia" para que entre al análisis)`);
        }
      }
      // 2b) Nombres de influencer casi iguales ("Paty Meza" / "Patty Meza")
      {
        const lev = (a, b) => {
          if (Math.abs(a.length - b.length) > 1) return 2;
          const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
          for (let j = 1; j <= b.length; j++) d[0][j] = j;
          for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
            d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          return d[a.length][b.length];
        };
        const cnt = new Map();
        for (const p of all) { const n = String(p.influencer_name || '').trim(); if (n) cnt.set(n, (cnt.get(n) || 0) + 1); }
        const names = [...cnt.keys()];
        const alias = new Map();
        for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
          const a = names[i], b = names[j], fa = foldTxt(a).replace(/\s/g, ''), fb = foldTxt(b).replace(/\s/g, '');
          if (fa.length >= 4 && fa !== fb && lev(fa, fb) === 1) {
            const [minor, major] = cnt.get(a) <= cnt.get(b) ? [a, b] : [b, a];
            alias.set(minor, major);
          }
        }
        for (const p of all) { const n = String(p.influencer_name || '').trim(); if (alias.has(n)) add(p, `Nombre de influencer parecido a otro: "${n}" (¿es "${alias.get(n)}"?)`); }
      }
      for (const p of all) {
        // 3) Link mal capturado
        const l = (p.link || '').trim();
        if (l) {
          const img = /imgur\.com|\.(png|jpe?g|webp|gif)(\?|$)/i.test(l);
          if (!/^https?:\/\//i.test(l) || /\s/.test(l) || (l.match(/https?:\/\//gi) || []).length > 1) add(p, 'Link mal capturado (espacios, texto extra o dos links pegados)');
          else if (!img && PLAT_DOMAIN[p.platform] && !PLAT_DOMAIN[p.platform].test(l)) add(p, `Link de otra plataforma en la pestaña ${p.platform}`);
        }
        // 4) Fecha, semana, mes y año
        if (p.date) {
          const d = parseDate(p.date);
          if (!d || isNaN(d)) add(p, `Fecha inválida ("${p.date}")`);
          else {
            if (p.year != null && +p.year !== d.getFullYear()) add(p, `Año no coincide con la fecha (${p.year} vs ${d.getFullYear()})`);
            if (p.month && foldTxt(p.month) !== MES_ES[d.getMonth()]) add(p, `Mes no coincide con la fecha (${p.month} vs ${MES_ES[d.getMonth()][0].toUpperCase() + MES_ES[d.getMonth()].slice(1)})`);
            if (d >= PRESS_WEEK1 && p.week != null) {
              const wk = Math.floor((d - PRESS_WEEK1) / 864e5 / 7) + 1;
              if (+p.week !== wk) add(p, `Semana no coincide con la fecha (S${p.week} vs S${wk})`);
            }
          }
        }
        // 5) Valores fuera de catálogo
        if (p.format && PLAT_FORMATS[p.platform] && !PLAT_FORMATS[p.platform].some(x => foldTxt(x) === foldTxt(p.format))) add(p, `Formato "${p.format}" no corresponde a ${p.platform}`);
        for (const [f, allowed] of Object.entries(CATALOG)) {
          if (p[f] && !allowed.some(x => foldTxt(x) === foldTxt(p[f]))) add(p, `${f === 'strategy' ? 'Tipo Pauta' : 'Tipo Contenido'} fuera de catálogo: "${p[f]}"`);
        }
        // 6) Números incoherentes
        if (p.basic_interactions != null && p.interactions != null && p.interactions < p.basic_interactions) add(p, 'Inter. Totales menor que Inter. Básicas');
        // 7) v68 — Campos que alimentan KPIs y análisis
        if (!p.product || !String(p.product).trim()) add(p, 'Sin Producto');
        if (askYes(p.is_influencer) && !String(p.influencer_name || '').trim()) add(p, '¿Influencer? = Sí pero sin Nombre Influencer');
      }
      // 8) v68 — Videos sin VTR o sin duración (el KPI de VTR 0–30 s los necesita).
      //    Solo en plataformas donde la mayoría de los videos sí trae el dato.
      {
        const VID = ['Reels', 'Video', 'Short', 'Live'];
        const byPlat = new Map();
        for (const p of all) if (VID.includes(p.format) && p.views > 0) { if (!byPlat.has(p.platform)) byPlat.set(p.platform, []); byPlat.get(p.platform).push(p); }
        for (const [pl, vids] of byPlat) {
          const hasV = vids.filter(p => p.vtr > 0).length / vids.length, hasD = vids.filter(p => p.duration > 0).length / vids.length;
          for (const p of vids) {
            if (hasV >= 0.6 && !(p.vtr > 0)) add(p, 'Video sin VTR (la mayoría de los videos de ' + pl + ' sí lo tiene)');
            if (hasD >= 0.6 && !(p.duration > 0)) add(p, 'Video sin Duración (seg)');
          }
        }
      }
      return out;
    }

    function computeDataQuality(posts, allForChecks) {
      const capture = computeCaptureChecks(allForChecks && allForChecks.length ? allForChecks : posts);
      const issues = [];
      const byWeek = new Map();
      const counts = { sinMetricas: 0, sinPauta: 0, sinClasif: 0, imposibles: 0, conMiniatura: 0, captura: 0, duplicados: 0, campos: 0 };
      for (const p of posts) {
        const tags = [];
        if (!hasMetrics(p)) { tags.push('Sin métricas'); counts.sinMetricas++; }
        if (!p.strategy) { tags.push('Sin Tipo Pauta'); counts.sinPauta++; }
        if (!p.format || !p.content_type) { tags.push(!p.format && !p.content_type ? 'Sin Formato ni Tipo Contenido' : !p.format ? 'Sin Formato' : 'Sin Tipo Contenido'); counts.sinClasif++; }
        if ((p._flags || []).length) { tags.push('Valor imposible (' + (p._flags.includes('er') ? 'ER Básico > 100%' : 'CTR > 100%') + ')'); counts.imposibles++; }
        const cap = capture.get(p);
        if (cap && cap.length) {
          tags.push(...cap); counts.captura++;
          if (cap.some(t => /^(Link duplicado|Mismo link)/.test(t))) counts.duplicados++;
          if (cap.some(t => !/^(Link duplicado|Mismo link)/.test(t))) counts.campos++;
        }
        if (tags.length) issues.push({ post: p, tags });
        if (p.week != null) {
          const k = (postYear(p) || '') + '-' + p.week;
          if (!byWeek.has(k)) byWeek.set(k, { year: postYear(p), week: p.week, total: 0, pending: 0 });
          const w = byWeek.get(k); w.total++; if (!hasMetrics(p)) w.pending++;
        }
      }
      const weeks = [...byWeek.values()].sort((a, b) => (b.year - a.year) || (b.week - a.week)).slice(0, 8);
      const ts = (p) => { const d = parseDate(p.date); return d ? d.getTime() : 0; };
      issues.sort((a, b) => ts(b.post) - ts(a.post));
      return { counts, weeks, issues, total: posts.length };
    }

    function QualityStat({ label, value, hint, warn }) {
      return html`
        <div className="min-w-0">
          <div className="text-[13px] text-txt3">${label}</div>
          <div className=${"text-[26px] font-medium tabular-nums leading-none mt-2 " + (warn ? 'text-amber' : 'text-txt4')}>${value}</div>
          <div className="text-[12px] text-txt4 mt-2 leading-snug">${hint}</div>
        </div>`;
    }

    function DataQualitySection({ D, onPick, rawPosts, onRefresh, refreshing, fetchedAt }) {
      const q = useMemo(() => computeDataQuality(D.allPosts || [], rawPosts), [D, rawPosts]);
      const [limit, setLimit] = useState(15);
      const [kind, setKind] = useState('all');
      const c = q.counts;
      const KINDS = [
        ['all', 'Todo', () => true],
        ['dup', 'Links duplicados', (t) => /^(Link duplicado|Mismo link)/.test(t)],
        ['campos', 'Campos mal llenados', (t) => !/^(Link duplicado|Mismo link|Sin |Valor imposible)/.test(t)],
        ['metricas', 'Sin métricas', (t) => t === 'Sin métricas'],
        ['clasif', 'Sin clasificar', (t) => /^Sin (Tipo|Formato)/.test(t)],
        ['tyc', 'Tendencia / Stay & Play', (t) => /^Clasificación:/.test(t)],
        ['video', 'Videos sin VTR o duración', (t) => /^Video sin/.test(t)],
        ['imposibles', 'Valores imposibles', (t) => /^Valor imposible/.test(t)],
      ];
      const kf = (KINDS.find(k => k[0] === kind) || KINDS[0])[2];
      const shown = kind === 'all' ? q.issues : q.issues.filter(i => i.tags.some(kf));
      return html`
        <section id="sec-calidad" className="px-4 md:px-7 py-7 relative group" aria-labelledby="h-calidad">
          <div className="mb-4 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 id="h-calidad" className="text-[18px] font-medium text-txt">Calidad de datos</h2>
              <p className="text-txt4 text-[12px] mt-1">Qué hay que completar o corregir en el Sheet antes de reportar. Respeta los filtros activos (${fmtFull(q.total)} posts).</p>
            </div>
            ${onRefresh && html`
              <div className="flex items-center gap-3">
                <span className="text-[12px] text-txt4">${refreshing ? 'Leyendo el Sheet…' : fetchedAt ? `Actualizado ${timeAgo(fetchedAt)}` : ''}</span>
                <button onClick=${() => onRefresh()} disabled=${refreshing}
                        title="Vuelve a leer el Sheet para ver si ya se corrigieron los pendientes"
                        className="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg bg-accent2/10 hover:bg-accent2/20 text-txt text-[12px] font-medium disabled:opacity-60 transition-colors">
                  <${RefreshIcon} size=${14} className=${refreshing ? 'animate-spin' : ''} /> ${refreshing ? 'Actualizando…' : 'Actualizar datos'}
                </button>
              </div>`}
          </div>

    // ============================================================
    // v22 — PRESS SEMANAL: "Performance Across SNS" + "VTR"
    // Replica exactamente las pestañas del Sheet (validado S1–S42 2026):
    //  · Posts / Alcance / Inter. Totales = Perf_Semanal (todos los posts)
    //  · Followers = suma de todas las cuentas de la hoja Followers
    //  · VTR = bloque "VTR General" de VTR_Video: promedio simple por
    //    plataforma (videos con VTR > 0, sin Stories) y promedio entre
    //    plataformas. Ignora los filtros del dashboard.
    // ============================================================
    const PRESS_YEAR = 2026;
    const PRESS_WEEK1 = new Date(2025, 11, 28);   // domingo de la S1
    const PRESS_PLATS = ['Facebook', 'Instagram', 'YouTube', 'TikTok', 'X', 'LinkedIn', 'Threads'];
    const MES_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function pressWeekRange(w) {
      const a = new Date(PRESS_WEEK1); a.setDate(a.getDate() + 7 * (w - 1));
      const b = new Date(a); b.setDate(b.getDate() + 6);
      return [a, b];
    }
    function pressLastClosedWeek(today = new Date()) {
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      return Math.floor((t - PRESS_WEEK1) / 86400000 / 7) + 1 - 1;
    }
    function ordEn(d) {
      const n = d.getDate();
      const suf = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
      return `${MES_EN[d.getMonth()]} ${String(n).padStart(2, '0')}${suf}`;
    }
    function fmtKpress(v) {
      v = Number(v || 0);
      if (v >= 1e6) return `${(v / 1e6).toFixed(1)} M`;
      if (v >= 1e4) return `${Math.round(v / 1e3)} K`;
      if (v >= 1e3) return `${(v / 1e3).toFixed(1)} K`;
      return `${Math.round(v)}`;
    }


    function computePressWeek(allPosts, week, followers) {
      const inWeek = (w) => (allPosts || []).filter(p => p.week === w && postYear(p) === PRESS_YEAR);
      const perfOf = (list) => ({
        posts: list.length,
        reach: list.reduce((s, p) => s + (p.reach || 0), 0),
        inter: list.reduce((s, p) => s + (p.interactions || 0), 0),
      });
      const vtrOf = (list) => {
        const by = {};
        for (const p of list) {
          if (p.vtr == null || !isFinite(p.vtr)) continue;
          (by[p.platform] = by[p.platform] || []).push(p.vtr);
        }
        const plats = {};
        for (const k of PRESS_PLATS) if (by[k]) plats[k] = by[k].reduce((a, b) => a + b, 0) / by[k].length;
        const vals = Object.values(plats);
        return { plats, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null };
      };
      const cur = inWeek(week), prev = inWeek(week - 1);
      const series = [];
      for (let w = 1; w <= week; w++) { const pf = perfOf(inWeek(w)); series.push({ w, reach: pf.reach, inter: pf.inter }); }
      const pending = cur.filter(p => !hasMetrics(p)).length;
      return {
        week, range: pressWeekRange(week),
        perf: perfOf(cur), prev: perfOf(prev), series,
        vtr: vtrOf(cur), vtrPrev: vtrOf(prev),
        fol: followers?.[week] ?? null, folPrev: followers?.[week - 1] ?? null,
        pending,
      };
    }

    function pressDelta(a, b) { return (a != null && b) ? (a - b) / b : null; }

    // v23 — Recuadros de campaña: campaña + subcampañas elegidas, misma
    // lógica que el reporte (todos los posts; VTR = promedio simple de los
    // videos con VTR > 0 sin Stories; post destacado = más Inter. Totales).
    function pressWeekPosts(allPosts, week) {
      return (allPosts || []).filter(p => p.week === week && postYear(p) === PRESS_YEAR);
    }
    function pressCampaignOptions(allPosts, week) {
      const map = new Map();
      for (const p of pressWeekPosts(allPosts, week)) {
        if (!p.campaign) continue;
        if (!map.has(p.campaign)) map.set(p.campaign, { name: p.campaign, posts: 0, inter: 0, subs: new Map() });
        const c = map.get(p.campaign);
        c.posts++; c.inter += p.interactions || 0;
        const sk = p.subcampaign || '(sin subcampaña)';
        c.subs.set(sk, (c.subs.get(sk) || 0) + 1);
      }
      return [...map.values()].sort((a, b) => b.inter - a.inter);
    }
    function computeCampaignBox(allPosts, week, camp, subs) {
      const list = pressWeekPosts(allPosts, week).filter(p =>
        p.campaign === camp && (!subs || subs.includes(p.subcampaign || '(sin subcampaña)')));
      if (!list.length) return null;
      const vt = list.filter(p => p.vtr != null && isFinite(p.vtr)).map(p => p.vtr);
      const top = [...list].sort((a, b) => (b.interactions || 0) - (a.interactions || 0))[0];
      return {
        posts: list.length,
        reach: list.reduce((s, p) => s + (p.reach || 0), 0),
        inter: list.reduce((s, p) => s + (p.interactions || 0), 0),
        vtr: vt.length ? vt.reduce((a, b) => a + b, 0) / vt.length : null,
        top: { label: `${top.platform} ${top.format || ''}`.trim(), reach: top.reach || 0, inter: top.interactions || 0, link: top.link || null },
      };
    }

    // v32 — Slide "[SNS Summary] Followers" (slide 3 del reporte semanal):
    // tabla de las últimas 14 semanas por cuenta (total + WoW), meta 2026
    // (AR) y % de avance (KPI's) para IG/TikTok/YouTube, suscriptores del
    // newsletter y evolución de followers por cuenta desde la semana 1.
    async function fetchPressFollowers() {
      // v33 — la pestaña Followers se lee del export CSV: gviz "adivina" el
      // tipo de cada columna y borra los encabezados "Week N" del newsletter.
      const readFollowers = async () => {
        if (AUTH_ON) return fetchRawSheet('Followers', 'A1:DZ60');
        try {
          const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${FOLLOWERS_GID}`);
          const txt = res.ok ? await res.text() : '';
          if (txt && !txt.trim().startsWith('<')) return Papa.parse(txt, { header: false, skipEmptyLines: false }).data;
        } catch {}
        return fetchRawSheet('Followers', 'A1:DZ60');
      };
      const [rows, statusRows] = await Promise.all([
        readFollowers(),
        fetchRawSheet('Status vs Meta 2026', 'A1:H40').catch(() => []),
      ]);
      const series = [], totals = {};
      let newsletter = null;
      for (let k = 0; k < rows.length; k++) {
        const r = rows[k], name = (r[0] || '').trim();
        if (/^newsletter/i.test(name)) {
          // Debajo: fila de encabezados "Week N" y fila de valores
          const hdr = rows[k + 1] || [], val = rows[k + 2] || [];
          const weeks = [], vals = [];
          // Semana de cada columna: se ancla al primer "Week N" encontrado y
          // avanza de uno en uno (por si algún encabezado llega vacío)
          let i0 = -1, w0 = null;
          for (let i = 1; i < hdr.length; i++) {
            const m = String(hdr[i] || '').match(/week\s*(\d+)/i);
            if (m) { i0 = i; w0 = +m[1]; break; }
          }
          if (w0 != null) for (let i = 1; i < Math.max(hdr.length, val.length); i++) {
            const raw = String(val[i] || '').replace(/[.,\s]/g, '');   // "33.536" y "33,536" → 33536
            if (!raw || isNaN(+raw)) continue;
            weeks.push(w0 + (i - i0)); vals.push(+raw);
          }
          if (weeks.length) newsletter = { weeks, vals };
          break;
        }
        if (!name || /^plataforma$/i.test(name) || /followers/i.test(name)) continue;
        const vals = [];
        for (let i = 1, w = 1; i < r.length; i += 2, w++) {
          const v = toNum(r[i]);
          if (v == null || v === 0) break;
          vals.push(v);
          totals[w] = (totals[w] || 0) + v;
        }
        if (vals.length) series.push({ name, vals });
      }
      const goals = {};
      for (const r of statusRows) {
        const name = (r[0] || '').trim();
        if (!name || /^(plataforma|total)$/i.test(name)) continue;
        const base = toNum(r[1]), goal = toNum(r[4]);
        if (goal) goals[name] = { base, goal };
      }
      return { totals, series, newsletter, goals };
    }

    const FOLLOWERS_GID = '818526065';
    const FOL_LABEL = (n) => /samsungmexico/i.test(n) ? 'Samsung Mexico' : /samsungmobile/i.test(n) ? 'Samsung Mobile' : /linkedin/i.test(n) ? 'LinkedIn*' : n;
    const FOL_COLORS = { Facebook: '4285F4', Instagram: 'EA4335', TikTok: 'FBBC04', YouTube: '34A853', LinkedIn: 'FF6D01',
                         'X | SamsungMexico': '46BDC6', 'X | SamsungMobile': '7BAAF7', Threads: 'F07B72' };

    function addFollowersSlide(pptx, d, per) {
      const F = d.folDetail;
      if (!F || !F.series.length) return;
      const E = (emu) => emu / 914400;
      const REG = 'Samsung SS Body Regular', BOLD = 'Samsung SS Body Bold';

        { x: E(308592), y: E(34914), w: E(8453700), h: E(483900), fontFace: 'Samsung SS Head Bold', bold: true, fontSize: 24, margin: 0, valign: 'middle' });

      // ---------- Tabla: últimas 14 semanas
      const w0 = Math.max(1, W - 13), weeks = [];
      for (let w = w0; w <= W; w++) weeks.push(w);
      const HEAD = { fill: { color: '073763' }, color: 'FFFFFF', bold: true, fontFace: BOLD };
      const c = (t, o = {}) => ({ text: t, options: o });
      const pct = (x, dec = 2) => x == null ? '—' : `${x < 0 ? '-' : ''}${Math.abs(x * 100).toFixed(dec)}%`;
      const r1 = [c('', { ...HEAD, rowspan: 2 })], r2 = [];
      weeks.forEach(w => { r1.push(c(`Week ${w}`, { ...HEAD, colspan: 2 })); r2.push(c('Total week', { ...HEAD, bold: false, fontSize: 3.5 }), c('WoW comparison', { ...HEAD, bold: false, fontSize: 3.5 })); });
      r1.push(c('AR', { ...HEAD, rowspan: 2 }), c("KPI'S", { ...HEAD, rowspan: 2 }));
      const body = F.series.map(({ name, vals }) => {
        const row = [c(FOL_LABEL(name), { ...HEAD })];
        weeks.forEach(w => {

      const TW = 11627825, labelW = 520000, sideW = 470000;

        fontFace: REG, fontSize: 4.5, color: '000000', align: 'center', valign: 'middle', margin: 1,
        border: { type: 'solid', pt: 0.5, color: 'BFBFBF' },
      });

      // ---------- Newsletter (hasta 26 semanas)
      const NL = F.newsletter;
      if (NL) {
        const idx = NL.weeks.map((w, i) => [w, NL.vals[i]]).filter(([w]) => w <= W).slice(-26);
        if (idx.length) {
          const NW = 6971029, nl0 = 1000000, nwk = (NW - nl0) / idx.length;
          s.addTable([
            [c('*', HEAD), ...idx.map(([w]) => c(`Week ${w}`, HEAD))],
            [c('Newsletter Subscribers', HEAD), ...idx.map(([, v]) => c(v.toLocaleString('en-US')))],
          ], {
            x: E(4972050), y: E(3686610), w: E(NW), colW: [E(nl0), ...idx.map(() => E(nwk))], rowH: [E(284133), E(284133)],
            fontFace: REG, fontSize: 4.5, color: '000000', align: 'center', valign: 'middle', margin: 1,
            border: { type: 'solid', pt: 0.5, color: 'BFBFBF' },
          });
        }
      }

      // ---------- Evolución de followers W1 → W actual
      const labels = Array.from({ length: W }, (_, i) => `W${i + 1}`);
      const data = F.series.map(({ name, vals }) => ({ name: name.replace('X | ', 'X | '), labels, values: labels.map((_, i) => vals[i] ?? null) }));
      s.addChart(pptx.ChartType.line, data, {
        x: E(188475), y: E(4321350), w: E(11719849), h: E(2380725),
        chartColors: F.series.map(({ name }) => FOL_COLORS[name] || '999999'),
        lineSize: 1.5, lineDataSymbol: 'none',
        showLegend: true, legendPos: 'r', legendFontSize: 7, legendFontFace: 'Arial',
        catAxisLabelFontSize: 6, catAxisLabelFontFace: 'Arial', catAxisLineShow: false,
        valAxisLabelFontSize: 6, valAxisLabelFontFace: 'Arial', valAxisLabelFormatCode: '#,##0', valAxisMinVal: 0,
        valGridLine: { color: 'E7E7E7', style: 'solid', size: 0.5 }, valAxisLineShow: false,
      });
      if (per) s.addText(per, { x: E(10103052), y: E(6702067), w: E(1803300), h: E(187500), fontFace: REG, fontSize: 5, color: '000000', align: 'right', margin: 0 });
    }

    // ============================================================
    // v35 — SLIDES DE TEMA LIBRE para la press (como el slide de Galaxy Tab
    // S12 del reporte, pero para cualquier dispositivo, campaña o tema).
    // El tema se define con filtros de la semana; los recuadros de abajo se
    // parten por la dimensión que se elija. Sentimiento y conversación son
    // espacios para pegar (vienen de Brandwatch y de las plataformas).
    // ============================================================
    const TOPIC_DIMS = [
      { k: 'campaign',    l: 'Campaña',     f: (p) => p.campaign },
      { k: 'product',     l: 'Producto',    f: (p) => p.product },
      { k: 'subcampaign', l: 'Subcampaña',  f: (p) => p.subcampaign },
      { k: 'platform',    l: 'Plataforma',  f: (p) => p.platform },
      { k: 'format',      l: 'Formato',     f: (p) => p.format },
    ];
    const topicDim = (k) => TOPIC_DIMS.find(d => d.k === k);
    function pressStats(list) {
      if (!list.length) return null;
      const vt = list.filter(p => p.vtr != null && isFinite(p.vtr)).map(p => p.vtr);
      const top = [...list].sort((a, b) => (b.interactions || 0) - (a.interactions || 0))[0];
      return {
        posts: list.length,
        reach: list.reduce((s, p) => s + (p.reach || 0), 0),
        inter: list.reduce((s, p) => s + (p.interactions || 0), 0),
        vtr: vt.length ? vt.reduce((a, b) => a + b, 0) / vt.length : null,
        top: { label: `${top.platform} ${top.format || ''}`.trim(), reach: top.reach || 0, inter: top.interactions || 0, link: top.link || null },
      };
    }
    function topicOptions(allPosts, week, dimK) {
      const D = topicDim(dimK); const m = new Map();
      for (const p of pressWeekPosts(allPosts, week)) {
        const v = D.f(p); if (!v) continue;
        const r = m.get(v) || { v, n: 0, inter: 0 }; r.n++; r.inter += p.interactions || 0; m.set(v, r);
      }
      return [...m.values()].sort((a, b) => b.inter - a.inter);
    }
    function topicList(allPosts, week, t) {
      const D = topicDim(t.dim);
      // Siempre totales (orgánico + pauta), como se reporta al cliente
      return pressWeekPosts(allPosts, week).filter(p => t.values.includes(D.f(p)));
    }
    function topicSplitOptions(list, splitK) {
      if (!splitK || splitK === 'none') return [];
      const D = topicDim(splitK); const m = new Map();
      for (const p of list) { const v = D.f(p) || '(sin dato)'; const r = m.get(v) || { v, n: 0, inter: 0 }; r.n++; r.inter += p.interactions || 0; m.set(v, r); }
      return [...m.values()].sort((a, b) => b.inter - a.inter);
    }
    function organicVtrRef(allPosts, week) {
      const v = (allPosts || []).filter(p => postYear(p) === PRESS_YEAR && p.week && p.week <= week && !isPaidP(p) &&
        p.vtr != null && isFinite(p.vtr)).map(p => p.vtr);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    }
    function computeTopic(allPosts, week, t) {
      if (t.dim === 'manual') return { manual: true, title: t.title || 'Tema', groups: [], bullets: [] };
      const list = topicList(allPosts, week, t);
      const perf = pressStats(list);
      const ref = organicVtrRef(allPosts, week);
      const D = t.split && t.split !== 'none' ? topicDim(t.split) : null;
      const groups = D ? (t.splitKeys || []).slice(0, 2).map(k => ({ title: k, data: pressStats(list.filter(p => (D.f(p) || '(sin dato)') === k)) })).filter(g => g.data) : [];
      const bullets = [];
      if (perf) {
        bullets.push(`${t.title || t.values.join(' · ')} generated ${fmtKpress(perf.reach)} reach and ${fmtKpress(perf.inter)} interactions across ${perf.posts} post${perf.posts === 1 ? '' : 's'} this week.`);
        if (perf.vtr != null && ref != null) {
          const dpp = perf.vtr - ref;
          bullets.push(`Its VTR (${perf.vtr.toFixed(2)}%) was ${Math.abs(dpp).toFixed(2)} pp ${dpp >= 0 ? 'above' : 'below'} the organic average, ${dpp >= 0 ? 'outperforming' : 'below'} the typical performance of organic content.`);
        } else bullets.push(`The best-performing piece was ${perf.top.label}, with ${fmtKpress(perf.top.reach)} reach and ${fmtKpress(perf.top.inter)} interactions.`);
      }
      return { manual: false, title: t.title || t.values.join(' · '), perf, ref, groups, bullets };
    }

    // v60 — Slide opcional "[SNS Summary] Account KPIs": mismas reglas que la

    function computePressKpis(allPosts, week) {
      const posts = (allPosts || []).filter(p => postYear(p) === PRESS_YEAR && p.week != null && +p.week <= week);
      const vids = posts.filter(kpiIsVid), ig = posts.filter(kpiIsIg);
      const wkOf = (list, w) => list.filter(p => +p.week === w);
      const series = Array.from({ length: week }, (_, i) => ({ w: i + 1, vtr: kpiVtr(wkOf(vids, i + 1)), ber: kpiBer(wkOf(ig, i + 1)) }));
      const cur = series[week - 1] || {}, prev = series[week - 2] || {};
      const byPlat = {};
      for (const p of wkOf(vids, week)) (byPlat[p.platform] = byPlat[p.platform] || []).push(p);
      const byFmt = {};
      for (const p of wkOf(ig, week)) (byFmt[p.format || 'Sin formato'] = byFmt[p.format || 'Sin formato'] || []).push(p);
      return {
        series, cur, prev,
        nVid: wkOf(vids, week).length, nIg: wkOf(ig, week).length,
        plats: Object.entries(byPlat).map(([k, l]) => ({ k, n: l.length, v: kpiVtr(l) })).sort((a, b) => b.n - a.n),
        fmts: Object.entries(byFmt).map(([k, l]) => ({ k, n: l.length, v: kpiBer(l) })).sort((a, b) => b.n - a.n),
        ytdVtr: kpiVtr(vids), ytdBer: kpiBer(ig),
      };
    }

        { x: E(308592), y: E(34914), w: E(8453700), h: E(483900), fontFace: 'Samsung SS Head Bold', bold: true, fontSize: 24, color: '2F5496', margin: 0, valign: 'middle' });
      const pctTxt = (dv, dec = 0) => dv == null ? 'n/d vs last week' : `${dv >= 0 ? '+' : ''}${(dv * 100).toFixed(dec)}% vs last week`;

      // ---------- Performance Across SNS
      frame(295825, 1700883, 3465300, 1460400);

      const lines = [['► Posts: ', String(d.perf.posts)], ['► Reach: ', fmtKpress(d.perf.reach)],
                     ['► Interactions: ', fmtKpress(d.perf.inter)], ['► Followers: ', d.fol ? fmtKpress(d.fol) : 'n/d']];
      const runs = [];
      lines.forEach(([l, v], i) => {
        if (i) runs.push({ text: ' ', options: { breakLine: true } });
        runs.push({ text: l, options: {} });
        runs.push({ text: v, options: { breakLine: i < lines.length - 1 } });

      s.addText(runs, { x: E(312950), y: E(1797832), w: E(3440400), h: E(1323000), fontFace: BOLD, bold: true, fontSize: 10.5, color: '000000', valign: 'top', margin: [3.6, 7.2, 3.6, 7.2], paraSpaceBefore: 0, paraSpaceAfter: 0 });
      const deltas = [pressDelta(d.perf.posts, d.prev.posts), pressDelta(d.perf.reach, d.prev.reach),
                      pressDelta(d.perf.inter, d.prev.inter), pressDelta(d.fol, d.folPrev)];
      const ya = [1856861, 2171224, 2470661, 2788790], yl = [1802611, 2125362, 2428725, 2749132];
      deltas.forEach((dv, i) => {
        arrow(2185606, ya[i], 190500, 138300, dv == null || dv === 0 ? null : dv > 0);
        label(2357725, yl[i], pctTxt(dv, i === 3 ? 2 : 0));

      // ---------- Reach & Interactions Over Time
      frame(3817555, 1694416, 4549200, 1460400);
      header(3817425, 1450660, 4549200, 252000, 'Reach & Interactions Over Time');
      const ser = d.series;
      if (ser.length) {
        const CX = 3961910, CW = 4305151, CY = 1942562, CH = 1113807;
        const PL = { x: 0.12, y: 0.06, w: 0.86, h: 0.62 };     // área de trazo fija → píldoras alineadas
        s.addChart(pptx.ChartType.area, [
          { name: 'Total Interactions', labels: ser.map(r => String(r.w)), values: ser.map(r => r.inter) },
          { name: 'Reach', labels: ser.map(r => String(r.w)), values: ser.map(r => r.reach) },
        ], {
          x: E(CX), y: E(CY), w: E(CW), h: E(CH), layout: PL,
          chartColors: ['1F3864', 'A4C2F4'], chartColorsOpacity: 85,
          showLegend: true, legendPos: 'b', legendFontSize: 6, legendFontFace: 'Arial',
          catAxisLabelFontSize: 5, catAxisLabelFontFace: 'Arial', catAxisLabelColor: '4285F4', catAxisLineShow: false,
          valAxisLabelFontSize: 5, valAxisLabelFontFace: 'Arial', valAxisLabelFormatCode: '#,##0,,"M"',
          valGridLine: { color: 'D9D9D9', style: 'solid', size: 0.5 }, valAxisLineShow: false,
        });
        // Píldoras de mes (JAN, FEB, …) sobre las semanas que abarca cada mes
        const MES_UP = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DEC'];
        const n = ser.length;
        const px = (i) => CX + CW * (PL.x + PL.w * ((i + 0.5) / n));
        const groups = [];
        ser.forEach((r, i) => {
          const m = pressWeekRange(r.w)[1].getMonth();   // mes del sábado que cierra la semana (S1 → JAN)
          if (!groups.length || groups[groups.length - 1].m !== m) groups.push({ m, i0: i, i1: i }); else groups[groups.length - 1].i1 = i;
        });
        const step = CW * PL.w / n;
        groups.forEach(g => {
          const x0 = px(g.i0) - step / 2, x1 = px(g.i1) + step / 2;
          s.addText(MES_UP[g.m], { x: E(x0 + 6000), y: E(1802000), w: E(Math.max(x1 - x0 - 12000, 60000)), h: E(139500),
            fill: { color: '00B0F0' }, line: { color: 'FFFFFF', width: 0.8 }, color: 'FFFFFF', bold: true,
            fontFace: 'Arial', fontSize: 4, align: 'center', valign: 'middle', margin: 0 });
        });
      }

      // ---------- VTR
      frame(8430948, 1691879, 3465300, 1460400);
      header(8423153, 1446748, 3473100, 252000, 'VTR');
      const avg = d.vtr.avg, avgPrev = d.vtrPrev.avg;
      const dpp = (avg != null && avgPrev != null) ? avg - avgPrev : null;
      const ppTxt = dpp == null ? `n/d vs W${d.week - 1}` : `${dpp >= 0 ? '+' : ''}${(Math.round(dpp * 10) / 10).toString()} pp vs W${d.week - 1}`;
      s.addText([
        { text: '► Average VTR: ', options: {} },
        { text: avg != null ? `${avg.toFixed(1)}% ` : 'n/d ', options: { breakLine: true } },
        { text: ppTxt, options: { fontSize: 6 } },
      ], { x: E(8460796), y: E(1724227), w: E(2141100), h: E(296700), fontFace: BOLD, bold: true, fontSize: 10.5, color: '000000', valign: 'top', margin: [3.6, 7.2, 0, 7.2] });
      arrow(10138589, 1790520, 217800, 158100, !dpp ? null : dpp > 0);
      const plats = Object.entries(d.vtr.plats).sort((a, b) => b[1] - a[1]);
      if (plats.length) {
        const rev = [...plats].reverse();                   // en barras horizontales el primero queda abajo
        const max = Math.max(...plats.map(p => p[1])) / 100;
        s.addChart(pptx.ChartType.bar, [{ name: 'VTR', labels: rev.map(p => p[0]), values: rev.map(p => p[1] / 100) }], {
          x: E(8446108), y: E(2035700), w: E(3439775), h: E(1037175),
          barDir: 'bar', barGapWidthPct: 60, chartColors: ['4285F4'],
          showLegend: false, showTitle: false,
          showValue: true, dataLabelFormatCode: '0.0%', dataLabelFontSize: 6, dataLabelColor: '4285F4', dataLabelPosition: 'outEnd',
          valAxisHidden: true, valGridLine: { style: 'none' }, valAxisMinVal: 0, valAxisMaxVal: max * 1.15,
          catAxisLabelFontSize: 6, catAxisLabelFontFace: 'Arial', catAxisLabelColor: '000000', catAxisLineShow: false,
        });
      }

      // ---------- Recuadros de campaña (fila inferior del slide)
      const BX = [298075, 4201125, 8124550], BY = 3550000, BW = 3781800, BH = 3061200;
      (d.boxes || []).forEach((bx, i) => {
        if (!bx || !bx.data || i > 2) return;
        const fx = BX[i], m = bx.data;
        frame(fx, BY, BW, BH);
        header(fx, BY - 323700, BW, 323700, bx.title || '');
        const L = [['► Posts: ', String(m.posts)], ['► Reach: ', fmtKpress(m.reach)], ['► Interactions: ', fmtKpress(m.inter)]];
        if (m.vtr != null) L.push(['► VTR: ', `${m.vtr.toFixed(2)}%`]);
        const rr = [];
        L.forEach(([l, v], k) => {
          if (k) rr.push({ text: ' ', options: { breakLine: true } });
          rr.push({ text: l, options: {} });
          rr.push({ text: v, options: { breakLine: k < L.length - 1 } });
        });
        s.addText(rr, { x: E(fx + 58175), y: E(BY + 142000), w: E(1900000), h: E(1231800), fontFace: BOLD, bold: true, fontSize: 10.5, color: '000000', valign: 'top', margin: [3.6, 7.2, 3.6, 7.2] });
        // Espacio para la imagen del post (el link abre la publicación)
        s.addText(m.top.link ? [{ text: 'Imagen del post', options: { hyperlink: { url: m.top.link, tooltip: 'Abrir publicación' } } }] : 'Imagen del post', {
          x: E(fx + 2261830), y: E(BY + 171575), w: E(1008053), h: E(1806888),
          fill: { color: 'F2F2F2' }, line: { color: 'BFBFBF', width: 0.75, dashType: 'dash' },
          fontFace: REG, fontSize: 7, color: '7F7F7F', align: 'center', valign: 'middle', margin: 2 });
        // Tablita del post destacado
        const cell = (t, o = {}) => ({ text: t, options: o });
        s.addTable([
          [cell(m.top.label, { colspan: 2, fill: { color: '002060' }, color: 'FFFFFF', bold: true, align: 'center' })],
          [cell('Reach'), cell(Math.round(m.top.reach).toLocaleString('en-US'), { align: 'center' })],
          [cell('Interactions'), cell(Math.round(m.top.inter).toLocaleString('en-US'), { align: 'center' })],
        ], {
          x: E(fx + 1968632), y: E(BY + 2051573), w: E(1578475), colW: [E(929025), E(649450)], rowH: E(289530),
          fontFace: REG, fontSize: 7, color: '000000', valign: 'middle', align: 'center',
          border: { type: 'solid', pt: 0.75, color: '000000' }, margin: 2,
        });
      });

      // ---------- Período
      const [a, b] = d.range;
      const per = a.getMonth() === b.getMonth() ? `PERIOD: ${ordEn(a)} - ${String(b.getDate()).padStart(2, '0')}th` : `PERIOD: ${ordEn(a)} - ${ordEn(b)}`;
      s.addText(per, { x: E(9900000), y: E(6560000), w: E(2100000), h: E(200000), fontFace: REG, fontSize: 6, color: '000000', align: 'right', margin: 0 });
      addFollowersSlide(pptx, d, per);
      if (d.kpis) addKpiSlide(pptx, d, per);
      (d.topics || []).forEach(T => addTopicSlide(pptx, T, per));
      return pptx.writeFile({ fileName: `SNS_W${d.week}_Press.pptx` });
    }

    const PRESS_STORE_KEY = 'smx-press-config-v1';
    function pressStoreRead() { try { return JSON.parse(localStorage.getItem(PRESS_STORE_KEY) || '{}') || {}; } catch { return {}; } }
    function pressStoreWrite(o) {
      try {   // solo las últimas 12 semanas
        const keep = Object.keys(o).map(Number).sort((a, b) => b - a).slice(0, 12);
        const out = {}; keep.forEach(k => { out[k] = o[k]; });
        localStorage.setItem(PRESS_STORE_KEY, JSON.stringify(out));
      } catch {}
    }

    function PressModal({ open, onClose, allPosts }) {
      const lastClosed = useMemo(() => pressLastClosedWeek(), []);
      const weeks = useMemo(() => {
        const set = new Set((allPosts || []).filter(p => postYear(p) === PRESS_YEAR && p.week).map(p => p.week));
        return [...set].filter(w => w >= 2).sort((a, b) => b - a);
      }, [allPosts]);
      const [week, setWeek] = useState(null);
      const [followers, setFollowers] = useState(null);
      const [folDetail, setFolDetail] = useState(null);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      useEffect(() => {
        if (!open) return;
        setErr(null);
        if (week == null) setWeek(weeks.includes(lastClosed) ? lastClosed : weeks[0]);
        if (!followers) fetchPressFollowers().then(r => { setFolDetail(r); setFollowers(r.totals); }).catch(() => setFollowers({}));
      }, [open]);
      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [open, onClose]);
      const d = useMemo(() => (week ? computePressWeek(allPosts, week, followers) : null), [allPosts, week, followers]);
      const campOpts = useMemo(() => (week ? pressCampaignOptions(allPosts, week) : []), [allPosts, week]);
      const [boxes, setBoxes] = useState([null, null, null]);   // { camp, subs: string[], title, touched }
      const [topics, setTopics] = useState([]);
      const [withKpis, setWithKpis] = useState(() => { try { return localStorage.getItem('smx-press-kpis') === '1'; } catch { return false; } });
      useEffect(() => { try { localStorage.setItem('smx-press-kpis', withKpis ? '1' : '0'); } catch {} }, [withKpis]);
      // v42 — pendientes de calidad de la semana a exportar
      const weekQ = useMemo(() => (week ? computeDataQuality(pressWeekPosts(allPosts, week), allPosts) : null), [allPosts, week]);
      // v37 — la press recuerda lo que armaste por semana (en este navegador)
      // y, para una semana nueva, parte de lo que usaste la semana anterior.
      const [origin, setOrigin] = useState(null);     // { kind: 'saved'|'prev'|'auto', from }
      const loadedFor = useRef(null);
      const skipSave = useRef(false);   // no guardar lo que solo se cargó o propuso
      const autoBoxes = () => [0, 1, 2].map(i => campOpts[i]
        ? { camp: campOpts[i].name, subs: [...campOpts[i].subs.keys()], title: campOpts[i].name, touched: false } : null);
      const adapt = (cfg) => {
        // Ajusta una configuración a lo que sí existe en esta semana
        const bx = (cfg.boxes || [null, null, null]).map(b => {
          if (!b) return null;
          const o = campOpts.find(c => c.name === b.camp);
          if (!o) return null;
          // Si nunca acotaste subcampañas, se toman todas las de esta semana
          const subs = b.subsTouched ? (b.subs || []).filter(x => o.subs.has(x)) : [];
          return { ...b, subs: subs.length ? subs : [...o.subs.keys()] };
        });
        const tp = (cfg.topics || []).map(t => {
          if (t.dim === 'manual') return t;
          const avail = new Set(topicOptions(allPosts, week, t.dim).map(o => o.v));
          const values = (t.values || []).filter(v => avail.has(v));
          return { ...t, values, splitKeys: values.length ? (t.splitKeys || []) : [] };
        });
        return { boxes: bx, topics: tp };
      };
      useEffect(() => {
        if (!week || !campOpts) return;
        const store = pressStoreRead();
        let cfg = null, from = null, kind = 'auto';
        if (store[week]) { cfg = store[week]; kind = 'saved'; from = week; }
        else {
          const prev = Object.keys(store).map(Number).filter(w => w < week).sort((a, b) => b - a)[0];
          if (prev) { cfg = store[prev]; kind = 'prev'; from = prev; }
        }
        if (cfg) {
          const a = adapt(cfg);
          if (kind === 'prev') {   // huecos sin campaña vigente: se llenan con la propuesta automática
            const auto = autoBoxes().filter(b => b && !a.boxes.some(x => x && x.camp === b.camp));
            a.boxes = a.boxes.map(b => b || auto.shift() || null);
            a.topics = a.topics.filter(t => t.dim === 'manual' || t.values.length);
          }
          setBoxes(a.boxes); setTopics(a.topics);
        } else { setBoxes(autoBoxes()); setTopics([]); }
        setOrigin({ kind, from });
        loadedFor.current = week; skipSave.current = true;
      }, [week, campOpts]);
      useEffect(() => {   // guarda cada cambio de la semana en curso
        if (!week || loadedFor.current !== week) return;
        if (skipSave.current) { skipSave.current = false; return; }
        const store = pressStoreRead();
        store[week] = { boxes, topics, savedAt: Date.now() };
        pressStoreWrite(store);
      }, [boxes, topics]);
      const resetAuto = () => {
        const store = pressStoreRead(); delete store[week]; pressStoreWrite(store);
        skipSave.current = true; setBoxes(autoBoxes()); setTopics([]); setOrigin({ kind: 'auto', from: null });
      };
      const setBox = (i, patch) => setBoxes(bs => bs.map((b, k) => k === i ? (patch === null ? null : { ...(b || {}), ...patch }) : b));
      const boxData = useMemo(() => boxes.map(b => b && b.camp ? computeCampaignBox(allPosts, week, b.camp, b.subs) : null), [boxes, allPosts, week]);
      const addTopic = () => {
        const top = topicOptions(allPosts, week, 'campaign')[0];
        setTopics(ts => [...ts, { title: top ? top.v : '', touched: false, dim: 'campaign', values: top ? [top.v] : [], scope: 'all', split: 'product', splitKeys: [] }]);
      };
      if (!open) return null;

      const dl = async () => {
        setBusy(true); setErr(null);
        try {
          await buildPressPptx({ ...d, folDetail, kpis: withKpis ? computePressKpis(allPosts, week) : null, topics: topics.map(t => computeTopic(allPosts, week, t)), boxes: boxes.map((b, i) => (b && boxData[i]) ? { title: b.title, data: boxData[i] } : null) });
        } catch (e) { setErr(e?.message || 'No se pudo generar el archivo.'); }
        finally { setBusy(false); }
      };
      const deltaTxtP = (v, dec = 0) => v == null ? '—' : `${v >= 0 ? '+' : ''}${(v * 100).toFixed(dec)}%`;
      const row = (k, v, dv, dec) => html`
        <div className="flex items-baseline justify-between py-1.5 text-[12px]">
          <span className="text-txt3">${k}</span>
          <span className="font-mono tabular-nums text-txt">${v}<span className=${"ml-2 text-[10px] " + (dv == null ? 'text-txt4' : dv >= 0 ? 'text-success' : 'text-amber')}>${deltaTxtP(dv, dec)}</span></span>
        </div>`;
      return html`
        <${Fragment}>
          <div className="fixed inset-0 z-40 fade-in" style=${{ background: 'rgba(0,0,0,0.6)' }} onClick=${onClose}/>
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick=${onClose}>
            <div role="dialog" aria-modal="true" aria-labelledby="h-press"
                 className="w-full max-w-md max-h-[90vh] overflow-y-auto rounded-2xl bg-surface border border-line2 fade-in p-6"
                 style=${{ boxShadow: '0 20px 60px rgba(0,0,0,0.5)' }} onClick=${(e) => e.stopPropagation()}>
              <div className="flex items-start justify-between mb-1">
                <h2 id="h-press" className="text-[16px] font-medium text-txt">Press semanal</h2>
                <button onClick=${onClose} aria-label="Cerrar" className="text-txt4 hover:text-txt"><${XIcon} size=${16}/></button>
              </div>
              <p className="text-[12px] text-txt4 mb-4">Descarga 3 slides en el formato del reporte (PPTX editable): la portada, el resumen de la semana (Performance Across SNS, Reach & Interactions, VTR y hasta 3 recuadros de campaña) y Followers (tabla de 14 semanas, meta 2026, newsletter y evolución). Puedes sumar slides de tema al final. Usa toda la cuenta, sin los filtros del dashboard.</p>

              <label className="block text-[10px] font-mono uppercase tracking-[0.16em] text-txt4 mb-1.5" htmlFor="press-week">Semana</label>
              <select id="press-week" value=${week || ''} onChange=${(e) => setWeek(+e.target.value)}
                      className="w-full text-[12px] bg-onSurface/[0.03] border border-line rounded-lg px-3 py-2 text-txt2 mb-4">
                ${weeks.map(w => { const [a, b] = pressWeekRange(w); return html`<option key=${w} value=${w}>S${w} · ${a.getDate()} ${MESES_ABBR(a)} – ${b.getDate()} ${MESES_ABBR(b)}${w === lastClosed ? ' (última cerrada)' : w > lastClosed ? ' (en curso)' : ''}</option>`; })}
              </select>

              ${d && html`
                <div className="rounded-xl border border-line px-4 py-2 mb-3">
                  ${row('Posts', String(d.perf.posts), pressDelta(d.perf.posts, d.prev.posts))}
                  ${row('Reach', fmtKpress(d.perf.reach), pressDelta(d.perf.reach, d.prev.reach))}
                  ${row('Interactions', fmtKpress(d.perf.inter), pressDelta(d.perf.inter, d.prev.inter))}
                  ${row('Followers', followers ? (d.fol ? fmtKpress(d.fol) : 'n/d') : '…', pressDelta(d.fol, d.folPrev), 2)}
                  <div className="flex items-baseline justify-between py-1.5 text-[12px]">
                    <span className="text-txt3">Average VTR</span>
                    <span className="font-mono tabular-nums text-txt">${d.vtr.avg != null ? d.vtr.avg.toFixed(1) + '%' : 'n/d'}
                      <span className="ml-2 text-[10px] text-txt4">${(d.vtr.avg != null && d.vtrPrev.avg != null) ? `${d.vtr.avg - d.vtrPrev.avg >= 0 ? '+' : ''}${(d.vtr.avg - d.vtrPrev.avg).toFixed(1)} pp` : '—'}</span>
                    </span>
                  </div>
                </div>
                ${d.pending > 0 && html`
                  <div className="rounded-lg border border-amber/40 bg-amber/[0.06] px-3 py-2 text-[11px] text-amber mb-3" role="status">
                    S${d.week} tiene ${d.pending} post${d.pending === 1 ? '' : 's'} sin métricas: los números pueden cambiar cuando se completen.
                  </div>`}
              `}
              ${origin && origin.kind !== 'auto' && html`
                <div className="flex items-center justify-between gap-2 rounded-lg bg-accent2/10 px-3 py-2 mb-3 text-[11px] text-txt2">
                  <span>${origin.kind === 'saved' ? `Recuperé lo que armaste para la S${origin.from}.` : `Partí de lo que usaste en la S${origin.from}.`}</span>
                  <button onClick=${resetAuto} className="text-accent hover:underline whitespace-nowrap">Volver a la propuesta automática</button>
                </div>`}
              <div className="text-[10px] font-mono uppercase tracking-[0.16em] text-txt4 mb-2 mt-1">Recuadros de campaña</div>
              <div className="space-y-2.5 mb-4">
                ${[0, 1, 2].map(i => {
                  const b = boxes[i];
                  const opt = b ? campOpts.find(c => c.name === b.camp) : null;
                  const m = boxData[i];
                  return html`
                    <div key=${i} className="rounded-xl border border-line px-3 py-2.5">
                      <div className="flex gap-2 items-center">
                        <span className="text-[10px] font-mono text-txt4 w-4">${i + 1}</span>
                        <select aria-label=${`Campaña del recuadro ${i + 1}`} value=${b?.camp || ''}
                                onChange=${(e) => {
                                  const v = e.target.value;
                                  if (!v) return setBox(i, null);
                                  const o = campOpts.find(c => c.name === v);
                                  setBox(i, { camp: v, subs: [...o.subs.keys()], title: (b && b.touched) ? b.title : v, touched: !!(b && b.touched) });
                                }}
                                className="flex-1 min-w-0 text-[12px] bg-onSurface/[0.03] border border-line rounded-lg px-2 py-1.5 text-txt2">
                          <option value="">— Sin recuadro —</option>
                          ${campOpts.map(c => html`<option key=${c.name} value=${c.name}>${c.name} · ${c.posts} post${c.posts === 1 ? '' : 's'}</option>`)}
                        </select>
                      </div>
                      ${b && opt && html`
                        <${Fragment}>
                          <input aria-label=${`Título del recuadro ${i + 1}`} value=${b.title}
                                 onChange=${(e) => setBox(i, { title: e.target.value, touched: true })}
                                 className="mt-2 w-full text-[12px] bg-onSurface/[0.03] border border-line rounded-lg px-2 py-1.5 text-txt" />
                          ${opt.subs.size > 1 && html`
                            <div className="flex flex-wrap gap-1.5 mt-2" role="group" aria-label="Subcampañas incluidas">
                              ${[...opt.subs.entries()].map(([sname, n]) => {
                                const on = b.subs.includes(sname);
                                return html`
                                  <button key=${sname} aria-pressed=${on}
                                          onClick=${() => {

                        <button type="submit" className="h-8 px-3 rounded-lg bg-accent2 text-white text-[12px] font-medium">Enviar</button>
                      </form>`}
                      ${(vote === 'si' || vote === 'enviado') && html`<span>Gracias. Con esto se ajusta el buscador.</span>`}

            </div>

            ${res && ['table', 'define'].includes(res.kind) && html`

                ${res.spec.intent === 'fol' && html`<button onClick=${() => { onClose(); setTimeout(() => { const el = document.getElementById('sec-followers'); el && el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80); }} className="h-8 px-3 rounded-lg border border-line text-[12px] text-txt2 hover:text-txt hover:border-line2 transition-colors">Ver «Followers y meta»</button>`}
              </div>`}
            ${res && !['empty', 'notice', 'help', 'caps', 'table', 'define', 'loading'].includes(res.kind) && html`
              <div className="flex flex-wrap items-center gap-2 px-5 md:px-6 py-3.5 border-t border-line bg-onSurface/[0.015]">
                <button onClick=${applyDash} className="h-8 px-3.5 rounded-lg bg-accent2 text-white text-[12px] font-medium hover:opacity-90 transition-opacity inline-flex items-center gap-1.5">
                  <${FilterIcon} size=${13}/> Ver en el dashboard</button>
                <button onClick=${copy} className="h-8 px-3 rounded-lg border border-line text-[12px] text-txt2 hover:text-txt hover:border-line2 transition-colors inline-flex items-center gap-1.5">
                  ${copied ? html`<${CheckIcon} size=${13}/> Copiado` : 'Copiar respuesta'}</button>
                <button onClick=${download} className="h-8 px-3 rounded-lg border border-line text-[12px] text-txt2 hover:text-txt hover:border-line2 transition-colors inline-flex items-center gap-1.5">
                  <${DownloadIcon} size=${13}/> CSV (${fmt(res.posts.length)})</button>
                ${dashMap && dashMap.skipped.length > 0 && html`<span className="text-[11px] text-txt4 ml-1">El dashboard no filtra por: ${dashMap.skipped.join(', ').toLowerCase()}.</span>`}
              </div>`}

    function App() {
      const { data, loading, refreshing, error, errors, fetchedAt, refresh, autoRefreshMin } = useDashboardData();
      const [selected, setSelected] = useState(null);
      const [askOpen, setAskOpen] = useState(false);
      const [exportOpen, setExportOpen] = useState(false);
      const [pressOpen, setPressOpen] = useState(false);
      const [mobileNav, setMobileNav] = useState(false);
      const [openGroups, setOpenGroups] = useState(() => {
        try { return JSON.parse(localStorage.getItem('smx-groups') || '{}') || {}; } catch { return {}; }
      });
      // Abre todos los bloques sin guardarlo como preferencia; devuelve cómo regresar
      const expandAllForPdf = useCallback(() => new Promise(resolve => {
        let before = null;
        setOpenGroups(prev => { before = prev; return { ...prev, analisis: true, control: true }; });
        setTimeout(() => resolve(() => setOpenGroups(before || {})), 1800);
      }), []);
      const setGroup = useCallback((k, v) => setOpenGroups(prev => {
        const next = { ...prev, [k]: v };
        try { localStorage.setItem('smx-groups', JSON.stringify(next)); } catch {}
        return next;
      }), []);
      const [kpiTrace, setKpiTrace] = useState(null);
      const allPosts = data?.allPosts || [];
      const { filters, setFilters, clear, isActive } = useFilters(allPosts);
      const { theme, toggleTheme, chart: chartTheme } = useTheme();

      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('smx-sidebar-collapsed') === '1'; } catch { return false; }
      });
      const toggleSidebar = useCallback(() => {
        setSidebarCollapsed(prev => {
          const next = !prev;
          try { localStorage.setItem('smx-sidebar-collapsed', next ? '1' : '0'); } catch {}
          return next;
        });
      }, []);

      // baseMeta y filteredData se recalculan SOLO cuando cambian
      // los datos crudos o los filtros — nunca durante un re-render normal.
      const baseMeta = data?.meta || null;
      // allPosts ya se calculó arriba, antes de useFilters (lo necesita
      // para poder recortar selecciones que dejan de tener sentido).

      const filteredData = useMemo(() => {
        if (!data || !baseMeta) return null;
        const filtered = applyFilters(allPosts, filters);
        const result = computeAggregates(filtered, baseMeta);
        // Expone el año seleccionado en meta para que TrendSection/PlatformsGrid
        // sepan qué año usar al calcular los 7 días de la semana en modo diario.
        result.meta.selected_year = filters.year;
        return result;
      }, [data, allPosts, baseMeta, filters]);

      // OJO: este hook tiene que vivir ANTES de los early-return de abajo
      // (loading/error) — un useMemo colocado después de un return
      // condicional rompe las Rules of Hooks (a veces se ejecuta, a veces
      // no) y React tira el error #310.
      // v21 — benchmarks por segmento sobre TODA la base (no depende de filtros)
      const benchmarks = useMemo(() => buildBenchmarks(allPosts), [allPosts]);

      const anomalyCount = useMemo(() => {
        if (!filteredData || filteredData.global.posts === 0) return 0;
        return computeAnomalies(filteredData).length;
      }, [filteredData]);

      // v61 — Motion: cada sección entra al aparecer en pantalla (una sola vez) y,
      // al cambiar filtros, el contenido hace un relevo breve para que se note qué cambió.
      useEffect(() => {
        const root = document.documentElement;
        root.classList.add('motion');
        const io = new IntersectionObserver((entries) => {
          for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); }
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.04 });
        const watch = () => document.querySelectorAll('main section:not(.in-view)').forEach(sec => {
          // lo que ya está en pantalla al cargar entra de inmediato
          io.observe(sec);
        });
        watch();
        const mo = new MutationObserver(watch);
        const main = document.querySelector('main');
        if (main) mo.observe(main, { childList: true, subtree: true });
        return () => { io.disconnect(); mo.disconnect(); };
      }, [loading, !!filteredData]);
      // v62 — (2) indicador deslizante para todos los selectores segmentados y
      // (5) la fila elegida se ilumina y el detalle se abre desde su altura.
      useEffect(() => {
        const place = (g) => {
          const btn = g.querySelector(':scope > button[aria-checked="true"]');
          let ind = g.querySelector(':scope > .seg-ind');
          if (!btn) { if (ind) ind.style.opacity = '0'; return; }
          if (!ind) {
            const cs = getComputedStyle(btn);   // toma el estilo activo original antes de transparentarlo
            ind = document.createElement('span'); ind.className = 'seg-ind'; ind.setAttribute('aria-hidden', 'true');
            if (/\bbg-surface\b/.test(btn.className)) ind.classList.add('seg-ind-surface');   // pastilla neutra (según tema)
            else { ind.style.background = cs.backgroundColor; ind.style.boxShadow = cs.boxShadow; }
            ind.style.borderRadius = cs.borderRadius;
            if (getComputedStyle(g).position === 'static') g.style.position = 'relative';
            g.prepend(ind); g.classList.add('has-ind');
            ind.style.transition = 'none';
            requestAnimationFrame(() => { ind.style.transition = ''; });
          }
          ind.style.opacity = '1';
          ind.style.left = btn.offsetLeft + 'px'; ind.style.top = btn.offsetTop + 'px';
          ind.style.width = btn.offsetWidth + 'px'; ind.style.height = btn.offsetHeight + 'px';
        };
        const all = () => document.querySelectorAll('[role="radiogroup"]').forEach(place);
        all();
        const mo = new MutationObserver((muts) => {
          if (muts.some(m => m.type === 'attributes' || [...m.addedNodes].some(n => n.nodeType === 1 && !(n.classList && n.classList.contains('seg-ind'))))) requestAnimationFrame(all);
        });
        mo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['aria-checked'] });
        const onResize = () => all();
        window.addEventListener('resize', onResize);
        try { document.fonts && document.fonts.ready.then(all); } catch {}
        // con content-visibility las secciones fuera de pantalla no tienen medidas: se recalcula al aparecer
        const onCv = () => requestAnimationFrame(all);
        document.addEventListener('contentvisibilityautostatechange', onCv, true);
        const onDown = (e) => {
          window.__smxPickY = e.clientY;
          const tr = e.target.closest && e.target.closest('tbody tr.cursor-pointer, tbody tr[role="button"]');
          if (tr && !e.target.closest('a, button, input, select')) { tr.classList.remove('row-picked'); void tr.offsetWidth; tr.classList.add('row-picked'); setTimeout(() => tr.classList.remove('row-picked'), 950); }
        };
        document.addEventListener('pointerdown', onDown, true);
        return () => { mo.disconnect(); window.removeEventListener('resize', onResize); document.removeEventListener('pointerdown', onDown, true); document.removeEventListener('contentvisibilityautostatechange', onCv, true); };
      }, [loading]);
      const firstSwap = useRef(true);
      useEffect(() => {
        if (firstSwap.current) { firstSwap.current = false; return; }
        const main = document.querySelector('main');
        if (!main) return;
        main.classList.remove('data-swap'); void main.offsetWidth; main.classList.add('data-swap');
        const t = setTimeout(() => main.classList.remove('data-swap'), 500);
        return () => clearTimeout(t);
      }, [filteredData]);
      // v67 — Pregúntale a la base: Ctrl/⌘+K o "/" para abrir
      const closeAsk = useCallback(() => setAskOpen(false), []);
      useEffect(() => {
        const onKey = (e) => {
          const tag = (e.target && e.target.tagName) || '';
          const typing = /INPUT|TEXTAREA|SELECT/.test(tag) || (e.target && e.target.isContentEditable);
          if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); setAskOpen(o => !o); }
          else if (e.key === '/' && !typing) { e.preventDefault(); setAskOpen(true); }
        };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        let fol = null;
        window.__smxAsk = async (q) => {
          let r = askAnswer(q, allPosts || [], undefined, { fetchedAt });
          if (r.need === 'fol') { if (!fol) fol = { press: await fetchPressFollowers().catch(() => null), goals: await fetchFollowerGoals().catch(() => []) }; r = askAnswer(q, allPosts || [], undefined, { fol, fetchedAt }); }
          return r;
        };
      }, [allPosts, fetchedAt]);
      if (loading) return html`<${LoadingState}/>`;
      if (error)   return html`<${ErrorState} message=${error} onRetry=${refresh}/>`;
      if (!data || !filteredData) return html`<${ErrorState} message="Sin datos disponibles." onRetry=${refresh}/>`;

      const D = filteredData;
      const noResults = D.global.posts === 0;
      // El laboratorio creativo de TikTok solo existe cuando el filtro de plataforma es únicamente TikTok
      const ttOnly = filters.platforms.length === 1 && filters.platforms[0] === 'TikTok';
      const navHidden = ttOnly ? [] : ['tiktok'];

      return html`
        <div className="min-h-screen bg-ink text-txt flex">
          <${ScrollProgressBar}/>
          <div className="hidden lg:block shrink-0">
          <${Sidebar}
            openGroups=${openGroups} onOpenGroup=${(k) => setGroup(k, true)}
            collapsed=${sidebarCollapsed}
            onToggle=${toggleSidebar}
            liveAlcance=${D.global.reach}
            livePosts=${D.global.posts}
            fetchedAt=${fetchedAt}
            autoRefreshMin=${autoRefreshMin}
            theme=${theme}
            onToggleTheme=${toggleTheme}
            onOpenExport=${() => setExportOpen(true)}
            anomalyCount=${noResults ? 0 : anomalyCount}
            hiddenIds=${navHidden}
          />
          </div>
          ${mobileNav && html`

              <div className="relative h-full shadow-2xl">
                <${Sidebar}
                  openGroups=${openGroups} onOpenGroup=${(k) => setGroup(k, true)} onNavigate=${() => setMobileNav(false)}
                  collapsed=${false} onToggle=${() => setMobileNav(false)}
                  liveAlcance=${D.global.reach} livePosts=${D.global.posts}
                  fetchedAt=${fetchedAt} autoRefreshMin=${autoRefreshMin}
                  theme=${theme} onToggleTheme=${toggleTheme}
                  onOpenExport=${() => { setMobileNav(false); setExportOpen(true); }}
                  anomalyCount=${noResults ? 0 : anomalyCount} hiddenIds=${navHidden} />
              </div>
            </div>`}

          <div className="flex-1 min-w-0 flex flex-col">

              <span className="text-[11px] font-mono uppercase tracking-[0.18em] text-txt3">Samsung MX · Performance</span>
              <span className="w-9"></span>
            </div>
            <${FilterBar}

              filters=${filters}
              setFilters=${setFilters}
              clear=${clear}

              totalPosts=${baseMeta.total_posts}
              allPosts=${allPosts}
            />

            <${TopBar} fetchedAt=${fetchedAt} onRefresh=${refresh} refreshing=${refreshing} autoRefreshMin=${autoRefreshMin} allPosts=${allPosts} onPick=${setSelected} onOpenPress=${() => setPressOpen(true)} onExpandAll=${expandAllForPdf} onAsk=${() => setAskOpen(true)}/>

            ${errors && errors.length > 0 && html`
              <div className="px-4 md:px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Aviso</span> · No se pudo cargar
                  ${errors.length === 1 ? ' ' + errors[0].platform : ` ${errors.length} pestañas`}.

                </div>
              </div>

            ${baseMeta.orphans_no_week > 0 && filters.weeks.length > 0 && html`
              <div className="px-4 md:px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Nota</span> ·
                  Hay ${baseMeta.orphans_no_week} ${baseMeta.orphans_no_week === 1 ? 'post' : 'posts'} sin semana asignada en tu Sheet
                  (${Object.entries(baseMeta.orphans_no_week_by_platform).map(([p,n]) => `${p}: ${n}`).join(', ')})
                  — se excluyen del filtro actual de semana.
                </div>
              </div>
            `}

            ${baseMeta.orphans_no_stage > 0 && filters.stages.length > 0 && html`
              <div className="px-4 md:px-7 mb-3">
                <div className="rounded-lg bg-amber/10 border border-amber/30 px-4 py-2 text-[12px] text-amber">
                  <span className="font-mono uppercase tracking-wider">Nota</span> ·
                  Hay ${baseMeta.orphans_no_stage} ${baseMeta.orphans_no_stage === 1 ? 'post' : 'posts'} sin etapa asignada en tu Sheet

                  — se excluyen del filtro actual de etapa.
                </div>

            ${noResults ? html`

                <h2 className="text-3xl text-txt mb-3 font-medium">No hay posts que cumplan los filtros.</h2>
                <p className="text-txt3 text-sm mb-6">Prueba ampliando el rango de semanas o quitando alguna selección.</p>

                        className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-accent text-ink text-sm font-medium hover:bg-accent2 hover:text-white transition-colors">

                </button>
              </div>
            ` : html`

                <${HeroSection} D=${D}
                  kpis=${html`<${KpiRow} D=${D} onTrace=${(key) => setKpiTrace(computeKpiTrace(D, key))} rawPosts=${allPosts} filters=${filters}/>`} />
                <${InsightsPanel}  D=${D}/>
                <${KpiCuentaSection} D=${D} chartTheme=${chartTheme} filters=${filters} onPick=${setSelected}/>
                <${FollowersSection} filters=${filters} chartTheme=${chartTheme} fetchedAt=${fetchedAt}/>
                <${TrendSection}   D=${D} chartTheme=${chartTheme} setFilters=${setFilters}/>
                <${PlatformsGrid}  D=${D} filters=${filters} setFilters=${setFilters}/>
                <${TopPostsTable}  D=${D} onPick=${setSelected} filters=${filters} benchmarks=${benchmarks} setFilters=${setFilters}/>
                <${VtrSection}         D=${D} onPick=${setSelected}/>
                <${InfluencersSection} D=${D} onPick=${setSelected}/>
                <${ContentMapSection}  D=${D} onPick=${setSelected}/>

                <${GroupBlock} id="analisis" label="Análisis" hint=${ttOnly ? "Mezcla, cadencia, horarios, promedios, comparativas, catálogo, TikTok creativo y simulador" : "Mezcla, cadencia, horarios, promedios, comparativas, catálogo y simulador"}
                  count=${ttOnly ? 8 : 7} open=${!!openGroups.analisis} onToggle=${() => setGroup('analisis', !openGroups.analisis)}>
                  <${MixSection}     D=${D} filters=${filters} setFilters=${setFilters}/>
                  <${CadenceSection}     D=${D}/>
                  <${HorariosSection}    D=${D}/>
                  <${AveragesSection}    D=${D}/>
                  <${ComparativasSection} D=${D} rawPosts=${allPosts} filters=${filters} chartTheme=${chartTheme} setFilters=${setFilters}/>
                  <${CatalogSection}     D=${D} filters=${filters} setFilters=${setFilters}/>
                  ${ttOnly && html`<${TikTokLabSection} D=${D} onPick=${setSelected} chartTheme=${chartTheme} rawPosts=${allPosts} filters=${filters}/>`}
                  <${SimuladorSection}   allPosts=${allPosts}/>
                <//>

                <${GroupBlock} id="control" label="Control" hint=${`Anomalías${anomalyCount ? ` (${anomalyCount})` : ''} y calidad de datos`}
                  count=${2} open=${!!openGroups.control} onToggle=${() => setGroup('control', !openGroups.control)}>
                  <${AnomaliesSection}   D=${D} onPick=${setSelected} rawPosts=${allPosts}/>
                  <${DataQualitySection} D=${D} onPick=${setSelected} rawPosts=${allPosts} onRefresh=${refresh} refreshing=${refreshing} fetchedAt=${fetchedAt}/>
                <//>
              </main>
            `}


            <${Footer} fetchedAt=${fetchedAt} totalPosts=${baseMeta.total_posts}/>
          </div>

          ${selected && html`<${DetailDrawer} post=${selected} benchmarks=${benchmarks} onClose=${() => setSelected(null)}/>`}
          <${AskPanel} open=${askOpen} onClose=${closeAsk} allPosts=${allPosts} onPick=${setSelected} setFilters=${setFilters} drawerOpen=${!!selected} fetchedAt=${fetchedAt}/>
          ${kpiTrace && html`<${KpiTraceDrawer} trace=${kpiTrace} onClose=${() => setKpiTrace(null)} onPick=${(p) => { setKpiTrace(null); setSelected(p); }}/>`}

    function AccountChip() {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const f = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', f); return () => document.removeEventListener('mousedown', f);
      }, []);
      if (!AUTH_ON || !authState.email) return null;
      const initial = (authState.name || authState.email || '?').trim()[0].toUpperCase();
      return html`
        <div ref=${ref} className="relative">
          <button onClick=${() => setOpen(o => !o)} aria-label=${`Cuenta: ${authState.email}`} aria-expanded=${open}
                  className="w-8 h-8 rounded-full overflow-hidden border border-line hover:border-line2 transition-colors flex items-center justify-center bg-accent2/20 text-[12px] text-txt font-medium">
            ${authState.picture ? html`<img src=${authState.picture} alt="" referrerpolicy="no-referrer" className="w-full h-full object-cover"/>` : initial}
          </button>
          ${open && html`
            <div className="absolute right-0 mt-2 w-[260px] rounded-xl border border-line bg-surface shadow-2xl z-50 p-3 fade-in">
              <div className="text-[13px] text-txt truncate">${authState.name}</div>
              <div className="text-[11px] text-txt4 truncate mb-3">${authState.email}</div>
              <button onClick=${() => { setOpen(false); authSignOut(); }} className="w-full h-8 rounded-lg border border-line text-[12px] text-txt2 hover:text-txt hover:border-line2 transition-colors">Cerrar sesión</button>
            </div>`}
        </div>`;
    }
    function Root() {
      const [st, setSt] = useState(() => (!AUTH_ON || authLoad()) ? 'in' : 'out');
      const [err, setErr] = useState(null);
      const [busy, setBusy] = useState(false);
      useEffect(() => {
        const f = (ev) => { if (ev === 'out') { setSt('out'); setErr(authOutMsg); authOutMsg = null; } else if (ev === 'expired') setSt(s => s === 'in' ? 'expired' : s); else if (ev === 'in') setSt('in'); };
        authListeners.add(f); return () => authListeners.delete(f);
      }, []);
      // Aviso 2 min antes de que venza el token (dura ~1 h)
      useEffect(() => {
        if (!AUTH_ON || st !== 'in') return;
        const ms = authState.exp - Date.now() - 120e3;
        const id = setTimeout(() => setSt('expired'), Math.max(1000, ms));
        return () => clearTimeout(id);
      }, [st]);
      const signIn = async () => {
        setBusy(true); setErr(null);
        try { await authSignIn(); setSt('in'); }
        catch (e) { setErr(e.message); }
        finally { setBusy(false); }
      };
      if (st === 'out') return html`<${LoginScreen} error=${err} busy=${busy} onSignIn=${signIn}/>`;
      return html`<${Fragment}><${App}/>${st === 'expired' && html`<${SessionBar} onRenew=${signIn} busy=${busy} error=${err}/>`}<//>`;
    }

    createRoot(document.getElementById('root')).render(html`<${Root}/>`);
  </script>
</body>
</html>
