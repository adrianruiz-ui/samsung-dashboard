    }

    // ============================================================
    // CadenceSection — mapa de calor de cadencia de publicación.
    // Una celda por día del calendario dentro del rango filtrado (estilo
    // "contribuciones" de GitHub): más oscuro = más posts ese día. Los
    // días sin publicar quedan visibles como huecos. Al costado, alcance
    // promedio por día de la semana para ver si conviene publicar en
    // ciertos días.
    // ============================================================
    const WEEKDAY_LABELS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

    function dateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function computeCadence(D) {
      const posts = D.allPosts || [];
      const byDate = new Map();
      for (const p of posts) {
        const d = parseDate(p.date);
        if (!d) continue;
        const key = dateKey(d);
        if (!byDate.has(key)) byDate.set(key, { date: d, posts: 0, reach: 0 });
        const rec = byDate.get(key);
        rec.posts += 1;
        rec.reach += p.reach || 0;
      }
      if (byDate.size === 0) return null;

      const withDates = [...byDate.values()].map(r => r.date);
      const minDate = D.meta?.date_min_scope || withDates.reduce((a, b) => a < b ? a : b);
      const maxDate = D.meta?.date_max_scope || withDates.reduce((a, b) => a > b ? a : b);

      // Alinea el inicio de la cuadrícula al domingo anterior para que
      // las columnas (semanas) queden parejas
      const start = new Date(minDate);
      start.setDate(start.getDate() - start.getDay());
      const end = new Date(maxDate);

      const days = [];
      const cursor = new Date(start);
      while (cursor <= end) {
        const key = dateKey(cursor);
        const rec = byDate.get(key);
        days.push({
          date: new Date(cursor),
          dow: cursor.getDay(),
          posts: rec ? rec.posts : 0,
          reach: rec ? rec.reach : 0,
          inRange: cursor >= minDate && cursor <= maxDate,
        });
        cursor.setDate(cursor.getDate() + 1);
      }

      const weeks = [];
      for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

      const byWeekday = WEEKDAY_LABELS.map((label, dow) => {
        const cells = days.filter(d => d.dow === dow && d.inRange && d.posts > 0);
        const postsCount = cells.reduce((s, d) => s + d.posts, 0);
        const reachSum = cells.reduce((s, d) => s + d.reach, 0);
        return { dow, label, posts: postsCount, avgReachPerPost: postsCount > 0 ? reachSum / postsCount : 0 };
      });

      const maxPostsInDay = Math.max(1, ...days.map(d => d.posts));

      return { weeks, byWeekday, maxPostsInDay };
    }

    function cadenceCellStyle(posts, maxPosts, inRange) {
      if (!inRange) return { visibility: 'hidden' };
      if (posts === 0) return { background: 'var(--cad-empty)' };
      const ratio = Math.min(1, posts / maxPosts).toFixed(3);
      // v65 — color por tema vía CSS vars (sin re-render al cambiar tema; html2canvas lee el valor ya resuelto)
      return { background: `rgba(var(--cad-ink), calc(var(--cad-a0) + var(--cad-span) * ${ratio}))` };
    }

    function CadenceHeatmap({ cadence }) {
      const { weeks, maxPostsInDay } = cadence;
      // Rejilla: 1ª columna = día, luego una columna por semana. Las celdas crecen
      // hasta llenar la tarjeta (con tope, para que pocas semanas no se vean gigantes).
      const monthOf = (w) => { const d = w.find(x => x.inRange) || w[0]; return d ? d.date.getMonth() : null; };
      const MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      const cols = `auto repeat(${weeks.length}, minmax(9px, 22px))`;
      return html`
        <div className="overflow-x-auto pb-1">
          <div style=${{ display: 'grid', gridTemplateColumns: cols, gap: 4, alignItems: 'center' }}>
            <div></div>
            ${weeks.map((w, wi) => { const m = monthOf(w); const prev = wi ? monthOf(weeks[wi - 1]) : null;
              return html`<div key=${'m' + wi} className="text-[11px] text-txt4 leading-none whitespace-nowrap overflow-visible pb-1" style=${{ width: 0 }}>${m !== prev && !(wi === 0 && weeks.length > 1 && monthOf(weeks[1]) !== m) ? MES[m] : ''}</div>`; })}
            ${WEEKDAY_LABELS.map((l, di) => html`
              <${Fragment} key=${'r' + di}>
                <div className="text-[11px] text-txt4 leading-none pr-2">${l}</div>
                ${weeks.map((week, wi) => { const day = week[di];
                  return html`<div key=${wi}
                    title=${day && day.inRange ? `${dateShort(day.date)} · ${day.posts} post${day.posts === 1 ? '' : 's'}${day.posts ? ` · ${fmt(day.reach)} alcance` : ''}` : undefined}
                    className="wave"
                    style=${{ width: '100%', aspectRatio: '1 / 1', borderRadius: 4, '--wd': `${wi * 16 + di * 30}ms`, ...(day ? cadenceCellStyle(day.posts, maxPostsInDay, day.inRange) : { visibility: 'hidden' }) }}></div>`; })}
              <//>`)}
          </div>
          <div className="flex items-center gap-1.5 mt-5 text-[11px] text-txt4">
            <span className="mr-1">Menos</span>
            ${[0, 0.25, 0.5, 0.75, 1].map((r, i) => html`<span key=${i} style=${{ width: 12, height: 12, borderRadius: 3, ...cadenceCellStyle(r === 0 ? 0 : Math.max(1, r * maxPostsInDay), maxPostsInDay, true) }}></span>`)}
            <span className="ml-1">Más publicaciones</span>
          </div>
        </div>`;
    }

    function WeekdayBars({ byWeekday }) {
      const max = Math.max(1, ...byWeekday.map(d => d.avgReachPerPost));
      return html`
        <div className="rounded-xl bg-surface border border-line p-5 h-full">
          <div className="text-[10px] font-mono uppercase tracking-[0.18em] text-txt4 mb-4">Alcance promedio por día de publicación</div>
          <div className="space-y-2.5">
            ${byWeekday.map(d => html`
              <div key=${d.dow} className="grid grid-cols-12 items-center gap-3">
                <div className="col-span-3 text-[11px] font-mono text-txt3">${d.label}</div>
                <div className="col-span-6 relative h-5 rounded bg-onSurface/[0.04] overflow-hidden">
                  <div className="absolute left-0 top-0 bar-grow h-full rounded bg-accent2"
                       style=${{ width: `${(d.avgReachPerPost / max * 100).toFixed(1)}%` }}></div>
                </div>
                <div className="col-span-3 text-right font-mono text-[11px] text-txt2 tabular-nums">${d.posts ? fmt(d.avgReachPerPost) : '—'}</div>
              </div>
            `)}
          </div>
          <div className="text-[11px] text-txt4 mt-4 leading-relaxed">Alcance promedio por publicación, según el día en que se publicó (filtro actual).</div>
        </div>`;
    }

    function CadenceSection({ D }) {
      const cadence = useMemo(() => computeCadence(D), [D]);
      return html`
        <section id="sec-cadencia" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-cadencia" name="Cadencia" />
          <div className="mb-5">
            <h2 className="text-[18px] font-medium text-txt">Cadencia de publicación</h2>
            <p className="text-txt4 text-[12px] mt-1">Un cuadro por día — mientras más oscuro, más publicaciones. Útil para detectar huecos y comparar rendimiento por día de la semana.</p>
          </div>

          ${!cadence ? html`
            <div className="rounded-xl bg-surface border border-line border-dashed p-8 text-center">
              <div className="text-txt3 text-[13px] mb-1">Sin fechas suficientes en este filtro</div>
            </div>
          ` : html`
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
              <div className="lg:col-span-8 rounded-xl bg-surface border border-line p-6 flex flex-col">
                <div className="text-[13px] font-medium text-txt mb-4">Publicaciones por día</div>
                <div className="flex-1 flex flex-col justify-center"><${CadenceHeatmap} cadence=${cadence} /></div>
              </div>
              <div className="lg:col-span-4">
                <${WeekdayBars} byWeekday=${cadence.byWeekday} />
              </div>
            </div>
          `}
        </section>`;
    }

    // ============================================================
    // v29 — HORARIOS: mejor hora para publicar.
    // La base no registra la hora, pero el ID de la publicación sí la
    // trae en varias plataformas (validado contra la columna Fecha: ~98%
    // coincide al día). TikTok, X y LinkedIn guardan el segundo exacto en
    // los bits altos del ID; Instagram y Threads en el shortcode (ID de
    // Meta con época propia). Facebook y YouTube no se pueden: su ID no
    // contiene la hora. Todo se calcula en el navegador, sin APIs.
    // ============================================================
    const PT_B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    const POSTTIME_PLATS = ['Instagram', 'TikTok', 'X', 'Threads', 'LinkedIn'];
    const _ptCache = new Map();
    function postTimestamp(link) {
      const l = (link || '').trim();
      if (!l) return null;
      if (_ptCache.has(l)) return _ptCache.get(l);
      let ms = null, m;
      try {
        if ((m = l.match(/tiktok\.com\/.*\/(?:video|photo)\/(\d{15,})/i))) ms = Number(BigInt(m[1]) >> 32n) * 1000;
        else if ((m = l.match(/(?:instagram\.com|threads\.(?:com|net))\/(?:[^/]+\/)?(?:p|reel|reels|post|tv)\/([A-Za-z0-9_-]{11})/i))) {
          let n = 0n; for (const ch of m[1]) n = n * 64n + BigInt(PT_B64.indexOf(ch));
          ms = Number(n >> 23n) + 1314220021721;
        }
        else if ((m = l.match(/(?:x|twitter)\.com\/[^/]+\/status\/(\d+)/i))) ms = Number(BigInt(m[1]) >> 22n) + 1288834974657;
        else if ((m = l.match(/(?:activity|share|ugcPost)[:-](\d{19})/i))) ms = Number(BigInt(m[1]) >> 22n);
      } catch { ms = null; }
      if (ms != null) { const y = new Date(ms).getUTCFullYear(); if (y < 2020 || y > 2030) ms = null; }
      _ptCache.set(l, ms);
      return ms;
    }
    const _mxFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Mexico_City', hour: 'numeric', hourCycle: 'h23', weekday: 'short' });
    const WD_IDX = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    const WD_ES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    function mxDayHour(ms) {
      const parts = _mxFmt.formatToParts(new Date(ms));
      const h = +parts.find(p => p.type === 'hour').value % 24;
      const d = WD_IDX[parts.find(p => p.type === 'weekday').value];
      return { d, h };
    }
    const HOUR_BANDS = [[6, 9], [9, 12], [12, 14], [14, 16], [16, 18], [18, 20], [20, 22], [22, 30]];
    const bandOf = (h) => { const hh = h < 6 ? h + 24 : h; return HOUR_BANDS.findIndex(([a, b]) => hh >= a && hh < b); };
    const bandLabel = (i) => { const [a, b] = HOUR_BANDS[i]; return `${a}–${b > 24 ? (b - 24) : b} h`; };
    const HORA_METRICS = [
      { k: 'ber',   l: 'ER básico',      f: (p) => (p.basic_er != null && !(p._flags || []).includes('er')) ? p.basic_er : null, fmtv: (v) => erFmt(v) },
      { k: 'reach', l: 'Alcance',        f: (p) => p.reach || null, fmtv: (v) => fmtFull(v) },
      { k: 'inter', l: 'Interacciones',  f: (p) => p.interactions || null, fmtv: (v) => fmtFull(v) },
    ];
    const HORA_MIN_N = 4;      // mínimo para pintar una celda
    const HORA_TOP_N = 8;      // mínimo para recomendar una franja
    const hMedian = (arr) => { if (!arr.length) return null; const a = [...arr].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };

    function computeHorarios(posts, metricK, plat, scope) {
      const M = HORA_METRICS.find(m => m.k === metricK) || HORA_METRICS[0];
      const eligible = posts.filter(p => POSTTIME_PLATS.includes(p.platform));
      const rows = [];
      for (const p of eligible) {
        if (plat !== 'all' && p.platform !== plat) continue;
        const paid = isPaidP(p);
        if (scope === 'org' && paid) continue;
        if (scope === 'paid' && !paid) continue;
        const v = M.f(p); if (v == null || !(v > 0)) continue;
        const ms = postTimestamp(p.link); if (ms == null) continue;
        rows.push({ p, v, ...mxDayHour(ms) });
      }
      // Índice vs. lo típico de su plataforma + formato (1.00 = típico)
      const segVals = new Map();
      for (const r of rows) { const k = r.p.platform + '|' + (r.p.format || ''); if (!segVals.has(k)) segVals.set(k, []); segVals.get(k).push(r.v); }
      const segMed = new Map([...segVals].map(([k, a]) => [k, hMedian(a)]));
      for (const r of rows) { const md = segMed.get(r.p.platform + '|' + (r.p.format || '')); r.idx = md ? r.v / md : null; r.b = bandOf(r.h); }
      const valid = rows.filter(r => r.idx != null && r.b >= 0);
      const cell = (list) => ({ n: list.length, idx: list.length ? hMedian(list.map(r => r.idx)) : null, val: list.length ? hMedian(list.map(r => r.v)) : null });
      const grid = WD_ES.map((_, d) => HOUR_BANDS.map((__, b) => cell(valid.filter(r => r.d === d && r.b === b))));
      const byBand = HOUR_BANDS.map((_, b) => cell(valid.filter(r => r.b === b)));
      const byDay = WD_ES.map((_, d) => cell(valid.filter(r => r.d === d)));
      const byHour = Array.from({ length: 24 }, (_, h) => valid.filter(r => r.h === h).length);
      const top = [];
      grid.forEach((row, d) => row.forEach((c, b) => { if (c.n >= HORA_TOP_N) top.push({ d, b, ...c }); }));
      top.sort((a, b) => b.idx - a.idx);
      const perPlat = POSTTIME_PLATS.map(pl => {
        const list = valid.filter(r => r.p.platform === pl);
        const bands = HOUR_BANDS.map((_, b) => ({ b, ...cell(list.filter(r => r.b === b)) })).filter(x => x.n >= HORA_TOP_N);
        bands.sort((a, b) => b.idx - a.idx);
        const busiest = HOUR_BANDS.map((_, b) => ({ b, n: list.filter(r => r.b === b).length })).sort((a, b) => b.n - a.n)[0];
        return { platform: pl, n: list.length, best: bands[0] || null, worst: bands.length > 1 ? bands[bands.length - 1] : null, busiest };
      }).filter(x => x.n > 0);
      const totalEligible = posts.filter(p => POSTTIME_PLATS.includes(p.platform)).length;
      const excluded = posts.filter(p => !POSTTIME_PLATS.includes(p.platform)).length;
      return { M, n: valid.length, grid, byBand, byDay, byHour, top: top.slice(0, 3), perPlat, totalEligible, excluded,
               decoded: posts.filter(p => POSTTIME_PLATS.includes(p.platform) && postTimestamp(p.link) != null).length };
    }

    function HorariosSection({ D }) {
      const [metric, setMetric] = useState('ber');
      // v60 — la plataforma se elige con el filtro general (antes había un selector propio que lo duplicaba)
      const plat = 'all';
      const [scope, setScope] = useState('org');
      const H = useMemo(() => computeHorarios(D.allPosts || [], metric, plat, scope), [D, metric, scope]);
      const idxTxt = (x) => x == null ? '—' : (x >= 1 ? '+' : '') + Math.round((x - 1) * 100) + '%';
      const heat = (c) => {
        if (!c.n) return { background: 'transparent' };
        if (c.n < HORA_MIN_N) return { background: 'rgb(var(--c-txt) / 0.04)' };
        const t = Math.max(-1, Math.min(1, Math.log2(c.idx)));      // -1 = mitad de lo típico, +1 = doble
        return t >= 0
          ? { background: `rgba(93, 202, 165, ${0.15 + 0.7 * t})` }
          : { background: `rgba(240, 179, 88, ${0.15 + 0.6 * -t})` };
      };
      const seg = (opts, cur, set, label) => html`
        <div className="inline-flex items-center rounded-lg bg-onSurface/[0.04] p-0.5 flex-wrap" role="radiogroup" aria-label=${label}>
          ${opts.map(([k, l]) => html`
            <button key=${k} role="radio" aria-checked=${cur === k} onClick=${() => set(k)}
                    className=${"px-2.5 py-1 rounded-md text-[11px] transition-colors " + (cur === k ? "bg-surface text-txt shadow-sm" : "text-txt3 hover:text-txt")}>${l}</button>`)}
        </div>`;

      return html`
        <section id="sec-horarios" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-horarios" name="Horarios" />
          <div className="mb-5">
            <h2 className="text-[18px] font-medium text-txt">Mejores horarios para publicar</h2>
            <p className="text-txt4 text-[12px] mt-1 max-w-3xl">
              La hora se obtiene del link de cada publicación (hora de Ciudad de México). Cada franja se compara contra lo típico de su misma plataforma y formato, así un Reel no compite contra un tuit.
              Facebook y YouTube no se incluyen: su link no contiene la hora.
            </p>
          </div>

          <div className="flex flex-wrap items-center gap-2 mb-4">
            ${seg(HORA_METRICS.map(m => [m.k, m.l]), metric, setMetric, 'Métrica')}
            ${seg([['org', 'Orgánico'], ['paid', 'Pauta'], ['all', 'Todos']], scope, setScope, 'Pauta')}
          </div>

          ${H.n < 12 ? html`
            <div className="rounded-xl bg-surface p-8 text-center text-txt3 text-[13px]">
              Muy pocos posts con hora en este filtro (${H.n}). Amplía el periodo o cambia Orgánico/Pauta.
            </div>` : html`
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
            <div className="lg:col-span-8 rounded-xl bg-surface p-5 overflow-x-auto">
              <div className="text-[13px] font-medium text-txt mb-1">${H.M.l} por día y hora</div>
              <div className="text-[11px] text-txt4 mb-4">Verde: rinde arriba de lo típico · ámbar: abajo · gris: menos de ${HORA_MIN_N} posts (sin lectura) · el número es cuántos posts hay en la franja</div>
              <table className="no-zebra w-full min-w-[560px] border-separate" style=${{ borderSpacing: 4 }}>
                <thead>
                  <tr>
                    <th></th>
                    ${HOUR_BANDS.map((_, b) => html`<th key=${b} scope="col" className="text-[10px] font-mono font-normal text-txt4 pb-1">${bandLabel(b)}</th>`)}
                  </tr>
                </thead>
                <tbody>
                  ${H.grid.map((row, d) => html`
                    <tr key=${d} style=${{ background: 'transparent' }}>
                      <th scope="row" className="text-[11px] font-normal text-txt3 text-left pr-2">${WD_ES[d]}</th>
                      ${row.map((c, b) => html`
                        <td key=${b} className="wave rounded-md text-center align-middle h-10"
                            style=${{ ...heat(c), '--wd': `${(d + b) * 45}ms` }}
                            title=${c.n ? `${WD_ES[d]} ${bandLabel(b)} · ${c.n} posts · mediana ${H.M.fmtv(c.val)} · ${idxTxt(c.idx)} vs. típico` : `${WD_ES[d]} ${bandLabel(b)} · sin posts`}>
                          ${c.n >= HORA_MIN_N
                            ? html`<div className="text-[11px] font-medium text-txt tabular-nums leading-tight">${idxTxt(c.idx)}</div><div className="text-[9px] font-mono text-txt3">${c.n}</div>`
                            : c.n ? html`<div className="text-[9px] font-mono text-faint">${c.n}</div>` : ''}
                        </td>`)}
                    </tr>`)}
                </tbody>
              </table>
            </div>

            <div className="lg:col-span-4 flex flex-col gap-3">
              <div className="rounded-xl bg-surface p-5">
                <div className="text-[13px] font-medium text-txt">Mejores franjas</div>
                <div className="text-[11px] text-txt4 mb-3">Mediana vs. lo típico de su plataforma y formato · solo franjas con ${HORA_TOP_N}+ posts</div>
                ${H.top.length === 0 ? html`<div className="text-[12px] text-txt4">Ninguna franja junta ${HORA_TOP_N}+ posts todavía.</div>`
                  : H.top.map((t, i) => html`
                    <div key=${i} className="flex items-baseline justify-between gap-3 py-1.5">
                      <div className="text-[13px] text-txt"><span className="text-txt4 font-mono text-[11px] mr-2">${i + 1}</span>${WD_ES[t.d]} · ${bandLabel(t.b)}</div>
                      <div className="text-right">
                        <div className="text-[13px] text-success tabular-nums">${idxTxt(t.idx)}</div>
                        <div className="text-[10px] font-mono text-txt4">${t.n} posts</div>
                      </div>
                    </div>`)}
              </div>
              <div className="rounded-xl bg-surface p-5">
                <div className="text-[13px] font-medium text-txt">Mejor franja por plataforma</div>
                <div className="text-[11px] text-txt4 mb-3">Franjas con ${HORA_TOP_N}+ posts</div>
                ${H.perPlat.map(pp => html`
                  <div key=${pp.platform} className="py-1.5">
                    <div className="flex items-center justify-between gap-2">
                      <span className="inline-flex items-center gap-2 text-[12px] text-txt2">
                        <svg width="8" height="8" viewBox="0 0 8 8" className="shrink-0" aria-hidden="true"><circle cx="4" cy="4" r="4" fill=${PLAT_COLORS[pp.platform]} /></svg>
                        ${pp.platform}
                      </span>
                      <span className="text-[12px] tabular-nums ${''}">
                        ${pp.best ? html`<span className="text-txt">${bandLabel(pp.best.b)}</span> <span className="text-success">${idxTxt(pp.best.idx)}</span>` : html`<span className="text-txt4">sin muestra suficiente</span>`}
                      </span>
                    </div>
                    <div className="text-[10px] font-mono text-txt4 mt-0.5 pl-8">
                      <span className="whitespace-nowrap">${pp.n} posts</span> · <span className="whitespace-nowrap">donde más publican: ${pp.busiest && pp.busiest.n ? bandLabel(pp.busiest.b) : '—'}</span>
                    </div>
                  </div>`)}
              </div>
            </div>

          </div>`}
        </section>`;
    }


    // ============================================================
    // v53 — KPIs DE CUENTA (metas fijas del cliente)
    //  · VTR ≥ 25% en videos de 0 a 30 s, todas las plataformas.
    //    Promedio simple de VTR (como la press), sin Stories.
    //  · Instagram: ER básico ≥ 5%, promedio simple por post (sin Stories y
    //    sin posts con ER imposible). Ponderado por alcance no sirve aquí: los
    //    posts con pauta tienen millones de alcance y aplastan el resultado.
    // Respeta los filtros del dashboard.
    // ============================================================
    const KPI_VTR_MIN = 25, KPI_VTR_MAXDUR = 30, KPI_IG_ER_MIN = 5;
    const kpiIsVid = (p) => p.format !== 'Stories' && p.vtr > 0 && p.duration > 0 && p.duration <= KPI_VTR_MAXDUR;
    const kpiIsIg = (p) => p.platform === 'Instagram' && p.format !== 'Stories' && p.reach > 0 && p.basic_er != null && !(p._flags || []).includes('er');
    const kpiVtr = (list) => list.length ? list.reduce((a, p) => a + p.vtr, 0) / list.length : null;
    const kpiBer = (list) => list.length ? list.reduce((a, p) => a + p.basic_er, 0) / list.length : null;

    function KpiCuentaSection({ D, chartTheme, filters, onPick }) {
      const ct = chartTheme || CHART_VARS;
      const all = D.allPosts || [];
      const vids = all.filter(kpiIsVid);
      const ig = all.filter(kpiIsIg);
      const igApplies = !(filters && filters.platforms && filters.platforms.length && !filters.platforms.includes('Instagram'));
      const vtr = kpiVtr(vids), ber = kpiBer(ig);
      const vOk = vids.filter(p => p.vtr >= KPI_VTR_MIN).length;
      const iOk = ig.filter(p => p.basic_er >= KPI_IG_ER_MIN).length;
      const byWeek = (list, f) => {
        const m = new Map();
        for (const p of list) { if (p.wk == null) continue; if (!m.has(p.wk)) m.set(p.wk, []); m.get(p.wk).push(p); }
        const keys = [...m.keys()].sort((a, b) => a - b);
        const my = multiYear(keys);
        return keys.map(k => ({ k, label: wkLabel(k, my), v: f(m.get(k)), n: m.get(k).length }));
      };
      const wV = byWeek(vids, kpiVtr), wI = byWeek(ig, kpiBer);
      const lastOf = (w) => w.length ? w[w.length - 1] : null;
      const weeksOk = (w, min) => w.filter(x => x.v != null && x.v >= min).length;
      const plats = [...new Set(vids.map(p => p.platform))].map(pl => {
        const l = vids.filter(p => p.platform === pl);
        return { pl, n: l.length, v: kpiVtr(l), ok: l.filter(p => p.vtr >= KPI_VTR_MIN).length };
      }).sort((a, b) => b.n - a.n);
      const fmts = [...new Set(ig.map(p => p.format || 'Sin formato'))].map(f => {
        const l = ig.filter(p => (p.format || 'Sin formato') === f);
        return { f, n: l.length, v: kpiBer(l), ok: l.filter(p => p.basic_er >= KPI_IG_ER_MIN).length };
      }).sort((a, b) => b.n - a.n);
      const pctTxt = (v) => v == null ? '—' : `${v.toFixed(2)}%`;
      const gapTxt = (v, min) => v == null ? '' : v >= min ? `+${(v - min).toFixed(2)} pts arriba de la meta` : `faltan ${(min - v).toFixed(2)} pts para la meta`;
      const Pill = ({ ok }) => html`<span className=${"pop-in text-[11px] font-medium rounded-full px-2.5 py-0.5 whitespace-nowrap shrink-0 " + (ok ? "bg-success/15 text-success" : "bg-amber/15 text-amber")}>${ok ? 'Cumple' : 'No cumple'}</span>`;
      const Dot = ({ ok }) => html`<span className=${"inline-block w-2 h-2 rounded-full " + (ok ? "bg-success" : "bg-amber")}></span>`;

      const Trend = ({ data, min, name, yMax = Math.ceil(Math.max(min * 1.4, ...data.map(d => d.v || 0)) / 20) * 20 }) => data.length < 2 ? html`<div className="text-[12px] text-txt4 py-8 text-center">Hace falta más de una semana en el filtro para ver la tendencia.</div>` : html`
        <div style=${{ height: 170 }}>
          <${ResponsiveContainer} width="100%" height="100%">
            <${LineChart} data=${data} margin=${{ top: 8, right: 12, left: 0, bottom: 0 }}>
              <${CartesianGrid} vertical=${false} />
              <${XAxis} dataKey="label" stroke=${ct.axis} fontSize=${10} tickLine=${false} axisLine=${false} interval="preserveStartEnd" minTickGap=${18} />
              <${YAxis} stroke=${ct.axis} fontSize=${10} tickLine=${false} axisLine=${false} width=${40} tickFormatter=${(v) => `${v.toFixed(0)}%`} allowDecimals=${false} domain=${[0, yMax]} ticks=${[0, yMax / 4, yMax / 2, yMax * 3 / 4, yMax]} />
              <${Tooltip} content=${({ active, payload }) => {
                if (!active || !payload || !payload.length) return null;
                const e = payload[0].payload;
                return html`<div style=${{ background: ct.tooltipBg, border: `1px solid ${ct.tooltipBorder}`, borderRadius: 8, padding: '8px 12px', fontSize: 11, color: ct.tooltipText }}>
                  <div style=${{ color: ct.tooltipLabel }}>${wkLong(e.k)}</div>
                  <div>${name} ${pctTxt(e.v)} · ${e.n} ${e.n === 1 ? 'post' : 'posts'}</div>
                  <div style=${{ color: e.v >= min ? '#3DBE8B' : '#F0B358' }}>${e.v >= min ? 'Cumple' : 'No cumple'} la meta de ${min}%</div></div>`;
              }} />
              <${ReferenceLine} y=${min} stroke="#3DBE8B" strokeDasharray="5 4" strokeOpacity=${0.8} />
              <${Line} type="monotone" dataKey="v" stroke="#4C6EF5" strokeWidth=${2} isAnimationActive=${true} animationDuration=${1200} animationEasing="ease-out"
                dot=${(pr) => html`<circle key=${pr.index} cx=${pr.cx} cy=${pr.cy} r=${3.2} fill=${pr.payload.v >= min ? '#3DBE8B' : '#F0B358'} />`} />
            <//>
          <//>
        </div>
        <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[11px] text-txt3">
          <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style=${{ background: '#3DBE8B' }}></span>Semana que cumple</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style=${{ background: '#F0B358' }}></span>Semana que no cumple</span>
          <span className="inline-flex items-center gap-1.5"><span style=${{ width: 14, borderTop: '2px dashed #3DBE8B' }}></span>Meta ${min}%</span>
        </div>`;

      const Stat = ({ label, value }) => html`<div className="min-w-0"><div className="text-[11px] text-txt4">${label}</div><div className="text-[14px] text-txt tabular-nums mt-0.5">${value}</div></div>`;

      return html`
        <section id="sec-kpis" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-kpis" name="KPIs" />
          <div className="mb-5">
            <h2 className="text-[18px] font-medium text-txt">KPIs de cuenta</h2>
            <p className="text-txt4 text-[12px] mt-1 max-w-3xl">Metas fijas de la cuenta. VTR mínimo de ${KPI_VTR_MIN}% en videos de 0 a ${KPI_VTR_MAXDUR} s en todas las plataformas, y ER básico mínimo de ${KPI_IG_ER_MIN}% en Instagram. No se cuentan Stories. Respeta los filtros activos.</p>
          </div>
          <div className=${"grid grid-cols-1 gap-3 " + (igApplies ? "xl:grid-cols-2" : "")}>
            <div className="rounded-xl bg-surface p-6 min-w-0">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <div className="text-[13px] font-medium text-txt">VTR en videos de 0 a ${KPI_VTR_MAXDUR} s</div>
                  <div className="text-[11px] text-txt4">Todas las plataformas, incluye Shorts · promedio por video · meta ${KPI_VTR_MIN}%</div>
                </div>
                ${vtr != null && html`<${Pill} ok=${vtr >= KPI_VTR_MIN} />`}
              </div>
              ${!vids.length ? html`<div className="text-[12px] text-txt4 py-8">No hay videos de 0 a ${KPI_VTR_MAXDUR} s con VTR en el filtro actual.</div>` : html`
                <div className="flex flex-wrap items-baseline gap-x-4 gap-y-1 mt-3">
                  <div className=${"text-[34px] font-medium tabular-nums leading-none " + (vtr >= KPI_VTR_MIN ? 'text-success' : 'text-amber')}><${CountUp} value=${vtr} format=${pctTxt} /></div>
                  <div className="text-[12px] text-txt3">${gapTxt(vtr, KPI_VTR_MIN)}</div>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-5">
                  <${Stat} label="Videos" value=${fmtFull(vids.length)} />
                  <${Stat} label=${`Llegan a ${KPI_VTR_MIN}% solos`} value=${`${Math.round(vOk / vids.length * 100)}%`} />
                  <${Stat} label="Semanas que cumplen" value=${wV.length ? `${weeksOk(wV, KPI_VTR_MIN)} de ${wV.length}` : '—'} />
                  <${Stat} label=${lastOf(wV) ? `Última semana · ${wkLabel(lastOf(wV).k)}` : 'Última semana'} value=${lastOf(wV) ? pctTxt(lastOf(wV).v) : '—'} />
                </div>
                <div className="mt-6"><${Trend} data=${wV} min=${KPI_VTR_MIN} name="VTR" /></div>
                <div className="overflow-x-auto mt-6"><table className="w-full text-[12px] whitespace-nowrap">
                  <thead><tr><th className="text-left py-2 px-2">Plataforma</th><th className="text-right py-2 px-2">Videos</th><th className="text-right py-2 px-2">VTR prom.</th><th className="text-right py-2 px-2">Cumplen solos</th><th className="text-right py-2 px-2">Estado</th></tr></thead>
                  <tbody>
                    ${plats.map(r => html`<tr key=${r.pl}>
                      <td className="py-2 px-2"><span className="inline-flex items-center gap-2"><svg width="8" height="8" viewBox="0 0 8 8" className="shrink-0" aria-hidden="true"><circle cx="4" cy="4" r="4" fill=${PLAT_COLORS[r.pl]} /></svg>${r.pl}</span></td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(r.n)}</td>
                      <td className=${"py-2 px-2 text-right tabular-nums " + (r.v >= KPI_VTR_MIN ? 'text-success' : 'text-amber')}>${pctTxt(r.v)}</td>
                      <td className="py-2 px-2 text-right tabular-nums text-txt3">${Math.round(r.ok / r.n * 100)}%</td>
                      <td className="py-2 px-2 text-right"><${Dot} ok=${r.v >= KPI_VTR_MIN} /></td>
                    </tr>`)}
                  </tbody>
                </table></div>`}
            </div>

            ${igApplies && html`<div className="rounded-xl bg-surface p-6 min-w-0">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <div className="text-[13px] font-medium text-txt">ER básico en Instagram</div>
                  <div className="text-[11px] text-txt4">Toda la cuenta, solo feed (sin Stories) · promedio por post · meta ${KPI_IG_ER_MIN}%</div>
                </div>
                ${igApplies && ber != null && html`<${Pill} ok=${ber >= KPI_IG_ER_MIN} />`}
              </div>
              ${!ig.length ? html`<div className="text-[12px] text-txt4 py-8">No hay posts de Instagram (sin Stories) en el filtro actual.</div>` : html`
                <div className="flex flex-wrap items-baseline gap-x-4 gap-y-1 mt-3">
                  <div className=${"text-[34px] font-medium tabular-nums leading-none " + (ber >= KPI_IG_ER_MIN ? 'text-success' : 'text-amber')}><${CountUp} value=${ber} format=${pctTxt} /></div>
                  <div className="text-[12px] text-txt3">${gapTxt(ber, KPI_IG_ER_MIN)}</div>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-5">
                  <${Stat} label="Posts" value=${fmtFull(ig.length)} />
                  <${Stat} label=${`Llegan a ${KPI_IG_ER_MIN}% solos`} value=${`${Math.round(iOk / ig.length * 100)}%`} />
                  <${Stat} label="Semanas que cumplen" value=${wI.length ? `${weeksOk(wI, KPI_IG_ER_MIN)} de ${wI.length}` : '—'} />
                  <${Stat} label=${lastOf(wI) ? `Última semana · ${wkLabel(lastOf(wI).k)}` : 'Última semana'} value=${lastOf(wI) ? pctTxt(lastOf(wI).v) : '—'} />
                </div>
                <div className="mt-6"><${Trend} data=${wI} min=${KPI_IG_ER_MIN} name="ER básico" /></div>
                <div className="overflow-x-auto mt-6"><table className="w-full text-[12px] whitespace-nowrap">
                  <thead><tr><th className="text-left py-2 px-2">Formato</th><th className="text-right py-2 px-2">Posts</th><th className="text-right py-2 px-2">ER básico</th><th className="text-right py-2 px-2">Cumplen solos</th><th className="text-right py-2 px-2">Estado</th></tr></thead>
                  <tbody>
                    ${fmts.map(r => html`<tr key=${r.f}>
                      <td className="py-2 px-2 text-txt2">${r.f}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(r.n)}</td>
                      <td className=${"py-2 px-2 text-right tabular-nums " + (r.v >= KPI_IG_ER_MIN ? 'text-success' : 'text-amber')}>${pctTxt(r.v)}</td>
                      <td className="py-2 px-2 text-right tabular-nums text-txt3">${Math.round(r.ok / r.n * 100)}%</td>
                      <td className="py-2 px-2 text-right"><${Dot} ok=${r.v >= KPI_IG_ER_MIN} /></td>
                    </tr>`)}
                  </tbody>
                </table></div>`}
            </div>`}
          </div>
          ${!igApplies && html`<p className="text-[12px] text-txt4 mt-3">El KPI de ER básico es solo de Instagram; aparece al incluirla en el filtro de plataforma.</p>`}
        </section>`;
    }

    // ============================================================
    // v44 — FOLLOWERS POR PLATAFORMA: todas las cuentas, tengan o no meta.
    // Fuente: pestaña Followers (total semanal por cuenta). Como las cuentas
    // tienen tamaños muy distintos (Facebook 5 M vs Threads 200 K), la
    // gráfica compara el crecimiento en % desde la S1 de 2026.
    // ============================================================
    const FOL_ACCOUNT_COLOR = (n) => /facebook/i.test(n) ? PLAT_COLORS.Facebook : /instagram/i.test(n) ? PLAT_COLORS.Instagram
      : /tiktok/i.test(n) ? PLAT_COLORS.TikTok : /youtube/i.test(n) ? PLAT_COLORS.YouTube : /linkedin/i.test(n) ? PLAT_COLORS.LinkedIn
      : /threads/i.test(n) ? '#8B8B95' : /mobile/i.test(n) ? '#9CA3AF' : /x \|/i.test(n) ? '#4B5563' : '#999999';
    const FOL_ACCOUNT_LABEL = (n) => /samsungmexico/i.test(n) ? 'X · Samsung México' : /samsungmobile/i.test(n) ? 'X · Samsung Mobile' : n;

    // Cuenta de la pestaña Followers → plataforma (las dos cuentas de X cuentan como X)
    const FOL_PLATFORM = (n) => /facebook/i.test(n) ? 'Facebook' : /instagram/i.test(n) ? 'Instagram' : /tiktok/i.test(n) ? 'TikTok'
      : /youtube/i.test(n) ? 'YouTube' : /linkedin/i.test(n) ? 'LinkedIn' : /threads/i.test(n) ? 'Threads'
      : /samsungmexico|samsungmobile|^x\b|x \||twitter/i.test(n) ? 'X' : null;
    const folPlatSel = (filters) => (filters && filters.platforms && filters.platforms.length ? filters.platforms : null);
    const folPlatTxt = (sel) => sel.length === 1 ? sel[0] : sel.length === 2 ? sel.join(' y ') : `${sel.slice(0, -1).join(', ')} y ${sel[sel.length - 1]}`;

    function FollowersSection({ filters, chartTheme, fetchedAt }) {
      const ct = chartTheme || CHART_VARS;
      const [state, setState] = useState({ loading: true });
      const [mode, setMode] = useState('pct');
      useEffect(() => {
        let alive = true;
        fetchPressFollowers().then(r => alive && setState({ data: r })).catch(e => alive && setState({ error: e?.message || 'error' }));
        return () => { alive = false; };
      }, [fetchedAt]);
      const platSel = folPlatSel(filters);
      // Con filtro de plataforma, solo se analizan las cuentas de esas plataformas
      const F = state.data && platSel ? { ...state.data, series: state.data.series.filter(s => platSel.includes(FOL_PLATFORM(s.name))) } : state.data;
      const lastW = F ? Math.max(0, ...F.series.map(s => s.vals.length)) : 0;
      // Semana de referencia: la elegida en el filtro (si es una sola de 2026) o la última con datos
      const selW = filters && filters.weeks && filters.weeks.length === 1 && wkYear(filters.weeks[0]) === PRESS_YEAR ? wkWeek(filters.weeks[0]) : null;
      const W = selW && selW <= lastW ? selW : lastW;
      const rows = useMemo(() => !F ? [] : F.series.map(({ name, vals }) => {
        const cur = vals[W - 1] ?? vals[vals.length - 1];
        const prev = vals[W - 2];
        const base = vals[0];
        const g = F.goals[name];
        return {
          name, label: FOL_ACCOUNT_LABEL(name), color: FOL_ACCOUNT_COLOR(name), cur,
          wow: prev ? cur - prev : null, wowPct: prev ? (cur / prev - 1) * 100 : null,
          ytd: base != null ? cur - base : null, ytdPct: base ? (cur / base - 1) * 100 : null,
          goalPct: g ? ((cur - (g.base ?? base)) / g.goal) * 100 : null,
          spark: vals.slice(0, W).map((v, i) => ({ i, v })),
        };
      }).sort((a, b) => b.cur - a.cur), [F, W]);
      const chart = useMemo(() => {
        if (!F) return [];
        return Array.from({ length: W }, (_, i) => {
          const o = { label: `S${i + 1}` };
          for (const { name, vals } of F.series) {
            const v = vals[i], b = vals[0];
            o[name] = v == null ? null : mode === 'pct' ? (b ? (v / b - 1) * 100 : null) : v - b;
          }
          return o;
        });
      }, [F, W, mode]);
      const total = rows.reduce((a, r) => a + (r.cur || 0), 0);
      const totalYtd = rows.reduce((a, r) => a + (r.ytd || 0), 0);
      const sgn = (v, f = fmtFull) => v == null ? '—' : `${v > 0 ? '+' : v < 0 ? '−' : '±'}${f(Math.abs(v))}`;

      return html`
        <section id="sec-followers" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-followers" name="Followers" />
          <div className="flex flex-wrap items-baseline justify-between gap-3 mb-5">
            <div>
              <h2 className="text-[18px] font-medium text-txt">Followers y meta</h2>
              <p className="text-txt4 text-[12px] mt-1">${platSel ? `Solo ${folPlatTxt(platSel)}, según el filtro de plataforma.` : 'Todas las cuentas, con o sin meta 2026.'} Semana de referencia: S${W} de ${PRESS_YEAR}${selW ? ' (la del filtro)' : ' (última registrada)'}.</p>
            </div>
            ${F && html`<div className="text-right">
              <div className="text-[12px] text-txt3">${platSel ? `Comunidad ${platSel.length === 1 ? platSel[0] : 'filtrada'}` : 'Comunidad total'}</div>
              <div className="text-[20px] font-medium text-txt tabular-nums">${fmtFull(total)}</div>
              <div className="text-[12px] tabular-nums ${''}"><span className=${totalYtd >= 0 ? 'text-success' : 'text-amber'}>${sgn(totalYtd)}</span> <span className="text-txt4">en ${PRESS_YEAR}</span></div>
            </div>`}
          </div>
          ${state.loading ? html`<div className="rounded-xl bg-surface p-6 text-[12px] text-txt4">Cargando followers…</div>`
          : state.error ? html`<div className="rounded-xl bg-surface p-6 text-[12px] text-amber">No se pudo leer la pestaña Followers: ${state.error}</div>`
          : html`
            ${!rows.length && html`<div className="rounded-xl bg-surface p-6 text-[12px] text-txt4 mb-3">No hay cuentas de ${platSel ? folPlatTxt(platSel) : 'esta selección'} en la pestaña Followers.</div>`}
            ${rows.length > 0 && html`<div className="rounded-2xl bg-surface p-2 md:p-3 overflow-x-auto">
              <table className="w-full text-[13px] whitespace-nowrap">
                <thead><tr>
                  <th className="text-left py-2.5 px-3">Cuenta</th>
                  <th className="text-right py-2.5 px-3">Followers</th>
                  <th className="text-right py-2.5 px-3">vs S${W - 1}</th>
                  <th className="text-right py-2.5 px-3">Ganados en ${PRESS_YEAR}</th>
                  <th className="text-left py-2.5 px-3 w-[22%]">Crecimiento en el año</th>
                  <th className="text-right py-2.5 px-3">Meta 2026</th>
                  <th className="text-left py-2.5 px-3 w-[140px]">Tendencia</th>
                </tr></thead>
                <tbody>
                  ${(() => { const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.ytdPct || 0)));
                    return rows.map(r => html`<tr key=${r.name}>
                      <td className="py-3 px-3"><span className="inline-flex items-center gap-2.5"><svg width="10" height="10" viewBox="0 0 10 10" className="shrink-0" aria-hidden="true"><circle cx="5" cy="5" r="5" fill=${r.color} /></svg><span className="text-txt">${r.label}</span></span></td>
                      <td className="py-3 px-3 text-right tabular-nums text-txt">${fmtFull(r.cur)}</td>
                      <td className=${"py-3 px-3 text-right tabular-nums " + (r.wow == null ? 'text-txt4' : r.wow >= 0 ? 'text-txt2' : 'text-amber')}>${sgn(r.wow)}</td>
                      <td className=${"py-3 px-3 text-right tabular-nums " + (r.ytd == null ? 'text-txt4' : r.ytd >= 0 ? 'text-txt2' : 'text-amber')}>${sgn(r.ytd)}</td>
                      <td className="py-3 px-3">
                        <div className="flex items-center gap-3">
                          <div className="flex-1 h-1.5 rounded-full bg-onSurface/[0.06] overflow-hidden">
                            <div className="bar-grow h-full rounded-full" style=${{ width: Math.abs(r.ytdPct || 0) / maxAbs * 100 + '%', background: (r.ytdPct || 0) >= 0 ? 'rgb(var(--c-success) / 0.75)' : 'rgb(var(--c-amber) / 0.8)' }}></div>
                          </div>
                          <span className=${"tabular-nums w-14 text-right " + ((r.ytdPct || 0) >= 0 ? 'text-txt2' : 'text-amber')}>${r.ytdPct == null ? '—' : `${r.ytdPct >= 0 ? '+' : ''}${r.ytdPct.toFixed(1)}%`}</span>
                        </div>
                      </td>
                      <td className="py-3 px-3 text-right tabular-nums">${r.goalPct != null ? html`<span className=${r.goalPct >= 100 ? 'text-success' : 'text-txt2'}>${r.goalPct.toFixed(1)}%</span>` : html`<span className="text-txt4">sin meta</span>`}</td>
                      <td className="py-1.5 px-3"><div style=${{ width: 130, height: 28 }}>
                        <${ResponsiveContainer} width="100%" height="100%"><${LineChart} data=${r.spark} margin=${{ top: 3, right: 2, left: 2, bottom: 3 }}>
                          <${YAxis} hide domain=${['dataMin', 'dataMax']} /><${Line} type="linear" dataKey="v" stroke=${r.color} strokeWidth=${1.4} dot=${false} isAnimationActive=${false} />
                        <//><//></div></td>
                    </tr>`); })()}
                </tbody>
              </table>
            </div>`}`}
          <${FollowerGoalsSection} embedded fetchedAt=${fetchedAt} chartTheme=${chartTheme} platforms=${platSel} />
        </section>`;
    }

    // ============================================================
    // v44 — INFLUENCERS: desempeño del contenido marcado "¿Influencer? = Sí",
    // solo en las plataformas donde se marca. Se compara contra el contenido
    // de marca de la MISMA plataforma y formato (peras con peras).
    // ============================================================
    const isInfluencer = (p) => /^s[ií]/i.test(String(p.is_influencer || '').trim());
    function InfluencersSection({ D, onPick }) {
      const posts = D.allPosts || [];
      const infl = posts.filter(isInfluencer);
      const plats = [...new Set(infl.map(p => p.platform))];
      const agg = (list) => list.length ? aggFinalize(list.reduce((a, p) => { aggAdd(a, p); return a; }, emptyAgg())) : null;
      const segKey = (p) => p.platform + '|' + (p.format || '');
      const segs = new Set(infl.map(segKey));
      const brandSame = posts.filter(p => !isInfluencer(p) && segs.has(segKey(p)));
      const I = agg(infl), B = agg(brandSame);
      const byPlat = plats.map(pl => {
        const i = agg(infl.filter(p => p.platform === pl));
        const iSegs = new Set(infl.filter(p => p.platform === pl).map(segKey));
        const b = agg(posts.filter(p => !isInfluencer(p) && iSegs.has(segKey(p))));
        return { pl, i, b };
      }).sort((x, y) => y.i.inter - x.i.inter);
      // Ranking por influencer (nombre normalizado: sin acentos, mayúsculas ni espacios de más)
      const byName = new Map();
      for (const p of infl) {
        const raw = String(p.influencer_name || 'Sin nombre').trim();
        const k = foldTxt(raw);
        if (!byName.has(k)) byName.set(k, { names: new Map(), list: [] });
        const r = byName.get(k); r.list.push(p); r.names.set(raw, (r.names.get(raw) || 0) + 1);
      }
      const ranking = [...byName.values()].map(r => {
        const a = agg(r.list);
        const top = [...r.list].sort((x, y) => (y.interactions || 0) - (x.interactions || 0))[0];
        return { name: [...r.names.entries()].sort((x, y) => y[1] - x[1])[0][0], a, plats: [...new Set(r.list.map(p => p.platform))], top,
                 paid: r.list.filter(isPaidP).length };
      });
      const [limit, setLimit] = useState(10);
      // v48 — jerarquización del ranking
      const INF_SORTS = [
        { k: 'inter', l: 'Interacciones', f: (a) => a.inter },
        { k: 'reach', l: 'Alcance', f: (a) => a.reach },
        { k: 'posts', l: 'Posts', f: (a) => a.posts },
        { k: 'inter_pp', l: 'Interacciones por post', f: (a) => a.inter_per_post },
        { k: 'reach_pp', l: 'Alcance por post', f: (a) => a.reach_per_post },
        { k: 'ber', l: 'ER básico', f: (a) => a.basic_er_avg, rate: true },
        { k: 'vtr', l: 'VTR', f: (a) => a.vtr_avg || null, rate: true },
      ];
      const [sortK, setSortK] = useState('inter');
      const [sortDir, setSortDir] = useState('desc');
      const [minPosts, setMinPosts] = useState(1);
      const infFlip = useRef(null);
      useFlip(infFlip, `${sortK}|${sortDir}|${minPosts}`);
      const S = INF_SORTS.find(x => x.k === sortK) || INF_SORTS[0];
      const ranked = ranking.filter(r => r.a.posts >= minPosts && (S.k !== 'vtr' || r.a.vtr_avg))
        .sort((x, y) => (sortDir === 'desc' ? -1 : 1) * ((S.f(x.a) ?? -Infinity) - (S.f(y.a) ?? -Infinity)));
      const sortBy = (k) => { if (k === sortK) setSortDir(d => d === 'desc' ? 'asc' : 'desc'); else { setSortK(k); setSortDir('desc'); } setLimit(10); };
      const Th = ({ k, l, left }) => html`<th className=${(left ? 'text-left' : 'text-right') + ' py-2 px-2'}>
        <button onClick=${() => sortBy(k)} aria-sort=${sortK === k ? (sortDir === 'desc' ? 'descending' : 'ascending') : 'none'}
                className=${"inline-flex items-center gap-1 whitespace-nowrap hover:text-accent " + (sortK === k ? 'text-accent' : '')}>
          ${l}${sortK === k ? (sortDir === 'desc' ? ' ↓' : ' ↑') : ''}</button></th>`;
      const ratio = (a, b) => (a != null && b) ? (a / b - 1) * 100 : null;
      const vsTxt = (d) => d == null ? '—' : `${d >= 0 ? '+' : ''}${d.toFixed(0)}%`;
      const vsCls = (d) => d == null ? 'text-txt4' : d >= 0 ? 'text-success' : 'text-amber';
      const Stat = ({ l, i, b, f, per }) => {
        const d = ratio(i, b);
        return html`<div className="min-w-0">
          <div className="text-[13px] text-txt3 mb-1.5">${l}</div>
          <div className="text-txt tabular-nums" style=${{ fontSize: 'clamp(20px, 1.8vw, 26px)', fontWeight: 500, lineHeight: 1.1, letterSpacing: '-0.015em' }}>${f(i)}</div>
          <div className="text-[12px] mt-1.5 tabular-nums"><span className=${vsCls(d)}>${vsTxt(d)}</span> <span className="text-txt4">vs marca${per ? ' por post' : ''} (${f(b)})</span></div>
        </div>`;
      };
      return html`
        <section id="sec-influencers" className="px-4 md:px-7 py-7 relative group">
          <${SectionExportBtn} sectionId="sec-influencers" name="Influencers" />
          <div className="mb-5">
            <h2 className="text-[18px] font-medium text-txt">Influencers</h2>
            <p className="text-txt4 text-[12px] mt-1 max-w-3xl">Contenido marcado como influencer en ${plats.length ? plats.join(', ') : 'ninguna plataforma de este filtro'}. Se compara contra el contenido de marca de la misma plataforma y formato, para comparar peras con peras.</p>
          </div>
          ${!infl.length ? html`<div className="rounded-xl bg-surface p-8 text-center text-[13px] text-txt3">No hay contenido de influencers en el filtro actual.</div>` : html`
            <div className="rounded-2xl bg-surface p-6 md:p-7 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-x-8 gap-y-6 mb-3">
              <div className="min-w-0">
                <div className="text-[13px] text-txt3 mb-1.5">Posts de influencers</div>
                <div className="text-txt tabular-nums" style=${{ fontSize: 'clamp(20px, 1.8vw, 26px)', fontWeight: 500, lineHeight: 1.1, letterSpacing: '-0.015em' }}>${fmtFull(I.posts)}</div>
                <div className="text-[12px] text-txt4 mt-1.5">${ranking.length} influencers · ${infl.filter(isPaidP).length} con pauta · ${(I.posts / Math.max(1, I.posts + B.posts) * 100).toFixed(0)}% de su segmento</div>
              </div>
              <${Stat} l="Alcance por post" i=${I.reach_per_post} b=${B && B.reach_per_post} f=${fmtFull} per />
              <${Stat} l="Interacciones por post" i=${I.inter_per_post} b=${B && B.inter_per_post} f=${fmtFull} per />
              <${Stat} l="ER básico" i=${I.basic_er_avg} b=${B && B.basic_er_avg} f=${erFmt} />
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
              <div className="2xl:col-span-5 lg:col-span-12 rounded-xl bg-surface p-5 overflow-x-auto">
                <div className="text-[13px] font-medium text-txt mb-3">Por plataforma</div>
                <table className="w-full text-[12px] whitespace-nowrap">
                  <thead><tr>
                    <th className="text-left py-2 px-2 font-medium text-txt3">Plataforma</th>
                    <th className="text-right py-2 px-2 font-medium text-txt3">Posts</th>
                    <th className="text-right py-2 px-2 font-medium text-txt3">Alcance/post</th>
                    <th className="text-right py-2 px-2 font-medium text-txt3">ER básico</th>
                    <th className="text-right py-2 px-2 font-medium text-txt3">VTR</th>
                  </tr></thead>
                  <tbody>
                    ${byPlat.map(({ pl, i, b }) => html`<tr key=${pl}>
                      <td className="py-2 px-2"><span className="inline-flex items-center gap-2"><svg width="8" height="8" viewBox="0 0 8 8" className="shrink-0" aria-hidden="true"><circle cx="4" cy="4" r="4" fill=${PLAT_COLORS[pl]} /></svg>${pl}</span></td>
                      <td className="py-2 px-2 text-right tabular-nums">${i.posts}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(i.reach_per_post)}<div className=${"text-[10px] " + vsCls(ratio(i.reach_per_post, b && b.reach_per_post))}>${vsTxt(ratio(i.reach_per_post, b && b.reach_per_post))} vs marca</div></td>
                      <td className="py-2 px-2 text-right tabular-nums">${erFmt(i.basic_er_avg)}<div className=${"text-[10px] " + vsCls(ratio(i.basic_er_avg, b && b.basic_er_avg))}>${vsTxt(ratio(i.basic_er_avg, b && b.basic_er_avg))} vs marca</div></td>
                      <td className="py-2 px-2 text-right tabular-nums">${i.vtr_avg ? erFmt(i.vtr_avg) : '—'}<div className=${"text-[10px] " + vsCls(ratio(i.vtr_avg || null, b && b.vtr_avg))}>${i.vtr_avg ? vsTxt(ratio(i.vtr_avg, b && b.vtr_avg)) + ' vs marca' : ''}</div></td>
                    </tr>`)}
                  </tbody>
                </table>
              </div>
              <div className="2xl:col-span-7 lg:col-span-12 rounded-xl bg-surface p-5 overflow-x-auto">
                <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <div className="text-[13px] font-medium text-txt">Ranking de influencers · por ${S.l.toLowerCase()}</div>
                  <div className="flex flex-wrap items-center gap-2">
                    <select aria-label="Ordenar ranking por" value=${sortK} onChange=${(e) => { setSortK(e.target.value); setSortDir('desc'); setLimit(10); }}
                            className="text-[12px] bg-onSurface/[0.04] rounded-lg px-2 py-1.5 text-txt2 border border-line">
                      ${INF_SORTS.map(o => html`<option key=${o.k} value=${o.k}>Ordenar por ${o.l.toLowerCase()}</option>`)}
                    </select>
                    <button onClick=${() => setSortDir(d => d === 'desc' ? 'asc' : 'desc')}
                            className="text-[12px] bg-onSurface/[0.04] rounded-lg px-2.5 py-1.5 text-txt2 hover:text-txt" title="Invertir orden">
                      ${sortDir === 'desc' ? 'Mayor a menor ↓' : 'Menor a mayor ↑'}</button>
                    <select aria-label="Mínimo de posts" value=${minPosts} onChange=${(e) => { setMinPosts(+e.target.value); setLimit(10); }}
                            className="text-[12px] bg-onSurface/[0.04] rounded-lg px-2 py-1.5 text-txt2 border border-line">
                      ${[1, 2, 3, 5].map(n => html`<option key=${n} value=${n}>${n === 1 ? 'Todos' : `${n}+ posts`}</option>`)}
                    </select>
                  </div>
                </div>
                ${S.rate && minPosts === 1 && html`<div className="text-[11px] text-txt4 mb-2">Tip: en tasas como ${S.l}, filtra 2+ posts para que un solo post no domine el ranking.</div>`}
                <table className="w-full text-[12px]">
                  <thead><tr>
                    <th className="text-left py-2 px-2">#</th>
                    <th className="text-left py-2 px-2">Influencer</th>
                    <${Th} k="posts" l="Posts" />
                    <${Th} k="reach" l="Alcance" />
                    <${Th} k="inter" l="Interacciones" />
                    <${Th} k="ber" l="ER básico" />
                    <${Th} k="vtr" l="VTR" />
                    <th className="text-right py-2 px-2">Mejor post</th>
                  </tr></thead>
                  <tbody ref=${infFlip}>
                    ${ranked.slice(0, limit).map((r, k) => html`<tr key=${r.name} data-flip=${r.name}>
                      <td className="py-2 px-2 text-txt4 tabular-nums">${k + 1}</td>
                      <td className="py-2 px-2 min-w-[170px]">
                        <div className="text-txt">${r.name}</div>
                        <div className="flex flex-wrap items-center gap-1 mt-1">${r.plats.map(pl => html`<span key=${pl} className="font-mono text-[8px] leading-none font-semibold text-white px-1 py-[3px] rounded" style=${{ background: PLAT_COLORS[pl] }}>${PLAT_LETTERS[pl]}</span>`)}${r.paid ? html`<span className="text-[10px] text-txt4 ml-1 whitespace-nowrap">${r.paid} con pauta</span>` : ''}</div>
                      </td>
                      <td className="py-2 px-2 text-right tabular-nums">${r.a.posts}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(r.a.reach)}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${fmtFull(r.a.inter)}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${erFmt(r.a.basic_er_avg)}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${r.a.vtr_avg ? erFmt(r.a.vtr_avg) : '—'}</td>
                      <td className="py-2 px-2 text-right whitespace-nowrap">
                        <button onClick=${() => onPick && onPick(r.top)} className="text-[11px] text-accent hover:underline mr-1.5">${r.top.platform} ${r.top.format || ''}</button>
                        <${PostLink} p=${r.top} compact />
                      </td>
                    </tr>`)}
                  </tbody>
                </table>
                ${ranked.length > limit && html`<button onClick=${() => setLimit(l => l + 10)} className="mt-3 text-[12px] text-accent hover:underline">Ver 10 más (${ranked.length - limit} restantes)</button>`}
              </div>
            </div>`}
        </section>`;
    }

    // ============================================================
    // v49 — TIKTOK · LABORATORIO CREATIVO
    // Lectura profunda solo de TikTok para el equipo creativo, con foco en
    // los contenidos de Tendencia y Stay & Play: ER básico, duración y VTR,
    // más retención (% del video visto), señales de distribución
    // (compartidos y guardados), followers ganados y atributos (audio,
    // subtítulos, IA). Respeta los filtros de periodo, pauta y contenido.
    // ============================================================
    // Detección tolerante a mayúsculas, acentos y variantes ("stay and play",
    // "Stay&Play", "TENDENCIA"): así un post mal escrito no se pierde del
    // análisis. Calidad de datos lista las variantes para estandarizarlas.
    const RX_STAY = /stay\s*(?:&|and|y|n|\+|-)?\s*play/;
    const RX_TEND = /tendencia/;
    const ttTxt = (p) => foldTxt(`${p.campaign || ''} ${p.subcampaign || ''}`);
    const TT_GROUPS = [
      { k: 'tend', l: 'Tendencia',   color: '#F0B358', test: (p) => RX_TEND.test(ttTxt(p)) },
      { k: 'stay', l: 'Stay & Play', color: '#5DCAA5', test: (p) => RX_STAY.test(ttTxt(p)) },
    ];
    const ttGroupOf = (p) => (TT_GROUPS.find(g => g.test(p)) || { k: 'rest', l: 'Resto de TikTok', color: '#4C6EF5' });
    const TT_DUR = [[0, 10, '≤10 s'], [10, 15, '11–15 s'], [15, 30, '16–30 s'], [30, 60, '31–60 s'], [60, 1e9, '60+ s']];
    const ttMean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    function ttStats(list) {
      const sum = (f) => list.reduce((a, p) => a + (f(p) || 0), 0);
      const reach = sum(p => p.reach);
      // ER básico = promedio por post sin Stories (solo existen en IG y FB), igual que el resto del dashboard
      const okEr = list.filter(p => !(p._flags || []).includes('er') && p.reach > 0 && p.basic_er != null && p.format !== 'Stories');
      const vids = list.filter(p => p.vtr != null && p.vtr > 0);
      const durs = list.filter(p => p.duration > 0);
      const ret = list.filter(p => p.duration > 0 && p.avg_watch_time > 0).map(p => Math.min(100, p.avg_watch_time / p.duration * 100));
      return {
        n: list.length,
        ber: okEr.length ? okEr.reduce((a, p) => a + p.basic_er, 0) / okEr.length : null,
        vtr: ttMean(vids.map(p => p.vtr)),
        dur: ttMean(durs.map(p => p.duration)),
        watch: ttMean(list.filter(p => p.avg_watch_time > 0).map(p => p.avg_watch_time)),
        ret: ttMean(ret),
        reachPP: list.length ? reach / list.length : null,
        sharesK: reach ? sum(p => p.shares) / reach * 1000 : null,
        savesK: reach ? sum(p => p.saves) / reach * 1000 : null,
        commentsK: reach ? sum(p => p.comments) / reach * 1000 : null,
        follPP: list.length ? sum(p => p.new_followers) / list.length : null,
        follTot: sum(p => p.new_followers),
      };
    }

    const TT_MES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const TT_QUADS = [
      { k: 'q1', l: 'Retiene y conversa',     hint: 'VTR y ER arriba de la mediana', good: true },
      { k: 'q2', l: 'Retiene, no conversa',   hint: 'Se ve completo, pero no genera interacción' },
      { k: 'q3', l: 'Conversa, no retiene',   hint: 'Genera interacción, pero se abandona pronto' },
      { k: 'q4', l: 'Ni retiene ni conversa', hint: 'Abajo de la mediana en ambas' },
    ];

    function TikTokLabSection({ D, onPick, chartTheme, rawPosts, filters }) {
      const ct = chartTheme || CHART_VARS;
      const [scope, setScope] = useState('org');   // org | paid | all — peras con peras: la pauta infla alcance y baja tasas
      const [span, setSpan] = useState('filtro');  // filtro | hist — histórico junta 2025 + 2026 para engrosar muestras chicas
      const [evoMetric, setEvoMetric] = useState('vtr');
      const ttAll = (span === 'hist' && rawPosts
        ? applyFilters(rawPosts, { ...filters, year: 'all', weeks: [], months: [] })
        : (D.allPosts || [])).filter(p => p.platform === 'TikTok');
      const tt = ttAll.filter(p => scope === 'all' || (scope === 'paid') === isPaidP(p));
      const [focus, setFocus] = useState('all');   // all | tend | stay
      const groups = [...TT_GROUPS, { k: 'rest', l: 'Resto de TikTok', color: '#4C6EF5' }].map(g => {
        const list = tt.filter(p => ttGroupOf(p).k === g.k);
        return { ...g, list, s: ttStats(list) };
      });
      const base = ttStats(tt);
      const focusList = tt.filter(p => focus === 'all' ? ttGroupOf(p).k !== 'rest' : ttGroupOf(p).k === focus);
      // Duración: buckets sobre todos los videos de TikTok
      const vids = tt.filter(p => p.duration > 0);
      const buckets = TT_DUR.map(([a, b, l]) => {
        const list = vids.filter(p => p.duration > a && p.duration <= b);
        const s = ttStats(list);
        const fl = list.filter(p => ttGroupOf(p).k !== 'rest').length;
        return { l, ...s, focusN: fl };
      }).filter(b => b.n > 0);
      const bestB = buckets.filter(b => b.n >= 5 && b.vtr != null).sort((x, y) => y.vtr - x.vtr)[0];
      const scatter = (k) => vids.filter(p => ttGroupOf(p).k === k && p.vtr > 0).map(p => ({ x: p.duration, y: p.vtr, z: Math.max(1, p.reach || 1), p }));
      const pct = (v, d = 2) => v == null ? '—' : `${v.toFixed(d)}%`;
      const num1 = (v, suf = '') => v == null ? '—' : `${v.toFixed(1)}${suf}`;
      const vs = (v, b) => (v == null || b == null || !b) ? null : (v / b - 1) * 100;
      const dTxt = (d) => d >= 100 ? `${(1 + d / 100).toFixed(1)}×` : `${d >= 0 ? '+' : ''}${d.toFixed(0)}%`;
      const Vs = ({ v, b }) => { const d = vs(v, b); return d == null ? '' : html`<div className=${"text-[10px] " + (d >= 0 ? 'text-success' : 'text-amber')}>${dTxt(d)} vs TikTok</div>`; };
      const ROWS = [
        ['Posts', s => fmtFull(s.n), null],
        ['ER básico', s => pct(s.ber), 'ber'],
        ['VTR promedio', s => pct(s.vtr), 'vtr'],
        ['Duración promedio', s => num1(s.dur, ' s'), null],
        ['Tiempo promedio de vista', s => num1(s.watch, ' s'), 'watch'],
        ['Alcance por post', s => fmtFull(s.reachPP), 'reachPP'],
        ['Compartidos por 1,000 de alcance', s => num1(s.sharesK), 'sharesK'],
        ['Guardados por 1,000 de alcance', s => num1(s.savesK), 'savesK'],
        ['Comentarios por 1,000 de alcance', s => num1(s.commentsK), 'commentsK'],
        ['Nuevos seguidores por post', s => fmtFull(s.follPP), 'follPP'],
      ];
      const medBer = (() => { const a = tt.filter(p => !(p._flags || []).includes('er')).map(p => p.basic_er).filter(v => v != null).sort((x, y) => x - y); return a.length ? a[a.length >> 1] : null; })();
      const medVtr = (() => { const a = tt.map(p => p.vtr).filter(v => v > 0).sort((x, y) => x - y); return a.length ? a[a.length >> 1] : null; })();
      const reads = [];
      for (const g of groups.slice(0, 2)) {
        if (!g.s.n) continue;
        const dB = vs(g.s.ber, base.ber), dV = vs(g.s.vtr, base.vtr);
        reads.push(`${g.l} (${g.s.n} posts): ER básico ${pct(g.s.ber)}${dB != null ? ` (${dTxt(dB)} vs TikTok)` : ''}, VTR ${pct(g.s.vtr)}${dV != null ? ` (${dTxt(dV)})` : ''}, duración promedio ${num1(g.s.dur, ' s')}.`);
      }
      if (bestB) reads.push(`En TikTok, los videos de ${bestB.l} retienen mejor: VTR promedio ${pct(bestB.vtr)} con ${bestB.n} videos.`);

      // Matriz ER básico × VTR (cuadrantes por la mediana de TikTok)
      const qPosts = tt.filter(p => p.vtr > 0 && p.basic_er != null && !(p._flags || []).includes('er'));
      const quadOf = (p) => (p.vtr >= medVtr ? (p.basic_er >= medBer ? 'q1' : 'q2') : (p.basic_er >= medBer ? 'q3' : 'q4'));
      const quadPts = (k) => qPosts.filter(p => ttGroupOf(p).k === k).map(p => ({ x: p.vtr, y: p.basic_er, p }));
      const quadRows = groups.map(g => {
        const list = qPosts.filter(p => ttGroupOf(p).k === g.k);
        const c = { q1: 0, q2: 0, q3: 0, q4: 0 };
        list.forEach(p => c[quadOf(p)]++);
        return { ...g, total: list.length, c };
      });
      const yCap = (() => { const a = qPosts.map(p => p.basic_er).sort((x, y) => x - y); if (!a.length) return 10; const v = a[Math.floor(a.length * 0.97)] || a[a.length - 1]; return Math.ceil(v * 1.1); })();
      const offScale = qPosts.filter(p => p.basic_er > yCap).length;
      for (const g of quadRows.slice(0, 2)) {
        if (g.total < 3) continue;
        const top = TT_QUADS.map(q => [q, g.c[q.k]]).sort((a, b) => b[1] - a[1])[0];
        reads.push(`${g.l}: ${Math.round(top[1] / g.total * 100)}% de sus posts cae en "${top[0].l}".`);
      }

      // Evolución mensual (mes calendario)
      const monthKey = (p) => { const d = parseDate(p.date); return d && !isNaN(d) ? d.getFullYear() * 100 + d.getMonth() + 1 : null; };
      const evoStat = (list) => evoMetric === 'vtr' ? ttStats(list).vtr : ttStats(list).ber;
      const evo = (() => {
        const keys = [...new Set(tt.map(monthKey).filter(Boolean))].sort((a, b) => a - b);
        const multiY = new Set(keys.map(k => Math.floor(k / 100))).size > 1;
        return keys.map(k => {
          const inM = tt.filter(p => monthKey(p) === k);
          const st = inM.filter(p => ttGroupOf(p).k === 'stay'), te = inM.filter(p => ttGroupOf(p).k === 'tend');
          return { k, label: TT_MES[k % 100 - 1] + (multiY ? ` '${String(Math.floor(k / 100)).slice(2)}` : ''),
                   stay: st.length ? evoStat(st) : null, tend: te.length ? evoStat(te) : null, all: evoStat(inM),
                   nStay: st.length, nTend: te.length, nAll: inM.length };
        });
      })();
      const stayMonths = evo.filter(e => e.stay != null);
      if (stayMonths.length >= 3) {
        const h = Math.floor(stayMonths.length / 2);
        const a = ttMean(stayMonths.slice(0, h).map(e => e.stay)), b = ttMean(stayMonths.slice(-h).map(e => e.stay));
        const d = vs(b, a);
        if (d != null) reads.push(`Stay & Play en el tiempo: su ${evoMetric === 'vtr' ? 'VTR' : 'ER básico'} de los meses recientes está ${Math.abs(d) < 5 ? 'estable' : `${Math.abs(d).toFixed(0)}% ${d > 0 ? 'arriba' : 'abajo'}`} vs. sus primeros meses.`);
      }

      // Receta ganadora: la duración que mejor sostiene VTR y ER básico
      const recipe = (() => {
        const m = new Map();
        for (const p of tt) {
          if (!(p.duration > 0) || !(p.vtr > 0) || (p._flags || []).includes('er')) continue;
          const b = TT_DUR.find(([a, z]) => p.duration > a && p.duration <= z);
          if (!m.has(b[2])) m.set(b[2], { dur: b[2], list: [] });
          m.get(b[2]).list.push(p);
        }
        const MIN = 5;
        return [...m.values()].filter(c => c.list.length >= MIN).map(c => {
          const st = ttStats(c.list);
          // Se ordena por la métrica más floja de las dos: premia lo que funciona en ambas, no lo que brilla en una y se cae en la otra
          const score = Math.min((st.vtr || 0) / (base.vtr || 1), (st.ber || 0) / (base.ber || 1));
          return { ...c, st, score, focusN: c.list.filter(p => ttGroupOf(p).k !== 'rest').length };
        }).sort((a, b) => b.score - a.score).slice(0, 3);
      })();

      return html`

              ${!recipe.length ? html`<div className="text-[12px] text-txt4">Aún no hay duraciones con 5 videos o más en este filtro. Prueba "Histórico 2025 + 2026".</div>` : html`
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
                  ${recipe.map((r, i) => html`<div key=${i} className=${"rounded-lg p-4 " + (i === 0 ? "bg-success/10" : "bg-onSurface/[0.03]")}>
                    <div className=${"text-[10px] font-mono uppercase tracking-[0.15em] mb-1 " + (i === 0 ? "text-success" : "text-txt4")}>${i === 0 ? 'La que mejor funciona' : `Opción ${i + 1}`}</div>
                    <div className="text-[14px] font-semibold text-txt leading-snug">${recipeName(r)}</div>

                      <div><div className="text-txt4 text-[10px]">VTR</div><div className="tabular-nums text-txt">${pct(r.st.vtr)}</div><${Vs} v=${r.st.vtr} b=${base.vtr} /></div>

                      <${Scatter} name="Resto de TikTok" data=${scatter('rest')} fill="#4C6EF5" fillOpacity=${0.25} isAnimationActive=${false} onClick=${(d) => onPick && onPick(d.p)} />
                      ${TT_GROUPS.map(g => html`<${Scatter} key=${g.k} name=${g.l} data=${scatter(g.k)} fill=${g.color} fillOpacity=${0.95} isAnimationActive=${false} onClick=${(d) => onPick && onPick(d.p)} />`)}
                    <//>
                  <//>
                </div>
                <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2">
                  ${groups.map(g => html`<span key=${g.k} className="inline-flex items-center gap-1.5 text-[11px] text-txt3"><span className="w-2.5 h-2.5 rounded-full" style=${{ background: g.color, opacity: g.k === 'rest' ? 0.4 : 1 }}></span>${g.l}</span>`)}

              <div className="rounded-xl bg-surface p-5 overflow-x-auto">

                  <tbody>
                    ${buckets.map(b => html`<tr key=${b.l}>
                      <td className="py-2 px-2 text-txt2">${b.l}${bestB && bestB.l === b.l ? html` <span className="text-[10px] text-success">· mejor VTR</span>` : ''}</td>
                      <td className="py-2 px-2 text-right tabular-nums">${b.n}</td>

            <div className="grid grid-cols-1 2xl:grid-cols-2 gap-3 mb-3">

                <div className="text-[11px] text-txt4 mb-3">Cada punto es un video, dividido por la mediana de TikTok (VTR ${pct(medVtr)} · ER básico ${pct(medBer)}). Arriba a la derecha: retiene y conversa. Clic para abrir el post.</div>
                <div className="relative" style=${{ height: 300 }}>
                  ${[['top-1 right-3 text-right', 'q1'], ['bottom-9 right-3 text-right', 'q2'], ['top-1 left-14', 'q3'], ['bottom-9 left-14', 'q4']].map(([pos, k]) => {

                  <${ResponsiveContainer} width="100%" height="100%">

                      <${ZAxis} range=${[60, 60]} />

                          <div>${TT_QUADS.find(q => q.k === quadOf(p)).l}</div></div>`;
                      }} />
                      ${medVtr != null && html`<${ReferenceLine} x=${medVtr} stroke="#888" strokeDasharray="4 4" />`}
                      ${medBer != null && html`<${ReferenceLine} y=${medBer} stroke="#888" strokeDasharray="4 4" />`}
                      <${Scatter} name="Resto de TikTok" data=${quadPts('rest')} fill="#4C6EF5" fillOpacity=${0.25} isAnimationActive=${false} onClick=${(d) => onPick && onPick(d.p)} />
                      ${TT_GROUPS.map(g => html`<${Scatter} key=${g.k} name=${g.l} data=${quadPts(g.k)} fill=${g.color} fillOpacity=${0.95} isAnimationActive=${false} onClick=${(d) => onPick && onPick(d.p)} />`)}
                    <//>
                  <//>
                </div>
                ${offScale > 0 && html`<div className="text-[10px] text-txt4 mt-1">${offScale} ${offScale === 1 ? 'video queda' : 'videos quedan'} arriba de la escala por su ER muy alto (cuentan en la tabla).</div>`}
                <table className="w-full text-[12px] whitespace-nowrap mt-3">
                  <thead><tr><th className="text-left py-2 px-2">Grupo</th>${TT_QUADS.map(q => html`<th key=${q.k} className="text-right py-2 px-2" title=${q.hint}>${q.l}</th>`)}</tr></thead>

                      ${TT_QUADS.map(q => html`<td key=${q.k} className=${"py-2 px-2 text-right tabular-nums " + (q.good && g.total && g.c[q.k] / g.total >= 0.25 ? 'text-success' : '')}>${g.total ? `${Math.round(g.c[q.k] / g.total * 100)}%` : '—'}<span className="text-txt4 text-[10px]"> · ${g.c[q.k]}</span></td>`)}
                    </tr>`)}
