<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F8F7F2" />
  <title>Samsung MX — Performance Brief</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F8F7F2'/%3E%3Ctext x='50' y='74' text-anchor='middle' font-family='Georgia,serif' font-size='78' font-weight='600' fill='%230A0A09' font-style='italic'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { paper: '#F8F7F2', ink: '#0A0A09', rule: '#E5E2DA', muted: '#6B675D', faint: '#A09B8E', cream: '#FFFFFF', accent: '#0F766E', amber: '#D97706', samsung: '#1428A0' },
          fontFamily: { sans: ['"Inter Tight"', 'system-ui', 'sans-serif'], serif: ['"Fraunces"', 'Georgia', 'serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] },
        },
      },
    };
  </script>
  <style>
    :root { color-scheme: light; }
    html, body, #root { height: 100%; background: #F8F7F2; color: #0A0A09; }
    body { font-family: 'Inter Tight', sans-serif; -webkit-font-smoothing: antialiased; background-image: radial-gradient(circle at 1px 1px, rgba(10,10,9,0.025) 1px, transparent 0); background-size: 24px 24px; }
    .font-serif { font-family: 'Fraunces', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .fade-in { animation: fadeIn 200ms ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useCallback, useMemo, useRef, Fragment } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import { ResponsiveContainer, AreaChart, Area, BarChart, Bar, LineChart, Line, ComposedChart, XAxis, YAxis, Tooltip, CartesianGrid } from 'https://esm.sh/recharts@2.12.7?deps=react@18.3.1';
    import Papa from 'https://esm.sh/papaparse@5.4.1';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(React.createElement);

    // CONFIG
    const SHEET_ID = '1TcmeDE08Df6Qk4lzRe6PhIBq5qOBUCC_vvHZq4UWD98';
    const SHEET_TABS = { Facebook: '📘 Facebook', Instagram: '📷 Instagram', YouTube: '▶️ YouTube', TikTok: '🎵 TikTok', X: '𝕏 X', LinkedIn: '💼 LinkedIn', Threads: '🧵 Threads' };
    const PLAT_COLORS = { Facebook:'#3B6FB8', Instagram:'#C73E6B', TikTok:'#1FA9B0', X:'#2A2A2A', YouTube:'#C53030', Threads:'#525252', LinkedIn:'#1F4D8C' };
    const PLAT_LETTERS = { Facebook:'FB', Instagram:'IG', YouTube:'YT', TikTok:'TT', X:'X', LinkedIn:'LI', Threads:'TH' };

    // --- FUNCIONES DE LIMPIEZA DE DATOS (EL MOTOR) ---
    function toNum(v) {
      if (v == null || v === '') return 0;
      let s = String(v).trim().replace(/,/g, '').replace(/%/g, '');
      if (s === '' || s === '—' || s === '-' || s === '#N/A' || s === '#DIV/0!') return 0;
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function parseDateAndWeek(dateStr) {
      if (!dateStr) return { date: null, week: null };
      const parts = dateStr.split('/');
      let d;
      // Forzar DD/MM/YYYY
      if (parts.length === 3) {
        d = new Date(parts[2], parts[1] - 1, parts[0]);
      } else {
        d = new Date(dateStr);
      }
      if (isNaN(d.getTime())) return { date: dateStr, week: null };
      
      const date = new Date(d.getTime());
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
      const week1 = new Date(date.getFullYear(), 0, 4);
      const week = 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
      return { date: d.toISOString(), week: week };
    }

    const COL_MAP = {
      'Link': 'link', 'Fecha': 'date', 'Semana': 'week', 'Formato': 'format', 
      'Campaña': 'campaign', 'Producto': 'product', 'Alcance': 'reach', 
      'Inter. Totales': 'interactions', 'ER Views %': 'er', 'Views': 'views',
      'Impresiones': 'impressions', 'Reacciones': 'reactions', 'Comentarios': 'comments',
      'Compartidos': 'shares', 'Guardados': 'saves', 'Clics': 'clics'
    };

    // --- COMPONENTES DE LA INTERFAZ ---
    const fmt = (n) => {
      if (!n) return '0';
      if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
      return Math.round(n).toLocaleString('es-MX');
    };

    function App() {
      const [allPosts, setAllPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [weekFilter, setWeekFilter] = useState(18); // Default a la semana del problema
      const [selected, setSelected] = useState(null);

      useEffect(() => {
        async function load() {
          const combined = [];
          for (const [plat, tab] of Object.entries(SHEET_TABS)) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&range=A2:AI`;
            try {
              const res = await fetch(url);
              const csv = await res.text();
              const parsed = Papa.parse(csv, { header: true, skipEmptyLines: 'greedy' });
              parsed.data.forEach(row => {
                // Solo descartar si realmente no hay nada
                if (!row.Post && !row.Link && !row.Fecha) return;
                const { date, week } = parseDateAndWeek(row.Fecha);
                const p = { platform: plat, date, weekCalculated: week };
                Object.entries(COL_MAP).forEach(([es, en]) => {
                  p[en] = (['reach', 'interactions', 'er', 'views', 'impressions', 'week'].includes(en)) ? toNum(row[es]) : row[es];
                });
                // Priorizar semana del Sheets, si no, la calculada
                p.week = p.week || week;
                combined.push(p);
              });
            } catch (e) { console.error("Error cargando "+plat, e); }
          }
          setAllPosts(combined);
          setLoading(false);
        }
        load();
      }, []);

      const filtered = useMemo(() => allPosts.filter(p => p.week === weekFilter), [allPosts, weekFilter]);
      
      const stats = useMemo(() => {
        return filtered.reduce((acc, p) => {
          acc.reach += p.reach; acc.inter += p.interactions; acc.posts += 1;
          return acc;
        }, { reach: 0, inter: 0, posts: 0 });
      }, [filtered]);

      if (loading) return html`<div class="h-screen flex items-center justify-center font-mono text-xs uppercase tracking-widest">Sincronizando con Google Sheets...</div>`;

      return html`
        <div class="min-h-screen bg-paper pb-20 fade-in">
          <header class="sticky top-0 z-30 bg-paper/80 border-b border-rule px-8 py-4 flex justify-between items-center backdrop-blur">
            <span class="font-serif italic text-2xl">Samsung MX Performance.</span>
            <div class="flex gap-2 bg-rule/20 p-1 rounded-full">
              ${[16, 17, 18, 19].map(w => html`
                <button onClick=${() => setWeekFilter(w)} 
                        class="px-4 py-1 rounded-full text-[10px] font-mono transition-all ${weekFilter === w ? 'bg-ink text-paper shadow-lg' : 'hover:bg-rule/40 text-muted'}">
                  S${w}
                </button>
              `)}
            </div>
          </header>

          <main class="max-w-[1440px] mx-auto px-8 pt-12">
            <section class="py-12 border-b border-rule mb-12">
              <div class="font-mono text-[10px] text-amber uppercase tracking-[0.3em] mb-4">Métricas Consolidadas — Semana ${weekFilter}</div>
              <h1 class="font-serif text-[10vw] leading-[0.85] tracking-tighter mb-8 tabular-nums">
                ${fmt(stats.reach)} <span class="text-faint italic font-light">alcance</span>
              </h1>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="border-l border-rule pl-6">
                  <div class="text-[10px] font-mono text-muted uppercase mb-1">Publicaciones</div>
                  <div class="text-3xl font-mono">${stats.posts}</div>
                </div>
                <div class="border-l border-rule pl-6">
                  <div class="text-[10px] font-mono text-muted uppercase mb-1">Interacciones Totales</div>
                  <div class="text-3xl font-mono">${fmt(stats.inter)}</div>
                </div>
                <div class="border-l border-rule pl-6 text-accent">
                  <div class="text-[10px] font-mono uppercase mb-1">Eficiencia Media (ER)</div>
                  <div class="text-3xl font-mono">
                    ${(filtered.reduce((a, b) => a + (b.er || 0), 0) / (filtered.filter(p => p.er > 0).length || 1)).toFixed(2)}%
                  </div>
                </div>
              </div>
            </section>

            <section>
              <h2 class="font-serif text-3xl mb-8 italic">Ranking de Performance</h2>
              <div class="bg-white border border-rule shadow-sm rounded-sm overflow-hidden">
                <table class="w-full text-left text-[13px] border-collapse">
                  <thead>
                    <tr class="bg-paper font-mono text-[10px] uppercase text-faint border-b border-rule">
                      <th class="p-4 font-medium">Plataforma</th>
                      <th class="p-4 font-medium">Fecha</th>
                      <th class="p-4 font-medium">Producto / Campaña</th>
                      <th class="p-4 font-medium text-right">Alcance</th>
                      <th class="p-4 font-medium text-right">Inter.</th>
                      <th class="p-4 font-medium text-right">ER %</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtered.sort((a,b) => b.reach - a.reach).map((p) => html`
                      <tr class="border-b border-rule/50 hover:bg-paper/40 transition-colors cursor-pointer" onClick=${() => setSelected(p)}>
                        <td class="p-4">
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style="background:${PLAT_COLORS[p.platform]}">
                            ${PLAT_LETTERS[p.platform]}
                          </span>
                        </td>
                        <td class="p-4 font-mono text-muted">
                          ${p.date ? new Date(p.date).toLocaleDateString('es-MX', {day:'2-digit', month:'short'}) : '—'}
                        </td>
                        <td class="p-4">
                          <div class="font-medium truncate max-w-[300px]">${p.product || 'Sin especificar'}</div>
                          <div class="text-[10px] text-faint truncate max-w-[300px] uppercase tracking-wider">${p.campaign || 'General'}</div>
                        </td>
                        <td class="p-4 text-right font-mono font-medium">${fmt(p.reach)}</td>
                        <td class="p-4 text-right font-mono text-muted">${fmt(p.interactions)}</td>
                        <td class="p-4 text-right font-mono text-accent font-bold">${(p.er || 0).toFixed(2)}%</td>
                      </tr>
                    `)}
                  </tbody>
                </table>
              </div>
            </section>
          </main>

          ${selected && html`
            <div class="fixed inset-0 z-50 flex justify-end bg-ink/10 backdrop-blur-sm" onClick=${() => setSelected(null)}>
              <div class="w-full max-w-lg bg-paper h-full shadow-2xl p-12 overflow-y-auto slide-in border-l border-rule" onClick=${e => e.stopPropagation()}>
                <button onClick=${() => setSelected(null)} class="mb-12 font-mono text-[10px] uppercase tracking-widest hover:text-amber transition-colors">← Cerrar vista</button>
                <div class="mb-2 text-amber font-mono text-[10px] uppercase tracking-widest">Semana ${selected.week} · ${selected.platform}</div>
                <h3 class="font-serif text-5xl leading-none mb-8 italic">${selected.product || 'Publicación'}</h3>
                
                <div class="space-y-6 mb-12">
                   <div class="flex justify-between border-b border-rule pb-4">
                      <span class="font-mono text-[10px] uppercase text-muted">Campaña</span>
                      <span class="text-sm font-medium">${selected.campaign || 'N/A'}</span>
                   </div>
                   <div class="flex justify-between border-b border-rule pb-4">
                      <span class="font-mono text-[10px] uppercase text-muted">Alcance</span>
                      <span class="text-xl font-mono">${selected.reach.toLocaleString()}</span>
                   </div>
                   <div class="flex justify-between border-b border-rule pb-4">
                      <span class="font-mono text-[10px] uppercase text-muted">Engagement</span>
                      <span class="text-xl font-mono text-accent">${selected.er.toFixed(2)}%</span>
                   </div>
                </div>

                ${selected.link && html`
                  <a href="${selected.link}" target="_blank" class="block w-full py-4 bg-ink text-paper text-center font-mono text-xs uppercase tracking-widest hover:bg-amber transition-all">Ver Post Original</a>
                `}
              </div>
            </div>
          `}
        </div>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>
</html>
